    /* ============================================================
       VIEW: Saved deal (one-page layout — alpha.7.0 skeleton)

       Loading flow:
         showSavedDeal(refId) ──┐
                                ├─ render loading skeleton
                                ├─ STORE.loadDeal(refId)  (async)
                                ├─ on success → render deal (alpha.7.1+)
                                └─ on error   → render error state with Back link

       Race guard:
         User may tap a saved deal then immediately navigate back to Home before
         loadDeal resolves. We track the active refId in _activeSavedDealRefId;
         if it changes between dispatch and resolve, we drop the render.

       Layout (alpha.7.0): minimal — banner saying "BoM + editor land in alpha.7.1"
       Layout (alpha.7.1+): BoM hero · sticky action bar · sticky chip nav ·
                            accordion sections (Project context, Solution type,
                            Inputs & outputs, LED [if hasLed], SX [if hasSx])
       ============================================================ */

    let _activeSavedDealRefId = null;

    function showSavedDeal(refId) {
      showChrome(true);
      updateNavActive('#/history');
      _activeSavedDealRefId = refId;

      // 1. Render loading skeleton immediately so the user sees activity.
      setRoot(renderSavedDealLoading(refId));

      // 2. Kick off the async load. Late resolutions are dropped via the
      //    race guard so they don't paint over a different view.
      STORE.loadDeal(refId).then(function(deal) {
        if (_activeSavedDealRefId !== refId) return;  // user navigated away
        if (!deal) {
          setRoot(renderSavedDealNotFound(refId));
          return;
        }
        setRoot(renderSavedDealLoaded(deal));
      }).catch(function(err) {
        if (_activeSavedDealRefId !== refId) return;
        // alpha.7.1: STORE.loadDeal throws on "deal not found" instead of
        // resolving with null. Classify by sniffing the message — the RPC
        // returns "deal_get: deal not found" and PostgREST returns PGRST116
        // for the no-rows case. Route those to the warn banner instead of
        // the red error banner.
        const msg = (err && err.message) ? err.message : String(err || '');
        if (/deal not found|PGRST116|no rows/i.test(msg)) {
          setRoot(renderSavedDealNotFound(refId));
          return;
        }
        setRoot(renderSavedDealError(refId, err));
      });
    }

    function renderSavedDealLoading(refId) {
      return '<div class="v">' +
          '<div class="h1">Saved deal</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="card" style="text-align:center; padding:24px 16px">' +
            '<div class="spinner" aria-hidden="true"></div>' +
            '<div class="small muted" style="margin-top:10px">Loading deal\u2026</div>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealNotFound(refId) {
      return '<div class="v">' +
          '<div class="h1">Deal not found</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="banner warn">' +
            '<strong>No deal matches this reference.</strong> ' +
            'It may have been deleted, or the link may be malformed. ' +
            'Check the History view for current deals.' +
          '</div>' +
          '<div style="margin-top:16px">' +
            '<button class="btn" type="button" data-nav="#/history">Back to History</button>' +
            ' <button class="btn btn-ghost" type="button" data-nav="#/home">Home</button>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealError(refId, err) {
      const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
      return '<div class="v">' +
          '<div class="h1">Couldn\u2019t load deal</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="banner err">' +
            '<strong>Load failed:</strong> ' + esc(msg) +
          '</div>' +
          '<div style="margin-top:16px">' +
            '<button class="btn" type="button" data-action="saved-retry" data-ref="' + esc(refId) + '">Try again</button>' +
            ' <button class="btn btn-ghost" type="button" data-nav="#/history">Back to History</button>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealLoaded(deal) {
      // alpha.7.1 — real one-page layout per SPEC §4.2.
      // BoM hero (top) · Rebuild banner (hidden) · sticky action bar ·
      // sticky chip nav · accordion sections (Project context auto-expanded).
      // Editable fields inside accordions land in alpha.7.2 (autosave layer).

      const refId    = (deal && (deal.display_ref || deal.ref || deal.id)) || '\u2014';
      const project  = (deal && deal.project)       || '\u2014';
      const customer = (deal && deal.customer_name) || '\u2014';
      const stage    = (deal && deal.stage)         || '\u2014';

      // ---- Compute BoM from deal data ----
      // APP.recoForDeal accepts wizardData-shaped objects; loadDeal returns
      // the symmetric shape, so the deal passes through directly. Wrap in
      // try/catch in case the loaded deal is missing required fields — we
      // still render the page, just without a BoM card.
      let reco = null;
      let recoErr = null;
      try {
        reco = (typeof APP !== 'undefined' && APP.recoForDeal)
          ? APP.recoForDeal(deal)
          : null;
      } catch (e) {
        recoErr = (e && e.message) ? e.message : String(e);
      }
      const bomHtml = reco
        ? renderBomCard(reco, deal.solutionType || '')
        : '<div class="bom-card empty-bom">' +
            '<div class="bom-chassis-sku">BOM UNAVAILABLE</div>' +
            '<div class="bom-chassis-label">Couldn\u2019t compute</div>' +
            '<div class="bom-meta">' + esc(recoErr || 'No solution type set.') + '</div>' +
          '</div>';

      // ---- Section visibility ----
      const hasLed = !!(deal && deal.hasLed);
      const hasSx  = !!(deal && deal.hasSx);

      // ---- Field-count badges (count non-empty values per section) ----
      const ctxFields = ['project','customer_name','partner_name','consultant_name',
        'venue','city','state','stage','lead_source','sales_person','presales_person',
        'contact_name','contact_phone','contact_email','expected_closure','deal_value'];
      const ctxCount = ctxFields.filter(f => deal && deal[f] != null && deal[f] !== '').length;

      const ioCount = (function() {
        if (!deal) return 0;
        if (deal.solutionType === 'calico') {
          return countNonZero(deal.calico_inputs) + countNonZero(deal.calico_outputs) +
                 (deal.calico_audio ? 1 : 0);
        }
        if (deal.solutionType === 'mv') {
          return (Array.isArray(deal.mv_inputs) ? deal.mv_inputs.filter(r => r && Number(r.qty) > 0).length : 0) +
                 (deal.mv_outputSignal ? 1 : 0);
        }
        if (deal.solutionType === 'corio') {
          return countNonZero(deal.corio_inputs) + countNonZero(deal.corio_outputs) +
                 (deal.corio_audio ? 1 : 0) + (deal.corio_fanFilter ? 1 : 0);
        }
        return 0;
      })();

      const ledCount    = (hasLed && Array.isArray(deal.screens))
        ? deal.screens.filter(s => Number(s.w) > 0 && Number(s.h) > 0).length
        : 0;
      const sxCount     = (hasSx && deal.sx_data)
        ? Object.values(deal.sx_data).filter(v => Number(v) > 0).length
        : 0;

      // ---- Chip nav (sticky) ----
      const chips = [
        { id:'sec-ctx', label:'Context'  },
        { id:'sec-sol', label:'Solution' },
        { id:'sec-io',  label:'I/O'      }
      ];
      if (hasLed) chips.push({ id:'sec-led', label:'LED' });
      if (hasSx)  chips.push({ id:'sec-sx',  label:'SX'  });
      const chipNavHtml = '<nav class="sd-chipnav" aria-label="Section nav">' +
        chips.map(c =>
          '<button class="sd-chip" type="button" data-action="sd-jump" data-target="' + esc(c.id) + '">' +
            esc(c.label) +
          '</button>'
        ).join('') +
      '</nav>';

      // ---- Helpers ----
      function row(label, value) {
        const v = (value == null || value === '') ? '\u2014' : String(value);
        return '<div class="sd-row">' +
            '<div class="sd-row-k">' + esc(label) + '</div>' +
            '<div class="sd-row-v">' + esc(v) + '</div>' +
          '</div>';
      }
      function sectionHeader(title, count) {
        return '<summary class="sd-summary">' +
            '<span class="sd-summary-title">' + esc(title) + '</span>' +
            '<span class="sd-summary-meta">' +
              '<span class="sd-badge">' + count + (count === 1 ? ' field' : ' fields') + '</span>' +
              '<span class="sd-chevron" aria-hidden="true">\u203a</span>' +
            '</span>' +
          '</summary>';
      }

      // ---- Section: Project context (auto-expanded) ----
      const ctxBody =
        row('Project',          deal.project) +
        row('Customer',         deal.customer_name) +
        row('Partner',          deal.partner_name) +
        row('Stage',            deal.stage) +
        row('Lead source',      deal.lead_source) +
        row('Venue / City',     [deal.venue, deal.city].filter(Boolean).join(' \u00b7 ')) +
        row('Salesperson',      deal.sales_person) +
        row('Presales',         deal.presales_person) +
        row('Contact',          [deal.contact_name, deal.contact_phone].filter(Boolean).join(' \u00b7 ')) +
        row('Expected closure', deal.expected_closure) +
        row('Deal value',       deal.deal_value);

      // ---- Section: Solution type ----
      const solBody = row('Family', familyLabel(deal.solutionType));

      // ---- Section: Inputs & outputs (family-specific compact preview) ----
      const ioBody = renderSavedDealIoPreview(deal);

      // ---- Section: LED (only if hasLed) ----
      const ledBody = hasLed
        ? (deal.screens || []).filter(s => Number(s.w) > 0 && Number(s.h) > 0).map((s, i) =>
            row('Screen ' + (i+1), s.w + ' \u00d7 ' + s.h + ' = ' + (s.w * s.h).toLocaleString() + ' px')
          ).join('') || '<div class="sd-row sd-row-muted">No screens set.</div>'
        : '';

      // ---- Section: SX (only if hasSx) ----
      const sxBody = hasSx
        ? SX_EDITORIAL
            .filter(s => Number((deal.sx_data || {})[s.id]) > 0)
            .map(s => row(s.label, deal.sx_data[s.id]))
            .join('') || '<div class="sd-row sd-row-muted">No SX quantities set.</div>'
        : '';

      // ---- Assemble ----
      return '<div class="v sd-view">' +

          // Header band
          '<div class="sd-header">' +
            '<div class="sd-ref">' + esc(refId) + '</div>' +
            '<div class="h1 sd-title">' + esc(project) + '</div>' +
            '<div class="small soft">' + esc(customer) + ' \u00b7 ' + esc(stage) + '</div>' +
          '</div>' +

          // BoM hero
          '<section class="sd-bom-wrap">' + bomHtml + '</section>' +

          // Rebuild banner (hidden until alpha.7.3 wires it)
          '<div id="sd-rebuild-banner" class="banner warn" hidden style="margin-top:10px">' +
            '<strong>BoM is out of date.</strong> ' +
            '<button class="btn btn-text" type="button" data-action="sd-rebuild">Tap Rebuild \u2192</button>' +
            ' <span class="small soft">(autosave + Rebuild wire up in alpha.7.2 / .7.3)</span>' +
          '</div>' +

          // Sticky action bar
          '<div class="sd-actionbar">' +
            '<button class="btn"        type="button" data-action="sd-excel"     disabled title="Wires up in Session 8">Excel</button>' +
            '<button class="btn"        type="button" data-action="sd-pdf"       disabled title="Wires up in Session 8">PDF</button>' +
            '<button class="btn btn-ghost" type="button" data-action="sd-edit"   disabled title="Edit form wires up in alpha.7.2">Edit</button>' +
            '<button class="btn btn-danger btn-ghost" type="button" data-action="sd-delete" disabled title="Wires up in alpha.7.4">Delete</button>' +
          '</div>' +

          // Sticky chip nav
          chipNavHtml +

          // Accordion sections
          '<div class="sd-accordion">' +

            '<details class="sd-section" id="sec-ctx" open>' +
              sectionHeader('Project context', ctxCount) +
              '<div class="sd-section-body">' + ctxBody +
                '<div class="sd-edit-note small soft">Editable fields land in alpha.7.2.</div>' +
              '</div>' +
            '</details>' +

            '<details class="sd-section" id="sec-sol">' +
              sectionHeader('Solution type', deal.solutionType ? 1 : 0) +
              '<div class="sd-section-body">' + solBody + '</div>' +
            '</details>' +

            '<details class="sd-section" id="sec-io">' +
              sectionHeader('Inputs & outputs', ioCount) +
              '<div class="sd-section-body">' + ioBody + '</div>' +
            '</details>' +

            (hasLed
              ? '<details class="sd-section" id="sec-led">' +
                  sectionHeader('LED screens', ledCount) +
                  '<div class="sd-section-body">' + ledBody + '</div>' +
                '</details>'
              : '') +

            (hasSx
              ? '<details class="sd-section" id="sec-sx">' +
                  sectionHeader('Signal extension', sxCount) +
                  '<div class="sd-section-body">' + sxBody + '</div>' +
                '</details>'
              : '') +

          '</div>' +

          // Bottom escape
          '<div style="margin-top:18px; text-align:center">' +
            '<button class="btn btn-ghost" type="button" data-nav="#/history">\u2190 Back to History</button>' +
          '</div>' +
        '</div>';
    }

    // Family label helper used in saved-deal Solution section.
    function familyLabel(t) {
      if (t === 'calico') return 'CALICO \u2014 Video Processor';
      if (t === 'mv')     return 'Multi Viewer (CORIOview)';
      if (t === 'corio')  return 'CORIO \u2014 Video Processor';
      return '\u2014';
    }

    // Count non-zero values in a simple object (used for I/O field counts).
    function countNonZero(obj) {
      if (!obj || typeof obj !== 'object') return 0;
      return Object.values(obj).filter(v => Number(v) > 0).length;
    }

    // Compact I/O preview per family. Mirrors the wizard step 3 structure.
    function renderSavedDealIoPreview(deal) {
      if (!deal || !deal.solutionType) {
        return '<div class="sd-row sd-row-muted">No solution type set.</div>';
      }
      const row = function(k, v) {
        const val = (v == null || v === '') ? '\u2014' : String(v);
        return '<div class="sd-row">' +
            '<div class="sd-row-k">' + esc(k) + '</div>' +
            '<div class="sd-row-v">' + esc(val) + '</div>' +
          '</div>';
      };
      if (deal.solutionType === 'calico') {
        const i = deal.calico_inputs || {};
        const o = deal.calico_outputs || {};
        return '<div class="sd-subhead">Inputs</div>' +
          row('HDMI 4K',  i.hdmi4k  || 0) +
          row('HDMI FHD', i.hdmiFhd || 0) +
          row('SDI 12G',  i.sdi12g  || 0) +
          row('SDI 3G',   i.sdi3g   || 0) +
          row('HDBaseT',  i.hdbt    || 0) +
          row('IP',       i.ip      || 0) +
          '<div class="sd-subhead">Outputs</div>' +
          row('Display',   o.display   || 0) +
          row('Projector', o.projector || 0) +
          row('SDI',       o.sdi       || 0) +
          row('Audio',     deal.calico_audio ? 'Yes' : 'No');
      }
      if (deal.solutionType === 'mv') {
        const rows = (deal.mv_inputs || [])
          .filter(r => r && r.signal && Number(r.qty) > 0)
          .map(r => row(r.signal, r.qty)).join('');
        return '<div class="sd-subhead">Inputs</div>' +
          (rows || '<div class="sd-row sd-row-muted">No inputs set.</div>') +
          '<div class="sd-subhead">Output</div>' +
          row('Signal', deal.mv_outputSignal || '\u2014');
      }
      if (deal.solutionType === 'corio') {
        const i = deal.corio_inputs || {};
        const o = deal.corio_outputs || {};
        const iRows = Object.entries(i).filter(([_,v]) => Number(v) > 0)
          .map(([k,v]) => row(k, v)).join('');
        const oRows = Object.entries(o).filter(([_,v]) => Number(v) > 0)
          .map(([k,v]) => row(k, v)).join('');
        return '<div class="sd-subhead">Inputs</div>' +
          (iRows || '<div class="sd-row sd-row-muted">No inputs set.</div>') +
          '<div class="sd-subhead">Outputs</div>' +
          (oRows || '<div class="sd-row sd-row-muted">No outputs set.</div>') +
          row('Audio',      deal.corio_audio || '\u2014') +
          row('Fan filter', deal.corio_fanFilter ? 'Yes' : 'No');
      }
      return '<div class="sd-row sd-row-muted">Unknown solution type.</div>';
    }

    /* ============================================================
       VIEW: Wizard (6 steps)
       ============================================================ */

    function showWizard(stepNum) {
      showChrome(true);
      updateNavActive('#/quote/new');
      if (!wizardData) wizardData = loadDraft();
      wizardData.step = clamp(parseInt(stepNum, 10) || 1, 1, 6);
      wizardData.errors = {};
      // Auto-skip conditional steps if their flag is off
      if (wizardData.step === 4 && !wizardData.hasLed) wizardData.step = wizardData.hasSx ? 5 : 6;
      if (wizardData.step === 5 && !wizardData.hasSx) wizardData.step = 6;
      renderWizard();
    }

    function renderWizard() {
      const d = wizardData;
      const visibleSteps = computeVisibleSteps(d);
      setRoot(
        '<div class="v">' +
          renderWizStepper(d.step, visibleSteps) +
          '<div class="wiz-step-label">Step ' + d.step + ' of 6 \u00b7 ' + esc(STEP_TITLES[d.step]) + '</div>' +
          '<div class="h1">' + esc(STEP_TITLES[d.step]) + '</div>' +
          '<div id="wiz-step-body">' + renderStepBody(d) + '</div>' +
          renderWizActions(d) +
        '</div>'
      );
    }

    function computeVisibleSteps(d) {
      const v = [1, 2, 3];
      if (d.hasLed) v.push(4);
      if (d.hasSx)  v.push(5);
      v.push(6);
      return v;
    }

    function renderWizStepper(current, visible) {
      const dots = [1,2,3,4,5,6].map(n => {
        let cls = 'wiz-dot';
        if (n === current) cls += ' active';
        else if (n < current) cls += ' done';
        const opacity = visible.indexOf(n) >= 0 ? '1' : '0.3';
        return '<div class="' + cls + '" style="opacity:' + opacity + '"></div>';
      }).join('');
      return '<div class="wiz-stepper">' + dots + '</div>';
    }

    function renderStepBody(d) {
      switch (d.step) {
        case 1: return renderStep1(d);
        case 2: return renderStep2(d);
        case 3: return renderStep3(d);
        case 4: return renderStep4(d);
        case 5: return renderStep5(d);
        case 6: return renderStep6(d);
        default: return '';
      }
    }

    function renderWizActions(d) {
      const isLast = d.step === 6;
      const isFirst = d.step === 1;
      return '' +
        '<div class="wiz-actionbar">' +
          (isFirst
            ? '<button class="btn btn-text" type="button" data-action="wiz-cancel">Cancel</button>'
            : '<button class="btn btn-ghost" type="button" data-action="wiz-back">\u2190 Back</button>') +
          '<div class="grow"></div>' +
          (isLast
            ? (d.reco
                ? '<button class="btn btn-ghost" type="button" data-action="wiz-rebuild">Rebuild BoM</button>'
                : '<button class="btn" type="button" data-action="wiz-build">Build quote \u2192</button>')
            : '<button class="btn" type="button" data-action="wiz-next">Next \u2192</button>') +
        '</div>';
    }

    /* ---------- Step 1: Project context ---------- */

    function renderStep1(d) {
      function field(id, label, value, opts) {
        opts = opts || {};
        const type = opts.type || 'text';
        const placeholder = opts.placeholder || '';
        const inputmode = opts.inputmode ? ' inputmode="' + opts.inputmode + '"' : '';
        const required = opts.required ? ' required' : '';
        const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + (opts.required ? ' *' : '') + '</label>' +
          '<input id="i-' + id + '" data-bind="' + id + '" type="' + type + '" ' +
            inputmode + ' value="' + esc(value || '') + '" ' +
            (placeholder ? 'placeholder="' + esc(placeholder) + '" ' : '') +
            required + '>' +
          helpHtml + errHtml +
        '</div>';
      }
      function selectField(id, label, value, options, opts) {
        opts = opts || {};
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        const optsHtml = (opts.placeholder ? '<option value="">' + esc(opts.placeholder) + '</option>' : '') +
          options.map(o => {
            const v = typeof o === 'string' ? o : o.value;
            const l = typeof o === 'string' ? o : o.label;
            return '<option value="' + esc(v) + '"' +
              (value === v ? ' selected' : '') + '>' + esc(l) + '</option>';
          }).join('');
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + (opts.required ? ' *' : '') + '</label>' +
          '<select id="i-' + id + '" data-bind="' + id + '"' +
            (opts.required ? ' required' : '') + '>' + optsHtml + '</select>' +
          errHtml +
        '</div>';
      }

      return '' +
        '<form id="step1-form" autocomplete="off" novalidate>' +
          '<h3 class="h3">Project</h3>' +
          field('project',         'Project name',     d.project,         { required: true,  placeholder: 'e.g. Auditorium upgrade' }) +
          field('customer_name',   'Customer',         d.customer_name,   { required: true }) +
          field('partner_name',    'Partner',          d.partner_name) +
          field('consultant_name', 'Consultant',       d.consultant_name) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Location</h3>' +
          field('venue', 'Venue', d.venue, { placeholder: 'e.g. ABC Tower, 12th floor' }) +
          field('city',  'City',  d.city) +
          field('state', 'State', d.state, { placeholder: 'e.g. Gujarat' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Stage &amp; owners</h3>' +
          selectField('stage', 'Stage', d.stage, STAGES, { required: true }) +
          selectField('lead_source', 'Lead source', d.lead_source, LEAD_SOURCES, { placeholder: '\u2014 select \u2014' }) +
          selectField('sales_person',    'Sales person',    d.sales_person,    SALES_TEAM,    { placeholder: '\u2014 unassigned \u2014' }) +
          selectField('presales_person', 'Presales person', d.presales_person, PRESALES_TEAM, { placeholder: '\u2014 unassigned \u2014' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Partner contact</h3>' +
          field('contact_name',  'Name',  d.contact_name) +
          field('contact_phone', 'Phone', d.contact_phone, { type: 'tel',   inputmode: 'tel' }) +
          field('contact_email', 'Email', d.contact_email, { type: 'email', inputmode: 'email' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Closure &amp; value</h3>' +
          field('expected_closure', 'Expected closure', d.expected_closure, { type: 'month', help: 'Year-month, e.g. 2026-09' }) +
          field('deal_value',       'Deal value (INR)', d.deal_value,       { type: 'number', inputmode: 'numeric', help: 'Approximate; refine later.' }) +
        '</form>';
    }

    /* ---------- Step 2: Solution type ---------- */

    function renderStep2(d) {
      const tiles = [
        { id:'mv',     title:'Multi Viewer (CORIOview)',
          sub:'MWP-* \u2014 fixed presets or Made-To-Order, including mixed inputs' },
        { id:'calico', title:'Video Processor \u2014 CALICO',
          sub:'C7-PRO-1200 / C7-PRO-2200 + input/output cards' },
        { id:'corio',  title:'Video Processor \u2014 CORIO',
          sub:'C3-503 / C3-510 / CM2-547-MK2 + CM/CM2 cards' }
      ];
      const errHtml = d.errors.solutionType
        ? '<div class="banner err">' + esc(d.errors.solutionType) + '</div>'
        : '';
      return errHtml +
        '<div class="tile-group">' +
          tiles.map(t =>
            '<label class="tile" data-checked="' + (d.solutionType === t.id ? 'true' : 'false') + '"' +
              ' data-action="solution-pick" data-value="' + t.id + '">' +
              '<input type="radio" name="solutionType" value="' + t.id + '"' +
                (d.solutionType === t.id ? ' checked' : '') + '>' +
              '<div class="tile-title">' + esc(t.title) + '</div>' +
              '<div class="tile-sub">' + esc(t.sub) + '</div>' +
            '</label>'
          ).join('') +
        '</div>';
    }

    /* ---------- Step 3: Inputs & outputs ---------- */

    function stepperRow(key, name, sub, value, opts) {
      opts = opts || {};
      const min = opts.min != null ? opts.min : 0;
      const max = opts.max != null ? opts.max : 32;
      const ns = opts.namespace || '';
      return '<div class="step-row">' +
        '<div class="step-label">' +
          '<div class="name">' + esc(name) + '</div>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-action="step-dec" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            (value <= min ? ' disabled' : '') + '>\u2212</button>' +
          '<input type="text" inputmode="numeric" value="' + value + '"' +
            ' data-action="step-set" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            ' aria-label="' + esc(name) + ' count">' +
          '<button type="button" data-action="step-inc" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            (value >= max ? ' disabled' : '') + '>+</button>' +
        '</div>' +
      '</div>';
    }

    function toggleRow(key, name, sub, checked, opts) {
      opts = opts || {};
      const ns = opts.namespace || '';
      return '<label class="tile" style="margin-bottom:8px"' +
        ' data-checked="' + (checked ? 'true' : 'false') + '"' +
        ' data-action="toggle" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<div class="tile-title">' + esc(name) + '</div>' +
        (sub ? '<div class="tile-sub">' + esc(sub) + '</div>' : '') +
      '</label>';
    }

    function renderStep3(d) {
      if (!d.solutionType) {
        return '<div class="banner warn">Pick a solution type in Step 2 first.</div>';
      }
      if (d.solutionType === 'calico') return renderStep3Calico(d);
      if (d.solutionType === 'mv')     return renderStep3Mv(d);
      if (d.solutionType === 'corio')  return renderStep3Corio(d);
      return '';
    }

    function renderStep3Calico(d) {
      const inErr = d.errors.calico_io
        ? '<div class="banner err">' + esc(d.errors.calico_io) + '</div>' : '';
      return inErr +
        '<h3 class="h3">Inputs</h3>' +
        '<div class="card">' +
          stepperRow('hdmi4k',  'HDMI 4K60', '4K60 4:4:4 sources',    d.calico_inputs.hdmi4k,  { namespace:'calico_inputs' }) +
          stepperRow('hdmiFhd', 'HDMI FHD',  '1080p sources',         d.calico_inputs.hdmiFhd, { namespace:'calico_inputs' }) +
          stepperRow('sdi12g',  'SDI 12G',   '12G-SDI sources',       d.calico_inputs.sdi12g,  { namespace:'calico_inputs' }) +
          stepperRow('sdi3g',   'SDI 3G',    '3G-SDI sources',        d.calico_inputs.sdi3g,   { namespace:'calico_inputs' }) +
          stepperRow('hdbt',    'HDBaseT',   'HDBT-extended sources', d.calico_inputs.hdbt,    { namespace:'calico_inputs' }) +

    /* ---------- Step 6: Review & build ---------- */

    function renderStep6(d) {
      const rows = [];
      const add = (k, v, jumpStep) => rows.push({ k, v, jumpStep });

      add('Project',  d.project || '\u2014', 1);
      add('Customer', d.customer_name || '\u2014', 1);
      if (d.partner_name)    add('Partner', d.partner_name, 1);
      if (d.consultant_name) add('Consultant', d.consultant_name, 1);
      add('Stage', d.stage || '\u2014', 1);
      if (d.sales_person)    add('Sales',    d.sales_person, 1);
      if (d.presales_person) add('Presales', d.presales_person, 1);
      if (d.deal_value)      add('Value', fmtINR(d.deal_value), 1);
      if (d.expected_closure) add('Expected closure', d.expected_closure, 1);

      const solLabel = { calico: 'CALICO Video Processor', mv: 'Multi Viewer', corio: 'CORIO Video Processor' }[d.solutionType] || '\u2014';
      add('Solution', solLabel, 2);

      if (d.solutionType === 'calico') {
        const inSum = Object.entries(d.calico_inputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ':' + v).join(', ') || 'none';
        const outSum = Object.entries(d.calico_outputs).filter(([k,v]) => k !== 'projectorRes' && v > 0)
          .map(([k,v]) => k + ':' + v).join(', ') || 'none';
        add('Inputs',  inSum, 3);
        add('Outputs', outSum, 3);
        if (d.calico_audio) add('Audio', 'Yes', 3);
      } else if (d.solutionType === 'mv') {
        const inSum = d.mv_inputs.filter(r => r.signal && r.qty > 0)
          .map(r => r.signal + ':' + r.qty).join(', ') || 'none';
        add('Inputs', inSum, 3);
        add('Output signal', d.mv_outputSignal || '\u2014', 3);
      } else if (d.solutionType === 'corio') {
        const inSum = Object.entries(d.corio_inputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ':' + v).join(', ') || 'none';
        const outSum = Object.entries(d.corio_outputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ':' + v).join(', ') || 'none';
        add('Inputs',  inSum, 3);
        add('Outputs', outSum, 3);
        if (d.corio_audio)      add('Audio module', d.corio_audio, 3);
        if (d.corio_fanFilter)  add('Fan filter', 'Yes', 3);
      }

      if (d.hasLed) {
        const sum = d.screens.length === 0
          ? 'no screens'
          : d.screens.map((s,i) => 'S' + (i+1) + ':' + s.w + '\u00d7' + s.h).join(', ');
        add('LED screens', sum, 4);
      }
      if (d.hasSx) {
        const sxSum = Object.entries(d.sx_data).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ':' + v).join(', ') || 'none';
        add('Signal extension', sxSum, 5);
      }

      const summaryHtml =
        '<div class="card wiz-summary">' +
          rows.map(r =>
            '<div class="sum-row">' +
              '<div>' +
                '<div class="sum-key">' + esc(r.k) + '</div>' +
                '<button class="edit-link" type="button" data-action="wiz-jump" data-step="' + r.jumpStep + '">Edit step ' + r.jumpStep + '</button>' +
              '</div>' +
              '<div class="sum-val">' + esc(r.v) + '</div>' +
            '</div>'
          ).join('') +
        '</div>';

      // BoM section (post-Build)
      const bomHtml = d.reco
        ? '<h2 class="h2">Bill of Materials</h2>' + renderBomCard(d.reco, d.solutionType) +
          '<section class="card">' +
            '<div class="h3">Save</div>' +
            '<div class="small muted" style="margin:0 0 10px">' +
              'Persisting this quote to Supabase + navigating to the saved-deal view ' +
              'is Session 7 work.' +
            '</div>' +
            '<button class="btn" type="button" disabled>Save quote (Session 7)</button>' +
            ' <button class="btn btn-ghost" type="button" data-action="wiz-new">Start new</button>' +
          '</section>'
        : '<div class="banner info" style="margin-top:16px">' +
            'Tap <strong>Build quote \u2192</strong> below to compute the BoM. ' +
            'Saving to Supabase wires up in Session 7.' +
          '</div>';

      return summaryHtml + bomHtml;
    }

    /* ---------- BoM card renderer ---------- */

    function renderBomCard(reco, family) {
      if (!reco) return '';
      // Hard error path
      if (reco.error) {
        return '<div class="bom-card empty-bom">' +
          '<div class="bom-chassis-sku">CONFIGURATION REJECTED</div>' +
          '<div class="bom-chassis-label">No chassis fits</div>' +
          '<div class="bom-meta">' + esc(reco.error) + '</div>' +
        '</div>';
      }
      // Empty / no-chassis (MV with no inputs etc)
      if (!reco.chassis) {
        return '<div class="bom-card empty-bom">' +
          '<div class="bom-chassis-sku">EMPTY</div>' +
          '<div class="bom-chassis-label">No chassis recommended</div>' +
          '<div class="bom-meta">' +
            esc((reco.meta && reco.meta.kind) || 'Empty input set.') +
          '</div>' +
        '</div>';
      }

      const meta = reco.meta || {};
      const slotsLine = (meta.slotsTotal != null)
        ? 'Slots: ' + (meta.slotsUsed != null ? meta.slotsUsed : '?') + ' / ' + meta.slotsTotal +
          (meta.ecosystem ? ' \u00b7 ' + meta.ecosystem : '')
        : (meta.chassisLabel || '');

      const linesHtml = (reco.cards || []).map(c =>
        '<li class="bom-line">' +
          '<div class="desc">' + esc(c.desc || c.label || c.sku) +
            '<span class="sku">' + esc(c.sku) + '</span>' +
          '</div>' +
          '<div class="qty">\u00d7' + (c.qty != null ? c.qty : 1) + '</div>' +
        '</li>'
      ).join('');

      const concernsHtml = (reco.concerns && reco.concerns.length)
        ? '<div class="bom-concerns">' +
            '<h4>Concerns</h4>' +
            '<ul>' + reco.concerns.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' +
          '</div>'
        : '';
      const valueAddsHtml = (reco.valueAdds && reco.valueAdds.length)
        ? '<div class="bom-valueadds">' +
            '<h4>Value-add notes</h4>' +
            '<ul>' + reco.valueAdds.map(v => '<li>' + esc(v) + '</li>').join('') + '</ul>' +
          '</div>'
        : '';

      return '<div class="bom-card">' +
        '<div class="bom-chassis-sku">' + esc(reco.chassis) + '</div>' +
        '<div class="bom-chassis-label">' + esc(meta.chassisLabel || reco.chassis) + '</div>' +
        '<div class="bom-meta">' + esc(slotsLine) + '</div>' +
        '<ul class="bom-lines">' + linesHtml + '</ul>' +
        concernsHtml + valueAddsHtml +
      '</div>';
    }

    /* ============================================================
       Wizard validation (per-step)
       Returns { ok, errors }. Errors are field-id → message strings.
       ============================================================ */

    function validateStep(d) {
      const errors = {};
      if (d.step === 1) {
        if (!d.project || !d.project.trim())     errors.project = 'Required.';
        if (!d.customer_name || !d.customer_name.trim()) errors.customer_name = 'Required.';
        if (!d.stage)                            errors.stage = 'Required.';
        if (d.contact_email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.contact_email)) {
          errors.contact_email = 'Looks invalid.';
        }
        if (d.deal_value && isNaN(Number(d.deal_value))) {
          errors.deal_value = 'Must be a number.';
        }
      } else if (d.step === 2) {
        if (!d.solutionType) errors.solutionType = 'Pick a solution type to continue.';
      } else if (d.step === 3) {
        if (d.solutionType === 'calico') {
          const inSum = Object.values(d.calico_inputs).reduce((a,b) => a + (Number(b)||0), 0);
          const outSum = ['display','projector','sdi'].reduce((a,k) => a + (Number(d.calico_outputs[k])||0), 0);
          if (inSum === 0 && outSum === 0) {
            errors.calico_io = 'At least one input or output is required.';
          }
        } else if (d.solutionType === 'mv') {
          const validInputs = d.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0);
          if (validInputs.length === 0) errors.mv_io = 'Add at least one input row with signal + qty.';
          else if (!d.mv_outputSignal)  errors.mv_io = 'Pick an output signal.';
        } else if (d.solutionType === 'corio') {
          const inSum = Object.values(d.corio_inputs).reduce((a,b) => a + (Number(b)||0), 0);
          const outSum = Object.values(d.corio_outputs).reduce((a,b) => a + (Number(b)||0), 0);
          if (inSum === 0 && outSum === 0) {
            errors.corio_io = 'At least one input or output is required.';
          }
        }
      } else if (d.step === 4) {
        if (d.hasLed && d.screens.filter(s => Number(s.w) > 0 && Number(s.h) > 0).length === 0) {
          errors.screens = 'Add at least one screen with width & height > 0, or untick LED in Step 3.';
        }
      } else if (d.step === 5) {
        if (d.hasSx) {
          const total = Object.values(d.sx_data).reduce((a,b) => a + (Number(b)||0), 0);
          if (total === 0) errors.sx = 'Set at least one SX quantity > 0, or untick SX in Step 3.';
        }
      }
      return { ok: Object.keys(errors).length === 0, errors };
    }

    /* ============================================================
       Form-state binding (read inputs back into wizardData)
       Called BEFORE step navigation so latest typed values are
       captured even if the user didn't blur the field.
       ============================================================ */

    function captureStep1Form() {
      const fields = ['project','customer_name','partner_name','consultant_name',
        'venue','city','state','stage','lead_source','sales_person','presales_person',
        'contact_name','contact_phone','contact_email','expected_closure','deal_value'];
      fields.forEach(f => {
        const el = $('i-' + f);
        if (el) wizardData[f] = el.value;
      });
    }

    function captureCurrentStepForm() {
      if (wizardData.step === 1) captureStep1Form();
      // Other steps capture in real-time via event delegation (steppers, tiles,
      // selects, MV rows, screen inputs). Step 1 is the only multi-textfield step
      // that benefits from a bulk capture before navigate.
    }

    /* ============================================================
       Event delegation (single click + input handler on body)
       APP wires the high-level routing actions (login submit,
       PW change submit, build, etc.) — UI handles in-view state
       only (steppers, tiles, screen-add, etc.).
       ============================================================ */

    function bindGlobalEvents() {
      // CLICK delegation
      document.body.addEventListener('click', function(e) {
        // Nav buttons (anywhere with data-nav)
        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
          e.preventDefault();
          const target = navBtn.getAttribute('data-nav');
          if (location.hash === target) {
            // Same route — force re-render via custom event
            window.dispatchEvent(new HashChangeEvent('hashchange'));
          } else {
            location.hash = target;
          }
          return;
        }

        // Sheet backdrop close
        const sheetClose = e.target.closest('[data-sheet-close]');
        if (sheetClose) { closeSheet(); return; }

        // Generic actions
        const actEl = e.target.closest('[data-action]');
        if (!actEl) return;
        const action = actEl.getAttribute('data-action');

        // History filter
        if (action === 'hist-filter') {
          const f = actEl.getAttribute('data-value');
          setHistoryFilter(f);
          return;
        }

        // Solution-type tile
        if (action === 'solution-pick') {
          const v = actEl.getAttribute('data-value');
          wizardData.solutionType = v;
          saveDraft();
          renderWizard();
          return;
        }

        // Stepper +/-
        if (action === 'step-inc' || action === 'step-dec') {
          const ns  = actEl.getAttribute('data-ns');
          const key = actEl.getAttribute('data-key');
          if (ns) {
            wizardData[ns][key] = (Number(wizardData[ns][key]) || 0) + (action === 'step-inc' ? 1 : -1);
            if (wizardData[ns][key] < 0) wizardData[ns][key] = 0;
          } else {
            // bare key — currently unused for steppers; reserved
          }
          saveDraft();
          renderWizard();
          return;
        }

        // Toggle (tile w/ checkbox)
        if (action === 'toggle') {
          const ns  = actEl.getAttribute('data-ns');
          const key = actEl.getAttribute('data-key');
          if (ns) {
            wizardData[ns][key] = !wizardData[ns][key];
          } else {
            wizardData[key] = !wizardData[key];
          }
          saveDraft();
          renderWizard();
          return;
        }

        // Wizard navigation
        if (action === 'wiz-next')   { APP.wizNext(); return; }
        if (action === 'wiz-back')   { APP.wizBack(); return; }
        if (action === 'wiz-build')  { APP.wizBuild(); return; }
        if (action === 'wiz-rebuild'){ APP.wizBuild(); return; }
        if (action === 'wiz-cancel') {
          if (confirm('Discard this draft quote and start over?')) {
            clearDraft();
            location.hash = '#/home';
          }
          return;
        }
        if (action === 'wiz-jump') {
          captureCurrentStepForm();
          const s = parseInt(actEl.getAttribute('data-step'), 10) || 1;
          wizardData.step = s;
          wizardData.reco = null;
          renderWizard();
          return;
        }
        if (action === 'wiz-new') {
          if (confirm('Clear this quote and start a new one?')) {
            clearDraft();
            wizardData = defaultWizard();
            renderWizard();
          }
          return;
        }

        // MV input row mgmt
        if (action === 'mv-input-add') {
          wizardData.mv_inputs.push({ signal: '', qty: 1 });
          saveDraft();
          renderWizard();
          return;
        }
        if (action === 'mv-input-remove') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          wizardData.mv_inputs.splice(idx, 1);
          saveDraft();
          renderWizard();
          return;
        }
        if (action === 'mv-input-inc' || action === 'mv-input-dec') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const row = wizardData.mv_inputs[idx];
          if (!row) return;
          row.qty = (Number(row.qty) || 0) + (action === 'mv-input-inc' ? 1 : -1);
          if (row.qty < 0) row.qty = 0;
          saveDraft();
          renderWizard();
          return;
        }

        // LED screen mgmt
        if (action === 'screen-add') {
          wizardData.screens.push({ w: '', h: '' });
          saveDraft();
          renderWizard();
          return;
        }
        if (action === 'screen-remove') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          wizardData.screens.splice(idx, 1);
          saveDraft();
          renderWizard();
          return;
        }

        // Logout
        if (action === 'logout') {
          STORE.logout();
          toast('Signed out.', 'default');
          location.hash = '#/login';
          return;
        }

        // Saved-deal "Try again" button — re-dispatches showSavedDeal with the
        // refId from data-ref. Avoids touching the hash (which wouldn't re-fire
        // if the user is already on #/quote/<ref>).
        if (action === 'saved-retry') {
          const ref = t.getAttribute('data-ref') || '';
          if (ref) showSavedDeal(ref);
          return;
        }

        // Saved-deal chip-nav jump — open target accordion section + smooth-scroll.
        // The <details> element needs `open` set explicitly before scrollIntoView
        // so the browser scrolls to the expanded position, not the collapsed one.
        if (action === 'sd-jump') {
          const targetId = t.getAttribute('data-target') || '';
          const el = document.getElementById(targetId);
          if (el) {
            if (el.tagName === 'DETAILS') el.open = true;
            // Defer to next frame so layout settles after open=true expands the body.
            requestAnimationFrame(function() {
              el.scrollIntoView({ behavior:'smooth', block:'start' });
            });
          }
          return;
        }

        // Smoke buttons
        // All three handlers toast a summary so the result survives even if
        // the smoke causes a view change (e.g. STORE smoke ends in logout
        // and the auth guard re-routes to #/login, wiping the dev pre).
        if (action === 'run-smoke') {
          const r = window.__smoke();
          renderSmokeOutput(r);
          const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
          toast('Sync smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
          return;
        }
        if (action === 'run-store-smoke') {
          if (!confirm('STORE smoke runs a full auth round-trip and will sign you out at the end. Continue?')) return;
          actEl.disabled = true;
          const el = $('dev-smoke-out');
          if (el) { el.hidden = false; el.innerHTML = '<span class="warn-ln">running\u2026</span>'; }
          window.__smokeStore().then(r => {
            // If still on Profile, render in-pre; otherwise toast only.
            if ($('dev-smoke-out')) renderSmokeOutput(r);
            const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
            toast('STORE smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
          }).catch(e => {
            toast('STORE smoke harness threw: ' + esc(e && e.message || String(e)), 'err');
          }).finally(() => { actEl.disabled = false; });
          return;
        }
        if (action === 'run-ui-smoke') {
          const r = window.__smokeUI();
          renderSmokeOutput(r);
          const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
          toast('UI smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
          return;
        }
      });

      // INPUT delegation (text fields, steppers, MV rows, screens, audio select)
      document.body.addEventListener('input', function(e) {
        const t = e.target;
        if (!t) return;

        // Generic data-bind ("namespace.key" or "key" for top-level)
        const bind = t.getAttribute('data-bind');
        if (bind) {
          if (bind.indexOf('.') > -1) {
            const [ns, key] = bind.split('.');
            wizardData[ns][key] = t.value;
          } else {
            wizardData[bind] = t.value;
          }
          saveDraft();
          // No re-render on input — would lose focus. Caller can re-render
          // explicitly when needed (e.g. projector resolution depends on
          // projector count, which uses stepper — handled separately).
          return;
        }

        // Stepper direct typing
        const action = t.getAttribute('data-action');
        if (action === 'step-set') {
          const ns  = t.getAttribute('data-ns');
          const key = t.getAttribute('data-key');
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? 0 : v;
          if (ns) wizardData[ns][key] = safe;
          saveDraft();
          // Don't re-render mid-type; user is still typing.
          return;
        }

        // MV input qty direct typing
        if (action === 'mv-input-set') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.mv_inputs[idx];
          if (row) {
            const v = parseInt(t.value, 10);
            row.qty = isNaN(v) || v < 0 ? 0 : v;
            saveDraft();
          }
          return;
        }

        // LED screen W/H direct typing
        if (action === 'screen-w' || action === 'screen-h') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.screens[idx];
          if (row) {
            const v = parseInt(t.value, 10);
            const safe = isNaN(v) || v < 0 ? '' : v;
            row[action === 'screen-w' ? 'w' : 'h'] = safe;
            saveDraft();
          }
          return;
        }
      });

      // CHANGE delegation for selects (MV per-row signal + general selects)
      document.body.addEventListener('change', function(e) {
        const t = e.target;
        if (!t) return;
        const action = t.getAttribute('data-action');
        if (action === 'mv-input-signal') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          if (wizardData.mv_inputs[idx]) {
            wizardData.mv_inputs[idx].signal = t.value;
            saveDraft();
          }
          return;
        }
        // Selects bound by data-bind already fire 'input' on change in most
        // browsers, but Safari historically only fires 'change' for select.
        const bind = t.getAttribute('data-bind');
        if (bind && t.tagName === 'SELECT') {
          if (bind.indexOf('.') > -1) {
            const [ns, key] = bind.split('.');
            wizardData[ns][key] = t.value;
          } else {
            wizardData[bind] = t.value;
          }
          saveDraft();
          return;
        }
      });

      // FORM SUBMIT delegation (login, force-PW, profile-PW, step1)
      document.body.addEventListener('submit', function(e) {
        const f = e.target;
        if (!f || f.tagName !== 'FORM') return;
        if (f.id === 'login-form')       { e.preventDefault(); APP.handleLoginSubmit(); return; }
        if (f.id === 'pw-form')          { e.preventDefault(); APP.handleForcePwSubmit(); return; }
        if (f.id === 'profile-pw-form')  { e.preventDefault(); APP.handleProfilePwSubmit(); return; }
        if (f.id === 'step1-form')       { e.preventDefault(); APP.wizNext(); return; }
      });
    }

    /* ============================================================
       Boot mount
       ============================================================ */

    function mount() {
      $('app').hidden = false;
      $('ver-pill').textContent = CATALOG.version;
      bindGlobalEvents();
    }

    /* ---------- Public API ---------- */

    return {
      mount, toast, openSheet, closeSheet,
      showLogin, showForcePw,
      showHome, showHistory, showProfile, showSavedDeal, showWizard,
      updateNavActive, showChrome,
      // expose for APP
      getWizardData: () => wizardData,
      setWizardData: (d) => { wizardData = d; },
      loadDraft, clearDraft, saveDraft: () => saveDraft(),
      defaultWizard,
      renderWizard,
      validateStep,
      captureCurrentStepForm,
      setFieldError,
      // helpers
      esc, fmtINR, debounce,
      // smoke renderer
      _renderSmokeOutput: renderSmokeOutput
    };
  })();

  /* ============================================================
     APP  (Session 5 + 6 of v27 rebuild)

     Orchestrator. Wires:
       - hashchange → UI view
       - auth state → guarded routes
       - login form → STORE.login
       - PW change form → STORE.changePassword
       - wizard Next/Back/Build → RECOMMEND dispatch

     Notes:
       - Save-on-Build is deferred to Session 7 per SPEC §5.1 ("No save yet")
         interpretation: Step 6 Build computes RECOMMEND + renders BoM, and a
         disabled "Save quote (Session 7)" button surfaces the next move.
       - actor_user_id injection is implicit in STORE; APP doesn't pass it.
       - Pipeline stages are hardcoded in UI.STAGES (TODO: load from DB
         per Session 4 handoff §12).
     ============================================================ */
  const APP = (function() {

    /* ---------- Router ---------- */

    function start() {
      // Guarded routing: if no current user and not at #/login, force to login.
      window.addEventListener('hashchange', onRouteChange);
      // Auth state cleanup: clear wizard draft on explicit logout via STORE event.
      STORE.onAuthChange(function(user) {
        if (!user) {
          UI.clearDraft();
          // Force to login if not already there.
          if (location.hash !== '#/login') location.hash = '#/login';
        }
      });
      // Boot route
      const initialHash = (location.hash && location.hash.length > 1) ? location.hash : '';
      const u = STORE.currentUser();
      if (!u) {
        // Unauth — force login
        if (initialHash !== '#/login') {
          // Setting hash will fire onRouteChange
          location.hash = '#/login';
        } else {
          UI.showLogin();
        }
        return;
      }
      // Auth — must_change short-circuits to force-PW
      if (u.must_change) {
        UI.showForcePw(u);
        return;
      }
      if (!initialHash || initialHash === '#/' || initialHash === '#/login') {
        location.hash = '#/home';
      } else {
        onRouteChange();
      }
    }

    function onRouteChange() {
      const hash = location.hash || '#/home';
      const u = STORE.currentUser();

      // Auth guard
      if (!u && hash !== '#/login') {
        location.hash = '#/login';
        return;
      }
      // Forced-PW guard: any logged-in user with must_change must finish PW
      // change before going anywhere else.
      if (u && u.must_change && hash !== '#/login') {
        UI.showForcePw(u);
        return;
      }

      // Route resolution
      if (hash === '#/login') { UI.showLogin(); return; }
      if (hash === '#/home')  { UI.showHome();  return; }
      if (hash === '#/history') { UI.showHistory(); return; }
      if (hash === '#/profile') { UI.showProfile(); return; }
      if (hash === '#/quote/new' ||
          hash.indexOf('#/quote/new/') === 0) {
        const parts = hash.split('/');
        // #/quote/new          → step 1
        // #/quote/new/2        → step 2
        const stepNum = parts.length >= 4 ? parseInt(parts[3], 10) || 1 : 1;
        UI.showWizard(stepNum);
        return;
      }
      if (hash.indexOf('#/quote/') === 0) {
        // #/quote/TV-XXXXXXXX → saved-deal view (alpha.7.0 skeleton, full layout alpha.7.1+)
        const refId = hash.substring('#/quote/'.length);
        UI.showSavedDeal(refId);
        return;
      }
      // Fallback
      location.hash = '#/home';
    }

    /* ---------- Login flow ---------- */

    async function handleLoginSubmit() {
      const userF = document.getElementById('f-username');
      const passF = document.getElementById('f-password');
      const userI = document.getElementById('i-username');
      const passI = document.getElementById('i-password');
      const btn   = document.getElementById('btn-login');
      if (!userI || !passI) return;

      UI.setFieldError('f-username', null);
      UI.setFieldError('f-password', null);

      const username = (userI.value || '').trim();
      const password = passI.value || '';
      if (!username) { UI.setFieldError('f-username', 'Required.'); userI.focus(); return; }
      if (!password) { UI.setFieldError('f-password', 'Required.'); passI.focus(); return; }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Signing in\u2026';
      try {
        const user = await STORE.login({ username, password });
        if (user.must_change) {
          UI.showForcePw(user);
          UI.toast('Please set a new password.', 'default');
        } else {
          UI.toast('Welcome, ' + (user.full_name || user.username) + '!', 'ok');
          location.hash = '#/home';
        }
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Sign-in failed.';
        UI.setFieldError('f-password', msg);
        UI.toast(msg, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function handleForcePwSubmit() {
      const oldF = document.getElementById('f-oldpw');
      const newF = document.getElementById('f-newpw');
      const new2F = document.getElementById('f-newpw2');
      const oldI = document.getElementById('i-oldpw');
      const newI = document.getElementById('i-newpw');
      const new2I = document.getElementById('i-newpw2');
      const btn = document.getElementById('btn-pwchange');

      UI.setFieldError('f-oldpw',  null);
      UI.setFieldError('f-newpw',  null);
      UI.setFieldError('f-newpw2', null);

      const oldPw = oldI.value || '';
      const newPw = newI.value || '';
      const conf  = new2I.value || '';

      if (!oldPw) { UI.setFieldError('f-oldpw', 'Required.'); return; }
      if (!newPw || newPw.trim().length < 6) {
        UI.setFieldError('f-newpw', 'At least 6 characters required.'); return;
      }
      if (newPw !== conf) { UI.setFieldError('f-newpw2', 'Does not match.'); return; }
      if (newPw.trim() !== newPw) {
        UI.setFieldError('f-newpw', 'No leading/trailing spaces.'); return;
      }
      if (newPw === oldPw) {
        UI.setFieldError('f-newpw', 'Must differ from current password.'); return;
      }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Updating\u2026';
      try {
        await STORE.changePassword({ oldPassword: oldPw, newPassword: newPw });
        UI.toast('Password updated. Welcome aboard.', 'ok');
        location.hash = '#/home';
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Password change failed.';
        UI.setFieldError('f-oldpw', msg);
        UI.toast(msg, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function handleProfilePwSubmit() {
      const oldI = document.getElementById('pi-oldpw');
      const newI = document.getElementById('pi-newpw');
      const new2I = document.getElementById('pi-newpw2');

      UI.setFieldError('pf-oldpw',  null);
      UI.setFieldError('pf-newpw',  null);
      UI.setFieldError('pf-newpw2', null);

      const oldPw = oldI.value || '';
      const newPw = newI.value || '';
      const conf  = new2I.value || '';

      if (!oldPw) { UI.setFieldError('pf-oldpw', 'Required.'); return; }
      if (!newPw || newPw.trim().length < 6) {
        UI.setFieldError('pf-newpw', 'At least 6 characters required.'); return;
      }
      if (newPw !== conf) { UI.setFieldError('pf-newpw2', 'Does not match.'); return; }
      if (newPw.trim() !== newPw) {
        UI.setFieldError('pf-newpw', 'No leading/trailing spaces.'); return;
      }
      try {
        await STORE.changePassword({ oldPassword: oldPw, newPassword: newPw });
        UI.toast('Password updated.', 'ok');
        // Clear form
        oldI.value = ''; newI.value = ''; new2I.value = '';
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Password change failed.';
        UI.setFieldError('pf-oldpw', msg);
        UI.toast(msg, 'err');
      }
    }

    /* ---------- Wizard navigation ---------- */

    function wizNext() {
      UI.captureCurrentStepForm();
      const d = UI.getWizardData();
      const v = UI.validateStep(d);
      if (!v.ok) {
        d.errors = v.errors;
        UI.renderWizard();
        // Toast first error for visibility
        const firstKey = Object.keys(v.errors)[0];
        UI.toast(v.errors[firstKey], 'err');
        return;
      }
      d.errors = {};
      // Advance with auto-skip for conditional steps
      let next = d.step + 1;
      if (next === 4 && !d.hasLed) next = d.hasSx ? 5 : 6;
      if (next === 5 && !d.hasSx)  next = 6;
      d.step = clamp(next, 1, 6);
      UI.saveDraft();
      UI.renderWizard();
    }

    function wizBack() {
      UI.captureCurrentStepForm();
      const d = UI.getWizardData();
      d.errors = {};
      let prev = d.step - 1;
      if (prev === 5 && !d.hasSx)  prev = d.hasLed ? 4 : 3;
      if (prev === 4 && !d.hasLed) prev = 3;
      d.step = clamp(prev, 1, 6);
      UI.saveDraft();
      UI.renderWizard();
    }

    function wizBuild() {
      const d = UI.getWizardData();
      try {
        d.reco = computeReco(d);
        UI.saveDraft();
        UI.renderWizard();
        if (d.reco && d.reco.error) {
          UI.toast(d.reco.error, 'err');
        } else if (d.reco && !d.reco.chassis) {
          UI.toast('No chassis recommended for current inputs.', 'warn');
        } else {
          UI.toast('BoM built. Scroll to review.', 'ok');
        }
      } catch (e) {
        UI.toast('Build failed: ' + (e && e.message || String(e)), 'err');
      }
    }

    function computeReco(d) {
      if (d.solutionType === 'calico') {
        return RECOMMEND.calico({
          inputs:  d.calico_inputs,
          outputs: Object.assign({}, d.calico_outputs, { led: !!d.hasLed }),
          screens: d.hasLed ? d.screens
            .filter(s => Number(s.w) > 0 && Number(s.h) > 0)
            .map(s => ({ pixels: Number(s.w) * Number(s.h), ports: 0 }))
            : [],
          audio:   !!d.calico_audio
        });
      }
      if (d.solutionType === 'mv') {
        const validInputs = d.mv_inputs
          .filter(r => r && r.signal && Number(r.qty) > 0)
          .map(r => ({ signal: r.signal, qty: Number(r.qty) }));
        return RECOMMEND.mv({
          inputs: validInputs,
          outputSignal: d.mv_outputSignal
        });
      }
      if (d.solutionType === 'corio') {
        // Strip zero-qty entries to keep the input clean for RECOMMEND.
        const inputs = {};
        Object.entries(d.corio_inputs).forEach(([k,v]) => { if (Number(v) > 0) inputs[k] = Number(v); });
        const outputs = {};
        Object.entries(d.corio_outputs).forEach(([k,v]) => { if (Number(v) > 0) outputs[k] = Number(v); });
        const args = { inputs, outputs };
        if (d.corio_audio)     args.audio = d.corio_audio;
        if (d.corio_fanFilter) args.fanFilter = true;
        return RECOMMEND.corio(args);
      }
      return { chassis: null, cards: [], concerns: [], valueAdds: [], meta: { type: 'empty' } };
    }

    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

    /* ---------- Public API ---------- */

    return {
      start, onRouteChange,
      handleLoginSubmit, handleForcePwSubmit, handleProfilePwSubmit,
      wizNext, wizBack, wizBuild,
      // alpha.7.1: UI.showSavedDeal needs to compute BoM from loaded deal data.
      // computeReco accepts wizardData-shaped object and STORE.loadDeal returns
      // the same shape (plus display_ref / lines[] / etc.), so passing the deal
      // straight in is safe.
      recoForDeal: computeReco
    };
  })();

  /* ============================================================
     __smokeUI() — Session 5 + 6 smoke gate
     Tests router resolution, wizard state machine, validation,
     and family-aware RECOMMEND dispatch via APP.computeReco.
     Synchronous. Console-callable.
     ============================================================ */
  window.__smokeUI = function() {
    const out = [];
    let pass = 0, fail = 0;
    function check(label, fn) {
      try {
        const r = fn();
        if (r === true) { out.push('\u2713 ' + label); pass++; }
        else            { out.push('\u2717 ' + label + '  \u2192 ' + r); fail++; }
      } catch (e) {
        out.push('\u2717 ' + label + '  \u2192 THREW: ' + (e && e.message || String(e)));
        fail++;
      }
    }

    /* ---- UI module shape ---- */
    check('UI is defined and frozen-like (returns object)',
      () => (typeof UI === 'object' && UI !== null) || 'got: ' + typeof UI);
    check('UI exposes mount, showLogin, showHome, showWizard',
      () => ['mount','showLogin','showHome','showWizard']
        .every(k => typeof UI[k] === 'function') || 'missing methods');
    check('APP exposes start, onRouteChange, wizNext, wizBack, wizBuild',
      () => ['start','onRouteChange','wizNext','wizBack','wizBuild']
        .every(k => typeof APP[k] === 'function') || 'missing methods');

    /* ---- Wizard default shape ---- */
    const dw = UI.defaultWizard();
    check('defaultWizard returns object with all required keys',
      () => ['project','customer_name','stage','solutionType',
             'calico_inputs','mv_inputs','corio_inputs',
             'hasLed','screens','hasSx','sx_data']
        .every(k => Object.prototype.hasOwnProperty.call(dw, k))
        || 'keys: ' + Object.keys(dw).join(','));
    check('defaultWizard.step === 1',
      () => dw.step === 1 || 'got: ' + dw.step);
    check('defaultWizard.calico_inputs has 6 signal types at 0',
      () => Object.keys(dw.calico_inputs).length === 6 &&
            Object.values(dw.calico_inputs).every(v => v === 0)
        || 'got: ' + JSON.stringify(dw.calico_inputs));

    /* ---- Validation step 1 (project + customer + stage required) ---- */
    const d1 = UI.defaultWizard(); d1.step = 1;
    let v = UI.validateStep(d1);
    check('Step 1 validation: empty form fails with project + customer_name errors',
      () => (!v.ok && !!v.errors.project && !!v.errors.customer_name) || 'errors: ' + JSON.stringify(v.errors));
    d1.project = 'Test'; d1.customer_name = 'X';
    v = UI.validateStep(d1);
    check('Step 1 validation: project + customer + default stage passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 2 (solutionType required) ---- */
    const d2 = UI.defaultWizard(); d2.step = 2;
    v = UI.validateStep(d2);
    check('Step 2 validation: no solutionType fails',
      () => (!v.ok && !!v.errors.solutionType) || 'errors: ' + JSON.stringify(v.errors));
    d2.solutionType = 'calico';
    v = UI.validateStep(d2);
    check('Step 2 validation: solutionType=calico passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 3 CALICO (need at least one I/O) ---- */
    const d3 = UI.defaultWizard(); d3.step = 3; d3.solutionType = 'calico';
    v = UI.validateStep(d3);
    check('Step 3 CALICO validation: all zeros fails with calico_io error',
      () => (!v.ok && !!v.errors.calico_io) || 'errors: ' + JSON.stringify(v.errors));
    d3.calico_inputs.hdmi4k = 3; d3.calico_outputs.display = 2;
    v = UI.validateStep(d3);
    check('Step 3 CALICO validation: 3 HDMI 4K in + 2 display out passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 3 MV ---- */
    const d3mv = UI.defaultWizard(); d3mv.step = 3; d3mv.solutionType = 'mv';
    v = UI.validateStep(d3mv);
    check('Step 3 MV validation: empty inputs fails',
      () => (!v.ok && !!v.errors.mv_io) || 'errors: ' + JSON.stringify(v.errors));
    d3mv.mv_inputs = [{ signal: 'FHD HDMI', qty: 4 }];
    d3mv.mv_outputSignal = '4K HDMI';
    v = UI.validateStep(d3mv);
    check('Step 3 MV validation: 4 FHD HDMI in + 4K HDMI out passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 4 (LED screens) ---- */
    const d4 = UI.defaultWizard(); d4.step = 4; d4.hasLed = true;
    v = UI.validateStep(d4);
    check('Step 4 validation: hasLed=true with no screens fails',
      () => (!v.ok && !!v.errors.screens) || 'errors: ' + JSON.stringify(v.errors));
    d4.screens = [{ w: 1920, h: 1080 }];
    v = UI.validateStep(d4);
    check('Step 4 validation: one 1920x1080 screen passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 5 (SX quantities) ---- */
    const d5 = UI.defaultWizard(); d5.step = 5; d5.hasSx = true;
    v = UI.validateStep(d5);
    check('Step 5 validation: hasSx=true with all zero qty fails',
      () => (!v.ok && !!v.errors.sx) || 'errors: ' + JSON.stringify(v.errors));
    d5.sx_data.hdmi = 2;
    v = UI.validateStep(d5);
    check('Step 5 validation: hasSx with hdmi=2 passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Visible-steps logic ---- */
    const dvs = UI.defaultWizard();
    // computeVisibleSteps is internal — test via render (does the wizard render?)
    // Just verify it doesn't throw by mounting a hidden wizard render.
    check('Wizard renders without throwing for default state',
      () => {
        try {
          const stash = UI.getWizardData();
          UI.setWizardData(UI.defaultWizard());
          UI.renderWizard();
          UI.setWizardData(stash);
          return true;
        } catch (e) { return e.message; }
      });

    /* ---- localStorage draft round-trip ---- */
    check('saveDraft + loadDraft round-trip preserves project name',
      () => {
        const stash = UI.getWizardData();
        const d = UI.defaultWizard();
        d.project = 'Smoke-UI-Roundtrip';
        UI.setWizardData(d);
        UI.saveDraft();
        // saveDraft is debounced; the implementation also exposes via direct call
        // here we wait a tick by checking the raw key
        // We accept either: localStorage has the key, or in-memory state still has it.
        const raw = localStorage.getItem('v27.wizard.draft');
        const ok = !raw || (raw.indexOf('Smoke-UI-Roundtrip') > -1);
        // Restore
        UI.setWizardData(stash);
        return ok || 'raw: ' + (raw ? raw.substring(0,100) : 'null');
      });

    /* ---- Router (synthetic hashchange) ---- */
    check('Router resolves #/home for logged-in user without throwing',
      () => {
        const u = STORE.currentUser();
        if (!u) return true;  // skip when unauth (just confirm no throw)
        try {
          const stash = location.hash;
          location.hash = '#/home';
          // hashchange is async — we don't await it; just verify no throw
          location.hash = stash || '#/home';
          return true;
        } catch (e) { return e.message; }
      });

    /* ---- DOM shell ---- */
    check('DOM has #app, #view-root, #bottom-nav, #toast-host, #sheet-host',
      () => ['app','view-root','bottom-nav','toast-host','sheet-host']
        .every(id => document.getElementById(id)) || 'missing shell DOM');
    check('Bottom nav has 4 buttons',
      () => document.querySelectorAll('#bottom-nav button[data-nav]').length === 4
        || 'got: ' + document.querySelectorAll('#bottom-nav button[data-nav]').length);

    /* ---- Version pill ---- */
    check('Version pill shows CATALOG.version',
      () => {
        const el = document.getElementById('ver-pill');
        return (el && el.textContent === CATALOG.version) ||
          'got: ' + (el && el.textContent);
      });

    /* ---- CSS variables loaded ---- */
    check('Design tokens loaded (--c-accent visible)',
      () => {
        const v = getComputedStyle(document.documentElement).getPropertyValue('--c-accent').trim();
        return v !== '' || 'got: empty';
      });

    /* ---- Chrome hidden on login (regression check, alpha.6.1 hotfix;
       rewritten in alpha.6.2 to be non-destructive — the original called
       UI.showLogin() mid-smoke which wiped view-root and broke output
       rendering. This version uses a transient probe element instead. */
    check('CSS [hidden] rule beats display:flex on chrome elements',
      () => {
        const probe = document.createElement('div');
        probe.className = 'topbar';
        probe.hidden = true;
        probe.style.position = 'absolute';
        probe.style.left = '-99999px';
        document.body.appendChild(probe);
        const display = getComputedStyle(probe).display;
        document.body.removeChild(probe);
        return display === 'none' || 'got: ' + display + ' (expected none)';
      });

    return {
      pass, fail, lines: out,
      summary: '\n' + pass + ' passed, ' + fail + ' failed (UI)',
      ok: fail === 0
    };
  };

  /* ============================================================
     Boot
     Mounts UI then starts APP router. Runs as soon as the
     containing <script> executes (script is at end of body, so
     DOMContentLoaded is no longer needed).
     ============================================================ */
  UI.mount();
  APP.start();

  /* ============================================================
     End of v27.0.0-alpha.7.1
     (Session 7 surface 2/6: real one-page layout — BoM hero,
      sticky action bar, sticky chip nav, accordion sections;

     ============================================================ */
  </script>
