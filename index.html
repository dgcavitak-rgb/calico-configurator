          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = _savedDealData.screens[idx];
          if (!row) return;
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? '' : v;
          const field = sdAct === 'sd-screen-w' ? 'w' : 'h';
          if (row[field] !== safe) {
            row[field] = safe;
            markStructuralDirty();
          }
          return;
        }

        // alpha.7.6: MV input qty direct typing
        if (sdAct === 'sd-mv-input-set' && _savedDealData) {
          if (!Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = _savedDealData.mv_inputs[idx];
          if (!row) return;
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? 0 : (v > 32 ? 32 : v);
          if (row.qty !== safe) {
            row.qty = safe;
            markStructuralDirty();
          }
          return;
        }

        // Stepper direct typing
        const action = t.getAttribute('data-action');
        if (action === 'step-set') {
          const ns  = t.getAttribute('data-ns');
          const key = t.getAttribute('data-key');
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? 0 : v;
          // v27.1.2 #3+#5 — synthetic LED stepper: resize screens array on
          // direct-type as well. Re-render here (unlike normal step-set which
          // skips render during typing) because screen blocks in Step 4 need
          // to update when user changes LED count from Step 3.
          if (ns === '__calico_led') {
            _resizeScreens(safe);
            wizardData.hasLed = (safe > 0);
            saveDraft();
            rerenderPreservingScroll();
            return;
          }
          // v27.1.2 #7 — corio_canvases direct typing.
          if (ns === '__corio_canvas') {
            wizardData.corio_canvases = safe;
            saveDraft();
            // Don't re-render mid-type; allow continued typing.
            return;
          }
          if (ns) wizardData[ns][key] = safe;
          saveDraft();
          // Don't re-render mid-type; user is still typing.
          return;
        }

        // MV input qty direct typing
        if (action === 'mv-input-set') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.mv_inputs[idx];
          if (row) {
            const v = parseInt(t.value, 10);
            row.qty = isNaN(v) || v < 0 ? 0 : v;
            saveDraft();
          }
          return;
        }

        // LED screen W/H direct typing
        if (action === 'screen-w' || action === 'screen-h') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.screens[idx];
          if (row) {
            const v = parseInt(t.value, 10);
            const safe = isNaN(v) || v < 0 ? '' : v;
            row[action === 'screen-w' ? 'w' : 'h'] = safe;
            saveDraft();
          }
          return;
        }

        // v27.1.2 #5 — LED pixel pitch direct typing.
        // Store as STRING (not parsed) during typing so users can build up
        // "2.5" → "2.50" without the value snapping. validateStep parses +
        // range-checks. Accept only digits and a single decimal point; strip
        // anything else silently so paste/autocomplete oddities don't stick.
        if (action === 'screen-pitch') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.screens[idx];
          if (row) {
            // Allow empty during typing; sanitize to numeric+decimal pattern.
            let s = String(t.value == null ? '' : t.value);
            // Permit one optional leading minus is NOT allowed — pitches are positive.
            s = s.replace(/[^0-9.]/g, '');
            // Collapse multiple decimal points to the first one
            const firstDot = s.indexOf('.');
            if (firstDot >= 0) {
              s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
            }
            row.pitch = s;
            // If sanitizer changed the value, write it back so the input
            // doesn't show illegal chars momentarily.
            if (s !== t.value) t.value = s;
            saveDraft();
          }
          return;
        }
      });

      // CHANGE delegation for selects (MV per-row signal + general selects)
      document.body.addEventListener('change', function(e) {
        const t = e.target;
        if (!t) return;
        const action = t.getAttribute('data-action');
        if (action === 'mv-input-signal') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          if (wizardData.mv_inputs[idx]) {
            wizardData.mv_inputs[idx].signal = t.value;
            saveDraft();
          }
          return;
        }
        // alpha.7.6: Saved-deal MV per-row signal change
        if (action === 'sd-mv-input-signal' && _savedDealData) {
          if (!Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = _savedDealData.mv_inputs[idx];
          if (!row) return;
          row.signal = t.value;
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        // Selects bound by data-bind already fire 'input' on change in most
        // browsers, but Safari historically only fires 'change' for select.
        const bind = t.getAttribute('data-bind');
        if (bind && t.tagName === 'SELECT') {
          if (bind.indexOf('.') > -1) {
            const [ns, key] = bind.split('.');
            wizardData[ns][key] = t.value;
          } else {
            wizardData[bind] = t.value;
          }
          saveDraft();
          return;
        }
        // alpha.7.2: Same Safari concern for saved-deal selects.
        // alpha.7.6: Soft/structural classification (see input handler).
        const sdBind = t.getAttribute('data-sd-bind');
        if (sdBind && t.tagName === 'SELECT' && _savedDealData) {
          _savedDealData[sdBind] = t.value;
          if (SOFT_FIELDS.indexOf(sdBind) >= 0) {
            scheduleAutosave();
          } else {
            markStructuralDirty();
          }
          return;
        }

        // v27.1.1 B5 — City <input list="cities-list"> autofills State on
        // change. Wizard path: bind=city; saved-deal path: sd-bind=city.
        // The input handler already wrote t.value to wizardData/_savedDealData
        // (per-keystroke); this just looks up state and updates the partner
        // state input. autoFillStateFromCity is a no-op for unmatched cities
        // and for 'Other' (empty state), so users on tier-3+ cities can type
        // both city and state freely.
        if (t.tagName === 'INPUT') {
          const wizBind = t.getAttribute('data-bind');
          if (wizBind === 'city') {
            autoFillStateFromCity(t.value);
            return;
          }
          if (sdBind === 'city') {
            autoFillStateFromCity(t.value);
            return;
          }
        }
      });

      // FORM SUBMIT delegation (login, force-PW, profile-PW, step1)
      document.body.addEventListener('submit', function(e) {
        const f = e.target;
        if (!f || f.tagName !== 'FORM') return;
        if (f.id === 'login-form')       { e.preventDefault(); APP.handleLoginSubmit(); return; }
        if (f.id === 'pw-form')          { e.preventDefault(); APP.handleForcePwSubmit(); return; }
        if (f.id === 'profile-pw-form')  { e.preventDefault(); APP.handleProfilePwSubmit(); return; }
        if (f.id === 'step1-form')       { e.preventDefault(); APP.wizNext(); return; }
      });
    }

    /* ============================================================
       Boot mount
       ============================================================ */

    function mount() {
      $('app').hidden = false;
      $('ver-pill').textContent = CATALOG.version;
      bindGlobalEvents();
    }

    /* ---------- Public API ---------- */

    return {
      mount, toast, openSheet, closeSheet,
      showLogin, showForcePw,
      showHome, showHistory, showProfile, showSavedDeal, showWizard,
      updateNavActive, showChrome,
      // expose for APP
      getWizardData: () => wizardData,
      setWizardData: (d) => { wizardData = d; },
      loadDraft, clearDraft, saveDraft: () => saveDraft(),

      // the saveDraft round-trip smoke test which reads localStorage
      // immediately after writing.
      flushDraft,
      defaultWizard,
      hydrateWizardFromDeal,
      renderWizard,
      validateStep,
      captureCurrentStepForm,
      setFieldError,
      // alpha.7.4: APP.wizSave needs the same payload-builder used by autosave
      buildSavePayload,
      // alpha.9.1: APP exposes these to __smokeIntegration. APP's IIFE has no
      // closure access to UI internals (different scope), so route via UI's
      // public API. Underscore prefix marks "for internal smoke use only".
      _SOFT_FIELDS:        SOFT_FIELDS,
      _STRUCTURAL_FIELDS:  STRUCTURAL_FIELDS,
      _STRUCTURED_COLS:    STRUCTURED_COLS,
      // v27.1.0 B2 smoke needs reach into the UUID-lookup machinery; same
      // expose-via-UI pattern as _SOFT_FIELDS above.
      _labelFor:           labelFor,
      _SALES_TEAM:         SALES_TEAM,
      _PRESALES_TEAM:      PRESALES_TEAM,

      _VENUE_TYPES:        VENUE_TYPES,

      // so direct reference fails. Step 6 Review uses these internally;

      HUMAN_LABELS,

      // smoke renderer
      _renderSmokeOutput: renderSmokeOutput
    };
  })();

  /* ============================================================
     APP  (Session 5 + 6 of v27 rebuild)

     Orchestrator. Wires:
       - hashchange → UI view
       - auth state → guarded routes
       - login form → STORE.login
       - PW change form → STORE.changePassword
       - wizard Next/Back/Build → RECOMMEND dispatch

     Notes:
       - Save-on-Build is deferred to Session 7 per SPEC §5.1 ("No save yet")
         interpretation: Step 6 Build computes RECOMMEND + renders BoM, and a
         disabled "Save quote (Session 7)" button surfaces the next move.
       - actor_user_id injection is implicit in STORE; APP doesn't pass it.
       - Pipeline stages are hardcoded in UI.STAGES (TODO: load from DB
         per Session 4 handoff §12).
     ============================================================ */
  const APP = (function() {

    /* ---------- Router ---------- */

    function start() {
      // Guarded routing: if no current user and not at #/login, force to login.
      window.addEventListener('hashchange', onRouteChange);
      // Auth state cleanup: clear wizard draft on explicit logout via STORE event.
      STORE.onAuthChange(function(user) {
        if (!user) {
          UI.clearDraft();
          // Force to login if not already there.
          if (location.hash !== '#/login') location.hash = '#/login';
        }
      });
      // Boot route
      const initialHash = (location.hash && location.hash.length > 1) ? location.hash : '';
      const u = STORE.currentUser();
      if (!u) {
        // Unauth — force login
        if (initialHash !== '#/login') {
          // Setting hash will fire onRouteChange
          location.hash = '#/login';
        } else {
          UI.showLogin();
        }
        return;
      }
      // Auth — must_change short-circuits to force-PW
      if (u.must_change) {
        UI.showForcePw(u);
        return;
      }
      if (!initialHash || initialHash === '#/' || initialHash === '#/login') {
        location.hash = '#/home';
      } else {
        onRouteChange();
      }
    }

    function onRouteChange() {
      const hash = location.hash || '#/home';
      const u = STORE.currentUser();

      // Auth guard
      if (!u && hash !== '#/login') {
        location.hash = '#/login';
        return;
      }
      // Forced-PW guard: any logged-in user with must_change must finish PW
      // change before going anywhere else.
      if (u && u.must_change && hash !== '#/login') {
        UI.showForcePw(u);
        return;
      }

      // Route resolution
      if (hash === '#/login') { UI.showLogin(); return; }
      if (hash === '#/home')  { UI.showHome();  return; }
      if (hash === '#/history') { UI.showHistory(); return; }
      if (hash === '#/profile') { UI.showProfile(); return; }
      if (hash === '#/quote/new' ||
          hash.indexOf('#/quote/new/') === 0) {
        const parts = hash.split('/');
        // #/quote/new          → step 1
        // #/quote/new/2        → step 2
        const stepNum = parts.length >= 4 ? parseInt(parts[3], 10) || 1 : 1;
        UI.showWizard(stepNum);
        return;
      }
      // v27.1.2 #6 — edit-mode wizard entry. Hash carries the refId so
      // wizSave can detect update-vs-insert. wizardData itself is
      // hydrated by the sd-edit handler BEFORE the hash change, so we
      // just route to the wizard renderer here.
      if (hash.indexOf('#/quote/edit/') === 0) {
        const parts = hash.split('/');
        // #/quote/edit/{refId}     → step 1
        // #/quote/edit/{refId}/3   → step 3 (deep link case)
        const stepNum = parts.length >= 5 ? parseInt(parts[4], 10) || 1 : 1;
        UI.showWizard(stepNum);
        return;
      }
      if (hash.indexOf('#/quote/') === 0) {
        // #/quote/TV-XXXXXXXX → saved-deal view (alpha.7.0 skeleton, full layout alpha.7.1+)
        const refId = hash.substring('#/quote/'.length);
        UI.showSavedDeal(refId);
        return;
      }
      // Fallback
      location.hash = '#/home';
    }

    /* ---------- Login flow ---------- */

    async function handleLoginSubmit() {
      const userF = document.getElementById('f-username');
      const passF = document.getElementById('f-password');
      const userI = document.getElementById('i-username');
      const passI = document.getElementById('i-password');
      const btn   = document.getElementById('btn-login');
      if (!userI || !passI) return;

      UI.setFieldError('f-username', null);
      UI.setFieldError('f-password', null);

      const username = (userI.value || '').trim();
      const password = passI.value || '';
      if (!username) { UI.setFieldError('f-username', 'Required.'); userI.focus(); return; }
      if (!password) { UI.setFieldError('f-password', 'Required.'); passI.focus(); return; }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Signing in\u2026';
      try {
        const user = await STORE.login({ username, password });
        if (user.must_change) {
          UI.showForcePw(user);
          UI.toast('Please set a new password.', 'default');
        } else {
          UI.toast('Welcome, ' + (user.full_name || user.username) + '!', 'ok');
          location.hash = '#/home';
        }
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Sign-in failed.';
        UI.setFieldError('f-password', msg);
        UI.toast(msg, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function handleForcePwSubmit() {
      const oldF = document.getElementById('f-oldpw');
      const newF = document.getElementById('f-newpw');
      const new2F = document.getElementById('f-newpw2');
      const oldI = document.getElementById('i-oldpw');
      const newI = document.getElementById('i-newpw');
      const new2I = document.getElementById('i-newpw2');
      const btn = document.getElementById('btn-pwchange');

      UI.setFieldError('f-oldpw',  null);
      UI.setFieldError('f-newpw',  null);
      UI.setFieldError('f-newpw2', null);

      const oldPw = oldI.value || '';
      const newPw = newI.value || '';
      const conf  = new2I.value || '';

      if (!oldPw) { UI.setFieldError('f-oldpw', 'Required.'); return; }
      if (!newPw || newPw.trim().length < 6) {
        UI.setFieldError('f-newpw', 'At least 6 characters required.'); return;
      }
      if (newPw !== conf) { UI.setFieldError('f-newpw2', 'Does not match.'); return; }
      if (newPw.trim() !== newPw) {
        UI.setFieldError('f-newpw', 'No leading/trailing spaces.'); return;
      }
      if (newPw === oldPw) {
        UI.setFieldError('f-newpw', 'Must differ from current password.'); return;
      }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Updating\u2026';
      try {
        await STORE.changePassword({ oldPassword: oldPw, newPassword: newPw });
        UI.toast('Password updated. Welcome aboard.', 'ok');
        location.hash = '#/home';
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Password change failed.';
        UI.setFieldError('f-oldpw', msg);
        UI.toast(msg, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function handleProfilePwSubmit() {
      const oldI = document.getElementById('pi-oldpw');
      const newI = document.getElementById('pi-newpw');
      const new2I = document.getElementById('pi-newpw2');

      UI.setFieldError('pf-oldpw',  null);
      UI.setFieldError('pf-newpw',  null);
      UI.setFieldError('pf-newpw2', null);

      const oldPw = oldI.value || '';
      const newPw = newI.value || '';
      const conf  = new2I.value || '';

      if (!oldPw) { UI.setFieldError('pf-oldpw', 'Required.'); return; }
      if (!newPw || newPw.trim().length < 6) {
        UI.setFieldError('pf-newpw', 'At least 6 characters required.'); return;
      }
      if (newPw !== conf) { UI.setFieldError('pf-newpw2', 'Does not match.'); return; }
      if (newPw.trim() !== newPw) {
        UI.setFieldError('pf-newpw', 'No leading/trailing spaces.'); return;
      }
      try {
        await STORE.changePassword({ oldPassword: oldPw, newPassword: newPw });
        UI.toast('Password updated.', 'ok');
        // Clear form
        oldI.value = ''; newI.value = ''; new2I.value = '';
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Password change failed.';
        UI.setFieldError('pf-oldpw', msg);
        UI.toast(msg, 'err');
      }
    }

    /* ---------- Wizard navigation ---------- */

    function wizNext() {
      UI.captureCurrentStepForm();
      const d = UI.getWizardData();
      const v = UI.validateStep(d);
      if (!v.ok) {
        d.errors = v.errors;
        UI.renderWizard();
        // Toast first error for visibility
        const firstKey = Object.keys(v.errors)[0];
        UI.toast(v.errors[firstKey], 'err');
        return;
      }
      d.errors = {};
      // Advance with auto-skip for conditional steps
      let next = d.step + 1;
      if (next === 4 && !d.hasLed) next = d.hasSx ? 5 : 6;
      if (next === 5 && !d.hasSx)  next = 6;
      d.step = clamp(next, 1, 6);
      UI.saveDraft();
      UI.renderWizard();
    }

    function wizBack() {
      UI.captureCurrentStepForm();
      const d = UI.getWizardData();
      d.errors = {};
      let prev = d.step - 1;
      if (prev === 5 && !d.hasSx)  prev = d.hasLed ? 4 : 3;
      if (prev === 4 && !d.hasLed) prev = 3;
      d.step = clamp(prev, 1, 6);
      UI.saveDraft();
      UI.renderWizard();
    }

    function wizBuild() {
      const d = UI.getWizardData();
      try {
        d.reco = computeReco(d);
        UI.saveDraft();
        UI.renderWizard();
        if (d.reco && d.reco.error) {
          UI.toast(d.reco.error, 'err');
        } else if (d.reco && !d.reco.chassis) {
          UI.toast('No chassis recommended for current inputs.', 'warn');
        } else {
          UI.toast('BoM built. Scroll to review.', 'ok');
        }
      } catch (e) {
        UI.toast('Build failed: ' + (e && e.message || String(e)), 'err');
      }
    }

    // alpha.7.4 — Save the wizard's current state as a new deal.
    // v27.1.1: Required-field validation in Step-1 enforces all 15 fields
    // (validateStep). This bottom-guard is defense-in-depth only; reaching
    // Step 6 implies the 15-field gate already passed.
    function wizSave() {
      const d = UI.getWizardData();
      if (!d.project || !d.customer_name || !d.stage) {
        UI.toast('Missing project, end user, or stage \u2014 go back to step 1.', 'err');
        return;
      }
      if (!d.reco) {
        UI.toast('Build the BoM first.', 'warn');
        return;
      }
      const payload = UI.buildSavePayload(d);
      if (!payload) {
        UI.toast('Could not build save payload.', 'err');
        return;
      }
      // v27.1.2 #6 — distinguish update (edit-mode) vs insert (new). buildSavePayload
      // already includes payload.id in edit-mode (set by hydrateWizardFromDeal),
      // which STORE.saveDeal routes to the deal_save RPC update path. Here we
      // only adjust the user-facing toast and the post-save navigation.
      const isEdit = !!payload.id;
      UI.toast(isEdit ? 'Updating\u2026' : 'Saving\u2026', 'info');
      STORE.saveDeal(payload).then(function(r) {
        const ref = r && r.display_ref;
        if (!ref) {
          UI.toast('Save returned no display_ref \u2014 something is off.', 'err');
          return;
        }
        UI.clearDraft();
        UI.toast(isEdit ? ('Updated ' + ref) : ('Saved as ' + ref), 'ok');
        // Navigate to the saved-deal view. onRouteChange picks up the hash
        // change and dispatches to showSavedDeal.
        location.hash = '#/quote/' + ref;
      }).catch(function(err) {
        const msg = (err && err.message) ? err.message : String(err);
        UI.toast((isEdit ? 'Update' : 'Save') + ' failed: ' + msg, 'err');
      });
    }

    function computeReco(d) {
      if (d.solutionType === 'calico') {
        return RECOMMEND.calico({
          inputs:  d.calico_inputs,
          outputs: Object.assign({}, d.calico_outputs, { led: !!d.hasLed }),
          screens: d.hasLed ? d.screens
            .filter(s => Number(s.w) > 0 && Number(s.h) > 0)
            .map(s => ({ pixels: Number(s.w) * Number(s.h), ports: 0 }))
            : [],
          audio:   !!d.calico_audio
        });
      }
      if (d.solutionType === 'mv') {
        const validInputs = d.mv_inputs
          .filter(r => r && r.signal && Number(r.qty) > 0)
          .map(r => ({ signal: r.signal, qty: Number(r.qty) }));
        return RECOMMEND.mv({
          inputs: validInputs,
          outputSignal: d.mv_outputSignal
        });
      }
      if (d.solutionType === 'corio') {
        // Strip zero-qty entries to keep the input clean for RECOMMEND.
        const inputs = {};
        Object.entries(d.corio_inputs).forEach(([k,v]) => { if (Number(v) > 0) inputs[k] = Number(v); });
        const outputs = {};
        Object.entries(d.corio_outputs).forEach(([k,v]) => { if (Number(v) > 0) outputs[k] = Number(v); });
        const args = { inputs, outputs };
        if (d.corio_audio)     args.audio = d.corio_audio;
        if (d.corio_fanFilter) args.fanFilter = true;
        return RECOMMEND.corio(args);
      }
      return { chassis: null, cards: [], concerns: [], valueAdds: [], meta: { type: 'empty' } };
    }

    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

    /* ---------- Public API ---------- */

    return {
      start, onRouteChange,
      handleLoginSubmit, handleForcePwSubmit, handleProfilePwSubmit,
      wizNext, wizBack, wizBuild, wizSave,
      // alpha.7.1: UI.showSavedDeal needs to compute BoM from loaded deal data.
      // computeReco accepts wizardData-shaped object and STORE.loadDeal returns
      // the same shape (plus display_ref / lines[] / etc.), so passing the deal
      // straight in is safe.
      recoForDeal: computeReco,
      // alpha.9.0 \u2014 internals exposed for __smokeIntegration only.
      // alpha.9.1 \u2014 the bare identifiers `buildSavePayload`, `SOFT_FIELDS`,
      // `STRUCTURAL_FIELDS`, `STRUCTURED_COLS` are NOT in APP's closure (all
      // defined inside the UI IIFE, lines 3154/3163/3250/3260). The alpha.9.0
      // expose throws ReferenceError at IIFE-tail. Route through UI.<name>:
      // UI's IIFE completes at line ~5757 before APP starts at ~5777, so
      // UI.<name> resolves cleanly here. Mirrors the working pattern at the
      // earlier `UI.buildSavePayload(d)` call site.
      _buildSavePayload:   UI.buildSavePayload,
      _SOFT_FIELDS:        UI._SOFT_FIELDS,
      _STRUCTURAL_FIELDS:  UI._STRUCTURAL_FIELDS,
      _STRUCTURED_COLS:    UI._STRUCTURED_COLS,
      _labelFor:           UI._labelFor,
      _SALES_TEAM:         UI._SALES_TEAM,
      _PRESALES_TEAM:      UI._PRESALES_TEAM,
      // v27.1.1 — N1/N2/N7/N8/N12 smoke reach: route through UI same as above
      _VENUE_TYPES:        UI._VENUE_TYPES,
      _LEAD_SOURCES:       UI._LEAD_SOURCES,
      _CITIES:             UI._CITIES,
      _autoFillStateFromCity: UI._autoFillStateFromCity
    };
  })();

  /* ============================================================
     __smokeUI() — Session 5 + 6 smoke gate
     Tests router resolution, wizard state machine, validation,
     and family-aware RECOMMEND dispatch via APP.computeReco.

  window.__smokeUI = function() {

    d2.solutionType = 'calico';
    v = UI.validateStep(d2);

    /* ---- Validation step 3 CALICO (need at least one I/O) ---- */

    v = UI.validateStep(d3);
    check('Step 3 CALICO validation: all zeros fails with calico_io error',

    d3.calico_inputs.hdmi4k = 3; d3.calico_outputs.display = 2;

    /* ---- Validation step 3 MV ---- */
    const d3mv = UI.defaultWizard(); d3mv.step = 3; d3mv.solutionType = 'mv';
    v = UI.validateStep(d3mv);
    check('Step 3 MV validation: empty inputs fails',

    d3mv.mv_inputs = [{ signal: 'FHD HDMI', qty: 4 }];
    d3mv.mv_outputSignal = '4K HDMI';
    v = UI.validateStep(d3mv);
    check('Step 3 MV validation: 4 FHD HDMI in + 4K HDMI out passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 4 (LED screens) ---- */
    const d4 = UI.defaultWizard(); d4.step = 4; d4.hasLed = true;
    v = UI.validateStep(d4);
    check('Step 4 validation: hasLed=true with no screens fails',
      () => (!v.ok && !!v.errors.screens) || 'errors: ' + JSON.stringify(v.errors));
    // v27.1.3 S4 — pitch is required after v27.1.2 #5. Stale test data was
    // missing the field so validation correctly rejected it. Added 1.5mm
    // (mid-range value; passes the 0.50-50.00 mm guard).
    d4.screens = [{ w: 1920, h: 1080, pitch: 1.5 }];
    v = UI.validateStep(d4);
    check('Step 4 validation: one 1920x1080 screen passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Validation step 5 (SX quantities) ---- */
    const d5 = UI.defaultWizard(); d5.step = 5; d5.hasSx = true;
    v = UI.validateStep(d5);
    check('Step 5 validation: hasSx=true with all zero qty fails',
      () => (!v.ok && !!v.errors.sx) || 'errors: ' + JSON.stringify(v.errors));
    d5.sx_data.hdmi = 2;
    v = UI.validateStep(d5);
    check('Step 5 validation: hasSx with hdmi=2 passes',
      () => v.ok || 'errors: ' + JSON.stringify(v.errors));

    /* ---- Visible-steps logic ---- */
    const dvs = UI.defaultWizard();
    // computeVisibleSteps is internal — test via render (does the wizard render?)
    // Just verify it doesn't throw by mounting a hidden wizard render.
    check('Wizard renders without throwing for default state',

          UI.setWizardData(UI.defaultWizard());

          UI.setWizardData(stash);

        UI.flushDraft();

        const ok = !raw || (raw.indexOf('Smoke-UI-Roundtrip') > -1);
        // Restore
        UI.setWizardData(stash);
        return ok || 'raw: ' + (raw ? raw.substring(0,100) : 'null');
      });

    check('Router resolves #/home for logged-in user without throwing',
      () => {

        .every(id => document.getElementById(id)) || 'missing shell DOM');
    check('Bottom nav has 4 buttons',
      () => document.querySelectorAll('#bottom-nav button[data-nav]').length === 4
        || 'got: ' + document.querySelectorAll('#bottom-nav button[data-nav]').length);

    check('Version pill shows CATALOG.version',
      () => {

    check('Design tokens loaded (--c-accent visible)',
      () => {

        return v !== '' || 'got: empty';

    check('UI.buildSavePayload exists',

      () => {

        if (p.lines[0].sku !== 'C7-PRO-1200') return 'chassis not first: ' + p.lines[0].sku;

        if (p.lines[1].product_family !== 'CALICO') return 'family: ' + p.lines[1].product_family;

      () => {

        }];

        });

        if (p.lines.length !== 1) return 'expected 1 line, got ' + p.lines.length;
        if (p.lines[0].sku !== 'C7-PRO-1200') return 'sku: ' + p.lines[0].sku;
        return true;
      });

    /* ---- Session 7.6 — MV/CORIO/LED/SX inline edit infrastructure ---- */

    check('CATALOG.mv.inputModules + outputModules exist (MV signal vocabulary)',
      () => {
        const inK  = Object.keys(CATALOG.mv.inputModules || {});
        const outK = Object.keys(CATALOG.mv.outputModules || {});
        return (inK.length > 0 && outK.length > 0)

  /* ============================================================
     v27.1.3 S6 — __smokeRunAll() aggregator

     Convenience runner referenced by the v27.1.2 deploy handoff doc but
     never actually built. Sequences every sync + async smoke harness in
     order, sums pass/fail counts, console.table()s a per-suite breakdown,
     and returns a structured result.

     __smokeStore() is intentionally excluded — it signs the user out at
     the end, which would interrupt any subsequent UI tests. Call it
     separately when you specifically want to validate STORE.
     ============================================================ */
  window.__smokeRunAll = async function() {
    const results = [];
    results.push(Object.assign({ name: 'core'        }, window.__smoke()));
    results.push(Object.assign({ name: 'ui'          }, window.__smokeUI()));
    results.push(Object.assign({ name: 'integration' }, window.__smokeIntegration()));
    results.push(Object.assign({ name: 'export'      }, window.__smokeExport()));
    results.push(Object.assign({ name: 'exportAsync' }, await window.__smokeExportAsync()));
    const totalPass = results.reduce(function(s, r) { return s + r.pass; }, 0);
    const totalFail = results.reduce(function(s, r) { return s + r.fail; }, 0);
    try {
      console.table(results.map(function(r) {
        return { suite: r.name, pass: r.pass, fail: r.fail };
      }));
    } catch (e) { /* console.table unsupported in some envs */ }
    console.log('SMOKE TOTAL: ' + totalPass + ' passed, ' + totalFail + ' failed');
    return { results: results, totalPass: totalPass, totalFail: totalFail, ok: totalFail === 0 };
  };
