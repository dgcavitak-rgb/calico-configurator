            ((d.sx_ap_qty | 0) <= 0 ? ' disabled' : '') + '>\u2212</button>' +
          '<span class="sx-step-val">' + (d.sx_ap_qty | 0) + '</span>' +
          '<button type="button" class="sx-step-btn" data-action="sx-ap-qty" data-delta="1">+</button>' +
        '</div>' +
      '</div>';

      // -------- AOC Cables card with per-line signal+jacket+length+qty --------
      // Lengths supported per signal+jacket (from CATALOG.sx.aocAvail)
      const aocLinesHtml = d.sx_aoc_lines.map(function (line, idx) {
        const sigOpts  = [{v:'HDMI', lbl:'HDMI'}, {v:'DisplayPort', lbl:'DisplayPort'}];
        const jktOpts  = [{v:'Standard', lbl:'Std'}, {v:'Plenum', lbl:'Plenum'}, {v:'LSZH', lbl:'LSZH'}, {v:'Armored', lbl:'Armored'}];
        // Available lengths from catalog
        const lengths = _aocAvailableLengths(line.signal, line.jacket);
        return '<div class="sx-line-row">' +
          '<div class="sx-line-grid">' +
            '<div class="sx-line-field"><label>Signal</label>' +
              '<div class="sx-pill-group">' +
                sigOpts.map(o =>
                  '<button type="button" class="sx-pill' + (line.signal === o.v ? ' active' : '') + '"' +
                    ' data-action="sx-aoc-set" data-idx="' + idx + '" data-key="signal" data-value="' + esc(o.v) + '">' +
                    esc(o.lbl) + '</button>'
                ).join('') +
              '</div>' +
            '</div>' +
            '<div class="sx-line-field"><label>Jacket</label>' +
              '<div class="sx-pill-group">' +
                jktOpts.map(o =>
                  '<button type="button" class="sx-pill' + (line.jacket === o.v ? ' active' : '') + '"' +
                    ' data-action="sx-aoc-set" data-idx="' + idx + '" data-key="jacket" data-value="' + esc(o.v) + '">' +
                    esc(o.lbl) + '</button>'
                ).join('') +
              '</div>' +
            '</div>' +
            '<div class="sx-line-field"><label>Length (m)</label>' +
              '<select class="sx-len-select" data-action="sx-aoc-set" data-idx="' + idx + '" data-key="length">' +
                lengths.map(L =>
                  '<option value="' + L + '"' + ((line.length|0) === L ? ' selected' : '') + '>' + L + ' m</option>'
                ).join('') +
              '</select>' +
            '</div>' +
            '<div class="sx-line-field"><label>Quantity</label>' +
              '<div class="sx-line-stepper">' +
                '<button type="button" class="sx-step-btn" data-action="sx-aoc-qty" data-idx="' + idx + '" data-delta="-1"' +
                  ((line.qty | 0) <= 0 ? ' disabled' : '') + '>\u2212</button>' +
                '<span class="sx-step-val">' + (line.qty | 0) + '</span>' +
                '<button type="button" class="sx-step-btn" data-action="sx-aoc-qty" data-idx="' + idx + '" data-delta="1">+</button>' +
                '<button type="button" class="sx-line-remove" data-action="sx-aoc-remove" data-idx="' + idx + '" aria-label="Remove line">\u00d7</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      const aocCard = '<div class="sx-card sx-card-wide">' +
        '<div class="sx-card-head">' +
          '<span class="sx-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6c0-2 3-3 8-3s8 1 8 3v12c0 2-3 3-8 3s-8-1-8-3z"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/></svg></span>' +
          '<div class="sx-card-text">' +
            '<div class="sx-card-title">AOC Cables</div>' +
            '<div class="sx-card-sub">Active Optical Cable \u00b7 HDMI / DisplayPort \u00b7 Std/Plenum/LSZH/Armored</div>' +
          '</div>' +
        '</div>' +
        (aocLinesHtml || '<div class="sx-line-empty">No AOC lines yet. Tap <strong>+ Add</strong> below.</div>') +
        '<button type="button" class="sx-add-line" data-action="sx-aoc-add">+ Add AOC cable</button>' +
      '</div>';

      return errHtml +
        '<div class="sx-grid">' +
          hdbtCard +
          daCard +
          '<div class="sx-grid-half">' + apCard + '</div>' +
          aocCard +
        '</div>';
    }

    /* v27.3.0 §10 — Lookup available AOC lengths from CATALOG given signal + jacket */
    function _aocAvailableLengths(signal, jacket) {
      const codes = (CATALOG && CATALOG.sx && CATALOG.sx.aocCodes) || {};
      const avail = (CATALOG && CATALOG.sx && CATALOG.sx.aocAvail) || {};
      const code = codes[signal] && codes[signal][jacket];
      if (code && Array.isArray(avail[code])) return avail[code];
      // Fallback — use the most common (HDMI Standard) lengths
      return avail['661'] || [10, 15, 20, 25, 30, 40, 50, 60, 70, 100];
    }

    /* ---------- Step 6: Review & build ---------- */

    function renderStep6(d) {
      const rows = [];
      const add = (k, v, jumpStep) => rows.push({ k, v, jumpStep });

      add('Project',  d.project || '\u2014', 1);
      add('End User', d.customer_name || '\u2014', 1);
      if (d.partner_name)    add('Partner', d.partner_name, 1);
      if (d.consultant_name) add('Consultant', d.consultant_name, 1);
      if (d.venue_type)      add('Venue type', d.venue_type, 1);
      if (d.city)            add('City', d.city + (d.state ? ', ' + d.state : ''), 1);
      add('Stage', d.stage || '\u2014', 1);
      if (d.lead_source)        add('Lead Origin', d.lead_source, 1);
      if (d.sales_person_id)    add('Sales',    labelFor(d.sales_person_id, SALES_TEAM), 1);
      if (d.presales_person_id) add('Presales', labelFor(d.presales_person_id, PRESALES_TEAM), 1);
      if (d.contact_name)       add('Contact', d.contact_name, 1);
      if (d.contact_phone)      add('Phone',   d.contact_phone, 1);
      if (d.contact_email)      add('Email',   d.contact_email, 1);
      if (d.close_month) add('Expected closure', d.close_month, 1);
      if (d.external_notes && String(d.external_notes).trim()) add('External notes', d.external_notes, 1);

      const solLabel = { calico: 'CALICO Video Processor', mv: 'Multi Viewer', corio: 'CORIO Video Processor' }[d.solutionType] || '\u2014';
      add('Solution', solLabel, 2);

      if (d.solutionType === 'calico') {
        // v27.1.2 #4a — humanize via HUMAN_LABELS map
        // Filter projectorRes (not a count field) before humanizing.
        const outForHuman = Object.assign({}, d.calico_outputs);
        delete outForHuman.projectorRes;
        // v27.1.3 F1 — synthesize LED count into outForHuman so the Outputs
        // row renders it. Canonical state lives in d.screens (length) +
        // d.hasLed — calico_outputs.led is not written by v27.1.2 #3 LED
        // stepper. This synthesis is display-only; does not write back.
        // HUMAN_LABELS.calico_outputs.led = 'LED Screen' already exists.
        if (d.hasLed && Array.isArray(d.screens) && d.screens.length > 0) {
          outForHuman.led = d.screens.length;
        }
        add('Inputs',  humanizeNamespace('calico_inputs',  d.calico_inputs),  3);
        add('Outputs', humanizeNamespace('calico_outputs', outForHuman),      3);
        // v27.1.3 U1 — always render Audio row (was conditional-hidden when
        // off). calico_audio still read for v27.1.1 deals; v27.1.2 #3 moves
        // canonical state into the Step 3 Audio toggle (still d.calico_audio).
        add('Audio', d.calico_audio ? 'Yes' : 'No', 3);
      } else if (d.solutionType === 'mv') {
        // MV signal names already human-readable from CATALOG.mv keys
        // ("HDMI 4K", "SDI 12G" etc.) so just swap ':' separator for '\u00d7'.
        const inSum = d.mv_inputs.filter(r => r.signal && r.qty > 0)
          .map(r => r.signal + ' \u00d7 ' + r.qty).join(', ') || 'none';
        add('Inputs', inSum, 3);
        add('Output signal', d.mv_outputSignal || '\u2014', 3);
      } else if (d.solutionType === 'corio') {
        // CORIO catalog keys already human-readable; humanize style only.
        const inSum = Object.entries(d.corio_inputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ' \u00d7 ' + v).join(', ') || 'none';
        const outSum = Object.entries(d.corio_outputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ' \u00d7 ' + v).join(', ') || 'none';
        add('Inputs',  inSum, 3);
        add('Outputs', outSum, 3);
        // v27.1.2 #7 — canvas count line, only shown when > 0.
        if (d.corio_canvases && Number(d.corio_canvases) > 0) {
          add('Canvases', String(d.corio_canvases), 3);
        }
        if (d.corio_audio)      add('Audio module', d.corio_audio, 3);
        if (d.corio_fanFilter)  add('Fan filter', 'Yes', 3);
      }

      if (d.hasLed) {
        // v27.1.2 #4a/#5 — humanize screens summary, include pitch when present.
        // OQ 5B: missing pitch (v27.1.1 saved deals) renders as '\u2014'.
        const sum = d.screens.length === 0
          ? 'no screens'
          : d.screens.map(function(s, i) {
              const pitchStr = (s.pitch != null && s.pitch !== '')
                ? ' @ ' + s.pitch + 'mm'
                : ' @ \u2014';
              return 'S' + (i+1) + ': ' + (s.w || '?') + '\u00d7' + (s.h || '?') + pitchStr;
            }).join(', ');
        add('LED screens', sum, 4);
      }
      if (d.hasSx) {
        add('Signal extension', humanizeNamespace('sx_data', d.sx_data), 5);
      }

      const summaryHtml =
        '<div class="card wiz-summary">' +
          rows.map(r =>
            '<div class="sum-row">' +
              '<div>' +
                '<div class="sum-key">' + esc(r.k) + '</div>' +
                '<button class="edit-link" type="button" data-action="wiz-jump" data-step="' + r.jumpStep + '">Edit step ' + r.jumpStep + '</button>' +
              '</div>' +
              '<div class="sum-val">' + esc(r.v) + '</div>' +
            '</div>'
          ).join('') +
        '</div>';

      // BoM section (post-Build). v27.3.0 — auto-save flow: when Build succeeds
      // we navigate directly to the saved-deal view (which has the glass action
      // bar w/ Excel/PDF/WhatsApp/Email). BoM here only appears on the
      // error/no-chassis path so the user can see what failed before going back.
      const bomHtml = d.reco
        ? '<h2 class="h2">Bill of Materials</h2>' + renderBomCard(d.reco, d.solutionType) +
          (d.reco.error || !d.reco.chassis
            ? '<div class="banner warn" style="margin-top:12px">' +
                'Adjust your inputs and tap <strong>Build &amp; save quote</strong> again.' +
              '</div>'
            : '')
        : '<div class="banner info" style="margin-top:16px">' +
            'Tap <strong>Build &amp; save quote</strong> below to compute the BoM. ' +
            'Your deal is saved automatically and the BoM opens with Excel / PDF / WhatsApp / Email actions.' +
          '</div>';

      return bomHtml + summaryHtml;
    }

    /* ---------- BoM card renderer ---------- */

    function renderBomCard(reco, family) {
      if (!reco) return '';
      // Hard error path
      if (reco.error) {
        return '<div class="bom-card empty-bom">' +
          '<div class="bom-chassis-sku">CONFIGURATION REJECTED</div>' +
          '<div class="bom-chassis-label">No chassis fits</div>' +
          '<div class="bom-meta">' + esc(reco.error) + '</div>' +
        '</div>';
      }
      // Empty / no-chassis (MV with no inputs etc)
      if (!reco.chassis) {
        return '<div class="bom-card empty-bom">' +
          '<div class="bom-chassis-sku">EMPTY</div>' +
          '<div class="bom-chassis-label">No chassis recommended</div>' +
          '<div class="bom-meta">' +
            esc((reco.meta && reco.meta.kind) || 'Empty input set.') +
          '</div>' +
        '</div>';
      }

      const meta = reco.meta || {};
      const slotsLine = (meta.slotsTotal != null)
        ? 'Slots: ' + (meta.slotsUsed != null ? meta.slotsUsed : '?') + ' / ' + meta.slotsTotal +
          (meta.ecosystem ? ' \u00b7 ' + meta.ecosystem : '')
        : (meta.chassisLabel || '');

      // v27.1.2 #4b — guarantee chassisLabel is meaningful and distinct
      // from the SKU. If recommendCalico/Mv/Corio set chassisLabel correctly
      // (they now do as of v27.1.2), this falls through unchanged. The
      // empty-fallback to SKU is removed so we never print the same string
      // on lines 1 and 2.
      const labelLine = (meta.chassisLabel && meta.chassisLabel !== reco.chassis)
        ? meta.chassisLabel
        : '';   // empty → element renders empty (no duplicate SKU)

      // v27.1.2 #4b — I/O port spec line. Reads from reco.meta.io (set by
      // each RECOMMEND path). Skipped when meta.io absent (e.g. error returns).
      const ioSpecLine = (function() {
        if (!meta.io) return '';
        function summariseSide(side, dataObj, mapNs) {
          const entries = Object.keys(dataObj)
            .map(function(k) { return [k, Number(dataObj[k]) || 0]; })
            .filter(function(e) { return e[1] > 0; });
          if (entries.length === 0) return '';
          const total = entries.reduce(function(a, e) { return a + e[1]; }, 0);
          const noun  = side + (total === 1 ? '' : 's');
          // Use HUMAN_LABELS when mapNs provided (CALICO); for MV/CORIO the
          // keys are already human-readable signal names so emit as-is.
          const breakdown = entries.map(function(e) {
            const lbl = mapNs && HUMAN_LABELS[mapNs] && HUMAN_LABELS[mapNs][e[0]]
              ? HUMAN_LABELS[mapNs][e[0]]
              : e[0];
            return e[1] + '\u00d7 ' + lbl;
          }).join(', ');
          return total + ' ' + noun + ' (' + breakdown + ')';
        }
        // Detect family by reco shape: CALICO uses calico_inputs/outputs keys.
        const isCalico = !!(meta.io.inputs && (
          meta.io.inputs.hdmi4k !== undefined || meta.io.inputs.hdmiFhd !== undefined ||
          meta.io.inputs.sdi12g !== undefined || meta.io.inputs.sdi3g  !== undefined ||
          meta.io.inputs.hdbt   !== undefined || meta.io.inputs.ip     !== undefined
        ));
        const inSum  = summariseSide('input',  meta.io.inputs  || {}, isCalico ? 'calico_inputs'  : null);
        const outSum = summariseSide('output', meta.io.outputs || {}, isCalico ? 'calico_outputs' : null);
        const parts = [];
        if (inSum)  parts.push(inSum);
        if (outSum) parts.push(outSum);
        return parts.join(' \u00b7 ');
      })();

      const linesHtml = (reco.cards || []).map(c =>
        '<li class="bom-line">' +
          '<div class="desc">' + esc(c.desc || c.label || c.sku) +
            '<span class="sku">' + esc(c.sku) + '</span>' +
          '</div>' +
          '<div class="qty">\u00d7' + (c.qty != null ? c.qty : 1) + '</div>' +
        '</li>'
      ).join('');

      const concernsHtml = (reco.concerns && reco.concerns.length)
        ? '<div class="bom-concerns">' +
            '<h4>Concerns</h4>' +
            '<ul>' + reco.concerns.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' +
          '</div>'
        : '';
      const valueAddsHtml = (reco.valueAdds && reco.valueAdds.length)
        ? '<div class="bom-valueadds">' +
            '<h4>Value-add notes</h4>' +
            '<ul>' + reco.valueAdds.map(v => '<li>' + esc(v) + '</li>').join('') + '</ul>' +
          '</div>'
        : '';

      // v27.1.2 #4b — line order: SKU · label (deduped) · I/O spec · slots · lines
      return '<div class="bom-card">' +
        '<div class="bom-chassis-sku">' + esc(reco.chassis) + '</div>' +
        (labelLine
          ? '<div class="bom-chassis-label">' + esc(labelLine) + '</div>'
          : '') +
        (ioSpecLine
          ? '<div class="bom-io">' + esc(ioSpecLine) + '</div>'
          : '') +
        '<div class="bom-meta">' + esc(slotsLine) + '</div>' +
        '<ul class="bom-lines">' + linesHtml + '</ul>' +
        concernsHtml + valueAddsHtml +
      '</div>';
    }

    /* ============================================================
       Wizard validation (per-step)
       Returns { ok, errors }. Errors are field-id → message strings.
       ============================================================ */

    function validateStep(d) {
      const errors = {};
      if (d.step === 1) {
        // v27.1.1 — item 9: all visible fields required except internal_notes
        // + external_notes. 15 required validators total. City "Other" path
        // (Q7): when city === 'Other' the state input must be non-empty
        // (typed manually); for any other city, state should have been
        // auto-filled. Either way we just require state non-empty.
        if (!d.project || !d.project.trim())             errors.project = 'Required.';
        if (!d.customer_name || !d.customer_name.trim()) errors.customer_name = 'Required.';
        if (!d.partner_name || !d.partner_name.trim())   errors.partner_name = 'Required.';
        if (!d.consultant_name || !d.consultant_name.trim()) errors.consultant_name = 'Required.';
        if (!d.venue_type)                               errors.venue_type = 'Required.';
        if (!d.city || !d.city.trim())                   errors.city = 'Required.';
        if (!d.state || !d.state.trim())                 errors.state = 'Required.';
        if (!d.stage)                                    errors.stage = 'Required.';
        if (!d.lead_source)                              errors.lead_source = 'Required.';
        if (!d.sales_person_id)                          errors.sales_person_id = 'Required.';
        if (!d.presales_person_id)                       errors.presales_person_id = 'Required.';
        if (!d.close_month || !/^\d{4}-\d{2}$/.test(d.close_month)) errors.close_month = 'Required (YYYY-MM).';
        if (!d.contact_name || !d.contact_name.trim())   errors.contact_name = 'Required.';
        if (!d.contact_phone || !/^[0-9]{10}$/.test(d.contact_phone)) errors.contact_phone = '10 digits required.';
        if (!d.contact_email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.contact_email)) errors.contact_email = 'Valid email required.';
        // internal_notes + external_notes are intentionally NOT required.
      } else if (d.step === 2) {
        if (!d.solutionType) errors.solutionType = 'Pick a solution type to continue.';
      } else if (d.step === 3) {
        if (d.solutionType === 'calico') {
          const inSum = Object.values(d.calico_inputs).reduce((a,b) => a + (Number(b)||0), 0);
          const outSum = ['display','projector','sdi'].reduce((a,k) => a + (Number(d.calico_outputs[k])||0), 0);
          if (inSum === 0 && outSum === 0) {
            errors.calico_io = 'At least one input or output is required.';
          }
          // v27.3.0 — CALICO renders LED W/H/pitch inline in Step 3 (Step 4
          // is skipped for CALICO), so validate screens here too.
          if (d.hasLed) {
            if (!d.screens || d.screens.length === 0) {
              errors.screens = 'Set Active LED screens > 0, or untick LED.';
            } else {
              const bad = [];
              for (let i = 0; i < d.screens.length; i++) {
                const s = d.screens[i] || {};
                const w = Number(s.w), h = Number(s.h);
                const p = s.pitch === '' || s.pitch == null ? NaN : Number(s.pitch);
                if (!(w >= 64 && w <= 16384)) bad.push('Screen ' + (i+1) + ' width');
                if (!(h >= 64 && h <= 16384)) bad.push('Screen ' + (i+1) + ' height');
                if (!(p >= 0.50 && p <= 50.00)) bad.push('Screen ' + (i+1) + ' pitch');
              }
              if (bad.length) {
                errors.screens = 'Fix: ' + bad.join(', ') + '. ' +
                  'W/H must be integer 64\u201316384 px. Pitch must be 0.50\u201350.00 mm.';
              }
            }
          }
        } else if (d.solutionType === 'mv') {
          const validInputs = d.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0);
          if (validInputs.length === 0) errors.mv_io = 'Add at least one input row with signal + qty.';
          else if (!d.mv_outputSignal)  errors.mv_io = 'Pick an output signal.';
        } else if (d.solutionType === 'corio') {
          const inSum = Object.values(d.corio_inputs).reduce((a,b) => a + (Number(b)||0), 0);
          const outSum = Object.values(d.corio_outputs).reduce((a,b) => a + (Number(b)||0), 0);
          if (inSum === 0 && outSum === 0) {
            errors.corio_io = 'At least one input or output is required.';
          }
        }
      } else if (d.step === 4) {
        // v27.1.2 #5 — full screen validation: W, H integers within
        // [64, 16384]; pitch decimal within [0.50, 50.00] (2dp).
        // Only fires when hasLed (other paths auto-skip to 5 or 6).
        // v27.3.0 — CALICO never reaches Step 4 (validation moved to Step 3).
        if (d.hasLed) {
          if (!d.screens || d.screens.length === 0) {
            errors.screens = 'Set Active LED screens > 0 in Step 3, or untick LED.';
          } else {
            const bad = [];
            for (let i = 0; i < d.screens.length; i++) {
              const s = d.screens[i] || {};
              const w = Number(s.w), h = Number(s.h);
              const p = s.pitch === '' || s.pitch == null ? NaN : Number(s.pitch);
              if (!(w >= 64 && w <= 16384)) bad.push('Screen ' + (i+1) + ' width');
              if (!(h >= 64 && h <= 16384)) bad.push('Screen ' + (i+1) + ' height');
              if (!(p >= 0.50 && p <= 50.00)) bad.push('Screen ' + (i+1) + ' pitch');
            }
            if (bad.length) {
              errors.screens = 'Fix: ' + bad.join(', ') + '. ' +
                'W/H must be integer 64\u201316384 px. Pitch must be 0.50\u201350.00 mm.';
            }
          }
        }
      } else if (d.step === 5) {
        if (d.hasSx) {
          // v27.3.0 — _syncSxSums keeps sx_data sums in sync with the
          // detail arrays, so total still works. Friendlier message tells
          // the user what to do with the new line-item UI.
          const total = Object.values(d.sx_data || {}).reduce((a,b) => a + (Number(b)||0), 0);
          if (total === 0) errors.sx = 'Add at least one HDBaseT line, splitter, AP-536, or AOC cable \u2014 or untick Signal Extension in Step 3.';
        }
      }
      return { ok: Object.keys(errors).length === 0, errors };
    }

    /* ============================================================
       Form-state binding (read inputs back into wizardData)
       Called BEFORE step navigation so latest typed values are
       captured even if the user didn't blur the field.
       ============================================================ */

    function captureStep1Form() {
      // v27.1.0 F3 — uses SOFT_FIELDS as the single source of truth so this
      // capture stays in sync automatically when SOFT_FIELDS changes.
      // Pre-v27.1 hardcoded a duplicate list that drifted. The i-* element
      // ID prefix works identically for input and textarea elements; .value
      // works identically too — no special-case needed for the notes textarea.
      SOFT_FIELDS.forEach(function(f) {
        const el = $('i-' + f);
        if (el) wizardData[f] = el.value;
      });
    }

    function captureCurrentStepForm() {
      if (wizardData.step === 1) captureStep1Form();
      // Other steps capture in real-time via event delegation (steppers, tiles,
      // selects, MV rows, screen inputs). Step 1 is the only multi-textfield step
      // that benefits from a bulk capture before navigate.
    }

    /* ============================================================
       Event delegation (single click + input handler on body)
       APP wires the high-level routing actions (login submit,
       PW change submit, build, etc.) — UI handles in-view state
       only (steppers, tiles, screen-add, etc.).
       ============================================================ */

    function bindGlobalEvents() {
      // CLICK delegation
      document.body.addEventListener('click', function(e) {
        // Nav buttons (anywhere with data-nav)
        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
          e.preventDefault();
          const target = navBtn.getAttribute('data-nav');
          if (location.hash === target) {
            // Same route — force re-render via custom event
            window.dispatchEvent(new HashChangeEvent('hashchange'));
          } else {
            location.hash = target;
          }
          return;
        }

        // Sheet backdrop close
        const sheetClose = e.target.closest('[data-sheet-close]');
        if (sheetClose) { closeSheet(); return; }

        // Generic actions
        const actEl = e.target.closest('[data-action]');
        if (!actEl) return;
        const action = actEl.getAttribute('data-action');

        // History filter
        if (action === 'hist-filter') {
          const f = actEl.getAttribute('data-value');
          setHistoryFilter(f);
          return;
        }

        // v27.3.0 — clear search input
        if (action === 'hist-clear-search') {
          const inp = $('hist-search');
          if (inp) {
            inp.value = '';
            inp.focus();
          }
          actEl.hidden = true;
          historyState.search = '';
          loadHistoryList();
          return;
        }

        // Solution-type tile
        if (action === 'solution-pick') {
          const v = actEl.getAttribute('data-value');
          wizardData.solutionType = v;
          // Keep VP sub-step revealed when CALICO/CORIO is picked
          wizardData._step2_videoProcessorOpen = (v === 'calico' || v === 'corio');
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // v27.3.0 §9 — Video Processor tile toggles the CALICO/CORIO sub-step picker
        if (action === 'solution-vp-toggle') {
          // If already on VP, leave selection. Otherwise reveal sub-step picker.
          const cur = wizardData.solutionType;
          const isVP = (cur === 'calico' || cur === 'corio');
          if (isVP) {
            // collapse if already expanded with nothing more to choose
            wizardData._step2_videoProcessorOpen = !wizardData._step2_videoProcessorOpen;
          } else {
            wizardData._step2_videoProcessorOpen = true;
          }
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // Stepper +/-
        if (action === 'step-inc' || action === 'step-dec') {
          const ns  = actEl.getAttribute('data-ns');
          const key = actEl.getAttribute('data-key');
          // v27.1.2 #3+#5 — synthetic 'led' stepper in the CALICO Outputs
          // section resizes wizardData.screens directly and keeps hasLed in
          // lockstep. No defaultWizard shape break — screens stays the canonical
          // state holder.
          if (ns === '__calico_led') {
            const cur = Array.isArray(wizardData.screens) ? wizardData.screens.length : 0;
            const delta = action === 'step-inc' ? 1 : -1;
            const next = Math.max(0, cur + delta);
            _resizeScreens(next);
            wizardData.hasLed = (next > 0);
            saveDraft();
            rerenderPreservingScroll();
            return;
          }
          // v27.1.2 #7 — synthetic 'corio_canvases' stepper writes top-level
          // (not nested under corio_outputs since it's not an I/O port count).
          if (ns === '__corio_canvas') {
            const cur = Number(wizardData.corio_canvases) || 0;
            const delta = action === 'step-inc' ? 1 : -1;
            wizardData.corio_canvases = Math.max(0, cur + delta);
            saveDraft();
            rerenderPreservingScroll();
            return;
          }
          if (ns) {
            wizardData[ns][key] = (Number(wizardData[ns][key]) || 0) + (action === 'step-inc' ? 1 : -1);
            if (wizardData[ns][key] < 0) wizardData[ns][key] = 0;
          } else {
            // bare key — currently unused for steppers; reserved
          }
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // Toggle (tile w/ checkbox)
        if (action === 'toggle') {
          // v27.2.6 — the new check-row layout puts the checkbox inside the
          // label. Clicking the checkbox itself fires the browser's default
          // toggle BEFORE this handler runs, then we flip wizardData again,
          // which makes it look like nothing happened. Prevent default so
          // wizardData is the only source of truth; the next render reflects it.
          if (e && typeof e.preventDefault === 'function') e.preventDefault();
          const ns  = actEl.getAttribute('data-ns');
          const key = actEl.getAttribute('data-key');
          if (ns) {
            wizardData[ns][key] = !wizardData[ns][key];
          } else {
            wizardData[key] = !wizardData[key];
          }
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // Wizard navigation
        if (action === 'wiz-next')   { APP.wizNext(); return; }
        if (action === 'wiz-back')   { APP.wizBack(); return; }
        // v27.3.0 — Tap a past step pill to jump back to it.
        // Captures the current step's form before navigation so edits don't
        // get lost. Forward jumps (to unreached steps) are blocked by the
        // aria-disabled flag rendered on those pills.
        // Clearing reco on jump means we don't show a stale recommendation
        // from the prior path.
        if (action === 'wiz-jump') {
          const target = parseInt(actEl.getAttribute('data-step'), 10);
          if (!target || target < 1 || target > 6) return;
          if (target === wizardData.step) return;  // same step — no-op
          captureCurrentStepForm();
          wizardData.step = target;
          wizardData.reco = null;
          saveDraft();
          renderWizard();
          return;
        }
        if (action === 'wiz-build')  { APP.wizBuild(); return; }
        if (action === 'wiz-rebuild'){ APP.wizBuild(); return; }
        if (action === 'wiz-save')   { APP.wizSave(); return; }
        if (action === 'wiz-cancel') {
          showConfirmSheet(
            'Discard this draft?',
            'Your wizard progress will be lost. This can\u2019t be undone.',
            { confirmLabel: 'Discard', danger: true },
            function () {
              clearDraft();
              location.hash = '#/home';
            }
          );
          return;
        }
        if (action === 'wiz-new') {
          showConfirmSheet(
            'Start a new quote?',
            'The current draft will be cleared.',
            { confirmLabel: 'Start new', danger: true },
            function () {
              clearDraft();
              wizardData = defaultWizard();
              renderWizard();
            }
          );
          return;
        }

        // MV input row mgmt
        if (action === 'mv-input-add') {
          // alpha.9.2: defensive Rule-A guard. The UI button is disabled at the
          // cap, but a stale view or rapid double-tap on the enable→disable
          // boundary could still fire this handler. No-op if already at cap.
          const _dist = new Set(
            wizardData.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
          );
          if (_dist.size >= 2) return;
          wizardData.mv_inputs.push({ signal: '', qty: 1 });
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        if (action === 'mv-input-remove') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          wizardData.mv_inputs.splice(idx, 1);
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        if (action === 'mv-input-inc' || action === 'mv-input-dec') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const row = wizardData.mv_inputs[idx];
          if (!row) return;
          row.qty = (Number(row.qty) || 0) + (action === 'mv-input-inc' ? 1 : -1);
          if (row.qty < 0) row.qty = 0;
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // v27.1.2 #5 — screen-add / screen-remove retired. The LED count
        // stepper in Step 3 (synthetic 'led' field, namespace '__calico_led')
        // owns array sizing via _resizeScreens(). Old handlers removed; if a
        // stale button somehow remains in DOM, the actions fall through to
        // the unhandled-action toast which is appropriate (visible failure).

        // Logout
        if (action === 'logout') {
          STORE.logout();
          toast('Signed out.', 'default');
          location.hash = '#/login';
          return;
        }

        // v27.3.0 — Load-error retry handlers
        if (action === 'home-retry')  { loadHomeRecent(); loadHomeSimpleStats(); return; }
        if (action === 'hist-retry')  { loadHistoryList(); return; }
        if (action === 'cust-retry')  { loadCustomerList(); return; }

        // v27.3.0 — Custom confirm sheet button handlers.
        // confirm-go invokes the stored callback then closes the sheet;
        // confirm-cancel just closes (drops the callback).
        if (action === 'confirm-cancel') {
          _pendingConfirmCallback = null;
          closeSheet();
          return;
        }
        if (action === 'confirm-go') {
          const cb = _pendingConfirmCallback;
          _pendingConfirmCallback = null;
          closeSheet();
          if (cb) {
            try { cb(); } catch (e) { console.error('[confirm] callback threw', e); }
          }
          return;
        }

        // v27.3.0 — Profile page: save edited contact fields via profile_update.
        if (action === 'profile-save') {
          // Prevent native form submit reload — this handler is on the submit button.
          if (ev && ev.preventDefault) ev.preventDefault();
          const u = STORE.currentUser();
          if (!u || !u.id) {
            toast('Session error \u2014 please sign in again.', 'err');
            return;
          }
          const fn   = ($('pi-fullname') && $('pi-fullname').value || '').trim();
          const t    = ($('pi-title')    && $('pi-title').value    || '').trim();
          const phRaw= ($('pi-phone')    && $('pi-phone').value    || '').trim();
          const em   = ($('pi-email')    && $('pi-email').value    || '').trim();
          // Normalize phone — strip non-digits, take last 10
          const phDigits = phRaw.replace(/\D/g, '');
          const ph = phDigits.length >= 10 ? phDigits.slice(-10) : phDigits;

          // Validation
          const errs = [];
          if (!fn) errs.push('Full name is required.');
          if (ph && ph.length !== 10) errs.push('Phone must be 10 digits.');
          if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) errs.push('Enter a valid email.');
          if (errs.length) { toast(errs[0], 'err'); return; }

          // Build payload — only send changed fields
          const payload = {};
          if (fn !== (u.full_name || ''))             payload.full_name = fn;
          if (t  !== (u.professional_title || ''))    payload.professional_title = t;
          if (ph !== (u.phone || ''))                 payload.phone = ph;
          if (em !== (u.email || ''))                 payload.email = em;
          if (Object.keys(payload).length === 0) {
            toast('No changes to save.', 'default');
            return;
          }

          actEl.disabled = true;
          STORE._rpc('profile_update', { p_actor: u.id, p_payload: payload })
            .then(function (r) {
              if (!r || r.ok !== true) throw new Error((r && r.error) || 'Profile save failed.');
              STORE._patchCurrentUser(payload);
              STORE.fetchRoster();  // not awaited
              toast('Profile saved.', 'ok');
              try { renderTopBarDynamic(STORE.currentUser()); } catch (e) {}
            })
            .catch(function (e) {
              toast('Save failed: ' + (e.message || String(e)), 'err');
            })
            .then(function () {
              if (actEl) actEl.disabled = false;
            });
          return;
        }

        // Saved-deal "Try again" button — re-dispatches showSavedDeal with the
        // refId from data-ref. Avoids touching the hash (which wouldn't re-fire
        // if the user is already on #/quote/<ref>).
        if (action === 'saved-retry') {
          const ref = actEl.getAttribute('data-ref') || '';
          if (ref) showSavedDeal(ref);
          return;
        }

        // Saved-deal chip-nav jump — open target accordion section + smooth-scroll.
        // The <details> element needs `open` set explicitly before scrollIntoView
        // so the browser scrolls to the expanded position, not the collapsed one.
        if (action === 'sd-jump') {
          const targetId = actEl.getAttribute('data-target') || '';
          const el = document.getElementById(targetId);
          if (el) {
            if (el.tagName === 'DETAILS') el.open = true;
            // Defer to next frame so layout settles after open=true expands the body.
            requestAnimationFrame(function() {
              el.scrollIntoView({ behavior:'smooth', block:'start' });
            });
          }
          return;
        }

        // v27.3.0 — Customer Directory actions
        if (action === 'cust-new') {
          UI.showCustomerEditor(null);
          return;
        }

        // v27.3.0 — Login "Trouble signing in?" link opens the reset password
        // request sheet (D10).
        if (action === 'rp-show') {
          showResetPasswordRequest();
          return;
        }
        if (action === 'cust-filter') {
          const v = actEl.getAttribute('data-value') || 'all';
          setCustomerFilter(v);
          return;
        }
        if (action === 'cust-open') {
          const id = actEl.getAttribute('data-id');
          if (id) UI.showCustomer360(id);
          return;
        }
        if (action === 'cust-edit') {
          const id = actEl.getAttribute('data-id');
          if (id) UI.showCustomerEditor(id);
          return;
        }
        if (action === 'cust-save') {
          const id = actEl.getAttribute('data-id');  // null for new
          const payload = {
            name:       ($('ce-name')     && $('ce-name').value || '').trim(),
            party_type: ($('ce-type')     && $('ce-type').value) || 'customer',
            city:       ($('ce-city')     && $('ce-city').value || '').trim(),
            state:      ($('ce-state')    && $('ce-state').value || '').trim(),
            industry:   ($('ce-industry') && $('ce-industry').value || '').trim(),
            website:    ($('ce-website')  && $('ce-website').value || '').trim(),
            notes:      ($('ce-notes')    && $('ce-notes').value || '').trim()
          };
          if (!payload.name) { toast('Name is required', 'err'); return; }
          if (id) payload.id = id;
          STORE.customerUpsert(payload).then(function (r) {
            if (r && r.ok === false) { toast('Save failed: ' + (r.error || 'unknown'), 'err'); return; }
            closeSheet();
            toast(id ? 'Updated' : 'Created', 'ok');
            loadCustomerList();
          }).catch(function (err) {
            toast('Save failed: ' + (err && err.message || String(err)), 'err');
          });
          return;
        }
        if (action === 'cust-delete') {
          const id = actEl.getAttribute('data-id');
          if (!id) return;
          showConfirmSheet(
            'Delete this customer?',
            'Linked deals will be unlinked but not deleted.',
            { confirmLabel: 'Delete', danger: true },
            function () {
              STORE.customerDelete(id).then(function () {
                closeSheet();
                toast('Deleted', 'ok');
                loadCustomerList();
              }).catch(function (err) {
                toast('Delete failed: ' + (err && err.message || String(err)), 'err');
              });
            }
          );
          return;
        }
        if (action === 'cust-merge') {
          const sourceId = actEl.getAttribute('data-id');
          if (!sourceId) return;
          // Show merge picker — list other customers to merge INTO
          const others = _customersCache.filter(c => c.id !== sourceId);
          if (others.length === 0) {
            toast('Need at least 2 customers to merge', 'warn');
            return;
          }
          const sourceName = (_customersCache.find(c => c.id === sourceId) || {}).name || '';
          openSheet(
            '<div class="notif-sheet" style="padding:0 16px 16px">' +
              '<div class="notif-sheet-head" style="padding-left:0;padding-right:0">' +
                '<h3>Merge into\u2026</h3>' +
              '</div>' +
              '<p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px">' +
                'All deals on <strong>' + esc(sourceName) + '</strong> will be reassigned to the chosen target. ' +
                'The source customer will be deleted. This cannot be undone.' +
              '</p>' +
              '<div class="field-v3"><label>Target customer</label>' +
                '<select class="input-v3" id="cm-target">' +
                  '<option value="">\u2014 pick one \u2014</option>' +
                  others.map(c =>
                    '<option value="' + esc(c.id) + '">' + esc(c.name || '') +
                    (c.city ? ' (' + esc(c.city) + ')' : '') + '</option>'
                  ).join('') +
                '</select>' +
              '</div>' +
              '<button class="btn-v3 btn-primary btn-md" type="button" data-action="cust-merge-confirm" data-source="' + esc(sourceId) + '" style="width:100%">' +
                'Merge \u2192' +
              '</button>' +
            '</div>'
          );
          return;
        }
        if (action === 'cust-merge-confirm') {
          const sourceId = actEl.getAttribute('data-source');
          const targetId = $('cm-target') && $('cm-target').value;
          if (!sourceId || !targetId) { toast('Pick a target customer', 'err'); return; }
          STORE.customerMerge(sourceId, targetId).then(function () {
            closeSheet();
            toast('Merged successfully', 'ok');
            loadCustomerList();
          }).catch(function (err) {
            toast('Merge failed: ' + (err && err.message || String(err)), 'err');
          });
          return;
        }

        // v27.3.0 — Notification row tap: mark read + navigate to deal if ref present
        if (action === 'notif-tap') {
          const id = actEl.getAttribute('data-id');
          const navTarget = actEl.getAttribute('data-nav');
          // Optimistic UI: dim the row immediately
          actEl.classList.add('notif-row-read');
          const unreadDot = actEl.querySelector('.notif-unread');
          if (unreadDot) unreadDot.remove();
          if (id) {
            STORE.notifMarkRead([id], false).catch(function () {});
            refreshNotifBadge();
          }
          if (navTarget) {
            closeSheet();
            location.hash = navTarget;
          }
          return;
        }

        // v27.3.0 — Mark all notifications as read
        if (action === 'notif-mark-all') {
          STORE.notifMarkRead(null, true).then(function () {
            // Re-render sheet contents and badge
            showNotificationsSheet();
            refreshNotifBadge();
          }).catch(function (err) {
            toast('Could not mark all read: ' + (err && err.message || String(err)), 'err');
          });
          return;
        }

        // v27.3.0 — Saved-deal: open audit log filtered to this ref
        if (action === 'sd-audit') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref_id;
          showAuditLogSheet({ refId: ref });
          return;
        }

        // v27.3.0 — User menu actions (avatar dropdown sheet)
        if (action === 'um-profile') {
          closeSheet();
          if (location.hash !== '#/profile') location.hash = '#/profile';
          return;
        }

        // v27.3.0 — Duplicate deal (v27.7 partial restore)
        if (action === 'sd-duplicate') {
          if (!_savedDealData) return;
          const srcRef = _savedDealData.display_ref || _savedDealData.ref_id;
          if (!srcRef) return;
          const newName = prompt('New project name (leave blank to copy current):', _savedDealData.project || '');
          if (newName === null) return;
          STORE.duplicateDeal(srcRef, newName.trim()).then(function (r) {
            if (r && r.ok === false) {
              toast('Duplicate failed: ' + (r.error || 'unknown'), 'err');
              return;
            }
            const newRef = (r && (r.display_ref || r.ref_id)) || '';
            toast('Duplicated as ' + newRef, 'ok');
            if (newRef) location.hash = '#/quote/' + newRef;
          }).catch(function (err) {
            toast('Duplicate failed: ' + (err && err.message || String(err)), 'err');
          });
          return;
        }
        if (action === 'um-changepw') {
          closeSheet();
          if (location.hash !== '#/profile') location.hash = '#/profile';
          toast('Use Profile page to change your password', 'default');
          return;
        }
        if (action === 'um-audit') {
          showAuditLogSheet({});
          return;
        }
        if (action === 'um-resets') {
          showResetPasswordPanel();
          return;
        }
        if (action === 'um-about') {
          showAboutSheet();
          return;
        }
        if (action === 'um-logout') {
          closeSheet();
          STORE.logout();
          location.hash = '#/login';
          return;
        }

        // v27.3.0 — Saved-deal: open revisions for this ref
        if (action === 'sd-revisions') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref_id;
          showRevisionsSheet(ref);
          return;
        }

        // v27.3.0 — Saved-deal: open stage transitions history for this ref
        if (action === 'sd-history') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref_id;
          showStageTransitionsSheet(ref);
          return;
        }

        // v27.3.0 — Reset password submit (from login screen sheet)
        if (action === 'rp-submit') {
          const un = ($('rp-username') && $('rp-username').value || '').trim();
          const reason = ($('rp-reason') && $('rp-reason').value || '').trim();
          if (!un) { toast('Username is required', 'err'); return; }
          STORE.resetPasswordRequest(un, reason).then(function (r) {
            if (r && r.ok === false) {
              toast('Request failed: ' + (r.error || 'unknown'), 'err');
            } else {
              closeSheet();
              toast('Request submitted. A Super user will review.', 'ok');
            }
          }).catch(function (err) {
            toast('Request failed: ' + (err && err.message || String(err)), 'err');
          });
          return;
        }

        // v27.3.0 — Super: approve a pending reset request (issues a temp PW)
        if (action === 'rp-approve') {
          const id = actEl.getAttribute('data-id');
          if (!id) return;
          // Generate a memorable temp password
          const temp = 'temp' + Math.floor(1000 + Math.random() * 9000);
          showConfirmSheet(
            'Approve reset request?',
            'Temp password ' + temp + ' will be set on the account and marked must-change. Share this password with the user securely.',
            { confirmLabel: 'Approve', danger: false },
            function () {
              STORE.resetPasswordApprove(id, temp).then(function () {
                toast('Approved. Temp password: ' + temp + ' (share with user)', 'ok');
                showResetPasswordPanel();
              }).catch(function (err) {
                toast('Approve failed: ' + (err && err.message || String(err)), 'err');
              });
            }
          );
          return;
        }

        // v27.3.0 — WhatsApp share (opens wa.me URL with prefilled message)
        if (action === 'sd-whatsapp') {
          if (!_savedDealData) return;
          try {
            const url = _buildWhatsAppUrl(_savedDealData);
            window.open(url, '_blank');
            toast('Opening WhatsApp\u2026 attach Excel/PDF before sending', 'ok');
          } catch (err) {
            toast('WhatsApp share failed: ' + (err && err.message || String(err)), 'err');
          }
          return;
        }

        // v27.3.0 — Email share (opens mailto: URL with prefilled subject/body)
        if (action === 'sd-email') {
          if (!_savedDealData) return;
          try {
            const url = _buildMailtoUrl(_savedDealData);
            window.location.href = url;
            toast('Opening email draft\u2026 attach Excel + PDF before sending', 'ok');
          } catch (err) {
            toast('Email share failed: ' + (err && err.message || String(err)), 'err');
          }
          return;
        }

        // v27.3.0 — Confirm deal (visual placeholder; full flow lands in v27.4)
        if (action === 'sd-confirm') {
          if (!_savedDealData) return;
          toast('Deal confirmation flow lands in v27.4', 'default');
          return;
        }

        // alpha.7.3 — Saved-deal structural steppers (+/− buttons)
        if (action === 'sd-step-inc' || action === 'sd-step-dec') {
          if (!_savedDealData) return;
          const ns  = actEl.getAttribute('data-sd-ns');
          const key = actEl.getAttribute('data-sd-key');
          if (!ns || !key) return;
          if (!_savedDealData[ns]) _savedDealData[ns] = {};
          const cur = Number(_savedDealData[ns][key]) || 0;
          let next = cur + (action === 'sd-step-inc' ? 1 : -1);
          if (next < 0) next = 0;
          if (next > 32) next = 32;
          if (next === cur) return;
          _savedDealData[ns][key] = next;
          markStructuralDirty();
          // Re-render to update +/− disabled states and the visible value.
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // alpha.7.3 — Saved-deal toggle tiles (calico_audio)
        if (action === 'sd-toggle') {
          if (!_savedDealData) return;
          const key = actEl.getAttribute('data-sd-key');
          if (!key) return;
          _savedDealData[key] = !_savedDealData[key];
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // alpha.7.3 — Rebuild BoM from current structural state
        if (action === 'sd-rebuild') {
          rebuildSavedDeal();
          return;
        }

        // v27.1.2 #6 — Edit: hydrate wizard from this deal, jump to Step 1.
        // OQ 6A locked: updates existing deal (not duplicate). Distinguished
        // from fresh-new via route '#/quote/edit/{refId}'. Save handler
        // (wiz-save) detects edit-mode via this hash and updates rather than
        // inserts. Per-step "Edit step N" links inside accordions remain (OQ 6B).
        if (action === 'sd-edit') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref || _savedDealRefId;
          if (!ref) {
            toast('Cannot edit: no reference ID.', 'err');
            return;
          }
          try {
            wizardData = hydrateWizardFromDeal(_savedDealData);
            wizardData.step = 1;
            wizardData.errors = {};
            // Persist edit-target refId on wizardData so wiz-save can detect
            // update-vs-insert without relying solely on the hash (hash may
            // change during step navigation).
            wizardData._editRefId = ref;
          } catch (e) {
            const msg = (e && e.message) ? e.message : String(e);
            toast('Cannot open editor: ' + msg, 'err');
            return;
          }
          location.hash = '#/quote/edit/' + encodeURIComponent(ref);
          return;
        }

        // alpha.8.0 — Excel export
        if (action === 'sd-excel') {
          if (!_savedDealData) return;
          _openExportModePicker('xlsx', _savedDealData);
          return;
        }

        // alpha.8.0 — PDF export
        if (action === 'sd-pdf') {
          if (!_savedDealData) return;
          _openExportModePicker('pdf', _savedDealData);
          return;
        }

        // v27.3.0 — Export mode picker chose a format/mode → run it
        if (action === 'export-go') {
          if (!_savedDealData) return;
          const fmt  = actEl.getAttribute('data-fmt')  || 'xlsx';
          const mode = actEl.getAttribute('data-mode') || 'boq';
          closeSheet();
          _runExport(fmt, mode, _savedDealData);
          return;
        }

        // alpha.8.3 — Soft-delete saved deal
        if (action === 'sd-delete') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref || _savedDealRefId;
          if (!ref) {
            toast('Cannot delete: no reference ID.', 'err');
            return;
          }
          showConfirmSheet(
            'Delete ' + ref + '?',
            'You can restore it from History \u2192 Deleted.',
            { confirmLabel: 'Delete', danger: true },
            function () {
              const btn = actEl;
              const orig = btn.textContent;
              btn.disabled = true;
              btn.textContent = 'Deleting\u2026';
              STORE.deleteDeal(ref).then(function(r) {
                if (r && r.ok === true) {
                  if (_autosaveTimer) { clearTimeout(_autosaveTimer); _autosaveTimer = null; }
                  _savedDealData    = null;
                  _savedDealRefId   = null;
                  _autosaveInFlight = false;
                  toast(ref + ' deleted. Restore from History \u2192 Deleted.', 'ok');
                  location.hash = '#/history';
                } else {
                  toast('Delete returned unexpected response: ' + JSON.stringify(r), 'err');
                  btn.disabled = false;
                  btn.textContent = orig;
                }
              }).catch(function(err) {
                const msg = (err && err.message) ? err.message : String(err);
                toast('Delete failed: ' + msg, 'err');
                btn.disabled = false;
                btn.textContent = orig;
              });
            }
          );
          return;
        }

        // alpha.8.3 — Restore a soft-deleted deal from History view
        if (action === 'hist-restore') {
          const ref = actEl.getAttribute('data-ref');
          if (!ref) return;
          showConfirmSheet(
            'Restore ' + ref + '?',
            'The deal will be reactivated and appear in your regular list.',
            { confirmLabel: 'Restore', danger: false },
            function () {
              const btn = actEl;
              const orig = btn.textContent;
              btn.disabled = true;
              btn.textContent = 'Restoring\u2026';
              STORE.restoreDeal(ref).then(function(r) {
                if (r && r.ok === true) {
                  toast(ref + ' restored.', 'ok');
                  if (typeof loadHistoryList === 'function') loadHistoryList();
                } else {
                  toast('Restore returned unexpected response: ' + JSON.stringify(r), 'err');
                  btn.disabled = false;
                  btn.textContent = orig;
                }
              }).catch(function(err) {
                const msg = (err && err.message) ? err.message : String(err);
                toast('Restore failed: ' + msg, 'err');
                btn.disabled = false;
                btn.textContent = orig;
              });
            }
          );
          return;
        }

        // alpha.7.6 — LED screen array mgmt
        if (action === 'sd-screen-add') {
          if (!_savedDealData) return;
          if (!Array.isArray(_savedDealData.screens)) _savedDealData.screens = [];
          _savedDealData.screens.push({ w: '', h: '' });
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        if (action === 'sd-screen-remove') {
          if (!_savedDealData || !Array.isArray(_savedDealData.screens)) return;
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (isNaN(idx) || idx < 0 || idx >= _savedDealData.screens.length) return;
          _savedDealData.screens.splice(idx, 1);
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // alpha.7.6 — MV input row mgmt
        if (action === 'sd-mv-input-add') {
          if (!_savedDealData) return;
          if (!Array.isArray(_savedDealData.mv_inputs)) _savedDealData.mv_inputs = [];
          // alpha.9.2: defensive Rule-A guard (mirror of wizard handler).
          const _dist = new Set(
            _savedDealData.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
          );
          if (_dist.size >= 2) return;
          _savedDealData.mv_inputs.push({ signal: '', qty: 1 });
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        if (action === 'sd-mv-input-remove') {
          if (!_savedDealData || !Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (isNaN(idx) || idx < 0 || idx >= _savedDealData.mv_inputs.length) return;
          _savedDealData.mv_inputs.splice(idx, 1);
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        if (action === 'sd-mv-input-inc' || action === 'sd-mv-input-dec') {
          if (!_savedDealData || !Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const row = _savedDealData.mv_inputs[idx];
          if (!row) return;
          const cur = Number(row.qty) || 0;
          let next = cur + (action === 'sd-mv-input-inc' ? 1 : -1);
          if (next < 0) next = 0;
          if (next > 32) next = 32;
          if (next === cur) return;
          row.qty = next;
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // Smoke buttons
        // All three handlers toast a summary so the result survives even if
        // the smoke causes a view change (e.g. STORE smoke ends in logout
        // and the auth guard re-routes to #/login, wiping the dev pre).
        if (action === 'run-smoke') {
          const r = window.__smoke();
          renderSmokeOutput(r);
          const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
          toast('Sync smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
          return;
        }
        if (action === 'run-store-smoke') {
          showConfirmSheet(
            'Run STORE smoke?',
            'This runs a full auth round-trip and will sign you out at the end.',
            { confirmLabel: 'Run smoke', danger: false },
            function () {
              actEl.disabled = true;
              const el = $('dev-smoke-out');
              if (el) { el.hidden = false; el.innerHTML = '<span class="warn-ln">running\u2026</span>'; }
              window.__smokeStore().then(r => {
                if ($('dev-smoke-out')) renderSmokeOutput(r);
                const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
                toast('STORE smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
              }).catch(e => {
                toast('STORE smoke harness threw: ' + esc(e && e.message || String(e)), 'err');
              }).finally(() => { actEl.disabled = false; });
            }
          );
          return;
        }
        if (action === 'run-ui-smoke') {
          const r = window.__smokeUI();
          renderSmokeOutput(r);
          const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
          toast('UI smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
          return;
        }
      });

      // INPUT delegation (text fields, steppers, MV rows, screens, audio select)
      document.body.addEventListener('input', function(e) {
        const t = e.target;
        if (!t) return;

        // v27.3.0 — LED aggregate band needs to update after user finishes
        // typing W/H/pitch. Hook here is "input" listener — but rerendering on
        // every keystroke would steal focus mid-typing. Instead: register a
        // blur listener once that triggers rerender when an LED field is
        // unfocused. The blur listener is added below in capture phase.

        // Generic data-bind ("namespace.key" or "key" for top-level)
        const bind = t.getAttribute('data-bind');
        if (bind) {
          if (bind.indexOf('.') > -1) {
            const [ns, key] = bind.split('.');
            wizardData[ns][key] = t.value;
          } else {
            wizardData[bind] = t.value;
          }
          saveDraft();
          // No re-render on input — would lose focus. Caller can re-render
          // explicitly when needed (e.g. projector resolution depends on
          // projector count, which uses stepper — handled separately).
          return;
        }

        // alpha.7.2: Saved-deal soft-field edits — mutate the loaded deal
        // object in place + trigger debounced autosave. Note this fires per
        // keystroke; the 1s debounce in scheduleAutosave keeps the network
        // calm.
        // alpha.7.6: Route via SOFT_FIELDS classification so sdField /
        // sdSelectField helpers can be reused for STRUCTURAL fields too
        // (which mark dirty + wait for Rebuild instead of autosaving).
        const sdBind = t.getAttribute('data-sd-bind');
        if (sdBind && _savedDealData) {
          _savedDealData[sdBind] = t.value;
          if (SOFT_FIELDS.indexOf(sdBind) >= 0) {
            scheduleAutosave();
          } else {
            markStructuralDirty();
          }
          return;
        }

        // alpha.7.3: Saved-deal stepper direct typing (sd-step-set)
        const sdAct = t.getAttribute('data-action');
        if (sdAct === 'sd-step-set' && _savedDealData) {
          const ns  = t.getAttribute('data-sd-ns');
          const key = t.getAttribute('data-sd-key');
          if (!ns || !key) return;
          if (!_savedDealData[ns]) _savedDealData[ns] = {};
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? 0 : (v > 32 ? 32 : v);
          if (_savedDealData[ns][key] !== safe) {
            _savedDealData[ns][key] = safe;
            markStructuralDirty();
            // Don't re-render mid-type — would lose focus. +/- disabled
            // states will refresh on next +/- tap or on Rebuild.
          }
          return;
        }

        // alpha.7.6: LED screen W/H direct typing
        if ((sdAct === 'sd-screen-w' || sdAct === 'sd-screen-h') && _savedDealData) {
          if (!Array.isArray(_savedDealData.screens)) return;
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = _savedDealData.screens[idx];
          if (!row) return;
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? '' : v;
          const field = sdAct === 'sd-screen-w' ? 'w' : 'h';
          if (row[field] !== safe) {
            row[field] = safe;
            markStructuralDirty();
          }
          return;
        }

        // alpha.7.6: MV input qty direct typing
        if (sdAct === 'sd-mv-input-set' && _savedDealData) {
          if (!Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = _savedDealData.mv_inputs[idx];
          if (!row) return;
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? 0 : (v > 32 ? 32 : v);
          if (row.qty !== safe) {
            row.qty = safe;
            markStructuralDirty();
          }
          return;
        }

        // Stepper direct typing
        const action = t.getAttribute('data-action');
        if (action === 'step-set') {
          const ns  = t.getAttribute('data-ns');
          const key = t.getAttribute('data-key');
          const v = parseInt(t.value, 10);
          const safe = isNaN(v) || v < 0 ? 0 : v;
          // v27.1.2 #3+#5 — synthetic LED stepper: resize screens array on
          // direct-type as well. Re-render here (unlike normal step-set which
          // skips render during typing) because screen blocks in Step 4 need
          // to update when user changes LED count from Step 3.
          if (ns === '__calico_led') {
            _resizeScreens(safe);
            wizardData.hasLed = (safe > 0);
            saveDraft();
            rerenderPreservingScroll();
            return;
          }
          // v27.1.2 #7 — corio_canvases direct typing.
          if (ns === '__corio_canvas') {
            wizardData.corio_canvases = safe;
            saveDraft();
            // Don't re-render mid-type; allow continued typing.
            return;
          }
          if (ns) wizardData[ns][key] = safe;
          saveDraft();
          // Don't re-render mid-type; user is still typing.
          return;
        }

        // MV input qty direct typing
        if (action === 'mv-input-set') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.mv_inputs[idx];
          if (row) {
            const v = parseInt(t.value, 10);
            row.qty = isNaN(v) || v < 0 ? 0 : v;
            saveDraft();
          }
          return;
        }

        // LED screen W/H direct typing
        if (action === 'screen-w' || action === 'screen-h') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.screens[idx];
          if (row) {
            const v = parseInt(t.value, 10);
            const safe = isNaN(v) || v < 0 ? '' : v;
            row[action === 'screen-w' ? 'w' : 'h'] = safe;
            saveDraft();
          }
          return;
        }

        // v27.1.2 #5 — LED pixel pitch direct typing.
        // Store as STRING (not parsed) during typing so users can build up
        // "2.5" → "2.50" without the value snapping. validateStep parses +
        // range-checks. Accept only digits and a single decimal point; strip
        // anything else silently so paste/autocomplete oddities don't stick.
        if (action === 'screen-pitch') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = wizardData.screens[idx];
          if (row) {
            // Allow empty during typing; sanitize to numeric+decimal pattern.
            let s = String(t.value == null ? '' : t.value);
            // Permit one optional leading minus is NOT allowed — pitches are positive.
            s = s.replace(/[^0-9.]/g, '');
            // Collapse multiple decimal points to the first one
            const firstDot = s.indexOf('.');
            if (firstDot >= 0) {
              s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
            }
            row.pitch = s;
            // If sanitizer changed the value, write it back so the input
            // doesn't show illegal chars momentarily.
            if (s !== t.value) t.value = s;
            saveDraft();
          }
          return;
        }

        /* v27.3.0 §10 — SX line-item handlers */
        // HDBaseT: add line
        if (action === 'sx-hdbt-add') {
          if (!Array.isArray(wizardData.sx_hdbt_lines)) wizardData.sx_hdbt_lines = [];
          wizardData.sx_hdbt_lines.push({
            id: 'h' + Date.now() + Math.floor(Math.random() * 1000),
            direction: 'kit',
            signal: 'Video',
            resolution: '1080p',
            qty: 1
          });
          _syncSxSums();
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        // HDBaseT: set a key (direction/signal/resolution) on a line
        if (action === 'sx-hdbt-set') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const key = actEl.getAttribute('data-key');
          const value = actEl.getAttribute('data-value');
          const line = wizardData.sx_hdbt_lines && wizardData.sx_hdbt_lines[idx];
          if (line && key) {
            line[key] = value;
            _syncSxSums();
            saveDraft();
            rerenderPreservingScroll();
          }
          return;
        }
        // HDBaseT: change qty
        if (action === 'sx-hdbt-qty') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const delta = parseInt(actEl.getAttribute('data-delta'), 10) || 0;
          const line = wizardData.sx_hdbt_lines && wizardData.sx_hdbt_lines[idx];
          if (line) {
            line.qty = Math.max(0, (line.qty | 0) + delta);
            _syncSxSums();
            saveDraft();
            rerenderPreservingScroll();
          }
          return;
        }
        // HDBaseT: remove line
        if (action === 'sx-hdbt-remove') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (wizardData.sx_hdbt_lines && wizardData.sx_hdbt_lines[idx]) {
            wizardData.sx_hdbt_lines.splice(idx, 1);
            _syncSxSums();
            saveDraft();
            rerenderPreservingScroll();
          }
          return;
        }
        // Splitter (DA): qty change for a model
        if (action === 'sx-da-qty') {
          const key = actEl.getAttribute('data-key');
          const delta = parseInt(actEl.getAttribute('data-delta'), 10) || 0;
          if (!wizardData.sx_da_counts) wizardData.sx_da_counts = { '612': 0, '614': 0, '618': 0 };
          wizardData.sx_da_counts[key] = Math.max(0, (wizardData.sx_da_counts[key] | 0) + delta);
          _syncSxSums();
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        // AP-536 qty
        if (action === 'sx-ap-qty') {
          const delta = parseInt(actEl.getAttribute('data-delta'), 10) || 0;
          wizardData.sx_ap_qty = Math.max(0, (wizardData.sx_ap_qty | 0) + delta);
          _syncSxSums();
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        // AOC: add line
        if (action === 'sx-aoc-add') {
          if (!Array.isArray(wizardData.sx_aoc_lines)) wizardData.sx_aoc_lines = [];
          wizardData.sx_aoc_lines.push({
            id: 'a' + Date.now() + Math.floor(Math.random() * 1000),
            signal: 'HDMI',
            jacket: 'Standard',
            length: 10,
            qty: 1
          });
          _syncSxSums();
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        // AOC: change qty
        if (action === 'sx-aoc-qty') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const delta = parseInt(actEl.getAttribute('data-delta'), 10) || 0;
          const line = wizardData.sx_aoc_lines && wizardData.sx_aoc_lines[idx];
          if (line) {
            line.qty = Math.max(0, (line.qty | 0) + delta);
            _syncSxSums();
            saveDraft();
            rerenderPreservingScroll();
          }
          return;
        }
        // AOC: remove line
        if (action === 'sx-aoc-remove') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (wizardData.sx_aoc_lines && wizardData.sx_aoc_lines[idx]) {
            wizardData.sx_aoc_lines.splice(idx, 1);
            _syncSxSums();
            saveDraft();
            rerenderPreservingScroll();
          }
          return;
        }
      });

      /* v27.3.0 §10 — sync sx_data sums from the detail arrays. Keeps backward
         compat with anything reading sx_data (validation, old paths). */
      function _syncSxSums() {
        if (!wizardData) return;
        if (!wizardData.sx_data) wizardData.sx_data = { hdmi: 0, sdi: 0, ap536: 0, avip: 0 };
        wizardData.sx_data.hdmi  = (wizardData.sx_hdbt_lines || []).reduce((s, l) => s + (l.qty | 0), 0);
        const da = wizardData.sx_da_counts || {};
        wizardData.sx_data.sdi   = (da['612']|0) + (da['614']|0) + (da['618']|0);
        wizardData.sx_data.ap536 = wizardData.sx_ap_qty | 0;
        wizardData.sx_data.avip  = (wizardData.sx_aoc_lines || []).reduce((s, l) => s + (l.qty | 0), 0);
      }

      // v27.3.0 — LED aggregate band refresh on blur (FocusEvent doesn't
      // bubble; use capture phase). Triggers rerender so the live readouts
      // (Pixels, RJ45 ports, Aspect ratio, Total) recompute from the latest
      // W/H/pitch values without stealing focus mid-typing.
      document.body.addEventListener('blur', function (e) {
        const t = e.target;
        if (!t) return;
        const action = t.getAttribute && t.getAttribute('data-action');
        if (action === 'screen-w' || action === 'screen-h' || action === 'screen-pitch') {
          // Defer to next tick so other blur handlers complete first
          setTimeout(function () { try { rerenderPreservingScroll(); } catch (e) {} }, 0);
        }
      }, true);

      // CHANGE delegation for selects (MV per-row signal + general selects)
      document.body.addEventListener('change', function(e) {
        const t = e.target;
        if (!t) return;
        const action = t.getAttribute('data-action');
        // v27.3.0 §10 — AOC length select handler (signal/jacket use pill clicks)
        if (action === 'sx-aoc-set') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const key = t.getAttribute('data-key');
          const line = wizardData.sx_aoc_lines && wizardData.sx_aoc_lines[idx];
          if (line && key) {
            line[key] = (key === 'length') ? (parseInt(t.value, 10) || 0) : t.value;
            // If signal/jacket changes, reset length to first available
            if (key === 'signal' || key === 'jacket') {
              const lengths = _aocAvailableLengths(line.signal, line.jacket);
              if (lengths.indexOf(line.length) === -1) line.length = lengths[0] || 10;
            }
            saveDraft();
            rerenderPreservingScroll();
          }
          return;
        }
        if (action === 'mv-input-signal') {
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          if (wizardData.mv_inputs[idx]) {
            wizardData.mv_inputs[idx].signal = t.value;
            saveDraft();
          }
          return;
        }
        // alpha.7.6: Saved-deal MV per-row signal change
        if (action === 'sd-mv-input-signal' && _savedDealData) {
          if (!Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(t.getAttribute('data-idx'), 10);
          const row = _savedDealData.mv_inputs[idx];
          if (!row) return;
          row.signal = t.value;
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        // Selects bound by data-bind already fire 'input' on change in most
        // browsers, but Safari historically only fires 'change' for select.
        const bind = t.getAttribute('data-bind');
        if (bind && t.tagName === 'SELECT') {
          if (bind.indexOf('.') > -1) {
            const [ns, key] = bind.split('.');
            wizardData[ns][key] = t.value;
          } else {
            wizardData[bind] = t.value;
          }
          saveDraft();
          return;
        }
        // alpha.7.2: Same Safari concern for saved-deal selects.
        // alpha.7.6: Soft/structural classification (see input handler).
        const sdBind = t.getAttribute('data-sd-bind');
        if (sdBind && t.tagName === 'SELECT' && _savedDealData) {
          _savedDealData[sdBind] = t.value;
          if (SOFT_FIELDS.indexOf(sdBind) >= 0) {
            scheduleAutosave();
          } else {
            markStructuralDirty();
          }
          return;
        }

        // v27.1.1 B5 — City <input list="cities-list"> autofills State on
        // change. Wizard path: bind=city; saved-deal path: sd-bind=city.
        // The input handler already wrote t.value to wizardData/_savedDealData
        // (per-keystroke); this just looks up state and updates the partner
        // state input. autoFillStateFromCity is a no-op for unmatched cities
        // and for 'Other' (empty state), so users on tier-3+ cities can type
        // both city and state freely.
        if (t.tagName === 'INPUT') {
          const wizBind = t.getAttribute('data-bind');
          if (wizBind === 'city') {
            autoFillStateFromCity(t.value);
            return;
          }
          if (sdBind === 'city') {
            autoFillStateFromCity(t.value);
            return;
          }
        }
      });

      // FORM SUBMIT delegation (login, force-PW, profile-PW, step1)
      document.body.addEventListener('submit', function(e) {
        const f = e.target;
        if (!f || f.tagName !== 'FORM') return;
        if (f.id === 'login-form')       { e.preventDefault(); APP.handleLoginSubmit(); return; }
        if (f.id === 'pw-form')          { e.preventDefault(); APP.handleForcePwSubmit(); return; }
        if (f.id === 'profile-pw-form')  { e.preventDefault(); APP.handleProfilePwSubmit(); return; }
        if (f.id === 'profile-setup-form') { e.preventDefault(); APP.handleProfileSetupSubmit(); return; }  // v27.2.0 — D16
        if (f.id === 'profile-info-form') {  // v27.3.0 — Profile page contact fields
          e.preventDefault();
          const btn = f.querySelector('[data-action="profile-save"]');
          if (btn) btn.click();
          return;
        }
        if (f.id === 'step1-form')       { e.preventDefault(); APP.wizNext(); return; }
      });
    }

    /* ============================================================
       Boot mount
       ============================================================ */

    function mount() {
      $('app').hidden = false;
      $('ver-pill').textContent = CATALOG.version;
      bindGlobalEvents();
    }

    /* ---------- Public API ---------- */

    return {

      showLogin, showForcePw, showProfileSetup,
      showHome, showHistory, showProfile, showSavedDeal, showWizard,
      showCustomers, showCustomer360, showCustomerEditor, showDashboard,
      updateNavActive, showChrome,
      // expose for APP
      getWizardData: () => wizardData,

      // immediately after writing.
      flushDraft,

      validateStep,
      captureCurrentStepForm,
      setFieldError,
