  <script>
  /* ============================================================
     THEME BOOTSTRAP (v27.3.0) — runs before any IIFE so the
     html[data-theme] attribute is correct before first paint.
     Storage key: 'tvone.theme.v27'. Values: 'light' | 'dark' | 'auto'.
     ============================================================ */
  (function () {
    var KEY = 'tvone.theme.v27';
    function getPref() { try { return localStorage.getItem(KEY) || 'auto'; } catch(e) { return 'auto'; } }
    function actual(pref) {
      if (pref !== 'auto') return pref;
      var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      return (m && m.matches) ? 'dark' : 'light';
    }
    var pref = getPref();
    document.documentElement.setAttribute('data-theme', actual(pref));
    // expose for APP.handleThemeToggle to consume
    window.__themeBoot = { KEY: KEY, pref: pref, actual: actual };
  })();
  </script>
  <script>
  /* ============================================================
     CATALOG (Session 1 of v27 rebuild)
     Pure product data — chassis, cards, accessories, slot rules.
     Extracted verbatim from v26.7.1 (dgcavitak-rgb/calico-configurator).
     No logic. No prices. Deep-frozen. No mutation possible from outside.

     Source map (line refs are v26 index.html):
       calico        ← CHASSIS L3644, OUTPUT_CARDS L3659, INPUT_CARDS L3666,
                       SLOT11_ALLOWED_WHEN_SLOT12 L3678
       mv            ← CORIOVIEW_CHASSIS L8213, CORIOVIEW_INPUT_CARDS L8223,
                       CORIOVIEW_OUTPUT_CARDS L8233, MWP_MTO L8242, MV_QTY_CAP L8244
       corio         ← CORIO_CHASSIS L8744, CORIO_CM_MODULES L8780,
                       CORIO_CM2_MODULES L8808, CORIO_PSU_SKUS L8831
       sx            ← SX_HDBT_MAP L8256, SX_DA_MAP L8262, SX_AP_MAP L8268,
                       SX_AOC_CODE L8272, SX_AOC_AVAIL L8277
       constants     ← PORT_CAPACITY_4K60 L3478

     Shape changes from v26 (data unchanged):
       - mv.chassis: v26 array → v27 object keyed by sku
       - mv.chassis['MWP-MTO']: hoisted from standalone MWP_MTO const into chassis
       - sx: sub-catalogs preserved, sx.types added per (c) framing
              (HDBT/DA/AP/AOC matches v26 reality; SPEC §6 editorial
              naming ['HDMI','SDI','AP-536','AVIP'] deferred to Session 6)
     ============================================================ */
  const CATALOG = (function() {

    function deepFreeze(o) {
      if (o && typeof o === 'object' && !Object.isFrozen(o)) {
        Object.values(o).forEach(deepFreeze);
        Object.freeze(o);
      }
      return o;
    }

    const constants = {
      PORT_CAPACITY_4K60: 3840 * 2160  // 4K@60 pixel budget per output port
    };

    /* ---------- CALICO ---------- */
    const calico = {
      chassis: {
        'C7-PRO-1200': {
          model: 'CALICO PRO C7-PRO-1200', formFactor: '1RU', fixedChassis: true,
          inputs: 6, outputs: 2, maxPortsNative: 2, redundantPSU: false,
          tagline: 'Compact 1RU fixed-chassis processor — 6 inputs, 2 outputs.'

  const RECOMMEND = (function() {

    function _pickCalicoInputCards(extraInputsNeeded, input) {
      const IC = CATALOG.calico.inputCards;
      const SLOT11 = CATALOG.calico.slotRules.slot11AllowedWhenSlot12;
      const inp = input.inputs;

      // v25.100.1 guard: SDI/HDBaseT/IP ALWAYS need cards even when total fits
      // native 8. Audio also needs a card. Bail only when truly nothing to pick.
      const nonHdmiInputs = (inp.sdi12g || 0) + (inp.sdi3g || 0) + (inp.hdbt || 0) + (inp.ip || 0);
      const audioGuard = !!input.audio;
      if (extraInputsNeeded <= 0 && nonHdmiInputs <= 0 && !audioGuard) {
        return { picks: [], unfittable: [] };
      }

      // Build cardsNeeded list — verbatim v25.80 per-signal logic.
      const cardsNeeded = []; // { key, ports, hbOnly?, lbOnly?, _placed? }

      const hdmiTotal = (inp.hdmi4k || 0) + (inp.hdmiFhd || 0);
      const NATIVE_HDMI = 8;
      const hdmiOverflow = Math.max(0, hdmiTotal - NATIVE_HDMI);
      if (hdmiOverflow > 0) {
        let remaining = hdmiOverflow;
        if (remaining >= 4) {
          cardsNeeded.push({ key: 'HDMI_4K_4IN', ports: 4, hbOnly: true });
          remaining -= 4;
        }
        while (remaining > 0) {
          cardsNeeded.push({ key: 'HDMI_4K_2IN', ports: 2, hbOnly: false });
          remaining -= 2;
        }
      }
      if ((inp.sdi12g || 0) > 0) {
        let r = inp.sdi12g;
        while (r > 0) { cardsNeeded.push({ key: 'SDI_12G_4IN', ports: 4, hbOnly: true }); r -= 4; }
      }
      if ((inp.sdi3g || 0) > 0) {
        let r = inp.sdi3g;
        while (r > 0) { cardsNeeded.push({ key: 'SDI_3G_4IN', ports: 4, hbOnly: false }); r -= 4; }
      }
      if ((inp.hdbt || 0) > 0) {
        let r = inp.hdbt;
        while (r > 0) { cardsNeeded.push({ key: 'HDBASET_2IN', ports: 2, hbOnly: false }); r -= 2; }
      }
      if ((inp.ip || 0) > 0) {
        let r = inp.ip;
        while (r > 0) { cardsNeeded.push({ key: 'MEDIA_4K_IN', ports: 1, hbOnly: false }); r -= 1; }
      }
      if (input.audio) {
        cardsNeeded.push({ key: 'AUDIO_2IN_4OUT', ports: 2, hbOnly: false, lbOnly: true });
      }

      if (cardsNeeded.length === 0) return { picks: [], unfittable: [] };

      // Pack into 2 slots: Slot 12 = HB, Slot 11 = LB.
      // Greedy: HB-only first, LB-only next, then flexibles respecting pairing.
      let slot12Key = null, slot11Key = null;
      for (let i = 0; i < cardsNeeded.length; i++) {
        const c = cardsNeeded[i];
        if (c.hbOnly && !slot12Key) { slot12Key = c.key; c._placed = true; break; }
      }
      for (let i = 0; i < cardsNeeded.length; i++) {
        const c = cardsNeeded[i];
        if (c.lbOnly && !c._placed && !slot11Key) { slot11Key = c.key; c._placed = true; break; }
      }
      const remaining = cardsNeeded.filter(c => !c._placed);
      for (let i = 0; i < remaining.length; i++) {
        const c = remaining[i];
        if (!slot12Key) { slot12Key = c.key; c._placed = true; }
        else if (!slot11Key) {
          const allowedInSlot11 = SLOT11[slot12Key] || [];
          if (allowedInSlot11.indexOf(c.key) >= 0) { slot11Key = c.key; c._placed = true; }
        }
      }

      const picks = [];
      const unfittable = [];
      if (slot12Key) picks.push({ card: IC[slot12Key], qty: 1, slot: 'HB (Slot 12)' });
      if (slot11Key) picks.push({ card: IC[slot11Key], qty: 1, slot: 'LB (Slot 11)' });
      cardsNeeded.forEach(c => { if (!c._placed) unfittable.push(c.key); });

      return { picks, unfittable };

        screens: (rawInput && rawInput.screens) || [],

      const PORT_CAP = CATALOG.constants.PORT_CAPACITY_4K60;
      const CHASSIS = CATALOG.calico.chassis;
      const OUT = CATALOG.calico.outputCards;

      const ledPixels = input.screens.reduce((a, s) => a + (s.pixels || 0), 0);
      const ledPorts = input.screens.reduce((a, s) => a + (s.ports || 0), 0);
      const rawLedPorts = ledPixels > 0 ? ledPixels / PORT_CAP : 0;
      const projPorts = input.outputs.projector || 0;

      const userWantsSDI = (input.outputs.sdi || 0) > 0;
      const sdiPortsNeeded = userWantsSDI ? input.outputs.sdi : 0;
      const displayPorts = input.outputs.display || 0;
      const hdmiPortsNeeded = ledPorts + projPorts + displayPorts;
      const portsNeeded = hdmiPortsNeeded + sdiPortsNeeded;

      const inputsNeeded = input.inputs.hdmi4k + input.inputs.hdmiFhd +
                           input.inputs.sdi12g + input.inputs.sdi3g +
                           input.inputs.hdbt + input.inputs.ip;

      const projPixelsPerUnit = input.outputs.projectorRes === '4K' ? PORT_CAP : (1920 * 1080);
      const totalPixelsProcessed = ledPixels + (projPorts * projPixelsPerUnit);

      const reasons = [];
      const concerns = [];
      const valueAdds = [];
      let chassis;
      let outputCardInfeasible = false;

      // CHASSIS CASCADE (v25.99.33 logic verbatim — 1U eligible only when EVERY input is HDMI)
      const needsInputCardSlots = (input.inputs.sdi12g + input.inputs.sdi3g +
                                   input.inputs.hdbt + input.inputs.ip) > 0;
      const audioInChassis = input.audio;
      if (!userWantsSDI && !needsInputCardSlots && !audioInChassis
          && hdmiPortsNeeded <= 2 && inputsNeeded <= 6) {
        chassis = 'C7-PRO-1200';
        reasons.push('HDMI output ports: ' + hdmiPortsNeeded + ' — fits C7-PRO-1200 (2 ports native)');
        reasons.push('Inputs: ' + inputsNeeded + ' (all HDMI) — fits C7-PRO-1200 (6 inputs native)');
      } else {
        chassis = 'C7-PRO-2200';
        if (userWantsSDI) reasons.push('SDI output required — C7-PRO-2200 (1U does not support SDI)');
        if (needsInputCardSlots) reasons.push('Non-HDMI inputs (SDI / HDBaseT / IP) require expansion cards — C7-PRO-2200 (1U fixed chassis has no input slots)');
        if (audioInChassis) reasons.push('Audio input card required — C7-PRO-2200 (only the 2U chassis has the input slot for it)');
        if (!userWantsSDI && hdmiPortsNeeded <= 4 && inputsNeeded <= 8) {
          reasons.push('HDMI outputs: ' + hdmiPortsNeeded + ', Inputs: ' + inputsNeeded + ' — fit C7-PRO-2200 native');
        }
        if (hdmiPortsNeeded > 4) reasons.push('HDMI outputs: ' + hdmiPortsNeeded + ' — exceeds native 4, output card required');
        if (inputsNeeded > 8) reasons.push('Inputs: ' + inputsNeeded + ' — exceeds native 8, input card required');
      }

      const model = CHASSIS[chassis];
      const cards = [];

      if (chassis === 'C7-PRO-2200') {
        const nativeHdmi = model.maxPortsNative; // 4

        // OUTPUT CARD SELECTION — Slot 10 holds exactly ONE card
        if (userWantsSDI && hdmiPortsNeeded > nativeHdmi) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — SDI output AND more than ' + nativeHdmi + ' HDMI outputs both requested. Slot 10 holds only ONE card (either SDI or HDMI expansion, not both). Requested: ' + hdmiPortsNeeded + ' HDMI + ' + sdiPortsNeeded + ' SDI. Multi-unit scenario required.');
        } else if (userWantsSDI && sdiPortsNeeded > 4) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — ' + sdiPortsNeeded + ' SDI outputs requested, but SDI_12G 4-OUT card provides max 4 ports. Multi-unit scenario required.');
        } else if (!userWantsSDI && hdmiPortsNeeded > 12) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — ' + hdmiPortsNeeded + ' HDMI outputs requested, but single C7-PRO-2200 maxes at 12 (native 4 × 4K + card 8 × FHD). Multi-unit scenario required.');
        } else if (!userWantsSDI && hdmiPortsNeeded > 8 && hdmiPortsNeeded <= 12) {
          cards.push({
            sku: OUT.HDMI_2K_8OUT.sku, description: OUT.HDMI_2K_8OUT.desc, qty: 1,
            notes: 'Adds 8 × FHD HDMI ports (native 4 × 4K HDMI remain). Used because 4K expansion card maxes at 8 total ports.',
            role: 'output_card'
          });
          reasons.push(hdmiPortsNeeded + ' HDMI outputs → HDMI_2K 8-OUT card (native 4 × 4K + card 8 × FHD = 12 HDMI ports total)');
          concerns.push('Port mix: 4 outputs available at 4K (native HDMI) and 8 outputs at FHD (via HDMI_2K 8-OUT card). Map displays to 4K vs FHD paths during BOM review.');
        } else if (!userWantsSDI && hdmiPortsNeeded > nativeHdmi) {
          cards.push({
            sku: OUT.HDMI_4K_4OUT.sku, description: OUT.HDMI_4K_4OUT.desc, qty: 1,
            notes: 'Adds 4 × 4K HDMI ports (native 4 + card 4 = 8 × 4K HDMI total)',
            role: 'output_card'
          });
          reasons.push(hdmiPortsNeeded + ' HDMI outputs → HDMI_4K 4-OUT card (native 4 + card 4 = 8 × 4K HDMI)');
        } else if (userWantsSDI && sdiPortsNeeded > 0 && sdiPortsNeeded <= 4) {
          cards.push({
            sku: OUT.SDI_12G_4OUT.sku, description: OUT.SDI_12G_4OUT.desc, qty: 1,
            notes: 'Adds 4 × 4K SDI ports (' + sdiPortsNeeded + ' needed). Native 4 × 4K HDMI outputs remain available.',
            role: 'output_card'
          });
          reasons.push(sdiPortsNeeded + ' SDI output(s) → SDI_12G 4-OUT card');
          if (hdmiPortsNeeded > 0) reasons.push(hdmiPortsNeeded + ' HDMI output(s) use native 4 × 4K HDMI ports (no HDMI expansion card needed)');
        }
        // HDMI ≤ 4 with no SDI → no output card (chassis only handles it)

        // INPUT CARD SELECTION
        const extraIn = Math.max(0, inputsNeeded - model.inputs);
        const audioNeeded = input.audio;
        const hasNonHdmi = needsInputCardSlots;
        const shouldPickCards = extraIn > 0 || audioNeeded || hasNonHdmi;

        if (shouldPickCards) {
          const result = _pickCalicoInputCards(extraIn, input);
          const inputCards = result.picks;
          const unfittable = result.unfittable;
          inputCards.forEach(ic => {
            cards.push({
              sku: ic.card.sku, description: ic.card.desc, qty: ic.qty,
              notes: 'Input expansion — adds ' + (ic.qty * ic.card.ports) + ' × ' + ic.card.resolution + ' ' + ic.card.signal + ' port(s) [' + ic.slot + ']',
              role: 'input_card'
            });
          });
          if (inputCards.length > 0) {
            reasons.push(inputCards.map(ic => ic.qty + '× ' + ic.card.sku + ' ' + ic.slot).join(' + '));
          }
          if (unfittable.length > 0) {
            outputCardInfeasible = true;
            concerns.push('⚠ NOT POSSIBLE in single chassis — ' + unfittable.length + ' card(s) cannot fit in remaining slots: ' + unfittable.join(', ') + '. Slot constraints (HB-only, LB-only, or cross-slot pairing rules) prevent fit. Multi-chassis scenario required.');
          }
        } else if (inputsNeeded > 0 && inputsNeeded <= model.inputs && (input.inputs.hdmiFhd || 0) > 0) {
          // VALUE-ADD: Inputs fit native AND user asked for FHD → promote to 4K free.
          const fhdCount = input.inputs.hdmiFhd;
          const k4Count = input.inputs.hdmi4k || 0;
          valueAdds.push({
            title: 'Free upgrade: ' + fhdCount + ' × FHD inputs promoted to 4K',
            body: 'Your requirement lists ' + k4Count + ' × 4K + ' + fhdCount + ' × FHD inputs. All ' + inputsNeeded + ' inputs fit within the C7-PRO-2200\'s 8 native 4K-capable inputs — so we deliver all ' + inputsNeeded + ' as 4K at no additional cost. No FHD input card required, and the customer gets full 4K capability across every source.'
          });
        }
        if (inputsNeeded > 16) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — ' + inputsNeeded + ' inputs requested exceed single-chassis max of 16. Multi-unit scenario required.');
        }

        // Defensive BoM-completeness check (v25.99.37 — never silently ship
        // unwireable BoM when non-HDMI inputs lack a matching input card).
        const nonHdmiIn = input.inputs.sdi12g + input.inputs.sdi3g +
                          input.inputs.hdbt + input.inputs.ip;
        const inCardCount = cards.filter(c => c.role === 'input_card').length;
        if (nonHdmiIn > 0 && inCardCount === 0) {
          concerns.push('⚠ INPUT CARD MISSING — the configuration includes ' + nonHdmiIn + ' non-HDMI input(s) (SDI / HDBaseT / IP) but no input-expansion card is in the BoM. The C7-PRO-2200 native inputs are HDMI-only — these sources cannot connect without the matching input card. Re-check the input configuration.');
        }
      }

      if (projPorts > 0) {
        const mode = projPorts > 1 ? 'edge blend' : 'standalone';
        reasons.push(projPorts + '× ' + input.outputs.projectorRes + ' projector' +
                     (projPorts > 1 ? 's' : '') + ' (' + mode + ') — 1 port per projector');
      }

      return {
        chassis,
        cards,
        concerns,
        valueAdds,
        reasons,
        meta: {
          // v27.1.2 #4b — chassisLabel guaranteed (was missing on CALICO path,
          // caused duplicate-SKU display in renderBomCard). Built from CATALOG
          // entry: form-factor + native inputs/outputs gives a useful one-liner.
          chassisLabel: (CHASSIS[chassis] && CHASSIS[chassis].model) || chassis,
          // v27.1.2 #4b — io summary for the new I/O spec line in BoM card.
          // renderBomCard formats this via HUMAN_LABELS into prose like
          // "4 inputs (2× HDMI 4K, 2× HDMI FHD) · 1 output (HDMI)".
          io: {
            inputs:  Object.assign({}, input.inputs),
            outputs: (function() {
              // Strip projectorRes (non-count) before copying so the summary
              // doesn't try to format it as a qty.
              const o = Object.assign({}, input.outputs);
              delete o.projectorRes;
              delete o.led;     // boolean, not a port count for v27.1.1 shape
              return o;
            })()
          },
          model: model.model, formFactor: model.formFactor,
          ledPixels, ledPorts, rawLedPorts, projPorts,
          hdmiPortsNeeded, sdiPortsNeeded, portsNeeded,
          totalPixelsProcessed, inputsNeeded,
          hasCards: cards.length > 0,
          outputCardInfeasible
        }
      };
    }

    return Object.freeze({
      calico: recommendCalico,
      mv: recommendMv,
      corio: recommendCorio
    });

    /* ---------- MV (CORIOview) ---------- */

    // Pure-function port of v26 recommendMWP (L10807).
    // Soft issues → concerns. Hard impossibilities (signal not in catalog,
    // too many cards for MTO) → returned as { error, chassis: null, cards: [] }
    // per SPEC §2.3.
    function recommendMv(rawInput) {
      const input = {
        inputs: Array.isArray(rawInput && rawInput.inputs) ? rawInput.inputs : [],
        outputSignal: (rawInput && rawInput.outputSignal) || ''
      };

      const CHASSIS = CATALOG.mv.chassis;
      const INPUT_MODS = CATALOG.mv.inputModules;
      const OUTPUT_MODS = CATALOG.mv.outputModules;
      const MTO = CHASSIS['MWP-MTO'];

      // Normalize: filter to entries with valid signal + qty>0
      const validInputs = input.inputs.filter(r => r && r.signal && Number(r.qty) > 0);

      if (validInputs.length === 0 || !input.outputSignal) {
        return {
          chassis: null, cards: [], concerns: [], valueAdds: [],
          reasons: [],
          meta: { type: 'empty', kind: validInputs.length === 0 ? 'no-inputs' : 'no-output' },
          error: validInputs.length === 0 ? 'No input rows provided.' : 'No output signal selected.'
        };
      }

      const reasons = [];
      const concerns = [];
      const valueAdds = [];

      // v27.1.2 #4b — build a uniform meta.io shape so renderBomCard can
      // format the I/O spec line consistently across MV / CALICO / CORIO.
      // For MV: inputs is keyed by signal label (already human-readable);
      // outputs is { [outputSignal]: 1 }.
      function _buildMvIo() {
        const ins = {};
        validInputs.forEach(function(r) {
          ins[r.signal] = (ins[r.signal] || 0) + (Number(r.qty) || 0);
        });
        const outs = {};
        if (input.outputSignal) outs[input.outputSignal] = 1;
        return { inputs: ins, outputs: outs };
      }

      // alpha.9.2: Rule A — Multi Viewer caps at 2 distinct signal types.
      // Defense in depth; the wizard UI also enforces this at the row level.
      // Fires before the downstream card-count guard (MTO.maxInputCards) so the
      // rep sees a spec-level message ("max 2 distinct") rather than a hardware
      // message ("needs 4 cards but supports 2").
      const MV_DISTINCT_CAP = 2;
      const distinctSigs = new Set(validInputs.map(r => r.signal)).size;
      if (distinctSigs > MV_DISTINCT_CAP) {
        return {
          chassis: null, cards: [], concerns, valueAdds, reasons,
          meta: { type: 'error' },
          error: 'Multi Viewer supports max ' + MV_DISTINCT_CAP + ' distinct signal types. Requested: ' + distinctSigs + '. Remove rows or change signal types to reduce to ' + MV_DISTINCT_CAP + ' distinct.'
        };
      }

      // Step 1: SINGLE-signal path — try a fixed preset (only possible when output is 4K HDMI).
      if (validInputs.length === 1) {
        const single = validInputs[0];
        const sig = single.signal;
        const qty = Number(single.qty) || 0;

        if (input.outputSignal === '4K HDMI') {
          // Iterate fixed-chassis entries in catalog order, find ones matching signal & capacity.
          const candidates = [];
          Object.keys(CHASSIS).forEach(sku => {
            const c = CHASSIS[sku];
            if (c.fixedChassis && c.inSignal === sig && c.inPorts >= qty) {
              candidates.push(c);
            }
          });
          if (candidates.length > 0) {
            candidates.sort((a, b) => a.inPorts - b.inPorts);
            const chosen = candidates[0];
            reasons.push('Single-signal ' + qty + '× ' + sig + ' → ' + chosen.sku + ' (' + chosen.inPorts + '-port preset)');
            return {
              chassis: chosen.sku,
              cards: [],
              concerns,
              valueAdds,
              reasons,
              meta: {
                type: 'fixed', chassisLabel: chosen.desc,
                io: _buildMvIo(),
                inputSignal: sig, outputSignal: input.outputSignal, inputCount: qty
              }
            };
          }
        }

        // Step 2: single-signal MTO fallback
        const inputCard = INPUT_MODS[sig];
        const outputCard = OUTPUT_MODS[input.outputSignal];
        if (!inputCard) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'Input signal "' + sig + '" not supported in current catalog.'
          };
        }
        if (!outputCard) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'Output signal "' + input.outputSignal + '" not supported in current catalog.'
          };
        }
        const cardsNeeded = Math.ceil(qty / inputCard.portsPerCard);
        if (cardsNeeded > MTO.maxInputCards) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'This configuration needs ' + cardsNeeded + ' input cards but MWP-MTO supports max ' + MTO.maxInputCards + '. Contact tvONE for a custom build.'
          };
        }

        // Preserve PLACEHOLDER warning as a concern if the output card is flagged.
        if (outputCard.placeholder) {
          concerns.push('Output module ' + outputCard.sku + ' is a PLACEHOLDER SKU; awaiting tvONE confirmation.');
        }

        reasons.push('No fixed preset matches — MTO build: ' + cardsNeeded + '× ' + inputCard.sku + ' + 1× ' + outputCard.sku);
        return {
          chassis: 'MWP-MTO',
          cards: [
            { sku: inputCard.sku,  description: inputCard.desc,  qty: cardsNeeded, role: 'input_card',  inputSignal: sig },
            { sku: outputCard.sku, description: outputCard.desc, qty: 1,           role: 'output_card', outputSignal: input.outputSignal }
          ],
          concerns,
          valueAdds,
          reasons,
          meta: {
            type: 'mto', chassisLabel: MTO.desc,
            io: _buildMvIo(),
            inputSignal: sig, outputSignal: input.outputSignal, inputCount: qty
          }
        };
      }

      // Step 3: MIXED-input MTO path — always MWP-MTO with one card per signal type.
      const outputCard = OUTPUT_MODS[input.outputSignal];
      if (!outputCard) {
        return {
          chassis: null, cards: [], concerns, valueAdds, reasons,
          meta: { type: 'error' },
          error: 'Output signal "' + input.outputSignal + '" not supported in current catalog.'
        };
      }

      const cardLines = [];
      let totalCards = 0;
      const signalLabels = [];
      let totalPorts = 0;
      for (let i = 0; i < validInputs.length; i++) {
        const row = validInputs[i];
        const sig = row.signal;
        const qty = Number(row.qty) || 0;
        const inputCard = INPUT_MODS[sig];
        if (!inputCard) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'Input signal "' + sig + '" not supported in current catalog.'
          };
        }
        const cardsNeeded = Math.ceil(qty / inputCard.portsPerCard);
        cardLines.push({
          sku: inputCard.sku, description: inputCard.desc, qty: cardsNeeded,
          role: 'input_card', inputSignal: sig
        });
        totalCards += cardsNeeded;
        signalLabels.push(qty + '× ' + sig);
        totalPorts += qty;
      }

      if (totalCards > MTO.maxInputCards) {
        return {
          chassis: null, cards: [], concerns, valueAdds, reasons,
          meta: { type: 'error' },
          error: 'Mixed-input build needs ' + totalCards + ' input cards but MWP-MTO supports max ' + MTO.maxInputCards + '. Reduce signal-type count or quantities. Contact tvONE for higher-density custom builds.'
        };
      }

      if (outputCard.placeholder) {
        concerns.push('Output module ' + outputCard.sku + ' is a PLACEHOLDER SKU; awaiting tvONE confirmation.');
      }

      const summarySignals = signalLabels.join(' + ');
      reasons.push('Mixed inputs (' + summarySignals + ') → MWP-MTO + ' + cardLines.length + ' input card(s) + 1× ' + outputCard.sku);

      return {
        chassis: 'MWP-MTO',
        cards: cardLines.concat([
          { sku: outputCard.sku, description: outputCard.desc, qty: 1, role: 'output_card', outputSignal: input.outputSignal }
        ]),
        concerns,
        valueAdds,
        reasons,
        meta: {
          type: 'mto-mixed', chassisLabel: MTO.desc + ' \u00b7 mixed input (' + summarySignals + ')',
          io: _buildMvIo(),
          inputSignal: summarySignals, outputSignal: input.outputSignal, inputCount: totalPorts
        }
      };
    }

    /* ---------- CORIO ---------- */

    // Pure-function port of v26 _corioAutoSelectChassis (L4341).
    // Returns chassis SKU based on signal mix.
    function _corioAutoSelectChassis(inputCounts, outputCounts) {
      const has4K = (Number(inputCounts['HDMI 4K'] || 0) > 0)
                 || (Number(inputCounts['HDMI 4K 2-in'] || 0) > 0)
                 || (Number(inputCounts['HDMI 4K 4-in'] || 0) > 0)
                 || (Number(inputCounts['SDI 12G'] || 0) > 0)
                 || (Number(outputCounts['HDMI 4K'] || 0) > 0)
                 || (Number(outputCounts['HDMI 4K 1-out'] || 0) > 0)
                 || (Number(outputCounts['HDMI 4K 2-out'] || 0) > 0)
                 || (Number(outputCounts['SDI 12G'] || 0) > 0);
      if (has4K) return 'CM2-547-MK2';
      let estSlots = 0;
      Object.keys(inputCounts).forEach(k => {
        const q = Number(inputCounts[k] || 0);
        if (q > 0) estSlots += Math.ceil(q / 2);
      });
      Object.keys(outputCounts).forEach(k => {
        const q = Number(outputCounts[k] || 0);
        if (q > 0) estSlots += Math.ceil(q / 2);
      });
      return (estSlots <= 3) ? 'C3-503' : 'C3-510';
    }

    // Pure-function port of v26 recommendCORIO (L11463) + auto-select combined.
    // Caller can override chassis via rawInput.chassisSku; otherwise auto-selected.
    function recommendCorio(rawInput) {
      const input = {
        inputs: (rawInput && rawInput.inputs) || {},
        outputs: (rawInput && rawInput.outputs) || {},
        audio: (rawInput && rawInput.audio) || null,             // '2-4' | '8-8' | null
        psuChoice: (rawInput && rawInput.psuChoice) || '400',     // '400' | '700' | '400+redundant' | ...
        fanFilter: !!(rawInput && rawInput.fanFilter),
        autoBlank: (rawInput && rawInput.autoBlank !== false),    // default true
        chassisSku: (rawInput && rawInput.chassisSku) || null
      };

      const CHASSIS = CATALOG.corio.chassis;
      const ACC = CATALOG.corio.accessories;
      const PSUS = CATALOG.corio.psu;

      // Resolve chassis: explicit override or auto-select.
      const chassisSku = input.chassisSku || _corioAutoSelectChassis(input.inputs, input.outputs);
      const chassis = CHASSIS[chassisSku];
      if (!chassis) {
        return {
          chassis: null, cards: [], concerns: [], valueAdds: [], reasons: [],
          meta: { type: 'error' },
          error: 'Unknown chassis: ' + chassisSku
        };
      }

      const moduleSet = (chassis.cardEcosystem === 'CM2') ? CATALOG.corio.cm2 : CATALOG.corio.cm;
      const cards = [];
      const concerns = [];
      const valueAdds = [];
      const reasons = [];
      let slotsInputUsed = 0, slotsOutputUsed = 0;

      reasons.push('Auto-selected ' + chassis.label + ' (' + chassis.sku + ') based on signal mix');

      // Input cards
      for (let i = 0; i < moduleSet.inputs.length; i++) {
        const card = moduleSet.inputs[i];
        const qty = Number(input.inputs[card.key] || 0);
        if (qty <= 0) continue;
        let portsRequired = qty;
        // C3-510 has 2 fixed DVI-U input ports built-in — subtract them only for DVI-U
        if (chassis.fixedInput && card.key === chassis.fixedInput.signal) {
          portsRequired = Math.max(0, qty - chassis.fixedInput.ports);
        }
        if (portsRequired <= 0) {
          reasons.push(qty + '× ' + card.key + ' absorbed by chassis fixed input — no card needed');
          continue;
        }
        const cardsNeeded = Math.ceil(portsRequired / card.ports);
        cards.push({
          sku: card.sku, qty: cardsNeeded,
          description: card.desc + ' (' + qty + ' port' + (qty === 1 ? '' : 's') + ' requested)',
          role: 'input_card', inputSignal: card.key,
          meta: { portsPerCard: card.ports, portsRequested: qty, portsAfterFixed: portsRequired }
        });
        slotsInputUsed += cardsNeeded;
      }

      // Output cards
      for (let i = 0; i < moduleSet.outputs.length; i++) {
        const card = moduleSet.outputs[i];
        const qty = Number(input.outputs[card.key] || 0);
        if (qty <= 0) continue;
        const cardsNeeded = Math.ceil(qty / card.ports);
        cards.push({
          sku: card.sku, qty: cardsNeeded,
          description: card.desc + ' (' + qty + ' port' + (qty === 1 ? '' : 's') + ' requested)',
          role: 'output_card', outputSignal: card.key,
          meta: { portsPerCard: card.ports, portsRequested: qty }
        });
        slotsOutputUsed += cardsNeeded;
      }

      // Audio module
      if (input.audio === '2-4' && moduleSet.audio['2-4']) {
        cards.push({
          sku: moduleSet.audio['2-4'].sku, qty: 1,
          description: moduleSet.audio['2-4'].desc,
          role: 'audio_card'
        });
        slotsInputUsed += 1;
      } else if (input.audio === '8-8') {
        if (moduleSet.audio['8-8']) {
          cards.push({
            sku: moduleSet.audio['8-8'].sku, qty: 1,
            description: moduleSet.audio['8-8'].desc,
            role: 'audio_card'
          });
          slotsInputUsed += 1;
        } else {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error', attemptedChassis: chassis.sku },
            error: '8-IN / 8-OUT audio module only available on CORIOmaster Micro/Mini. CM2 supports 2-IN/3-OUT only.'
          };
        }
      }

      // Slot validation (hard math)
      const totalSlotsUsed = slotsInputUsed + slotsOutputUsed;
      if (chassis.slotsAreFlex) {
        if (totalSlotsUsed > chassis.slots) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error', attemptedChassis: chassis.sku, slotsUsed: totalSlotsUsed, slotsTotal: chassis.slots },
            error: 'Configuration needs ' + totalSlotsUsed + ' slots but ' + chassis.label + ' has only ' + chassis.slots + ' slots. Reduce the input/output count or pick a larger chassis.'
          };
        }
      } else {
        // CM2: input vs output split with 1 flex overflow slot.
        const inputCap = (chassis.slotsInputOnly + chassis.slotsInputHb);  // 8 for CM2
        const outputCap = chassis.slotsOutput;                              // 7 for CM2
        const flexCap = chassis.slotsFlex;                                  // 1 for CM2
        const inputOver = Math.max(0, slotsInputUsed - inputCap);
        const outputOver = Math.max(0, slotsOutputUsed - outputCap);
        const flexUsed = inputOver + outputOver;
        if (flexUsed > flexCap) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error', attemptedChassis: chassis.sku, slotsInputUsed, slotsOutputUsed },
            error: 'Configuration needs ' + slotsInputUsed + ' input slot(s) + ' + slotsOutputUsed + ' output slot(s) — exceeds CM2 capacity (max 8 input + 7 output + 1 flex). Reduce cards or split into multiple chassis.'
          };
        }
      }

      // CPU module (auto-include)
      cards.push({
        sku: chassis.cpuModule, qty: 1,
        description: 'HTTPS CPU module for ' + chassis.label,
        role: 'accessory'
      });

      // PSU
      if (chassis.psuRequired) {
        const is700 = String(input.psuChoice).indexOf('700') === 0;
        const psu = is700 ? PSUS['700'] : PSUS['400'];
        cards.push({
          sku: psu.sku, qty: 1,
          description: psu.desc + ' (chassis PSU)',
          role: 'accessory'
        });
        if (String(input.psuChoice).indexOf('redundant') !== -1) {
          cards.push({
            sku: psu.sku, qty: 1,
            description: psu.desc + ' (redundant)',
            role: 'accessory'
          });
        }
      }

      // Fan filter (optional, customer-requested)
      if (input.fanFilter) {
        const filter = ACC['CM2-Filter'];
        cards.push({
          sku: filter.sku, qty: 1,
          description: filter.desc,
          role: 'accessory'
        });
      }

      // CM-BLANK auto-fill for Micro/Mini if enabled
      if (input.autoBlank && (chassis.sku === 'C3-503' || chassis.sku === 'C3-510')) {
        const unfilled = chassis.slots - totalSlotsUsed;
        if (unfilled > 0) {
          const blank = ACC['CM-BLANK'];
          cards.push({
            sku: blank.sku, qty: unfilled,
            description: blank.desc + (unfilled === 1 ? '' : 's'),
            role: 'accessory'
          });
        }
      }

      return {
        chassis: chassis.sku,
        cards,
        concerns,
        valueAdds,
        reasons,
        meta: {
          type: 'ok',
          chassisLabel: chassis.label,
          // v27.1.2 #4b — io summary for the BoM I/O spec line.
          io: {
            inputs:  Object.assign({}, input.inputs),
            outputs: Object.assign({}, input.outputs)
          },
          ecosystem: chassis.cardEcosystem,
          slotsUsed: totalSlotsUsed,
          slotsTotal: chassis.slots,
          slotsInputUsed,
          slotsOutputUsed
        }
      };
    }

    // sha256(text) → lowercase hex string. Uses WebCrypto SubtleCrypto.
    async function sha256Hex(text) {
      const enc = new TextEncoder().encode(String(text));
      const buf = await crypto.subtle.digest('SHA-256', enc);
      const arr = new Uint8Array(buf);
      let s = '';
      for (let i = 0; i < arr.length; i++) s += arr[i].toString(16).padStart(2, '0');
      return s;

    function randomHex(bytes) {
      const arr = new Uint8Array(bytes);
      crypto.getRandomValues(arr);

      for (let i = 0; i < arr.length; i++) s += arr[i].toString(16).padStart(2, '0');

      const arr = new Uint8Array(n * 2);   // overdraw, modulo bias is acceptable for ref IDs

      if (text) {
