    // Family label helper used in saved-deal Solution section.
    function familyLabel(t) {
      if (t === 'calico') return 'CALICO \u2014 Video Processor';
      if (t === 'mv')     return 'Multi Viewer (CORIOview)';
      if (t === 'corio')  return 'CORIO \u2014 Video Processor';
      return '\u2014';
    }

    // Count non-zero values in a simple object (used for I/O field counts).
    function countNonZero(obj) {
      if (!obj || typeof obj !== 'object') return 0;
      return Object.values(obj).filter(v => Number(v) > 0).length;
    }

    // Compact I/O preview/edit per family. Mirrors wizard step 3 structure.
    // alpha.7.3: CALICO becomes editable steppers + audio toggle; MV/CORIO
    // stay read-only with hint (cosmetic-session backlog).
    function renderSavedDealIoSection(deal) {
      if (!deal || !deal.solutionType) {
        return '<div class="sd-row sd-row-muted">No solution type set.</div>';
      }
      const row = function(k, v) {
        const val = (v == null || v === '') ? '\u2014' : String(v);
        return '<div class="sd-row">' +
            '<div class="sd-row-k">' + esc(k) + '</div>' +
            '<div class="sd-row-v">' + esc(val) + '</div>' +
          '</div>';
      };
      if (deal.solutionType === 'calico') {
        // Defensive: ensure objects exist so steppers don't NaN.
        if (!deal.calico_inputs)  deal.calico_inputs  = { hdmi4k:0, hdmiFhd:0, sdi12g:0, sdi3g:0, hdbt:0, ip:0 };
        if (!deal.calico_outputs) deal.calico_outputs = { display:0, projector:0, sdi:0 };
        const i = deal.calico_inputs;
        const o = deal.calico_outputs;
        return '<div class="sd-subhead">Inputs</div>' +
          sdStepperRow('hdmi4k',  'HDMI 4K60', '4K60 4:4:4 sources',    i.hdmi4k,  { namespace:'calico_inputs' }) +
          sdStepperRow('hdmiFhd', 'HDMI FHD',  '1080p sources',         i.hdmiFhd, { namespace:'calico_inputs' }) +
          sdStepperRow('sdi12g',  'SDI 12G',   '12G-SDI sources',       i.sdi12g,  { namespace:'calico_inputs' }) +
          sdStepperRow('sdi3g',   'SDI 3G',    '3G-SDI sources',        i.sdi3g,   { namespace:'calico_inputs' }) +
          sdStepperRow('hdbt',    'HDBaseT',   'HDBT-extended sources', i.hdbt,    { namespace:'calico_inputs' }) +
          sdStepperRow('ip',      'IP / NDI',  'IP-streamed sources',   i.ip,      { namespace:'calico_inputs' }) +
          '<div class="sd-subhead">Outputs</div>' +
          sdStepperRow('display',   'Display (HDMI)',   'Standard displays', o.display,   { namespace:'calico_outputs' }) +
          sdStepperRow('projector', 'Projector (HDMI)', 'Projector outputs', o.projector, { namespace:'calico_outputs' }) +
          sdStepperRow('sdi',       'SDI output',       '12G-SDI outputs',   o.sdi,       { namespace:'calico_outputs' }) +
          '<div class="sd-subhead">Audio</div>' +
          sdToggleRow('calico_audio', 'Audio handling',
            'Embed/de-embed audio + AES67/Dante options', !!deal.calico_audio);
      }
      if (deal.solutionType === 'mv') {
        // Defensive: ensure mv_inputs is an array.
        if (!Array.isArray(deal.mv_inputs)) deal.mv_inputs = [];
        const MV_INPUT_SIGNALS  = Object.keys(CATALOG.mv.inputModules);
        const MV_OUTPUT_SIGNALS = Object.keys(CATALOG.mv.outputModules);

        // alpha.9.2: Rule A — max 2 distinct signal types (mirror of renderStep3Mv).
        // Same shape as the wizard: capReached disables "+ Add input" and filters
        // each row's signal dropdown to {distinctSet} ∪ {row.signal}.
        const MV_DISTINCT_CAP = 2;
        const distinctSet = new Set(
          deal.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
        );
        const capReached = distinctSet.size >= MV_DISTINCT_CAP;
        const capBanner = capReached
          ? '<div class="banner info" style="margin-top:8px"><strong>Cap reached:</strong> Multi Viewer supports a maximum of ' + MV_DISTINCT_CAP + ' distinct signal types. Remove a row or change its signal to add a different type.</div>'
          : '';

        const inputRowsHtml = deal.mv_inputs.length === 0
          ? '<div class="muted small" style="padding:8px 0">No input rows yet. Tap \u201c+ Add input\u201d below.</div>'
          : deal.mv_inputs.map((row, idx) =>
              '<div class="card" style="margin-bottom:8px">' +
                '<div class="row gap-2" style="flex-wrap:wrap">' +
                  '<select data-action="sd-mv-input-signal" data-idx="' + idx + '" style="flex:1;min-width:140px">' +
                    '<option value="">\u2014 signal \u2014</option>' +
                    MV_INPUT_SIGNALS
                      .filter(s => !capReached || distinctSet.has(s) || s === row.signal)
                      .map(s =>
                        '<option value="' + esc(s) + '"' +
                        (row.signal === s ? ' selected' : '') + '>' + esc(s) + '</option>'
                      ).join('') +
                  '</select>' +
                  '<div class="stepper">' +
                    '<button type="button" data-action="sd-mv-input-dec" data-idx="' + idx + '"' +
                      ((Number(row.qty) || 0) <= 0 ? ' disabled' : '') + '>\u2212</button>' +
                    '<input type="text" inputmode="numeric" value="' + (row.qty || 0) + '"' +
                      ' data-action="sd-mv-input-set" data-idx="' + idx + '" aria-label="qty">' +
                    '<button type="button" data-action="sd-mv-input-inc" data-idx="' + idx + '">+</button>' +
                  '</div>' +
                  '<button class="btn btn-text" type="button" data-action="sd-mv-input-remove" data-idx="' + idx + '"' +
                    ' aria-label="Remove" style="min-width:auto;padding:8px">\u00d7</button>' +
                '</div>' +
              '</div>'
            ).join('');
        const outputOptions = MV_OUTPUT_SIGNALS.map(s => ({ value: s, label: s }));
        return '<div class="sd-subhead">Inputs</div>' +
          inputRowsHtml +
          '<button class="btn btn-ghost btn-block" type="button" data-action="sd-mv-input-add"' + (capReached ? ' disabled' : '') + '>+ Add input</button>' +
          capBanner +
          '<div class="sd-subhead">Output signal</div>' +
          sdSelectField('mv_outputSignal', 'Output', deal.mv_outputSignal || '', outputOptions,
            { placeholder: '\u2014 select \u2014' }) +
          '<div class="sd-edit-note small soft">Edits set the Rebuild banner above. Tap <strong>Rebuild</strong> to recompute the BoM.</div>';
      }
      if (deal.solutionType === 'corio') {
        // Defensive: ensure objects exist so steppers don't NaN.
        if (!deal.corio_inputs)  deal.corio_inputs  = {};
        if (!deal.corio_outputs) deal.corio_outputs = {};
        const cm2In  = CATALOG.corio.cm2.inputs;
        const cm2Out = CATALOG.corio.cm2.outputs;
        // Use sdSelectField for corio_audio — it lands at top level (not in
        // SOFT_FIELDS), so the routing in the data-sd-bind handler calls
        // markStructuralDirty (no autosave).
        const audioOptions = [
          { value: '',    label: 'None' },
          { value: '2-4', label: '2-4 (analog + SPDIF)' },
          { value: '8-8', label: '8-8 (CM only \u00b7 8-IN / 8-OUT HD-44)' }
        ];
        return '<div class="sd-subhead">Inputs</div>' +
          cm2In.map(c =>
            sdStepperRow(c.key, c.key, c.desc, deal.corio_inputs[c.key] || 0, { namespace:'corio_inputs' })
          ).join('') +
          '<div class="sd-subhead">Outputs</div>' +
          cm2Out.map(c =>
            sdStepperRow(c.key, c.key, c.desc, deal.corio_outputs[c.key] || 0, { namespace:'corio_outputs' })
          ).join('') +
          '<div class="sd-subhead">Audio</div>' +
          sdSelectField('corio_audio', 'Audio module', deal.corio_audio || '', audioOptions) +
          (deal.corio_audio === '8-8'
            ? '<div class="help danger-text">8-8 module is CM-only \u2014 incompatible with CM2 / 4K chassis.</div>'
            : '') +
          '<div class="sd-subhead">Add-ons</div>' +
          sdToggleRow('corio_fanFilter', 'CM2 fan filter', 'Adds CM2-Filter line item', !!deal.corio_fanFilter);
      }
      return '<div class="sd-row sd-row-muted">Unknown solution type.</div>';
    }

    /* ============================================================
       VIEW: Wizard (6 steps)
       ============================================================ */

    function showWizard(stepNum) {
      showChrome(true);
      updateNavActive('#/quote/new');
      // v27.1.2 #2 + #6 — reset/preserve logic by hash shape:
      //   #/quote/new            → silent reset (fresh "New" tap, OQ 2A)
      //   #/quote/new/N          → deep-link into wizard, preserve in-memory state
      //   #/quote/edit/{ref}     → preserve hydrated state from sd-edit handler
      //   #/quote/edit/{ref}/N   → ditto, deep link mid-edit
      // OQ 2A locked: silent reset, no confirm prompt.
      const isFreshNew = (location.hash === '#/quote/new');
      if (isFreshNew) {
        clearDraft();             // wipes localStorage AND sets wizardData = defaultWizard()
      } else if (!wizardData) {
        wizardData = loadDraft();
      }
      wizardData.step = clamp(parseInt(stepNum, 10) || 1, 1, 6);
      wizardData.errors = {};
      // Auto-skip conditional steps if their flag is off
      if (wizardData.step === 4 && !wizardData.hasLed) wizardData.step = wizardData.hasSx ? 5 : 6;
      if (wizardData.step === 5 && !wizardData.hasSx) wizardData.step = 6;
      renderWizard();
    }

    // v27.1.3 F2 — Wrapper that re-renders the wizard while preserving the
    // current scroll position. Used at all in-step state mutation sites
    // (steppers, toggles, MV row add/remove). The bare renderWizard() does
    // setRoot(html) → wholesale innerHTML replace AND setRoot itself calls
    // window.scrollTo(0, 0) on every render (line ~4372). To preserve scroll
    // we must call scrollTo(0, y) SYNCHRONOUSLY after renderWizard returns
    // — same task, same paint frame — so the second scrollTo wins. A
    // requestAnimationFrame restore loses to setRoot's scrollTo on Chrome
    // Android because a paint can occur between the two scrolls.
    // Step-navigation handlers (wiz-jump, wiz-new, hydration mount) keep
    // calling renderWizard() directly — scroll-to-top is correct there.
    function rerenderPreservingScroll() {
      const y = window.scrollY || window.pageYOffset || 0;
      renderWizard();
      window.scrollTo(0, y);
    }

    function renderWizard() {
      const d = wizardData;
      const visibleSteps = computeVisibleSteps(d);
      setRoot(
        '<div class="v">' +
          renderWizStepper(d.step, visibleSteps) +
          '<div class="wiz-step-label">Step ' + d.step + ' of 6 \u00b7 ' + esc(STEP_TITLES[d.step]) + '</div>' +
          '<div class="h1">' + esc(STEP_TITLES[d.step]) + '</div>' +
          '<div id="wiz-step-body">' + renderStepBody(d) + '</div>' +
          renderWizActions(d) +
        '</div>'
      );
    }

    function computeVisibleSteps(d) {
      const v = [1, 2, 3];
      if (d.hasLed) v.push(4);
      if (d.hasSx)  v.push(5);
      v.push(6);
      return v;
    }

    function renderWizStepper(current, visible) {
      const dots = [1,2,3,4,5,6].map(n => {
        let cls = 'wiz-dot';
        if (n === current) cls += ' active';
        else if (n < current) cls += ' done';
        const opacity = visible.indexOf(n) >= 0 ? '1' : '0.3';
        return '<div class="' + cls + '" style="opacity:' + opacity + '"></div>';
      }).join('');
      return '<div class="wiz-stepper">' + dots + '</div>';
    }

    function renderStepBody(d) {
      switch (d.step) {
        case 1: return renderStep1(d);
        case 2: return renderStep2(d);
        case 3: return renderStep3(d);
        case 4: return renderStep4(d);
        case 5: return renderStep5(d);
        case 6: return renderStep6(d);
        default: return '';
      }
    }

    function renderWizActions(d) {
      const isLast = d.step === 6;
      const isFirst = d.step === 1;
      return '' +
        '<div class="wiz-actionbar">' +
          (isFirst
            ? '<button class="btn btn-text" type="button" data-action="wiz-cancel">Cancel</button>'
            : '<button class="btn btn-ghost" type="button" data-action="wiz-back">\u2190 Back</button>') +
          '<div class="grow"></div>' +
          (isLast
            ? (d.reco
                ? '<button class="btn btn-ghost" type="button" data-action="wiz-rebuild">Rebuild BoM</button>'
                : '<button class="btn" type="button" data-action="wiz-build">Build quote \u2192</button>')
            : '<button class="btn" type="button" data-action="wiz-next">Next \u2192</button>') +
        '</div>';
    }

    /* ---------- Step 1: Project context ---------- */

    function renderStep1(d) {
      function field(id, label, value, opts) {
        opts = opts || {};
        const type = opts.type || 'text';
        const placeholder = opts.placeholder || '';
        const inputmode = opts.inputmode ? ' inputmode="' + opts.inputmode + '"' : '';
        const maxlength = opts.maxlength ? ' maxlength="' + opts.maxlength + '"' : '';
        const required = opts.required ? ' required' : '';
        const listAttr = opts.list ? ' list="' + opts.list + '"' : '';
        const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + (opts.required ? ' *' : '') + '</label>' +
          '<input id="i-' + id + '" data-bind="' + id + '" type="' + type + '" ' +
            inputmode + maxlength + listAttr + ' value="' + esc(value || '') + '" ' +
            (placeholder ? 'placeholder="' + esc(placeholder) + '" ' : '') +
            required + '>' +
          helpHtml + errHtml +
        '</div>';
      }
      // v27.1.0 — Multiline variant of field(). Same closure (shares d),
      // same i- prefix, same data-bind delegation. textarea.value works
      // identically to input.value so the capture path is unchanged.
      function textareaField(id, label, value, opts) {
        opts = opts || {};
        const placeholder = opts.placeholder || '';
        const rows = opts.rows || 3;
        const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + '</label>' +
          '<textarea id="i-' + id + '" data-bind="' + id + '" rows="' + rows + '"' +
            (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '>' +
            esc(value || '') +
          '</textarea>' +
          helpHtml + errHtml +
        '</div>';
      }
      function selectField(id, label, value, options, opts) {
        opts = opts || {};
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        const optsHtml = (opts.placeholder ? '<option value="">' + esc(opts.placeholder) + '</option>' : '') +
          options.map(o => {
            const v = typeof o === 'string' ? o : o.value;
            const l = typeof o === 'string' ? o : o.label;
            return '<option value="' + esc(v) + '"' +
              (value === v ? ' selected' : '') + '>' + esc(l) + '</option>';
          }).join('');
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + (opts.required ? ' *' : '') + '</label>' +
          '<select id="i-' + id + '" data-bind="' + id + '"' +
            (opts.required ? ' required' : '') + '>' + optsHtml + '</select>' +
          errHtml +
        '</div>';
      }

      // v27.1.1 — Datalist for the City field (B5). Native mobile search,
      // works on Z Fold Chrome / Samsung Internet. Includes 'Other' fallback.
      const citiesDatalist = '<datalist id="cities-list">' +
        CITIES.map(function(c) {
          return '<option value="' + esc(c.city) + '"></option>';
        }).join('') +
      '</datalist>';

      return '' +
        '<form id="step1-form" autocomplete="off" novalidate>' +
          citiesDatalist +
          '<h3 class="h3">Project</h3>' +
          field('project',         'Project name', d.project,         { required: true, placeholder: 'e.g. Auditorium upgrade' }) +
          field('customer_name',   'End User',     d.customer_name,   { required: true }) +
          field('partner_name',    'Partner',      d.partner_name,    { required: true }) +
          field('consultant_name', 'Consultant',   d.consultant_name, { required: true }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Location</h3>' +
          selectField('venue_type', 'Venue type', d.venue_type, VENUE_TYPES, { placeholder: '\u2014 select \u2014', required: true }) +
          field('city',  'City',  d.city,  { required: true, list: 'cities-list', placeholder: 'Start typing\u2026' }) +
          field('state', 'State', d.state, { required: true, placeholder: 'Auto-fills from city; type if City = Other' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Stage &amp; owners</h3>' +
          selectField('stage', 'Stage', d.stage, STAGES, { required: true }) +
          selectField('lead_source', 'Lead Origin', d.lead_source, LEAD_SOURCES, { placeholder: '\u2014 select \u2014', required: true }) +
          selectField('sales_person_id',    'Sales person',    d.sales_person_id,    SALES_TEAM,    { placeholder: '\u2014 select \u2014', required: true }) +
          selectField('presales_person_id', 'Presales person', d.presales_person_id, PRESALES_TEAM, { placeholder: '\u2014 select \u2014', required: true }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Partner contact</h3>' +
          field('contact_name',  'Contact name',  d.contact_name,  { required: true, placeholder: 'Site / partner contact person' }) +
          field('contact_phone', 'Contact phone', d.contact_phone, { required: true, inputmode: 'numeric', maxlength: 10, help: '10-digit mobile (no country code, no spaces)' }) +
          field('contact_email', 'Contact email', d.contact_email, { required: true, type: 'email', placeholder: 'name@company.com' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Closure</h3>' +
          field('close_month', 'Expected closure', d.close_month, { required: true, type: 'month', help: 'Year-month, e.g. 2026-09' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Notes</h3>' +
          textareaField('internal_notes', 'Internal notes', d.internal_notes, { rows: 3, placeholder: 'Visible only to Cavitak team \u2014 not exported to Excel/PDF' }) +
          textareaField('external_notes', 'External notes', d.external_notes, { rows: 3, placeholder: 'Shown in Excel/PDF exports to customer/partner' }) +
        '</form>';
    }

    /* ---------- Step 2: Solution type ---------- */

    function renderStep2(d) {
      const tiles = [
        { id:'mv',     title:'Multi Viewer (CORIOview)',
          sub:'MWP-* \u2014 fixed presets or Made-To-Order, including mixed inputs' },
        { id:'calico', title:'Video Processor \u2014 CALICO',
          sub:'C7-PRO-1200 / C7-PRO-2200 + input/output cards' },
        { id:'corio',  title:'Video Processor \u2014 CORIO',
          sub:'C3-503 / C3-510 / CM2-547-MK2 + CM/CM2 cards' }
      ];
      const errHtml = d.errors.solutionType
        ? '<div class="banner err">' + esc(d.errors.solutionType) + '</div>'
        : '';
      return errHtml +
        '<div class="tile-group">' +
          tiles.map(t =>
            '<label class="tile" data-checked="' + (d.solutionType === t.id ? 'true' : 'false') + '"' +
              ' data-action="solution-pick" data-value="' + t.id + '">' +
              '<input type="radio" name="solutionType" value="' + t.id + '"' +
                (d.solutionType === t.id ? ' checked' : '') + '>' +
              '<div class="tile-title">' + esc(t.title) + '</div>' +
              '<div class="tile-sub">' + esc(t.sub) + '</div>' +
            '</label>'
          ).join('') +
        '</div>';
    }

    /* ---------- Step 3: Inputs & outputs ---------- */

    function stepperRow(key, name, sub, value, opts) {
      opts = opts || {};
      const min = opts.min != null ? opts.min : 0;
      const max = opts.max != null ? opts.max : 32;
      const ns = opts.namespace || '';
      return '<div class="step-row">' +
        '<div class="step-label">' +
          '<div class="name">' + esc(name) + '</div>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-action="step-dec" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            (value <= min ? ' disabled' : '') + '>\u2212</button>' +
          '<input type="text" inputmode="numeric" value="' + value + '"' +
            ' data-action="step-set" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            ' aria-label="' + esc(name) + ' count">' +
          '<button type="button" data-action="step-inc" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            (value >= max ? ' disabled' : '') + '>+</button>' +
        '</div>' +
      '</div>';
    }

    function toggleRow(key, name, sub, checked, opts) {
      opts = opts || {};
      const ns = opts.namespace || '';
      return '<label class="tile" style="margin-bottom:8px"' +
        ' data-checked="' + (checked ? 'true' : 'false') + '"' +
        ' data-action="toggle" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<div class="tile-title">' + esc(name) + '</div>' +
        (sub ? '<div class="tile-sub">' + esc(sub) + '</div>' : '') +
      '</label>';
    }

    function renderStep3(d) {
      if (!d.solutionType) {
        return '<div class="banner warn">Pick a solution type in Step 2 first.</div>';
      }
      if (d.solutionType === 'calico') return renderStep3Calico(d);
      if (d.solutionType === 'mv')     return renderStep3Mv(d);
      if (d.solutionType === 'corio')  return renderStep3Corio(d);
      return '';
    }

    function renderStep3Calico(d) {
      const inErr = d.errors.calico_io
        ? '<div class="banner err">' + esc(d.errors.calico_io) + '</div>' : '';
      // v27.1.2 #3+#5 — derive LED count from existing screens array length.
      // Stepper drives this via the new 'calico-led' action which resizes
      // d.screens in-place (preserving entries on shrink, pushing {w,h,pitch}
      // on grow) and toggles d.hasLed accordingly. This keeps hasLed and
      // screens as the canonical state (no defaultWizard shape break).
      const ledCount = (d.hasLed && Array.isArray(d.screens)) ? d.screens.length : 0;
      return inErr +
        '<h3 class="h3">Inputs</h3>' +
        '<div class="card">' +
          stepperRow('hdmi4k',  'HDMI 4K60', '4K60 4:4:4 sources',    d.calico_inputs.hdmi4k,  { namespace:'calico_inputs' }) +
          stepperRow('hdmiFhd', 'HDMI FHD',  '1080p sources',         d.calico_inputs.hdmiFhd, { namespace:'calico_inputs' }) +
          stepperRow('sdi12g',  'SDI 12G',   '12G-SDI sources',       d.calico_inputs.sdi12g,  { namespace:'calico_inputs' }) +
          stepperRow('sdi3g',   'SDI 3G',    '3G-SDI sources',        d.calico_inputs.sdi3g,   { namespace:'calico_inputs' }) +
          stepperRow('hdbt',    'HDBaseT',   'HDBT-extended sources', d.calico_inputs.hdbt,    { namespace:'calico_inputs' }) +
          stepperRow('ip',      'IP / NDI',  'IP-streamed sources',   d.calico_inputs.ip,      { namespace:'calico_inputs' }) +
        '</div>' +
        '<h3 class="h3">Outputs</h3>' +
        '<div class="card">' +
          stepperRow('display',   'Display (HDMI)',   'Standard displays', d.calico_outputs.display,   { namespace:'calico_outputs' }) +
          stepperRow('projector', 'Projector (HDMI)', 'Projector outputs', d.calico_outputs.projector, { namespace:'calico_outputs' }) +
          stepperRow('sdi',       'SDI output',       '12G-SDI outputs',   d.calico_outputs.sdi,       { namespace:'calico_outputs' }) +
          // v27.1.2 #3+#5 — LED relocated from Add-ons to Outputs as a qty stepper.
          // Special action 'calico-led' (not the generic stepper action) so we
          // can resize the screens array in lockstep. namespace omitted to mark
          // this as a synthetic field — not a direct binding.
          stepperRow('led',       'Active LED screens', 'Per-screen W/H/pitch lives in Step 4', ledCount, { namespace:'__calico_led' }) +
          (d.calico_outputs.projector > 0
            ? '<div class="field" style="margin-top:10px">' +
                '<label>Projector resolution</label>' +
                '<select data-bind="calico_outputs.projectorRes">' +
                  '<option value="FHD"' + (d.calico_outputs.projectorRes === 'FHD' ? ' selected' : '') + '>FHD</option>' +
                  '<option value="4K"'  + (d.calico_outputs.projectorRes === '4K'  ? ' selected' : '') + '>4K</option>' +
                '</select>' +
              '</div>'
            : '') +
          // v27.1.2 #3 — Audio relocated from Add-ons to Outputs.
          toggleRow('calico_audio', 'Audio required', 'Add audio extraction / embed cards', d.calico_audio, { namespace:'' }) +
        '</div>' +
        '<h3 class="h3">Add-ons</h3>' +
        '<div class="col">' +
          // v27.1.2 #3 — SX is the lone Add-on now and serves as flow-control
          // toggle for Step 5 (already wired via computeVisibleSteps / showWizard
          // auto-skip on hasSx).
          toggleRow('hasSx',        'Signal Extension needed',    'Configure HDMI / SDI / AP-536 / AVIP in Step 5', d.hasSx,        { namespace:'' }) +
        '</div>';
    }

    function renderStep3Mv(d) {
      const MV_INPUT_SIGNALS = Object.keys(CATALOG.mv.inputModules);
      const MV_OUTPUT_SIGNALS = Object.keys(CATALOG.mv.outputModules);

      // alpha.9.2: Rule A — max 2 distinct signal types (mirrors RECOMMEND.mv guard).
      // capReached disables "+ Add input" and filters each row's signal dropdown
      // to {already-chosen distinct signals} ∪ {this row's own signal}, so
      // existing rows can be retargeted but can't expand distinct count past 2.
      const MV_DISTINCT_CAP = 2;
      const distinctSet = new Set(
        d.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
      );
      const capReached = distinctSet.size >= MV_DISTINCT_CAP;
      const capBanner = capReached
        ? '<div class="banner info" style="margin-top:8px"><strong>Cap reached:</strong> Multi Viewer supports a maximum of ' + MV_DISTINCT_CAP + ' distinct signal types. Remove a row or change its signal to add a different type.</div>'
        : '';

      const inErr = d.errors.mv_io
        ? '<div class="banner err">' + esc(d.errors.mv_io) + '</div>' : '';

      const inputRowsHtml = d.mv_inputs.length === 0
        ? '<div class="muted small" style="padding:8px 0">No input rows yet. Tap \u201c+ Add input\u201d below.</div>'
        : d.mv_inputs.map((row, idx) =>
          '<div class="card" style="margin-bottom:8px">' +
            '<div class="row gap-2" style="flex-wrap:wrap">' +
              '<select data-action="mv-input-signal" data-idx="' + idx + '" style="flex:1;min-width:140px">' +
                '<option value="">\u2014 signal \u2014</option>' +
                MV_INPUT_SIGNALS
                  .filter(s => !capReached || distinctSet.has(s) || s === row.signal)
                  .map(s =>
                    '<option value="' + esc(s) + '"' +
                    (row.signal === s ? ' selected' : '') + '>' + esc(s) + '</option>'
                  ).join('') +
              '</select>' +
              '<div class="stepper">' +
                '<button type="button" data-action="mv-input-dec" data-idx="' + idx + '"' +
                  (row.qty <= 0 ? ' disabled' : '') + '>\u2212</button>' +
                '<input type="text" inputmode="numeric" value="' + (row.qty || 0) + '"' +
                  ' data-action="mv-input-set" data-idx="' + idx + '" aria-label="qty">' +
                '<button type="button" data-action="mv-input-inc" data-idx="' + idx + '">+</button>' +
              '</div>' +
              '<button class="btn btn-text" type="button" data-action="mv-input-remove" data-idx="' + idx + '" aria-label="Remove" style="min-width:auto;padding:8px">\u00d7</button>' +
            '</div>' +
          '</div>'
        ).join('');

      return inErr +
        '<h3 class="h3">Inputs</h3>' +
        inputRowsHtml +
        '<button class="btn btn-ghost btn-block" type="button" data-action="mv-input-add"' + (capReached ? ' disabled' : '') + '>+ Add input</button>' +
        capBanner +
        '<h3 class="h3">Output signal</h3>' +
        '<div class="card">' +
          '<div class="field" style="margin:0">' +
            '<label for="mv-out">Output signal *</label>' +
            '<select id="mv-out" data-bind="mv_outputSignal">' +
              '<option value="">\u2014 select \u2014</option>' +
              MV_OUTPUT_SIGNALS.map(s =>
                '<option value="' + esc(s) + '"' +
                (d.mv_outputSignal === s ? ' selected' : '') + '>' + esc(s) + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="sp-12"></div>' +
        toggleRow('hasSx', 'Signal Extension needed', 'Configure in Step 5', d.hasSx, { namespace:'' });
    }

    function renderStep3Corio(d) {
      const cm2In  = CATALOG.corio.cm2.inputs;
      const cm2Out = CATALOG.corio.cm2.outputs;
      const inErr = d.errors.corio_io
        ? '<div class="banner err">' + esc(d.errors.corio_io) + '</div>' : '';

      return inErr +
        '<div class="banner info">' +
          'Configures CM2 (CORIOmaster2 4K) modules. ' +
          'For CM ecosystem (C3-503 / C3-510 \u00b7 1080p), RECOMMEND will downgrade ' +
          'automatically when only CM-compatible signals are selected.' +
        '</div>' +
        // v27.1.2 #7 — Canvas configuration above Outputs (OQ 7A). Single
        // count field. Captured + displayed in Review/Excel/PDF; chassis
        // auto-select unaffected this release (algorithm update deferred to
        // v27.1.3 per OQ 7B).
        '<h3 class="h3">Canvas configuration</h3>' +
        '<div class="card">' +
          stepperRow('corio_canvases', 'Canvas count', 'Number of independent canvases (UI-only — does not affect chassis pick in v27.1.2)', d.corio_canvases || 0, { namespace:'__corio_canvas' }) +
        '</div>' +
        '<h3 class="h3">Inputs</h3>' +
        '<div class="card">' +
          cm2In.map(c =>
            stepperRow(c.key, c.key, c.desc, d.corio_inputs[c.key] || 0, { namespace:'corio_inputs' })
          ).join('') +
        '</div>' +
        '<h3 class="h3">Outputs</h3>' +
        '<div class="card">' +
          cm2Out.map(c =>
            stepperRow(c.key, c.key, c.desc, d.corio_outputs[c.key] || 0, { namespace:'corio_outputs' })
          ).join('') +
        '</div>' +
        '<h3 class="h3">Audio</h3>' +
        '<div class="card">' +
          '<div class="field" style="margin:0">' +
            '<label>Audio module</label>' +
            '<select data-bind="corio_audio">' +
              '<option value=""'    + (d.corio_audio === ''    ? ' selected' : '') + '>None</option>' +
              '<option value="2-4"' + (d.corio_audio === '2-4' ? ' selected' : '') + '>2-4 (analog + SPDIF)</option>' +
              '<option value="8-8"' + (d.corio_audio === '8-8' ? ' selected' : '') + '>8-8 (CM only \u00b7 8-IN / 8-OUT HD-44)</option>' +
            '</select>' +
            (d.corio_audio === '8-8'
              ? '<div class="help danger-text">8-8 module is CM-only \u2014 incompatible with CM2 / 4K chassis.</div>'
              : '') +
          '</div>' +
        '</div>' +
        '<h3 class="h3">Add-ons</h3>' +
        '<div class="col">' +
          toggleRow('corio_fanFilter', 'Add CM2 fan filter (CM2-Filter)', '', d.corio_fanFilter, { namespace:'' }) +
          toggleRow('hasSx', 'Signal Extension needed', 'Configure HDMI / SDI / AP-536 / AVIP in Step 5', d.hasSx, { namespace:'' }) +
        '</div>';
    }

    /* ---------- Step 4: LED screens ---------- */

    function renderStep4(d) {
      const errHtml = d.errors.screens
        ? '<div class="banner err">' + esc(d.errors.screens) + '</div>' : '';
      // v27.1.2 #5 — block count is fixed by Step 3's LED stepper. No add/remove
      // here. Each block has W (px), H (px), Pitch (mm, 2dp decimal). If user
      // landed here with screens=[] (shouldn't happen due to auto-skip when
      // hasLed=false, but defensive), prompt them back to Step 3.
      if (!d.screens || d.screens.length === 0) {
        return errHtml +
          '<div class="banner info">' +
            'No screens configured. Set <strong>Active LED screens</strong> in Step 3 to add screens.' +
          '</div>';
      }
      const screensHtml = d.screens.map(function(s, idx) {
        const px = (Number(s.w) || 0) * (Number(s.h) || 0);
        return '<div class="card" style="margin-bottom:8px">' +
          '<div class="row between" style="margin:0 0 6px">' +
            '<strong>Screen ' + (idx + 1) + '</strong>' +
          '</div>' +
          '<div class="row gap-2">' +
            '<div class="field" style="flex:1;margin:0">' +
              '<label>Width (px)</label>' +
              '<input type="text" inputmode="numeric" value="' + esc(s.w) + '"' +
                ' data-action="screen-w" data-idx="' + idx + '">' +
            '</div>' +
            '<div class="field" style="flex:1;margin:0">' +
              '<label>Height (px)</label>' +
              '<input type="text" inputmode="numeric" value="' + esc(s.h) + '"' +
                ' data-action="screen-h" data-idx="' + idx + '">' +
            '</div>' +
          '</div>' +
          // v27.1.2 #5 — Pixel pitch (mm), decimal 2dp. inputmode="decimal"
          // so mobile keyboards show the decimal point. Field hint reminds
          // the range so smaller LED pitches are clearly accepted.
          '<div class="field" style="margin:8px 0 0">' +
            '<label>Pixel pitch (mm)</label>' +
            '<input type="text" inputmode="decimal" value="' + esc(s.pitch || '') + '"' +
              ' placeholder="e.g. 2.50"' +
              ' data-action="screen-pitch" data-idx="' + idx + '">' +
            '<div class="help">Typical 0.50\u201350.00 mm \u00b7 2 decimal places</div>' +
          '</div>' +
          (px > 0 ? '<div class="help mono" style="margin-top:6px">= ' +
            px.toLocaleString('en-US') + ' pixels</div>' : '') +
        '</div>';
      }).join('');
      return errHtml + screensHtml;
    }

    /* ---------- Step 5: Signal Extension ---------- */

    function renderStep5(d) {
      const errHtml = d.errors.sx
        ? '<div class="banner err">' + esc(d.errors.sx) + '</div>' : '';
      return errHtml +
        '<div class="banner warn">' +
          '<strong>Heads-up:</strong> Signal Extension SKUs are captured here but ' +
          'not yet rolled into the BoM card in v27.0. Detailed per-family sub-wizards ' +
          '(kit-vs-tx/rx, fiber distance, distribution fanout) land in v27.1.' +
        '</div>' +
        '<h3 class="h3">Quantities</h3>' +
        '<div class="card">' +
          SX_EDITORIAL.map(s =>
            stepperRow(s.id, s.label, s.hint, d.sx_data[s.id] || 0, { namespace:'sx_data' })
          ).join('') +
        '</div>';
    }

    /* ---------- Step 6: Review & build ---------- */

    function renderStep6(d) {
      const rows = [];
      const add = (k, v, jumpStep) => rows.push({ k, v, jumpStep });

      add('Project',  d.project || '\u2014', 1);
      add('End User', d.customer_name || '\u2014', 1);
      if (d.partner_name)    add('Partner', d.partner_name, 1);
      if (d.consultant_name) add('Consultant', d.consultant_name, 1);
      if (d.venue_type)      add('Venue type', d.venue_type, 1);
      if (d.city)            add('City', d.city + (d.state ? ', ' + d.state : ''), 1);
      add('Stage', d.stage || '\u2014', 1);
      if (d.lead_source)        add('Lead Origin', d.lead_source, 1);
      if (d.sales_person_id)    add('Sales',    labelFor(d.sales_person_id, SALES_TEAM), 1);
      if (d.presales_person_id) add('Presales', labelFor(d.presales_person_id, PRESALES_TEAM), 1);
      if (d.contact_name)       add('Contact', d.contact_name, 1);
      if (d.contact_phone)      add('Phone',   d.contact_phone, 1);
      if (d.contact_email)      add('Email',   d.contact_email, 1);
      if (d.close_month) add('Expected closure', d.close_month, 1);
      if (d.external_notes && String(d.external_notes).trim()) add('External notes', d.external_notes, 1);

      const solLabel = { calico: 'CALICO Video Processor', mv: 'Multi Viewer', corio: 'CORIO Video Processor' }[d.solutionType] || '\u2014';
      add('Solution', solLabel, 2);

      if (d.solutionType === 'calico') {
        // v27.1.2 #4a — humanize via HUMAN_LABELS map
        // Filter projectorRes (not a count field) before humanizing.
        const outForHuman = Object.assign({}, d.calico_outputs);
        delete outForHuman.projectorRes;
        // v27.1.3 F1 — synthesize LED count into outForHuman so the Outputs
        // row renders it. Canonical state lives in d.screens (length) +
        // d.hasLed — calico_outputs.led is not written by v27.1.2 #3 LED
        // stepper. This synthesis is display-only; does not write back.
        // HUMAN_LABELS.calico_outputs.led = 'LED Screen' already exists.
        if (d.hasLed && Array.isArray(d.screens) && d.screens.length > 0) {
          outForHuman.led = d.screens.length;
        }
        add('Inputs',  humanizeNamespace('calico_inputs',  d.calico_inputs),  3);
        add('Outputs', humanizeNamespace('calico_outputs', outForHuman),      3);
        // v27.1.3 U1 — always render Audio row (was conditional-hidden when
        // off). calico_audio still read for v27.1.1 deals; v27.1.2 #3 moves
        // canonical state into the Step 3 Audio toggle (still d.calico_audio).
        add('Audio', d.calico_audio ? 'Yes' : 'No', 3);
      } else if (d.solutionType === 'mv') {
        // MV signal names already human-readable from CATALOG.mv keys
        // ("HDMI 4K", "SDI 12G" etc.) so just swap ':' separator for '\u00d7'.
        const inSum = d.mv_inputs.filter(r => r.signal && r.qty > 0)
          .map(r => r.signal + ' \u00d7 ' + r.qty).join(', ') || 'none';
        add('Inputs', inSum, 3);
        add('Output signal', d.mv_outputSignal || '\u2014', 3);
      } else if (d.solutionType === 'corio') {
        // CORIO catalog keys already human-readable; humanize style only.
        const inSum = Object.entries(d.corio_inputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ' \u00d7 ' + v).join(', ') || 'none';
        const outSum = Object.entries(d.corio_outputs).filter(([_,v]) => v > 0)
          .map(([k,v]) => k + ' \u00d7 ' + v).join(', ') || 'none';
        add('Inputs',  inSum, 3);
        add('Outputs', outSum, 3);
        // v27.1.2 #7 — canvas count line, only shown when > 0.
        if (d.corio_canvases && Number(d.corio_canvases) > 0) {
          add('Canvases', String(d.corio_canvases), 3);
        }
        if (d.corio_audio)      add('Audio module', d.corio_audio, 3);
        if (d.corio_fanFilter)  add('Fan filter', 'Yes', 3);
      }

      if (d.hasLed) {
        // v27.1.2 #4a/#5 — humanize screens summary, include pitch when present.
        // OQ 5B: missing pitch (v27.1.1 saved deals) renders as '\u2014'.
        const sum = d.screens.length === 0
          ? 'no screens'
          : d.screens.map(function(s, i) {
              const pitchStr = (s.pitch != null && s.pitch !== '')
                ? ' @ ' + s.pitch + 'mm'
                : ' @ \u2014';
              return 'S' + (i+1) + ': ' + (s.w || '?') + '\u00d7' + (s.h || '?') + pitchStr;
            }).join(', ');
        add('LED screens', sum, 4);
      }
      if (d.hasSx) {
        add('Signal extension', humanizeNamespace('sx_data', d.sx_data), 5);
      }

      const summaryHtml =
        '<div class="card wiz-summary">' +
          rows.map(r =>
            '<div class="sum-row">' +
              '<div>' +
                '<div class="sum-key">' + esc(r.k) + '</div>' +
                '<button class="edit-link" type="button" data-action="wiz-jump" data-step="' + r.jumpStep + '">Edit step ' + r.jumpStep + '</button>' +
              '</div>' +
              '<div class="sum-val">' + esc(r.v) + '</div>' +
            '</div>'
          ).join('') +
        '</div>';

      // BoM section (post-Build)
      const bomHtml = d.reco
        ? '<h2 class="h2">Bill of Materials</h2>' + renderBomCard(d.reco, d.solutionType) +
          '<section class="card">' +
            '<div class="h3">Save</div>' +
            '<div class="small muted" style="margin:0 0 10px">' +
              'Persists to Supabase and opens the saved-deal view. ' +
              'You can keep editing soft fields with autosave from there.' +
            '</div>' +
            '<button class="btn" type="button" data-action="wiz-save">Save quote</button>' +
            ' <button class="btn btn-ghost" type="button" data-action="wiz-new">Start new</button>' +
          '</section>'
        : '<div class="banner info" style="margin-top:16px">' +
            'Tap <strong>Build quote \u2192</strong> below to compute the BoM, then save.' +
          '</div>';

      return bomHtml + summaryHtml;
    }

    /* ---------- BoM card renderer ---------- */

    function renderBomCard(reco, family) {
      if (!reco) return '';
      // Hard error path
      if (reco.error) {
        return '<div class="bom-card empty-bom">' +
          '<div class="bom-chassis-sku">CONFIGURATION REJECTED</div>' +
          '<div class="bom-chassis-label">No chassis fits</div>' +
          '<div class="bom-meta">' + esc(reco.error) + '</div>' +
        '</div>';
      }
      // Empty / no-chassis (MV with no inputs etc)
      if (!reco.chassis) {
        return '<div class="bom-card empty-bom">' +
          '<div class="bom-chassis-sku">EMPTY</div>' +
          '<div class="bom-chassis-label">No chassis recommended</div>' +
          '<div class="bom-meta">' +
            esc((reco.meta && reco.meta.kind) || 'Empty input set.') +
          '</div>' +
        '</div>';
      }

      const meta = reco.meta || {};
      const slotsLine = (meta.slotsTotal != null)
        ? 'Slots: ' + (meta.slotsUsed != null ? meta.slotsUsed : '?') + ' / ' + meta.slotsTotal +
          (meta.ecosystem ? ' \u00b7 ' + meta.ecosystem : '')
        : (meta.chassisLabel || '');

      // v27.1.2 #4b — guarantee chassisLabel is meaningful and distinct
      // from the SKU. If recommendCalico/Mv/Corio set chassisLabel correctly
      // (they now do as of v27.1.2), this falls through unchanged. The
      // empty-fallback to SKU is removed so we never print the same string
      // on lines 1 and 2.
      const labelLine = (meta.chassisLabel && meta.chassisLabel !== reco.chassis)
        ? meta.chassisLabel
        : '';   // empty → element renders empty (no duplicate SKU)

      // v27.1.2 #4b — I/O port spec line. Reads from reco.meta.io (set by
      // each RECOMMEND path). Skipped when meta.io absent (e.g. error returns).
      const ioSpecLine = (function() {
        if (!meta.io) return '';
        function summariseSide(side, dataObj, mapNs) {
          const entries = Object.keys(dataObj)
            .map(function(k) { return [k, Number(dataObj[k]) || 0]; })
            .filter(function(e) { return e[1] > 0; });
          if (entries.length === 0) return '';
          const total = entries.reduce(function(a, e) { return a + e[1]; }, 0);
          const noun  = side + (total === 1 ? '' : 's');
          // Use HUMAN_LABELS when mapNs provided (CALICO); for MV/CORIO the
          // keys are already human-readable signal names so emit as-is.
          const breakdown = entries.map(function(e) {
            const lbl = mapNs && HUMAN_LABELS[mapNs] && HUMAN_LABELS[mapNs][e[0]]
              ? HUMAN_LABELS[mapNs][e[0]]
              : e[0];
            return e[1] + '\u00d7 ' + lbl;
          }).join(', ');
          return total + ' ' + noun + ' (' + breakdown + ')';
        }
        // Detect family by reco shape: CALICO uses calico_inputs/outputs keys.
        const isCalico = !!(meta.io.inputs && (
          meta.io.inputs.hdmi4k !== undefined || meta.io.inputs.hdmiFhd !== undefined ||
          meta.io.inputs.sdi12g !== undefined || meta.io.inputs.sdi3g  !== undefined ||
          meta.io.inputs.hdbt   !== undefined || meta.io.inputs.ip     !== undefined
        ));
        const inSum  = summariseSide('input',  meta.io.inputs  || {}, isCalico ? 'calico_inputs'  : null);
        const outSum = summariseSide('output', meta.io.outputs || {}, isCalico ? 'calico_outputs' : null);
        const parts = [];
        if (inSum)  parts.push(inSum);
        if (outSum) parts.push(outSum);
        return parts.join(' \u00b7 ');
      })();

      const linesHtml = (reco.cards || []).map(c =>
        '<li class="bom-line">' +
          '<div class="desc">' + esc(c.desc || c.label || c.sku) +
            '<span class="sku">' + esc(c.sku) + '</span>' +
          '</div>' +
          '<div class="qty">\u00d7' + (c.qty != null ? c.qty : 1) + '</div>' +
        '</li>'
      ).join('');

      const concernsHtml = (reco.concerns && reco.concerns.length)
        ? '<div class="bom-concerns">' +
            '<h4>Concerns</h4>' +
            '<ul>' + reco.concerns.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' +
          '</div>'
        : '';
      const valueAddsHtml = (reco.valueAdds && reco.valueAdds.length)
        ? '<div class="bom-valueadds">' +
            '<h4>Value-add notes</h4>' +
            '<ul>' + reco.valueAdds.map(v => '<li>' + esc(v) + '</li>').join('') + '</ul>' +
          '</div>'
        : '';

      // v27.1.2 #4b — line order: SKU · label (deduped) · I/O spec · slots · lines
      return '<div class="bom-card">' +
        '<div class="bom-chassis-sku">' + esc(reco.chassis) + '</div>' +
        (labelLine
          ? '<div class="bom-chassis-label">' + esc(labelLine) + '</div>'
          : '') +
        (ioSpecLine
          ? '<div class="bom-io">' + esc(ioSpecLine) + '</div>'
          : '') +
        '<div class="bom-meta">' + esc(slotsLine) + '</div>' +
        '<ul class="bom-lines">' + linesHtml + '</ul>' +
        concernsHtml + valueAddsHtml +
      '</div>';
    }

    /* ============================================================
       Wizard validation (per-step)
       Returns { ok, errors }. Errors are field-id → message strings.
       ============================================================ */

    function validateStep(d) {
      const errors = {};
      if (d.step === 1) {
        // v27.1.1 — item 9: all visible fields required except internal_notes
        // + external_notes. 15 required validators total. City "Other" path
        // (Q7): when city === 'Other' the state input must be non-empty
        // (typed manually); for any other city, state should have been
        // auto-filled. Either way we just require state non-empty.
        if (!d.project || !d.project.trim())             errors.project = 'Required.';
        if (!d.customer_name || !d.customer_name.trim()) errors.customer_name = 'Required.';
        if (!d.partner_name || !d.partner_name.trim())   errors.partner_name = 'Required.';
        if (!d.consultant_name || !d.consultant_name.trim()) errors.consultant_name = 'Required.';
        if (!d.venue_type)                               errors.venue_type = 'Required.';
        if (!d.city || !d.city.trim())                   errors.city = 'Required.';
        if (!d.state || !d.state.trim())                 errors.state = 'Required.';
        if (!d.stage)                                    errors.stage = 'Required.';
        if (!d.lead_source)                              errors.lead_source = 'Required.';
        if (!d.sales_person_id)                          errors.sales_person_id = 'Required.';
        if (!d.presales_person_id)                       errors.presales_person_id = 'Required.';
        if (!d.close_month || !/^\d{4}-\d{2}$/.test(d.close_month)) errors.close_month = 'Required (YYYY-MM).';
        if (!d.contact_name || !d.contact_name.trim())   errors.contact_name = 'Required.';
        if (!d.contact_phone || !/^[0-9]{10}$/.test(d.contact_phone)) errors.contact_phone = '10 digits required.';
        if (!d.contact_email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.contact_email)) errors.contact_email = 'Valid email required.';
        // internal_notes + external_notes are intentionally NOT required.
      } else if (d.step === 2) {
        if (!d.solutionType) errors.solutionType = 'Pick a solution type to continue.';
      } else if (d.step === 3) {
        if (d.solutionType === 'calico') {
          const inSum = Object.values(d.calico_inputs).reduce((a,b) => a + (Number(b)||0), 0);
          const outSum = ['display','projector','sdi'].reduce((a,k) => a + (Number(d.calico_outputs[k])||0), 0);
          if (inSum === 0 && outSum === 0) {
            errors.calico_io = 'At least one input or output is required.';
          }
        } else if (d.solutionType === 'mv') {
          const validInputs = d.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0);
          if (validInputs.length === 0) errors.mv_io = 'Add at least one input row with signal + qty.';
          else if (!d.mv_outputSignal)  errors.mv_io = 'Pick an output signal.';
        } else if (d.solutionType === 'corio') {
          const inSum = Object.values(d.corio_inputs).reduce((a,b) => a + (Number(b)||0), 0);
          const outSum = Object.values(d.corio_outputs).reduce((a,b) => a + (Number(b)||0), 0);
          if (inSum === 0 && outSum === 0) {
            errors.corio_io = 'At least one input or output is required.';
          }
        }
      } else if (d.step === 4) {
        // v27.1.2 #5 — full screen validation: W, H integers within
        // [64, 16384]; pitch decimal within [0.50, 50.00] (2dp).
        // Only fires when hasLed (other paths auto-skip to 5 or 6).
        if (d.hasLed) {
          if (!d.screens || d.screens.length === 0) {
            errors.screens = 'Set Active LED screens > 0 in Step 3, or untick LED.';
          } else {
            const bad = [];
            for (let i = 0; i < d.screens.length; i++) {
              const s = d.screens[i] || {};
              const w = Number(s.w), h = Number(s.h);
              const p = s.pitch === '' || s.pitch == null ? NaN : Number(s.pitch);
              if (!(w >= 64 && w <= 16384)) bad.push('Screen ' + (i+1) + ' width');
              if (!(h >= 64 && h <= 16384)) bad.push('Screen ' + (i+1) + ' height');
              if (!(p >= 0.50 && p <= 50.00)) bad.push('Screen ' + (i+1) + ' pitch');
            }
            if (bad.length) {
              errors.screens = 'Fix: ' + bad.join(', ') + '. ' +
                'W/H must be integer 64\u201316384 px. Pitch must be 0.50\u201350.00 mm.';
            }
          }
        }
      } else if (d.step === 5) {
        if (d.hasSx) {
          const total = Object.values(d.sx_data).reduce((a,b) => a + (Number(b)||0), 0);
          if (total === 0) errors.sx = 'Set at least one SX quantity > 0, or untick SX in Step 3.';
        }
      }
      return { ok: Object.keys(errors).length === 0, errors };
    }

    /* ============================================================
       Form-state binding (read inputs back into wizardData)
       Called BEFORE step navigation so latest typed values are
       captured even if the user didn't blur the field.
       ============================================================ */

    function captureStep1Form() {
      // v27.1.0 F3 — uses SOFT_FIELDS as the single source of truth so this
      // capture stays in sync automatically when SOFT_FIELDS changes.
      // Pre-v27.1 hardcoded a duplicate list that drifted. The i-* element
      // ID prefix works identically for input and textarea elements; .value
      // works identically too — no special-case needed for the notes textarea.
      SOFT_FIELDS.forEach(function(f) {
        const el = $('i-' + f);
        if (el) wizardData[f] = el.value;
      });
    }

    function captureCurrentStepForm() {
      if (wizardData.step === 1) captureStep1Form();
      // Other steps capture in real-time via event delegation (steppers, tiles,
      // selects, MV rows, screen inputs). Step 1 is the only multi-textfield step
      // that benefits from a bulk capture before navigate.
    }

    /* ============================================================
       Event delegation (single click + input handler on body)
       APP wires the high-level routing actions (login submit,
       PW change submit, build, etc.) — UI handles in-view state
       only (steppers, tiles, screen-add, etc.).
       ============================================================ */

    function bindGlobalEvents() {
      // CLICK delegation
      document.body.addEventListener('click', function(e) {
        // Nav buttons (anywhere with data-nav)
        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
          e.preventDefault();
          const target = navBtn.getAttribute('data-nav');
          if (location.hash === target) {
            // Same route — force re-render via custom event
            window.dispatchEvent(new HashChangeEvent('hashchange'));
          } else {
            location.hash = target;
          }
          return;
        }

        // Sheet backdrop close
        const sheetClose = e.target.closest('[data-sheet-close]');
        if (sheetClose) { closeSheet(); return; }

        // Generic actions
        const actEl = e.target.closest('[data-action]');
        if (!actEl) return;
        const action = actEl.getAttribute('data-action');

        // History filter
        if (action === 'hist-filter') {
          const f = actEl.getAttribute('data-value');
          setHistoryFilter(f);
          return;
        }

        // Solution-type tile
        if (action === 'solution-pick') {
          const v = actEl.getAttribute('data-value');
          wizardData.solutionType = v;
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // Stepper +/-
        if (action === 'step-inc' || action === 'step-dec') {
          const ns  = actEl.getAttribute('data-ns');
          const key = actEl.getAttribute('data-key');
          // v27.1.2 #3+#5 — synthetic 'led' stepper in the CALICO Outputs
          // section resizes wizardData.screens directly and keeps hasLed in
          // lockstep. No defaultWizard shape break — screens stays the canonical
          // state holder.
          if (ns === '__calico_led') {
            const cur = Array.isArray(wizardData.screens) ? wizardData.screens.length : 0;
            const delta = action === 'step-inc' ? 1 : -1;
            const next = Math.max(0, cur + delta);
            _resizeScreens(next);
            wizardData.hasLed = (next > 0);
            saveDraft();
            rerenderPreservingScroll();
            return;
          }
          // v27.1.2 #7 — synthetic 'corio_canvases' stepper writes top-level
          // (not nested under corio_outputs since it's not an I/O port count).
          if (ns === '__corio_canvas') {
            const cur = Number(wizardData.corio_canvases) || 0;
            const delta = action === 'step-inc' ? 1 : -1;
            wizardData.corio_canvases = Math.max(0, cur + delta);
            saveDraft();
            rerenderPreservingScroll();
            return;
          }
          if (ns) {
            wizardData[ns][key] = (Number(wizardData[ns][key]) || 0) + (action === 'step-inc' ? 1 : -1);
            if (wizardData[ns][key] < 0) wizardData[ns][key] = 0;
          } else {
            // bare key — currently unused for steppers; reserved
          }
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // Toggle (tile w/ checkbox)
        if (action === 'toggle') {
          const ns  = actEl.getAttribute('data-ns');
          const key = actEl.getAttribute('data-key');
          if (ns) {
            wizardData[ns][key] = !wizardData[ns][key];
          } else {
            wizardData[key] = !wizardData[key];
          }
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // Wizard navigation
        if (action === 'wiz-next')   { APP.wizNext(); return; }
        if (action === 'wiz-back')   { APP.wizBack(); return; }
        if (action === 'wiz-build')  { APP.wizBuild(); return; }
        if (action === 'wiz-rebuild'){ APP.wizBuild(); return; }
        if (action === 'wiz-save')   { APP.wizSave(); return; }
        if (action === 'wiz-cancel') {
          if (confirm('Discard this draft quote and start over?')) {
            clearDraft();
            location.hash = '#/home';
          }
          return;
        }
        if (action === 'wiz-jump') {
          captureCurrentStepForm();
          const s = parseInt(actEl.getAttribute('data-step'), 10) || 1;
          wizardData.step = s;
          wizardData.reco = null;
          renderWizard();
          return;
        }
        if (action === 'wiz-new') {
          if (confirm('Clear this quote and start a new one?')) {
            clearDraft();
            wizardData = defaultWizard();
            renderWizard();
          }
          return;
        }

        // MV input row mgmt
        if (action === 'mv-input-add') {
          // alpha.9.2: defensive Rule-A guard. The UI button is disabled at the
          // cap, but a stale view or rapid double-tap on the enable→disable
          // boundary could still fire this handler. No-op if already at cap.
          const _dist = new Set(
            wizardData.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
          );
          if (_dist.size >= 2) return;
          wizardData.mv_inputs.push({ signal: '', qty: 1 });
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        if (action === 'mv-input-remove') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          wizardData.mv_inputs.splice(idx, 1);
          saveDraft();
          rerenderPreservingScroll();
          return;
        }
        if (action === 'mv-input-inc' || action === 'mv-input-dec') {
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const row = wizardData.mv_inputs[idx];
          if (!row) return;
          row.qty = (Number(row.qty) || 0) + (action === 'mv-input-inc' ? 1 : -1);
          if (row.qty < 0) row.qty = 0;
          saveDraft();
          rerenderPreservingScroll();
          return;
        }

        // v27.1.2 #5 — screen-add / screen-remove retired. The LED count
        // stepper in Step 3 (synthetic 'led' field, namespace '__calico_led')
        // owns array sizing via _resizeScreens(). Old handlers removed; if a
        // stale button somehow remains in DOM, the actions fall through to
        // the unhandled-action toast which is appropriate (visible failure).

        // Logout
        if (action === 'logout') {
          STORE.logout();
          toast('Signed out.', 'default');
          location.hash = '#/login';
          return;
        }

        // Saved-deal "Try again" button — re-dispatches showSavedDeal with the
        // refId from data-ref. Avoids touching the hash (which wouldn't re-fire
        // if the user is already on #/quote/<ref>).
        if (action === 'saved-retry') {
          const ref = t.getAttribute('data-ref') || '';
          if (ref) showSavedDeal(ref);
          return;
        }

        // Saved-deal chip-nav jump — open target accordion section + smooth-scroll.
        // The <details> element needs `open` set explicitly before scrollIntoView
        // so the browser scrolls to the expanded position, not the collapsed one.
        if (action === 'sd-jump') {
          const targetId = t.getAttribute('data-target') || '';
          const el = document.getElementById(targetId);
          if (el) {
            if (el.tagName === 'DETAILS') el.open = true;
            // Defer to next frame so layout settles after open=true expands the body.
            requestAnimationFrame(function() {
              el.scrollIntoView({ behavior:'smooth', block:'start' });
            });
          }
          return;
        }

        // alpha.7.3 — Saved-deal structural steppers (+/− buttons)
        if (action === 'sd-step-inc' || action === 'sd-step-dec') {
          if (!_savedDealData) return;
          const ns  = actEl.getAttribute('data-sd-ns');
          const key = actEl.getAttribute('data-sd-key');
          if (!ns || !key) return;
          if (!_savedDealData[ns]) _savedDealData[ns] = {};
          const cur = Number(_savedDealData[ns][key]) || 0;
          let next = cur + (action === 'sd-step-inc' ? 1 : -1);
          if (next < 0) next = 0;
          if (next > 32) next = 32;
          if (next === cur) return;
          _savedDealData[ns][key] = next;
          markStructuralDirty();
          // Re-render to update +/− disabled states and the visible value.
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // alpha.7.3 — Saved-deal toggle tiles (calico_audio)
        if (action === 'sd-toggle') {
          if (!_savedDealData) return;
          const key = actEl.getAttribute('data-sd-key');
          if (!key) return;
          _savedDealData[key] = !_savedDealData[key];
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // alpha.7.3 — Rebuild BoM from current structural state
        if (action === 'sd-rebuild') {
          rebuildSavedDeal();
          return;
        }

        // v27.1.2 #6 — Edit: hydrate wizard from this deal, jump to Step 1.
        // OQ 6A locked: updates existing deal (not duplicate). Distinguished
        // from fresh-new via route '#/quote/edit/{refId}'. Save handler
        // (wiz-save) detects edit-mode via this hash and updates rather than
        // inserts. Per-step "Edit step N" links inside accordions remain (OQ 6B).
        if (action === 'sd-edit') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref || _savedDealRefId;
          if (!ref) {
            toast('Cannot edit: no reference ID.', 'err');
            return;
          }
          try {
            wizardData = hydrateWizardFromDeal(_savedDealData);
            wizardData.step = 1;
            wizardData.errors = {};
            // Persist edit-target refId on wizardData so wiz-save can detect
            // update-vs-insert without relying solely on the hash (hash may
            // change during step navigation).
            wizardData._editRefId = ref;
          } catch (e) {
            const msg = (e && e.message) ? e.message : String(e);
            toast('Cannot open editor: ' + msg, 'err');
            return;
          }
          location.hash = '#/quote/edit/' + encodeURIComponent(ref);
          return;
        }

        // alpha.8.0 — Excel export
        if (action === 'sd-excel') {
          if (!_savedDealData) return;
          const btn = actEl;
          const orig = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Generating\u2026';
          EXPORT.excel(_savedDealData).then(function(blob) {
            const fn = EXPORT.filename(_savedDealData, 'xlsx');
            EXPORT.download(blob, fn);
            toast('Excel exported: ' + fn, 'ok');
          }).catch(function(err) {
            const msg = (err && err.message) ? err.message : String(err);
            toast('Excel export failed: ' + msg, 'err');
          }).then(function() {
            btn.disabled = false;
            btn.textContent = orig;
          });
          return;
        }

        // alpha.8.0 — PDF export
        if (action === 'sd-pdf') {
          if (!_savedDealData) return;
          const btn = actEl;
          const orig = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Generating\u2026';
          EXPORT.pdf(_savedDealData).then(function(blob) {
            const fn = EXPORT.filename(_savedDealData, 'pdf');
            EXPORT.download(blob, fn);
            toast('PDF exported: ' + fn, 'ok');
          }).catch(function(err) {
            const msg = (err && err.message) ? err.message : String(err);
            toast('PDF export failed: ' + msg, 'err');
          }).then(function() {
            btn.disabled = false;
            btn.textContent = orig;
          });
          return;
        }

        // alpha.8.3 — Soft-delete saved deal
        if (action === 'sd-delete') {
          if (!_savedDealData) return;
          const ref = _savedDealData.display_ref || _savedDealData.ref || _savedDealRefId;
          if (!ref) {
            toast('Cannot delete: no reference ID.', 'err');
            return;
          }
          if (!confirm('Delete ' + ref + '?\n\nYou can restore it from History \u2192 Deleted.')) return;
          const btn = actEl;
          const orig = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Deleting\u2026';
          STORE.deleteDeal(ref).then(function(r) {
            if (r && r.ok === true) {
              // Cancel any pending autosave so the dispose doesn't fire a save
              // against a now-deleted deal.
              if (_autosaveTimer) { clearTimeout(_autosaveTimer); _autosaveTimer = null; }
              _savedDealData    = null;
              _savedDealRefId   = null;
              _autosaveInFlight = false;
              toast(ref + ' deleted. Restore from History \u2192 Deleted.', 'ok');
              location.hash = '#/history';
            } else {
              toast('Delete returned unexpected response: ' + JSON.stringify(r), 'err');
              btn.disabled = false;
              btn.textContent = orig;
            }
          }).catch(function(err) {
            const msg = (err && err.message) ? err.message : String(err);
            toast('Delete failed: ' + msg, 'err');
            btn.disabled = false;
            btn.textContent = orig;
          });
          return;
        }

        // alpha.8.3 — Restore a soft-deleted deal from History view
        if (action === 'hist-restore') {
          const ref = actEl.getAttribute('data-ref');
          if (!ref) return;
          if (!confirm('Restore ' + ref + '?')) return;
          const btn = actEl;
          const orig = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Restoring\u2026';
          STORE.restoreDeal(ref).then(function(r) {
            if (r && r.ok === true) {
              toast(ref + ' restored.', 'ok');
              // Reload the history list — the restored deal disappears from
              // the Deleted filter and reappears in All / Open / Won / Lost.
              if (typeof loadHistoryList === 'function') loadHistoryList();
            } else {
              toast('Restore returned unexpected response: ' + JSON.stringify(r), 'err');
              btn.disabled = false;
              btn.textContent = orig;
            }
          }).catch(function(err) {
            const msg = (err && err.message) ? err.message : String(err);
            toast('Restore failed: ' + msg, 'err');
            btn.disabled = false;
            btn.textContent = orig;
          });
          return;
        }

        // alpha.7.6 — LED screen array mgmt
        if (action === 'sd-screen-add') {
          if (!_savedDealData) return;
          if (!Array.isArray(_savedDealData.screens)) _savedDealData.screens = [];
          _savedDealData.screens.push({ w: '', h: '' });
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        if (action === 'sd-screen-remove') {
          if (!_savedDealData || !Array.isArray(_savedDealData.screens)) return;
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (isNaN(idx) || idx < 0 || idx >= _savedDealData.screens.length) return;
          _savedDealData.screens.splice(idx, 1);
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // alpha.7.6 — MV input row mgmt
        if (action === 'sd-mv-input-add') {
          if (!_savedDealData) return;
          if (!Array.isArray(_savedDealData.mv_inputs)) _savedDealData.mv_inputs = [];
          // alpha.9.2: defensive Rule-A guard (mirror of wizard handler).
          const _dist = new Set(
            _savedDealData.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
          );
          if (_dist.size >= 2) return;
          _savedDealData.mv_inputs.push({ signal: '', qty: 1 });
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        if (action === 'sd-mv-input-remove') {
          if (!_savedDealData || !Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          if (isNaN(idx) || idx < 0 || idx >= _savedDealData.mv_inputs.length) return;
          _savedDealData.mv_inputs.splice(idx, 1);
          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }
        if (action === 'sd-mv-input-inc' || action === 'sd-mv-input-dec') {
          if (!_savedDealData || !Array.isArray(_savedDealData.mv_inputs)) return;
          const idx = parseInt(actEl.getAttribute('data-idx'), 10);
          const row = _savedDealData.mv_inputs[idx];
          if (!row) return;
          const cur = Number(row.qty) || 0;
          let next = cur + (action === 'sd-mv-input-inc' ? 1 : -1);
          if (next < 0) next = 0;
          if (next > 32) next = 32;
          if (next === cur) return;

          markStructuralDirty();
          setRoot(renderSavedDealLoaded(_savedDealData));
          return;
        }

        // Smoke buttons
        // All three handlers toast a summary so the result survives even if
        // the smoke causes a view change (e.g. STORE smoke ends in logout
        // and the auth guard re-routes to #/login, wiping the dev pre).
        if (action === 'run-smoke') {
          const r = window.__smoke();
          renderSmokeOutput(r);
          const lvl = r.ok ? 'ok' : (r.fail > 0 ? 'err' : 'warn');
          toast('Sync smoke: ' + r.pass + ' passed, ' + r.fail + ' failed', lvl);
          return;
        }
        if (action === 'run-store-smoke') {
          if (!confirm('STORE smoke runs a full auth round-trip and will sign you out at the end. Continue?')) return;
          actEl.disabled = true;

          return;
        }

        // alpha.7.6: LED screen W/H direct typing
        if ((sdAct === 'sd-screen-w' || sdAct === 'sd-screen-h') && _savedDealData) {
