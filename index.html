    .field-v3 .field-error { font-size: var(--t-caption); color: var(--danger); margin-top: 4px; }

    /* --- SHEET v3 (overrides existing #sheet-host styles) --- */
    /* Existing #sheet-host markup retained; v3 styles applied via attribute. */
    #sheet-host { z-index: 50; }
    #sheet-host[data-open="true"] .sheet-backdrop {
      opacity: 1; pointer-events: auto;
    }
    .sheet-v3 {
      max-width: 720px; margin: 0 auto;
      background: var(--bg-card);
      border-top-left-radius: var(--r-lg);
      border-top-right-radius: var(--r-lg);
      box-shadow: var(--shadow-sheet);
      max-height: 85vh;
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet-handle {
      width: 36px; height: 4px;
      background: var(--border-strong);
      border-radius: 999px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }

    /* --- TOAST v3 (overrides existing #toast-host children) --- */
    /* Existing #toast-host markup retained; we restyle .toast children to v3. */
    #toast-host {
      position: fixed; top: 70px; left: 0; right: 0;
      z-index: 300; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: var(--s-2);
      padding: 0 var(--s-4);
    }
    #toast-host .toast {
      pointer-events: auto;
      display: flex; align-items: center; gap: var(--s-3);
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--ink-soft);
      border-radius: var(--r-md);
      padding: 12px 18px 12px 14px;
      box-shadow: 0 4px 12px rgba(15,14,12,0.06), 0 12px 32px rgba(15,14,12,0.10);
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 13.5px;
      color: var(--ink-strong);
      max-width: 100%;
      transform: translateY(-20px); opacity: 0;
      animation: toast-in var(--dur-slow) var(--ease-spring) forwards;
    }
    /* v27.3.0 — Type-specific accent (left edge stripe matches icon color) */
    #toast-host .toast.ok    { border-left-color: #22C55E; }
    #toast-host .toast.warn  { border-left-color: #F59E0B; }
    #toast-host .toast.err   { border-left-color: #EF4444; }
    #toast-host .toast::before {
      content: '';
      width: 18px; height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: 12px;
    }
    #toast-host .toast.ok::before {
      background-color: #22C55E;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    }
    #toast-host .toast.warn::before {
      background-color: #F59E0B;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='9' x2='12' y2='13'/><line x1='12' y1='17' x2='12.01' y2='17'/></svg>");
    }
    #toast-host .toast.err::before {
      background-color: #EF4444;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>");
    }
    @keyframes toast-in { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    /* --- EMPTY STATE v3 --- */
    .empty-state {
      text-align: center;
      padding: var(--s-9) var(--s-5);
    }
    .empty-state-illustration {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--accent-soft);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: var(--s-5);
      color: var(--accent);
    }
    .empty-state-illustration svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .empty-state-title {
      font-family: var(--font-display);
      font-weight: 600; font-size: var(--t-h2);
      color: var(--ink-strong);
      margin: 0 0 var(--s-2);
      letter-spacing: var(--ls-h1);
    }
    .empty-state-body {
      font-size: var(--t-body-sm);
      color: var(--ink-soft);
      margin: 0 auto var(--s-5);
      max-width: 360px;
      line-height: 1.5;
    }

    /* --- SKELETON v3 --- */
    .sk {
      background: linear-gradient(90deg, var(--bg-subtle) 0%, var(--bg-card-hover) 50%, var(--bg-subtle) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      border-radius: var(--r-xs);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .sk-card { height: 120px; border-radius: var(--r-md); }

    /* --- v27.3.0 HOME PAGE LAYOUT --- */
    .v273-page {
      max-width: 1100px; margin: 0 auto;
      padding: var(--s-6) var(--s-5) calc(var(--s-12) + 60px);
      position: relative; z-index: 1;
    }
    .kpi-grid {
      display: grid; gap: var(--s-3);
      grid-template-columns: repeat(4, 1fr);
      margin-bottom: var(--s-7);
    }
    @media (max-width: 720px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-tile {
      position: relative;
      border-radius: var(--r-md);
      padding: var(--s-5) var(--s-5) var(--s-4);
      color: white;
      cursor: pointer;
      overflow: hidden;
      transition: transform var(--dur-base) var(--ease-out), filter var(--dur-base) var(--ease-out);
      min-height: 120px;
      display: flex; flex-direction: column; justify-content: space-between;
      border: none; text-align: left;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .kpi-tile:hover { transform: translateY(-3px); filter: brightness(1.05); }
    .kpi-tile:active { transform: scale(0.985) translateY(-1px); }
    .kpi-tile::after {
      content: ''; position: absolute;
      top: -40%; right: -20%;
      width: 60%; height: 200%;
      background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 70%);
      transform: rotate(20deg);
      pointer-events: none;
    }
    .kpi-tile-blue   { background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); box-shadow: 0 4px 14px rgba(37,99,235,0.30); }
    .kpi-tile-green  { background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); box-shadow: 0 4px 14px rgba(22,163,74,0.30); }
    .kpi-tile-purple { background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 100%); box-shadow: 0 4px 14px rgba(124,58,237,0.30); }
    .kpi-tile-amber  { background: var(--brand-grad); box-shadow: 0 4px 14px rgba(232,115,28,0.30); }
    .kpi-tile-icon {
      position: absolute; top: var(--s-4); right: var(--s-4);
      width: 22px; height: 22px;
      color: rgba(255,255,255,0.65);
      pointer-events: none;
    }
    .kpi-tile-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .kpi-eyebrow {
      font-family: var(--font-display);
      font-weight: 600; font-size: var(--t-eyebrow);
      letter-spacing: var(--ls-eyebrow); text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: var(--s-2);
      white-space: nowrap;
      text-overflow: ellipsis; overflow: hidden;
    }
    .kpi-value {
      font-family: var(--font-display);
      font-weight: 700; font-size: 28px;
      letter-spacing: -0.02em; line-height: 1.1;
      margin: 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .kpi-sub { margin-top: var(--s-3); font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.85); }
    @media (max-width: 540px) {
      .kpi-eyebrow { font-size: 9px; letter-spacing: 0.06em; }
      .kpi-value { font-size: 24px; }
      .kpi-tile { padding: var(--s-4) var(--s-3) var(--s-3); min-height: 100px; }
    }

    .attention-row {
      display: grid; gap: var(--s-3);
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: var(--s-7);
    }
    @media (max-width: 720px) { .attention-row { grid-template-columns: 1fr; } }
    .attention-card {
      display: block; text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: var(--s-4);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      color: inherit;
    }
    .attention-card:hover { transform: translateY(-2px); border-color: var(--border-mid); box-shadow: 0 6px 20px rgba(15,14,12,0.06), 0 1px 3px rgba(15,14,12,0.04); }
    html[data-theme="dark"] .attention-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.30); }
    .attention-card:active { transform: scale(0.99); }
    .attention-card-danger  { border-top: 3px solid #DC2626; background: linear-gradient(180deg, rgba(220,38,38,0.04) 0%, var(--bg-card) 50%); }
    .attention-card-warning { border-top: 3px solid #F59E0B; background: linear-gradient(180deg, rgba(245,158,11,0.04) 0%, var(--bg-card) 50%); }
    .attention-card-stale   { border-top: 3px solid #A78BFA; background: linear-gradient(180deg, rgba(167,139,250,0.04) 0%, var(--bg-card) 50%); }
    .attention-head { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-3); }
    .attention-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .attention-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .attention-card-danger  .attention-icon { color: #DC2626; }
    .attention-card-warning .attention-icon { color: #F59E0B; }
    .attention-card-stale   .attention-icon { color: #A78BFA; }
    .attention-title { font-family: var(--font-display); font-weight: 600; font-size: var(--t-body-sm); color: var(--ink-strong); flex: 1; }
    .attention-count { font-family: var(--font-display); font-weight: 700; font-size: var(--t-body); color: var(--ink-soft); background: var(--bg-subtle); padding: 2px 10px; border-radius: var(--r-pill); font-variant-numeric: tabular-nums; }
    .attention-empty { font-size: var(--t-body-sm); color: var(--ink-soft); text-align: center; padding: var(--s-4) 0; }

    .deal-list-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-card);
      padding: 0; overflow: hidden;
      transition: box-shadow var(--dur-base) var(--ease-out);
    }
    .deal-list-card:hover { box-shadow: 0 6px 20px rgba(15,14,12,0.06), 0 1px 3px rgba(15,14,12,0.04); }
    html[data-theme="dark"] .deal-list-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.30); }
    .deal-list-head { display: flex; align-items: baseline; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 0.5px solid var(--border-soft); }
    .deal-list-head h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--t-h2); color: var(--ink-strong); margin: 0; letter-spacing: var(--ls-h1); }
    .deal-list-head .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }

    /* --- v27.3.0 GLASS ACTION BAR --- */
    .bom-action-bar {
      position: fixed; bottom: 60px;
      left: 0; right: 0; z-index: 28;
      display: flex; justify-content: center;
      padding: var(--s-3) var(--s-4);
      pointer-events: none;
    }
    .bom-action-bar-inner {
      pointer-events: auto;
      display: flex; gap: var(--s-2); align-items: center;
      background: var(--bg-topbar);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-soft);
      padding: 8px; border-radius: var(--r-lg);
      box-shadow: 0 8px 32px rgba(15,14,12,0.12);
      max-width: 100%;
      overflow-x: auto;
    }
    .bom-action-bar-inner::-webkit-scrollbar { display: none; }
    .action-btn-v3 {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px; min-height: 38px;
      font-family: var(--font-display); font-weight: 600; font-size: var(--t-body-sm);
      color: var(--ink-strong);
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-sm);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      transition:
        transform var(--dur-fast) var(--ease-spring),
        background var(--dur-base) var(--ease-out),
        border-color var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out);
    }
    .action-btn-v3::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 50%);
      pointer-events: none;
      opacity: 0.6;
      transition: opacity var(--dur-base) var(--ease-out);
    }
    html[data-theme="dark"] .action-btn-v3::before {
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 50%);
      opacity: 1;
    }
    .action-btn-v3:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--border-mid);
      background: var(--bg-card-hover);
      box-shadow: 0 4px 14px rgba(15,14,12,0.08), 0 1px 2px rgba(15,14,12,0.04);
    }
    html[data-theme="dark"] .action-btn-v3:hover:not(:disabled) {
      box-shadow: 0 4px 14px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.20);
    }
    .action-btn-v3:active:not(:disabled) { transform: scale(0.97); }
    .action-btn-v3:disabled { opacity: 0.5; cursor: not-allowed; }
    .action-btn-v3 .icon {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
      position: relative; z-index: 1;
      color: var(--ink-mid);
    }
    .action-btn-v3 .label { position: relative; z-index: 1; }
    .action-btn-v3.act-confirm .icon { color: var(--success); }
    .action-btn-v3.act-excel   .icon { color: #16A34A; }
    .action-btn-v3.act-pdf     .icon { color: #DC2626; }
    .action-btn-v3.act-wa      .icon { color: #25D366; }
    .action-btn-v3.act-email   .icon { color: #7C3AED; }
    @media (max-width: 720px) {
      .action-btn-v3 .label { display: none; }
      .action-btn-v3 { padding: 10px; min-width: 38px; }
      .action-btn-v3 .icon { width: 18px; height: 18px; }
    }

    /* --- v27.3.0 SOLUTION TILES (Step 2) — override legacy .tile --- */
    .tile {
      appearance: none; border: 1.5px solid var(--border-mid); background: var(--bg-card);
      padding: var(--s-4); border-radius: var(--r-md);
      text-align: left; cursor: pointer;
      transition:
        transform var(--dur-base) var(--ease-out),
        border-color var(--dur-base) var(--ease-out),
        background var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out);
      font-family: inherit;
      display: flex; align-items: flex-start; gap: var(--s-3);
      width: 100%;
    }
    .tile-icon {
      width: 40px; height: 40px;
      border-radius: var(--r-sm);
      background: var(--accent-soft); color: var(--accent-deep);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-spring);
    }
    .tile-icon svg { width: 22px; height: 22px; }
    .tile-text { flex: 1; min-width: 0; }
    .tile-title {
      font-family: var(--font-display);
      font-weight: 700; font-size: var(--t-body);
      color: var(--ink-strong);
      margin-bottom: var(--s-1);
      letter-spacing: -0.005em;
    }
    .tile-sub { font-size: var(--t-body-sm); color: var(--ink-soft); margin: 0; line-height: 1.4; }
    .tile[data-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .tile[data-checked="true"] .tile-icon { background: var(--accent); color: white; }
    .tile:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(232,115,28,0.10), 0 1px 3px rgba(15,14,12,0.04); }
    .tile:hover .tile-icon { transform: scale(1.06); }
    .tile:active { transform: scale(0.99); }
    .tile-group { display: grid; gap: var(--s-3); }
    .sub-tile-group {
      margin-top: var(--s-3);
      padding: var(--s-3); background: var(--bg-subtle);
      border-radius: var(--r-md);
      grid-template-columns: 1fr 1fr;
    }
    .sub-tile-group .tile { padding: var(--s-3); }
    .sub-tile-group .tile-title { font-size: var(--t-body-sm); }
    .sub-tile-group .tile-sub { font-size: 11px; }
    @media (max-width: 540px) { .sub-tile-group { grid-template-columns: 1fr; } }

    /* --- v27.3.0 LED CARD (Step 4) — live badges --- */
    .led-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: var(--s-4);
      margin-bottom: var(--s-3);
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
    }
    .led-card:hover { border-color: var(--border-mid); box-shadow: 0 6px 20px rgba(15,14,12,0.06), 0 1px 3px rgba(15,14,12,0.04); }
    html[data-theme="dark"] .led-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.30); }
    .led-card-head {
      font-family: var(--font-display); font-weight: 600; font-size: var(--t-h3);
      color: var(--ink-strong); margin-bottom: var(--s-3);
      letter-spacing: var(--ls-h1);
    }
    .led-badge-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: var(--s-3);
    }
    .led-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      background: var(--accent-soft);
      border: 0.5px solid var(--border-soft);
      font-size: 11.5px; font-family: var(--font-display); font-weight: 500;
      transition: background var(--dur-base) var(--ease-out);
    }
    .led-badge-k { color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; font-size: 9.5px; font-weight: 600; }
    .led-badge-v { color: var(--accent-deep); font-weight: 700; font-variant-numeric: tabular-nums; }
    html[data-theme="dark"] .led-badge-v { color: var(--accent); }
    .led-physical {
      display: flex; align-items: center; gap: 6px;
      margin-top: var(--s-3); padding-top: var(--s-3);
      border-top: 0.5px solid var(--border-soft);
      font-size: 11.5px; color: var(--ink-soft);
      font-family: var(--font-mono);
    }
    .led-physical svg { color: var(--ink-faint); }
    .led-aggregate {
      display: grid; gap: var(--s-3);
      grid-template-columns: repeat(4, 1fr);
      padding: var(--s-4);
      margin-top: var(--s-4);
      background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
      border-radius: var(--r-md);
      color: white;
      box-shadow: 0 4px 14px rgba(22,163,74,0.22);
    }
    /* v27.3.0 — slim aggregate summary replacing the loud green band.
       Per-screen pills cover the per-screen detail; this just rolls up totals. */
    .led-summary {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      margin-top: var(--s-3);
      background: var(--accent-soft);
      border-radius: var(--r-sm);
      border: 0.5px solid var(--border-soft);
      font-size: 12.5px;
      color: var(--ink-mid);
      font-family: var(--font-display);
    }
    .led-summary svg { color: var(--accent-deep); flex-shrink: 0; }
    .led-summary strong { color: var(--accent-deep); font-weight: 700; font-variant-numeric: tabular-nums; }
    html[data-theme="dark"] .led-summary strong { color: var(--accent); }
    /* v27.3.0 — LED cards inline in CALICO Step 3 (Outputs card). Tighter
       spacing and a subtle divider so they read as a sub-block. */
    .calico-led-inline {
      margin: var(--s-3) 0 0;
      padding-top: var(--s-3);
      border-top: 0.5px dashed var(--border-mid);
    }
    .calico-led-inline .led-card { margin-bottom: var(--s-2); }
    .calico-led-inline .led-aggregate { margin-top: var(--s-3); padding: var(--s-3); }
    .calico-led-inline .led-agg-v { font-size: 17px; }
    @media (max-width: 540px) { .led-aggregate { grid-template-columns: repeat(2, 1fr); } }
    .led-agg-k {
      font-family: var(--font-display); font-weight: 600;
      font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 4px;
    }
    .led-agg-v {
      font-family: var(--font-display); font-weight: 700;
      font-size: 20px; line-height: 1.1;
      color: white;
      font-variant-numeric: tabular-nums;
    }

    /* --- v27.3.0 SX GRID (Step 5) — 4 designed cards --- */
    .sx-grid {
      display: grid; gap: var(--s-3);
      grid-template-columns: repeat(2, 1fr);
    }
    @media (max-width: 540px) { .sx-grid { grid-template-columns: 1fr; } }
    .sx-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: var(--s-4);
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column; gap: var(--s-3);
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
    }
    .sx-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-mid);
      box-shadow: 0 6px 20px rgba(15,14,12,0.06), 0 1px 3px rgba(15,14,12,0.04);
    }
    html[data-theme="dark"] .sx-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.30); }
    .sx-card-head { display: flex; align-items: flex-start; gap: var(--s-3); }
    .sx-card-icon {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      background: var(--accent-soft); color: var(--accent-deep);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sx-card-icon svg { width: 18px; height: 18px; }
    .sx-card-text { flex: 1; min-width: 0; }
    .sx-card-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: var(--t-body); color: var(--ink-strong);
      letter-spacing: -0.005em;
      margin-bottom: 2px;
    }
    .sx-card-sub { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
    .sx-card-stepper {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-subtle);
      border-radius: var(--r-sm);
      padding: 6px;
    }
    .sx-step-btn {
      appearance: none; border: none;
      width: 32px; height: 32px;
      border-radius: var(--r-xs);
      background: var(--bg-card);
      color: var(--ink-strong);
      font-family: var(--font-display); font-weight: 700; font-size: 16px;
      cursor: pointer;
      transition: background var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
      -webkit-tap-highlight-color: transparent;
    }
    .sx-step-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-deep); }
    .sx-step-btn:active:not(:disabled) { transform: scale(0.92); }
    .sx-step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sx-step-val {
      font-family: var(--font-display); font-weight: 700;
      font-size: 18px;
      color: var(--ink-strong);
      font-variant-numeric: tabular-nums;
      min-width: 32px; text-align: center;
    }

    /* --- v27.3.0 §10 SX LINE-ITEM PICKERS --- */
    .sx-card-wide { grid-column: 1 / -1; }
    .sx-line-row {
      border-top: 0.5px solid var(--border-soft);
      padding: var(--s-3) 0;
    }
    .sx-line-row:first-of-type { border-top: none; padding-top: var(--s-2); }
    .sx-line-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--s-3);
    }
    @media (min-width: 720px) {
      .sx-line-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .sx-line-field { display: flex; flex-direction: column; gap: 4px; }
    .sx-line-field label {
      font-family: var(--font-display);
      font-weight: 600; font-size: 10.5px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .sx-pill-group {
      display: flex; flex-wrap: wrap; gap: 4px;
      background: var(--bg-subtle);
      padding: 3px; border-radius: var(--r-sm);
    }
    .sx-pill {
      appearance: none; border: none;
      background: transparent;
      color: var(--ink-mid);
      padding: 6px 10px;
      border-radius: var(--r-xs);
      font-family: var(--font-display);
      font-weight: 600; font-size: 12px;
      cursor: pointer;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
      min-height: 30px;
      white-space: nowrap;
    }
    .sx-pill:hover { background: var(--bg-card-hover); color: var(--ink-strong); }
    .sx-pill.active {
      background: var(--accent); color: var(--ink-on-brand);
      box-shadow: 0 2px 6px rgba(232,115,28,0.30);
    }
    .sx-pill.active:hover { background: var(--accent-deep); }
    .sx-line-stepper {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg-subtle);
      padding: 3px; border-radius: var(--r-sm);
    }
    .sx-line-stepper .sx-step-btn { width: 28px; height: 28px; font-size: 14px; }
    .sx-line-stepper .sx-step-val { font-size: 14px; min-width: 24px; }
    .sx-line-remove {
      appearance: none; border: none;
      width: 28px; height: 28px;
      border-radius: var(--r-xs);
      background: transparent;
      color: var(--ink-soft);
      font-size: 18px; line-height: 1;
      cursor: pointer;
      margin-left: 4px;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
    }
    .sx-line-remove:hover { background: var(--danger-soft); color: var(--danger); }
    .sx-len-select {
      appearance: none; -webkit-appearance: none;
      background: var(--bg-input);
      border: 1px solid var(--border-mid);
      border-radius: var(--r-sm);
      padding: 8px 10px;
      color: var(--ink-strong);
      font-family: var(--font-system); font-size: 13px;
      cursor: pointer;
      min-height: 36px;
    }
    .sx-len-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .sx-line-empty {
      padding: var(--s-4);
      text-align: center;
      color: var(--ink-soft);
      font-size: 13px;
      background: var(--bg-subtle);
      border-radius: var(--r-sm);
      margin-top: var(--s-2);
    }
    .sx-add-line {
      appearance: none; border: 1px dashed var(--border-mid);
      background: transparent;
      color: var(--accent-deep);
      width: 100%;
      padding: 10px;
      border-radius: var(--r-sm);
      font-family: var(--font-display); font-weight: 600; font-size: 13px;
      cursor: pointer;
      margin-top: var(--s-3);
      transition: background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
    }
    .sx-add-line:hover { background: var(--accent-soft); border-color: var(--accent); }
    .sx-da-row {
      display: flex; align-items: center; gap: var(--s-3);
      padding: var(--s-3) 0;
      border-top: 0.5px solid var(--border-soft);
    }
    .sx-da-row:first-of-type { border-top: none; padding-top: var(--s-2); }
    .sx-da-text { flex: 1; min-width: 0; }
    .sx-da-title { font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--ink-strong); }
    .sx-da-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

    /* --- v27.3.0 CUSTOMER DIRECTORY (D1-D3 silent-drop restore) --- */
    .cust-toolbar {
      display: flex; flex-direction: column; gap: var(--s-3);
      margin-bottom: var(--s-3);
    }
    .cust-search {
      position: relative;
      display: flex; align-items: center;
    }
    .cust-search svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--ink-soft);
      pointer-events: none;
    }
    .cust-search input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      background: var(--bg-card);
      border: 1px solid var(--border-mid);
      border-radius: var(--r-sm);
      font-family: var(--font-system); font-size: 14px;
      color: var(--ink-strong);
      transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
    }
    .cust-search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .cust-filter-chips {
      display: flex; gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .cust-filter-chips::-webkit-scrollbar { display: none; }
    .cust-chip {
      appearance: none; border: 1px solid var(--border-mid);
      background: var(--bg-card);
      color: var(--ink-mid);
      padding: 6px 12px;
      border-radius: var(--r-pill);
      font-family: var(--font-display); font-weight: 600; font-size: 12.5px;
      cursor: pointer;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .cust-chip:hover { border-color: var(--accent); color: var(--ink-strong); }
    .cust-chip.active {
      background: var(--accent); color: var(--ink-on-brand);
      border-color: var(--accent);
    }
    .cust-row {
      appearance: none; border: none;
      display: flex; align-items: center; gap: var(--s-3);
      width: 100%; padding: 12px 14px;
      background: var(--bg-card);
      border-bottom: 0.5px solid var(--border-soft);
      text-align: left; cursor: pointer;
      font-family: inherit;
      transition: background var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }
    .cust-row:hover { background: var(--bg-card-hover); }
    .cust-row:first-of-type { border-top-left-radius: var(--r-md); border-top-right-radius: var(--r-md); }
    .cust-row:last-of-type { border-bottom: none; border-bottom-left-radius: var(--r-md); border-bottom-right-radius: var(--r-md); }
    .cust-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: white;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 700; font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(232,115,28,0.20);
    }
    .cust-avatar-lg { width: 52px; height: 52px; font-size: 18px; }
    .cust-body { flex: 1; min-width: 0; }
    .cust-name {
      font-family: var(--font-display); font-weight: 600;
      font-size: 14.5px; color: var(--ink-strong);
      line-height: 1.3;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cust-sub {
      font-size: 12px; color: var(--ink-soft);
      margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-transform: capitalize;
    }
    .cust-type-icon {
      width: 22px; height: 22px;
      color: var(--ink-faint);
      flex-shrink: 0;
    }
    .cust-type-icon svg { width: 100%; height: 100%; }

    /* Customer 360 sheet header */
    .cust-360-head {
      display: flex; align-items: center; gap: var(--s-3);
      padding: 16px;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .cust-360-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 18px; color: var(--ink-strong);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .cust-360-sub {
      font-size: 12.5px; color: var(--ink-soft);
      margin-top: 2px;
      text-transform: capitalize;
    }
    .cust-360-actions {
      display: flex; gap: 6px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border-soft);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cust-360-actions::-webkit-scrollbar { display: none; }
    .cust-360-kpis {
      display: grid; gap: 1px;
      grid-template-columns: repeat(4, 1fr);
      background: var(--border-soft);
      border-bottom: 0.5px solid var(--border-soft);
    }
    .cust-360-kpi {
      background: var(--bg-card);
      padding: 12px 8px;
      text-align: center;
    }
    .cust-360-kpi-k {
      font-family: var(--font-display); font-weight: 600;
      font-size: 9.5px; color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .cust-360-kpi-v {
      font-family: var(--font-display); font-weight: 700;
      font-size: 18px; color: var(--ink-strong);
      font-variant-numeric: tabular-nums;
    }

    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--s-3);
      margin-bottom: var(--s-3);
    }
    .page-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--t-h1, 24px);
      color: var(--ink-strong);
      margin: 0;
      letter-spacing: -0.015em;
    }

    /* --- v27.3.0 LOGIN REFRESH --- */
    .login-bg-v3 {
      position: fixed; inset: 0;
      background: var(--bg-page);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .login-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      opacity: 0.55;
      pointer-events: none;
      will-change: transform;
    }
    .login-orb-1 {
      width: 460px; height: 460px;
      background: radial-gradient(circle, #F7941D 0%, transparent 65%);
      top: -120px; left: -120px;
      animation: orb-drift-a 18s ease-in-out infinite alternate;
    }
    .login-orb-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #FAC172 0%, transparent 65%);
      bottom: -100px; right: -100px;
      animation: orb-drift-b 22s ease-in-out infinite alternate;
    }
    html[data-theme="dark"] .login-orb { opacity: 0.32; }
    @keyframes orb-drift-a {
      0%   { transform: translate3d(0,0,0) scale(1); }
      100% { transform: translate3d(60px, 40px, 0) scale(1.08); }
    }
    @keyframes orb-drift-b {
      0%   { transform: translate3d(0,0,0) scale(1); }
      100% { transform: translate3d(-40px, -50px, 0) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .login-orb { animation: none !important; }
    }
    .login-card-v3 {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 32px 24px 20px;
      box-shadow: 0 24px 60px rgba(15,14,12,0.10), 0 4px 12px rgba(15,14,12,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    html[data-theme="dark"] .login-card-v3 {
      box-shadow: 0 24px 60px rgba(0,0,0,0.50), 0 4px 12px rgba(0,0,0,0.30);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logos {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 14px;
    }
    .login-tvone-logo { color: #F7941D; display: inline-flex; }
    .login-logo-divider {
      width: 1px; height: 22px;
      background: var(--border-mid);
    }
    .login-cavitak-logo { display: inline-flex; }
    .login-title {
      font-family: var(--font-display);
      font-weight: 700; font-size: 20px;
      color: var(--ink-strong);
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 12.5px;
      color: var(--ink-soft);
    }
    .login-input-wrap {
      position: relative; display: flex; align-items: center;
    }
    .login-input-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--ink-soft);
      pointer-events: none;
    }
    .input-v3-iconed { padding-left: 36px !important; }
    .login-submit {
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 4px;
    }
    .login-forgot {
      appearance: none; border: none; background: transparent;
      color: var(--accent-deep);
      font-family: var(--font-display); font-weight: 600; font-size: 12.5px;
      cursor: pointer;
      display: block;
      margin: 14px auto 0;
      padding: 6px 10px;
      border-radius: var(--r-sm);
      transition: background var(--dur-base) var(--ease-out);
    }
    .login-forgot:hover { background: var(--accent-soft); }
    .login-foot {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 0.5px solid var(--border-soft);
      text-align: center;
    }
    .login-ver {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-faint);
      letter-spacing: 0.05em;
    }

    /* --- v27.3.0 DASHBOARD UPGRADE — 8 KPI tiles --- */
    .kpi-grid-8 {
      display: grid; gap: 8px;
      grid-template-columns: repeat(2, 1fr);
      margin-bottom: var(--s-4);
    }
    @media (min-width: 540px) { .kpi-grid-8 { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 880px) { .kpi-grid-8 { grid-template-columns: repeat(8, 1fr); } }
    /* Color variants for the 4 new tiles (red/gray/cyan/pink) */
    .kpi-tile-red    { background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%); }
    .kpi-tile-red    .kpi-tile-icon { background: #EF4444; color: white; }
    .kpi-tile-red    .kpi-value     { color: #991B1B; }
    .kpi-tile-gray   { background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%); }
    .kpi-tile-gray   .kpi-tile-icon { background: #6B7280; color: white; }
    .kpi-tile-gray   .kpi-value     { color: #1F2937; }
    .kpi-tile-cyan   { background: linear-gradient(135deg, #CFFAFE 0%, #A5F3FC 100%); }
    .kpi-tile-cyan   .kpi-tile-icon { background: #06B6D4; color: white; }
    .kpi-tile-cyan   .kpi-value     { color: #155E75; }
    .kpi-tile-pink   { background: linear-gradient(135deg, #FCE7F3 0%, #FBCFE8 100%); }
    .kpi-tile-pink   .kpi-tile-icon { background: #EC4899; color: white; }
    .kpi-tile-pink   .kpi-value     { color: #9D174D; }
    html[data-theme="dark"] .kpi-tile-red    { background: linear-gradient(135deg, rgba(239,68,68,0.18) 0%, rgba(239,68,68,0.08) 100%); }
    html[data-theme="dark"] .kpi-tile-red    .kpi-value { color: #FCA5A5; }
    html[data-theme="dark"] .kpi-tile-gray   { background: linear-gradient(135deg, rgba(107,114,128,0.20) 0%, rgba(107,114,128,0.10) 100%); }
    html[data-theme="dark"] .kpi-tile-gray   .kpi-value { color: #D1D5DB; }
    html[data-theme="dark"] .kpi-tile-cyan   { background: linear-gradient(135deg, rgba(6,182,212,0.18) 0%, rgba(6,182,212,0.08) 100%); }
    html[data-theme="dark"] .kpi-tile-cyan   .kpi-value { color: #67E8F9; }
    html[data-theme="dark"] .kpi-tile-pink   { background: linear-gradient(135deg, rgba(236,72,153,0.18) 0%, rgba(236,72,153,0.08) 100%); }
    html[data-theme="dark"] .kpi-tile-pink   .kpi-value { color: #F9A8D4; }

    /* Dashboard sections */
    .dash-section {
      margin-bottom: var(--s-5);
    }
    .dash-section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: var(--s-3);
    }
    .dash-section-head h2 {
      font-family: var(--font-display); font-weight: 700;
      font-size: 16px; color: var(--ink-strong);
      margin: 0; letter-spacing: -0.01em;
    }
    .dash-section-head .meta {
      font-size: 11.5px; color: var(--ink-soft);
      font-family: var(--font-display); font-weight: 500;
    }

    /* Stage funnel */
    .stage-funnel {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .funnel-row {
      display: grid; gap: 10px;
      grid-template-columns: 100px 1fr 32px;
      align-items: center;
    }
    @media (min-width: 540px) { .funnel-row { grid-template-columns: 160px 1fr 40px; } }
    .funnel-stage {
      font-family: var(--font-display); font-weight: 600;
      font-size: 12px; color: var(--ink-mid);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .funnel-bar-wrap {
      height: 18px;
      background: var(--bg-subtle);
      border-radius: var(--r-pill);
      overflow: hidden;
    }
    .funnel-bar {
      height: 100%;
      border-radius: var(--r-pill);
      transition: width 600ms var(--ease-out);
    }
    .funnel-count {
      font-family: var(--font-display); font-weight: 700;
      font-size: 13px; color: var(--ink-strong);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* v27.3.0 — Funnel rows are clickable buttons; jump to History filtered to stage */
    .funnel-row-btn {
      appearance: none;
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
      padding: 4px 6px;
      margin: 0 -6px;
      border-radius: var(--r-sm);
      transition: background var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .funnel-row-btn:hover { background: var(--bg-subtle); }
    .funnel-row-btn:active { transform: scale(0.99); }
    .funnel-row-btn.funnel-row-empty {
      cursor: default;
      opacity: 0.55;
    }
    .funnel-row-btn.funnel-row-empty:hover { background: transparent; }
    .funnel-row-btn.funnel-row-empty:active { transform: none; }
    .funnel-row-btn .funnel-stage {
      font-weight: 600;
    }

    /* Region tiles */
    .region-grid {
      display: grid; gap: 8px;
      grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 540px) { .region-grid { grid-template-columns: repeat(4, 1fr); } }
    .region-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--zone-color, var(--accent));
      border-radius: var(--r-md);
      padding: 12px;
      transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
    }
    /* v27.3.0 — Region tile as clickable button */
    .region-tile-btn {
      appearance: none;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .region-tile-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,14,12,0.06); }
    .region-tile-btn:active { transform: scale(0.99); }
    .region-tile-btn:hover .region-tile-head svg { opacity: 1 !important; color: var(--zone-color) !important; }
    .region-tile:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,14,12,0.05); }
    .region-tile-head {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 10px;
    }
    .region-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .region-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 13px; color: var(--ink-strong);
    }
    .region-stats {
      display: grid; gap: 6px;
      grid-template-columns: repeat(3, 1fr);
    }
    .region-stat-k {
      font-family: var(--font-display); font-weight: 600;
      font-size: 9.5px; color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .region-stat-v {
      font-family: var(--font-display); font-weight: 700;
      font-size: 16px; color: var(--ink-strong);
      font-variant-numeric: tabular-nums;
    }

    /* Stuck/slipped table */
    .stuck-table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .stuck-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
    }
    .stuck-table thead th {
      background: var(--bg-subtle);
      font-family: var(--font-display); font-weight: 600;
      font-size: 10.5px;
      color: var(--ink-soft);
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 9px 12px;
      text-align: left;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .stuck-table thead th.num { text-align: right; }
    .stuck-table tbody tr {
      cursor: pointer;
      border-bottom: 0.5px solid var(--border-soft);
      transition: background var(--dur-base) var(--ease-out);
    }
    .stuck-table tbody tr:hover { background: var(--bg-card-hover); }
    .stuck-table tbody tr:last-child { border-bottom: none; }
    .stuck-table td {
      padding: 10px 12px;
      vertical-align: top;
    }
    .stuck-table td.num { text-align: right; white-space: nowrap; }
    .stuck-project {
      font-family: var(--font-display); font-weight: 600;
      font-size: 13px; color: var(--ink-strong);
    }
    .stuck-meta {
      font-size: 11px; color: var(--ink-soft);
      margin-top: 2px;
    }
    .stuck-days {
      font-family: var(--font-display); font-weight: 700;
      font-size: 13px;
      color: var(--warning, #F59E0B);
      font-variant-numeric: tabular-nums;
    }
    .stuck-days-bad { color: var(--danger, #EF4444); }
    .stuck-table-more {
      padding: 10px 12px;
      text-align: center;
      font-size: 12px; color: var(--ink-soft);
      background: var(--bg-subtle);
    }
    .stuck-table-more a {
      color: var(--accent-deep);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .stuck-table-more a:hover { text-decoration: underline; }

    /* --- v27.3.0 saved-deal SX read-only summary --- */
    .sd-sx-list {
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 12px;
    }
    .sd-sx-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--bg-subtle);
      border-radius: var(--r-sm);
      border: 0.5px solid var(--border-soft);
    }
    .sd-sx-icon {
      width: 32px; height: 32px;
      border-radius: var(--r-xs);
      background: var(--accent-soft);
      color: var(--accent-deep);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sd-sx-icon svg { width: 16px; height: 16px; }
    .sd-sx-text { flex: 1; min-width: 0; }
    .sd-sx-title {
      font-family: var(--font-display); font-weight: 600;
      font-size: 13.5px; color: var(--ink-strong);
      line-height: 1.3;
    }
    .sd-sx-sub {
      font-size: 11.5px; color: var(--ink-soft);
      margin-top: 2px;
    }
    .sd-sx-qty {
      font-family: var(--font-display); font-weight: 700;
      font-size: 16px; color: var(--accent-deep);
      font-variant-numeric: tabular-nums;
      padding: 4px 10px;
      background: var(--bg-card);
      border-radius: var(--r-pill);
      border: 1px solid var(--border-soft);
    }

    /* --- v27.3.0 SIMPLE HOME --- */
    .home-hero {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: var(--s-3);
      margin-bottom: var(--s-4);
      padding-top: var(--s-2);
    }
    .home-hero-text { flex: 1; min-width: 0; }
    .home-greet {
      font-family: var(--font-display); font-weight: 500;
      font-size: 13px; color: var(--ink-soft);
      letter-spacing: 0.005em;
      margin-bottom: 2px;
    }
    .home-hero-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 24px; color: var(--ink-strong);
      margin: 0; letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .home-cta {
      appearance: none; border: none;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--accent); color: var(--ink-on-brand);
      border-radius: var(--r-pill);
      font-family: var(--font-display); font-weight: 600; font-size: 12.5px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(232,115,28,0.25);
      transition: transform var(--dur-fast) var(--ease-spring), background var(--dur-base) var(--ease-out);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .home-cta:hover { background: var(--accent-deep); }
    .home-cta:active { transform: scale(0.97); }
    .home-stats {
      display: grid; gap: 10px;
      grid-template-columns: repeat(2, 1fr);
      margin-bottom: var(--s-5);
    }
    @media (min-width: 720px) { .home-stats { grid-template-columns: repeat(4, 1fr); } }
    .home-stat {
      appearance: none; border: 1px solid var(--border-soft);
      background: var(--bg-card);
      border-radius: 14px;
      padding: 14px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }
    .home-stat::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--stat-color, var(--accent));
    }
    .home-stat:hover {
      transform: translateY(-2px);
      border-color: var(--stat-color, var(--accent));
      box-shadow: 0 6px 18px rgba(15,14,12,0.06);
    }
    html[data-theme="dark"] .home-stat:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.40); }
    .home-stat-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--stat-color) 12%, transparent);
      color: var(--stat-color);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    @supports not (background: color-mix(in srgb, red 50%, blue)) {
      .home-stat-icon { background: rgba(247,148,29,0.12); }
    }
    .home-stat-icon svg { width: 18px; height: 18px; }
    .home-stat-text { width: 100%; }
    .home-stat-value {
      font-family: var(--font-display); font-weight: 700;
      font-size: 26px; line-height: 1;
      color: var(--ink-strong);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .home-stat-title {
      font-family: var(--font-display); font-weight: 600;
      font-size: 12.5px; color: var(--ink-strong);
      margin-bottom: 2px;
    }
    .home-stat-sub {
      font-size: 11.5px; color: var(--ink-soft);
    }
    .home-link {
      color: var(--accent-deep);
      font-weight: 600;
      font-size: 12.5px;
      text-decoration: none;
      cursor: pointer;
    }
    .home-link:hover { text-decoration: underline; }
    .home-dash-cta {
      margin-top: var(--s-4);
      padding: 14px;
      background: var(--bg-card);
      border: 1px dashed var(--border-mid);
      border-radius: var(--r-md);
      text-align: center;
    }
    .home-dash-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--accent-deep);
      font-family: var(--font-display); font-weight: 600; font-size: 13.5px;
      text-decoration: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: var(--r-sm);
      transition: background var(--dur-base) var(--ease-out);
    }
    .home-dash-link:hover { background: var(--accent-soft); }

    /* --- v27.3.0 Home empty state (new users) --- */
    .home-empty {
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 24px;
      text-align: center;
    }
    .home-empty-art {
      width: 80px; height: 80px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .home-empty-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 18px;
      color: var(--ink-strong);
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
    }
    .home-empty-body {
      font-size: 13.5px;
      color: var(--ink-soft);
      margin: 0 0 18px 0;
      max-width: 280px;
      line-height: 1.45;
    }
    .home-empty-cta {
      appearance: none; border: none;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px;
      background: var(--accent); color: var(--ink-on-brand);
      border-radius: var(--r-pill);
      font-family: var(--font-display); font-weight: 600; font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(232,115,28,0.32);
      transition: transform var(--dur-fast) var(--ease-spring), background var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }
    .home-empty-cta:hover { background: var(--accent-deep); }
    .home-empty-cta:active { transform: scale(0.97); }

    /* --- v27.3.0 Stage transitions timeline --- */
    .st-timeline {
      padding: 16px 18px 12px 18px;
      display: flex; flex-direction: column;
    }
    .st-row {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 12px;
      padding-bottom: 18px;
    }
    .st-row:last-child { padding-bottom: 4px; }
    .st-marker {
      display: flex; flex-direction: column; align-items: center;
      padding-top: 4px;
    }
    .st-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--ink-soft);
      border: 2px solid var(--bg-card);
      box-shadow: 0 0 0 1px var(--border-soft);
      flex-shrink: 0;
    }
    .st-row-current .st-dot {
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .st-line {
      flex: 1;
      width: 2px;
      background: var(--border-soft);
      margin-top: 4px;
      min-height: 16px;
    }
    .st-body {
      min-width: 0;
      padding-top: 1px;
    }
    .st-stages {
      display: flex; align-items: center;
      flex-wrap: wrap;
      gap: 2px;
      margin-bottom: 4px;
    }
    .st-meta {
      font-size: 11.5px;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }
    .st-notes {
      margin-top: 6px;
      padding: 8px 10px;
      background: var(--bg-subtle);
      border-radius: var(--r-sm);
      font-size: 12.5px;
      color: var(--ink-mid);
      line-height: 1.4;
    }

    /* Stage badge → clickable history link */
    .sd-stage-link {
      appearance: none;
      border: 0;
      font-family: var(--font-display);
      font-weight: inherit;
      transition: transform var(--dur-fast) var(--ease-spring), filter var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }
    .sd-stage-link:hover { filter: brightness(0.96); transform: translateY(-1px); }
    .sd-stage-link:active { transform: scale(0.97); }

    /* --- v27.3.0 Pull-to-refresh --- */
    .ptr-indicator {
      position: fixed;
      top: var(--topbar-h, 56px);
      left: 50%;
      transform: translate(-50%, -100%);
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      box-shadow: 0 4px 12px rgba(15,14,12,0.10);
      display: flex; align-items: center; justify-content: center;
      z-index: 80;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--dur-base) var(--ease-out);
    }
    .ptr-indicator.is-visible { opacity: 1; }
    .ptr-indicator svg {
      width: 18px; height: 18px;
      color: var(--accent-deep);
    }
    .ptr-indicator.is-spinning svg {
      animation: ptr-spin 0.8s linear infinite;
    }
    @keyframes ptr-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ptr-indicator { transition: none; }
      .ptr-indicator.is-spinning svg { animation: none; }
    }

    /* --- v27.3.0 Export mode picker --- */
    .export-mode-grid {
      display: grid; gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 540px) { .export-mode-grid { grid-template-columns: 1fr 1fr; } }
    .export-mode-card {
      appearance: none;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: 14px;
      display: flex; align-items: center; gap: 12px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }
    .export-mode-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(15,14,12,0.06);
    }
    .export-mode-card:active { transform: scale(0.98); }
    .export-mode-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .export-mode-icon svg { width: 20px; height: 20px; }
    .export-mode-text { flex: 1; min-width: 0; }
    .export-mode-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 14px; color: var(--ink-strong);
      margin-bottom: 2px;
    }
    .export-mode-sub {
      font-size: 11.5px; color: var(--ink-soft);
      line-height: 1.35;
    }

    /* --- v27.3.0 History page upgrade --- */
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-pill);
      padding: 4px 10px 4px 14px;
      margin-bottom: 12px;
      transition: border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
    }
    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    @supports not (background: color-mix(in srgb, red 50%, blue)) {
      .search-bar:focus-within { box-shadow: 0 0 0 3px rgba(247,148,29,0.18); }
    }
    .search-icon {
      color: var(--ink-soft);
      display: inline-flex; align-items: center;
      flex-shrink: 0;
    }
    .search-input {
      appearance: none;
      border: 0; outline: 0; background: transparent;
      flex: 1; min-width: 0;
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--ink-strong);
      padding: 10px 0;
    }
    .search-input::placeholder { color: var(--ink-faint); }
    .search-input::-webkit-search-cancel-button { display: none; }
    .search-clear {
      appearance: none; border: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--bg-subtle);
      color: var(--ink-soft);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
    }
    .search-clear:hover { background: var(--ink-soft); color: var(--bg-card); }

    .hist-chip-row {
      display: flex; gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .hist-chip-row::-webkit-scrollbar { display: none; }
    .hist-chip {
      appearance: none; border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--ink-mid);
      border-radius: var(--r-pill);
      padding: 6px 12px;
      font-family: var(--font-display); font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .hist-chip:hover { border-color: var(--accent); color: var(--ink-strong); }
    .hist-chip:active { transform: scale(0.96); }
    .hist-chip-active {
      background: var(--accent);
      color: var(--ink-on-brand);
      border-color: var(--accent);
    }
    .hist-chip-active:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--ink-on-brand); }

    .hist-meta {
      font-family: var(--font-display); font-weight: 500;
      font-size: 11.5px; color: var(--ink-soft);
      margin-bottom: 10px;
      letter-spacing: 0.005em;
    }
    /* --- v27.3.0 History sort row --- */
    .hist-sort-row {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 10px 0;
    }
    .hist-sort-label {
      font-family: var(--font-display); font-weight: 600;
      font-size: 11px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .hist-sort-select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-sm);
      padding: 7px 28px 7px 12px;
      font-family: var(--font-display); font-weight: 600;
      font-size: 12px;
      color: var(--ink-strong);
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 12px;
    }
    .hist-sort-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .hist-summary {
      display: grid; gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
      margin-bottom: 12px;
    }
    .hist-summary-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--tile-color, var(--accent));
      border-radius: var(--r-sm);
      padding: 10px 12px;
    }
    .hist-summary-val {
      font-family: var(--font-display); font-weight: 700;
      font-size: 18px; line-height: 1;
      color: var(--ink-strong);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .hist-summary-label {
      font-family: var(--font-display); font-weight: 600;
      font-size: 10.5px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* --- v27.3.0 About sheet --- */
    .about-head {
      text-align: center;
      padding: 24px 16px 16px;
      border-bottom: 1px solid var(--border-soft);
      margin: 0 -16px 16px;
    }
    .about-logo {
      display: inline-block;
      padding: 8px 14px;
      background: var(--accent-soft);
      border-radius: var(--r-md);
      margin-bottom: 6px;
    }
    .about-grid {
      display: flex; flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }
    .about-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      padding: 10px 6px;
      border-bottom: 0.5px solid var(--border-soft);
      align-items: baseline;
    }
    .about-row:last-child { border-bottom: none; }
    .about-key {
      font-family: var(--font-display); font-weight: 600;
      font-size: 10.5px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .about-val {
      font-size: 13px;
      color: var(--ink-strong);
      line-height: 1.4;
    }
    .about-val.mono { font-family: var(--font-mono); }
    .about-footer {
      padding: 14px 12px 4px;
      background: var(--accent-soft);
      border-radius: var(--r-md);
      margin-top: 4px;
    }

    /* --- v27.3.0 Wizard progress header --- */
    .wiz-progress {
      margin-bottom: var(--s-4);
      padding-top: var(--s-2);
    }
    .wiz-progress-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 4px;
    }
    .wiz-progress-eyebrow {
      font-family: var(--font-display); font-weight: 700;
      font-size: 10.5px;
      color: var(--accent-deep);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .wiz-progress-pct {
      font-family: var(--font-display); font-weight: 700;
      font-size: 11px;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }
    .wiz-progress-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 22px;
      color: var(--ink-strong);
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .wiz-progress-track {
      height: 6px;
      background: var(--bg-subtle);
      border-radius: var(--r-pill);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .wiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-deep) 100%);
      border-radius: var(--r-pill);
      transition: width 380ms var(--ease-out);
    }
    .wiz-pills {
      display: flex; gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .wiz-pills::-webkit-scrollbar { display: none; }
    .wiz-pill {
      appearance: none;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--ink-soft);
      font-family: var(--font-display); font-weight: 600;
      font-size: 11.5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-spring);
      -webkit-tap-highlight-color: transparent;
    }
    .wiz-pill:active { transform: scale(0.96); }
    .wiz-pill-n {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--bg-subtle);
      color: var(--ink-soft);
      font-size: 10.5px;
      font-weight: 700;
      padding: 0 4px;
    }
    .wiz-pill-label {
      font-weight: 600;
    }
    /* Past — completed (check) */
    .wiz-pill-past {
      color: var(--success, #22C55E);
      border-color: color-mix(in srgb, var(--success, #22C55E) 35%, var(--border-soft));
      background: color-mix(in srgb, var(--success, #22C55E) 8%, var(--bg-card));
    }
    @supports not (background: color-mix(in srgb, red 50%, blue)) {
      .wiz-pill-past { border-color: #BFE7CB; background: #F1FBF4; }
    }
    /* Current — amber, bold */
    .wiz-pill-current {
      color: var(--ink-on-brand);
      background: var(--accent);
      border-color: var(--accent);
    }
    .wiz-pill-current .wiz-pill-n {
      background: rgba(255,255,255,0.25);
      color: var(--ink-on-brand);
    }
    /* Future — muted, disabled affordance */
    .wiz-pill-future {
      cursor: default;
      opacity: 0.6;
    }
    .wiz-pill-future:active { transform: none; }

    /* --- v27.3.0 Profile page --- */
    .profile-hero {
      display: flex; align-items: center; gap: 14px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      margin-bottom: var(--s-4);
    }
    .profile-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--brand-grad);
      color: white;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(232,115,28,0.25);
    }
    .profile-hero-text { flex: 1; min-width: 0; }
    .profile-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 18px; color: var(--ink-strong);
      margin: 0 0 3px 0;
      letter-spacing: -0.015em;
    }
    .profile-sub {
      font-size: 12.5px; color: var(--ink-soft);
    }
    .profile-section {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
      padding: 16px;
      margin-bottom: var(--s-3);
    }
    .profile-section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 12px;
    }
    .profile-section-head h2 {
      font-family: var(--font-display); font-weight: 700;
      font-size: 14.5px; color: var(--ink-strong);
      margin: 0; letter-spacing: -0.005em;
    }
    .profile-section-head .meta {
      font-size: 11px; color: var(--ink-soft);
      font-weight: 500;
    }
    .profile-grid {
      display: flex; flex-direction: column; gap: 2px;
      margin-bottom: 8px;
    }
    .profile-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 0.5px solid var(--border-soft);
      align-items: baseline;
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-key {
      font-family: var(--font-display); font-weight: 600;
      font-size: 10.5px;
      color: var(--ink-soft);

    /* --- v27.3.0 Load-error state with retry --- */
    .load-error {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 16px;
      background: var(--bg-card);
      border: 1px solid var(--danger, #EF4444);
      border-radius: var(--r-md);
      margin: 12px 0;

    .load-error-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(239,68,68,0.10);
      color: var(--danger, #EF4444);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;

    .load-error-icon svg { width: 20px; height: 20px; }
    .load-error-text { flex: 1; min-width: 0; }
    .load-error-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 14px;
      color: var(--ink-strong);
      margin-bottom: 2px;
    }
    .load-error-msg {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.4;
      word-break: break-word;
    }
    .load-error-retry {
      appearance: none; border: 1px solid var(--accent);
      background: var(--bg-card);
      color: var(--accent-deep);
      padding: 8px 14px;
      border-radius: var(--r-pill);

      -webkit-tap-highlight-color: transparent;
    }
    .load-error-retry:hover { background: var(--accent); color: var(--ink-on-brand); }
    .load-error-retry:active { transform: scale(0.97); }

    /* --- v27.3.0 Confirm sheet --- */
    .confirm-sheet {
      padding: 24px 20px 20px;
      text-align: center;
    }
    .confirm-icon {
      width: 56px; height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .confirm-icon svg { width: 28px; height: 28px; }
    .confirm-icon-danger {
      background: rgba(239,68,68,0.10);
      color: var(--danger, #EF4444);
    }
    .confirm-icon-info {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .confirm-title {
      font-family: var(--font-display); font-weight: 700;
      font-size: 17px;
      color: var(--ink-strong);
      margin: 0 0 6px 0;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .confirm-msg {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .confirm-actions {
      display: flex; gap: 8px;
    }
    .confirm-actions .btn-v3 { flex: 1; }
    /* Danger button variant — used by confirm-go in danger mode */
    .btn-v3.btn-danger {
      background: var(--danger, #EF4444);
      color: white;
      border: 1px solid var(--danger, #EF4444);
    }
    .btn-v3.btn-danger:hover { background: #DC2626; border-color: #DC2626; }
    .btn-v3.btn-danger:active { transform: scale(0.98); }

    /* --- v27.3.0 Skeleton loaders --- */
    .skeleton {
      background: linear-gradient(90deg,
        var(--bg-subtle) 0%,
        color-mix(in srgb, var(--bg-subtle) 60%, var(--bg-card) 40%) 50%,
        var(--bg-subtle) 100%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s ease-in-out infinite;
      border-radius: var(--r-xs);
      display: block;
    }
    @supports not (background: color-mix(in srgb, red 50%, blue)) {
      .skeleton { background: var(--bg-subtle); }
    }
    @keyframes skeleton-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; }
    }
    .skeleton-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .skeleton-row:last-child { border-bottom: none; }
    .skeleton-circle  { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
    .skeleton-text    { height: 12px; }
    .skeleton-text-sm { height: 9px; }
    .skeleton-card {
      padding: 14px;
      border-radius: var(--r-md);
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
    }
    .skeleton-grid {
      display: grid; gap: 10px;
      grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 720px) { .skeleton-grid { grid-template-columns: repeat(4, 1fr); } }

    /* --- v27.3.0 NOTIFICATION SHEET (D6-D9 restore) --- */
    .notif-sheet { padding: 4px 0 16px; }
    .notif-sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px 12px;
      border-bottom: 0.5px solid var(--border-soft);

      font-family: var(--font-display); font-weight: 600;
      font-size: var(--t-h2); color: var(--ink-strong);
      margin: 0; letter-spacing: var(--ls-h1);
    }
    .notif-row {
      display: flex; align-items: flex-start; gap: var(--s-3);
      width: 100%; padding: 12px 16px;
      background: var(--bg-card);
      border: none; border-bottom: 0.5px solid var(--border-soft);
      text-align: left; cursor: pointer;
      font-family: inherit;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--dur-base) var(--ease-out);
    }
    .notif-row:hover { background: var(--bg-card-hover); }
    .notif-row:active { background: var(--bg-subtle); }
    .notif-row:last-child { border-bottom: none; }
    .notif-row-read { opacity: 0.62; }
    .notif-icon {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      background: var(--accent-soft); color: var(--accent-deep);
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .notif-icon svg { width: 18px; height: 18px; }
    .notif-row-read .notif-icon { background: var(--bg-subtle); color: var(--ink-soft); }
    .notif-body { flex: 1; min-width: 0; }
    .notif-msg {
      font-size: var(--t-body-sm);
      color: var(--ink-strong);
      line-height: 1.4;
      margin-bottom: 2px;
      word-wrap: break-word;
    }
    .notif-meta {
      font-size: 11px;
      color: var(--ink-soft);
      font-family: var(--font-mono);
    }
    .notif-unread {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 6px;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    /* --- v27.3.0 CONFETTI BURST (Won-deal celebration) --- */
    .confetti-burst {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }
    .confetti-particle {
      position: absolute;
      top: -20px;
      width: 10px; height: 14px;
      border-radius: 2px;
      animation: confetti-fall linear forwards;
      transform-origin: center;
    }
    @keyframes confetti-fall {
      0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(var(--drift, 0), 105vh, 0) rotate(var(--rotate, 360deg)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti-particle { animation: none !important; opacity: 0 !important; }
    }
  </style>
