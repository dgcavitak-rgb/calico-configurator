    v27.2.3 — BUG FIXES + SCREEN DIMENSIONS (2026-05-25)
    User-reported bugs against v27.2.2:
      Bug 1: D16 gate re-fires on every login despite successful save
             Root cause: localStorage `_user` from a pre-v27.2.2 session
             cached phone as "+91 8160756906" — fails PHONE_RE on rehydrate.
             Fix: bootRestore() now self-heals stale phones to last-10-digits
             format on every page load. One-time write-back; no re-login.
      Bug 2: Saved-deal view shows "Empty input set / No chassis recommended"
             even when Step 6 just showed a real BoM for the same data.
             Root cause: `deal_get` RPC didn't return `raw_submission` jsonb.
             Frontend merge loop at showSavedDeal hit `undefined` and skipped,
             leaving deal.solutionType/calico_inputs/screens/etc undefined.
             computeReco fell through every if-branch, returned empty.
             Fix: BACKEND migration `deal_get_returns_raw_submission`
             (2026-05-25). Pure additive — existing callers ignore extra
             keys. No frontend change needed; the existing merge loop now
             finds the data it always expected.
      Bug 3: Step 5 SX banner had stale "v27.0 / v27.1" version references.
             Fix: rewritten to "this version / an upcoming version."

    New feature — Screen physical dimensions:
      Compute width_mm / height_mm / diagonal_mm / diagonal_inches from
      each screen's {w, h, pitch} via UI._screenDimensions. Displayed
      inline in Step 4 (under each pitch input) and in a new "Screen
      Configuration" block in both Excel and PDF exports. Pure display
      this release; persistence to deal_screens table deferred to v27.2.4.

    v27.2.2 — FLOW REORDER (2026-05-25, post-v27.2.1 verified-clean deploy)
    User feedback after v27.2.1 ship: the gate order was wrong. Profile
    fields should be collected on the very first login (default-PW
    session), BEFORE the user sets their own password — not after. Also,
    partial-fill must be tolerated: a user who fills only email and
    leaves the rest blank should save what they filled, and the gate
    should re-fire on next login asking only for what's still missing.
    And after the force-PW change succeeds, the session must end so the
    user signs back in with their new password.

    Changes:
      A. Order swap in 3 sites (start, onRouteChange, handleLoginSubmit):
         Profile gate now fires BEFORE force-PW gate.
      B. handleProfileSetupSubmit rewritten:
         - Validates each filled field individually; empty fields are
           skipped, not errored.
         - Builds the profile_update payload conditionally — only sends
           keys for filled-and-valid fields. The RPC's existing COALESCE
           semantics preserve DB values for keys we don't send. (Option A
           of two; backend RPC unchanged.)
         - At-least-one valid field required to submit; nudge toast if
           all blank.
         - After save, re-checks profileIncomplete on the patched user.
           If still incomplete → re-render the gate with what's left.
           If complete + must_change → route to force-PW gate.
           If complete + !must_change → route to home (normal flow).
      C. handleForcePwSubmit: on success, STORE.logout() + UI.showLogin()
         + toast "Please sign in with your new password." Voluntary PW
         changes (handleProfilePwSubmit) unchanged — still stay logged in.
      D. Form copy softened: removed `required` HTML attrs, banner now
         says "Fill what you can now — we'll ask again next login for
         anything you skip."

    Audit-gate (six checks A-F per OP §1.9) ran clean before this hand-off.

    v27.2.1 — HOTFIX (2026-05-24, same-day as v27.2.0)
    Bug: blank screen for any logged-in user after v27.2.0 deploy.
    Root cause: 7 bare cross-IIFE references inside APP IIFE to UI-private
    symbols. start() called `profileIncomplete(u)` which is defined in UI
    IIFE — sibling scope, not reachable by bare name. ReferenceError
    aborted start() before any view rendered. Same bug class as the
    pre-existing labelFor latent bug fixed in v27.2.0, but introduced
    BY v27.2.0 itself. OP §2.14 self-violation.

    Fix: 7 surgical str_replace edits in APP scope:
      - 3x profileIncomplete(...)  → UI._profileIncomplete(...)
      - 1x normalizePhone(...)     → UI._normalizePhone(...)
      - 1x PHONE_RE.test(...)      → inlined /^[0-9]{10}$/
      - 1x EMAIL_RE.test(...)      → inlined /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      - 1x pendingProfileUser || STORE.currentUser()  →  STORE.currentUser()
    No functionality change; same C1+C2+D16 behaviour as v27.2.0 intended.

    v27.2.0 — CONTRACT RESTORE (Slice B of v27.2 scope)
    Date: 2026-05-24. Frontend only; backend unchanged at v26.19.0.
    Spec: /home/claude/work/SPEC-v27.2-contract-restore.md
    Inventory: /mnt/project/01-FEATURES.md (D16 + C1 + C2 → ✓ shipped)

    Shipped this version:
      1. STORE.fetchRoster + roster cache (user_list RPC at login)
         - new: STORE.fetchRoster, .getRoster, .rosterById, .clearRoster, ._patchCurrentUser
         - new: UI._userRichFor, ._joinParts, ._normalizePhone, ._profileIncomplete
         - persists to localStorage.v27.roster; cleared on logout
      2. D16 Profile Setup Gate (silently dropped in v27 rebuild, now restored)
         - route-level gate, mirrors must_change pattern (non-dismissible)
         - 3 fields: professional_title, phone (last-10-digit normalized),
           email; validated locally to match the gate predicate
         - 3-failure escape hatch with sessionStorage bypass (session-scoped)
      3. C1 Cavitak T&C block (contract C1, OP §3.8) — 11 items, in Excel + PDF
         - text verbatim from BS production 2026-05-06 + tvONE v25.109.1 warranty
         - new: UI._tncItems(dateStr), UI._formatQuoteDate(Date)
      4. C2 Sales+Presales contact footer (contract C2, OP §3.9) — in Excel + PDF
         - reads name/title/phone/email from roster cache per UUID
         - Sales row, Presales row (skipped when no presales assigned),
           Escalation row (skipped when viewer is Super), Issued-by row
      5. Latent bug fix (caught during Item 3): bare labelFor/SALES_TEAM/
         PRESALES_TEAM references inside EXPORT IIFE could not resolve
         via lexical scope (EXPORT and UI are sibling IIFEs). Existing
         v27.1.3 Excel/PDF context row "Salesperson: <uuid>" likely showed
         raw UUID in production. Now namespaced via UI._labelFor.

    Heads-up for deploy:
      - 25/26 active users will hit the D16 gate on next login (96%).
        Send a team WhatsApp before deploying so the modal isn't surprising.
      - Dipenkumar's phone has +91 prefix in current DB; will normalize

      - Smoke test plan: SPEC §6 S1-S10.

    /* Ambient orbs — calm, subtle */
    body::before, body::after {
      content: ''; position: fixed; pointer-events: none; z-index: 0;
      border-radius: 50%; filter: blur(60px);
    }
    body::before {
      top: -15vh; left: -15vw; width: 50vw; height: 50vw; max-width: 500px; max-height: 500px;
      background: var(--orb-1); animation: orb1 var(--dur-ambient) ease-in-out infinite;
    }
    body::after {
      bottom: -25vh; right: -20vw; width: 60vw; height: 60vw; max-width: 600px; max-height: 600px;
      background: var(--orb-2); animation: orb2 calc(var(--dur-ambient) * 1.4) ease-in-out infinite;
      animation-delay: -5s;
    }
    @keyframes orb1 { 0%,100% { transform: translate(0,0); opacity: 0.7; } 50% { transform: translate(4vw,3vh); opacity: 1; } }
    @keyframes orb2 { 0%,100% { transform: translate(0,0); opacity: 0.7; } 50% { transform: translate(-3vw,-2vh); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    button, input, select, textarea { font: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:active { text-decoration: underline; }

    /* App shell */
    #app { min-height: 100vh; display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top); position: relative; z-index: 1; }
    #view-root { flex: 1;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
    #view-root .v { max-width: var(--content-max); margin: 0 auto; padding: 16px; }

    /* Topbar / tricolor */
    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--c-elev);
      border-bottom: 1px solid var(--c-border);
      position: sticky; top: env(safe-area-inset-top); z-index: 8; }
    .topbar .brand { font-weight: 700; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .topbar .brand .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--c-accent); }
    .topbar .ver { font: 11px var(--f-mono); color: var(--c-fg-mute);
      background: var(--c-sunk); padding: 2px 6px; border-radius: 4px; }
    .tricolor-bar { display: flex; height: 3px; }
    .tricolor-bar span { display: block; height: 100%; }
    .tricolor-bar .a { width: 50%; background: var(--c-accent); }
    .tricolor-bar .b { width: 23%; background: var(--c-gold); }
    .tricolor-bar .c { width: 27%; background: var(--c-fg); }

    /* Bottom nav */
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--c-elev); box-shadow: var(--sh-nav);
      padding-bottom: env(safe-area-inset-bottom);
      display: flex; justify-content: space-around; }
    .bottom-nav button { flex: 1; min-height: var(--nav-h); border: 0;
      background: transparent; color: var(--c-fg-mute); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 4px;
      font: 600 11px var(--f-sans);
      -webkit-tap-highlight-color: transparent; }
    .bottom-nav button[aria-current="page"] { color: var(--c-accent); }
    .bottom-nav button:active { background: var(--c-sunk); }
    .bottom-nav button .icon { width: 22px; height: 22px; stroke: currentColor;
      fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Card */
    .card { background: var(--c-elev); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 16px; box-shadow: var(--sh-card);
      margin: 0 0 12px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; min-height: var(--tap); padding: 10px 18px;
      background: var(--c-accent); color: var(--c-fg-rev);
      border: 0; border-radius: var(--r-md);
      font: 600 15px/1 var(--f-sans); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none; transition: background 80ms; }
    .btn:active { background: var(--c-accent-dk); }
    .btn[disabled] { background: var(--c-sunk); color: var(--c-fg-mute); cursor: not-allowed; }
    .btn.btn-ghost { background: transparent; color: var(--c-accent); border: 1px solid var(--c-border-st); }
    .btn.btn-ghost:active { background: var(--c-sunk); }
    .btn.btn-ghost[disabled] { color: var(--c-fg-mute); border-color: var(--c-border); background: transparent; }
    .btn.btn-danger { background: var(--c-err); }
    .btn.btn-danger:active { background: #8a1f15; }
    .btn.btn-text { background: transparent; color: var(--c-accent); padding: 10px 12px; }
    .btn.btn-block { width: 100%; }

    /* Inputs */
    .field { display: block; margin: 0 0 14px; }
    .field > label { display: block; font-size: 13px; font-weight: 600;
      color: var(--c-fg-soft); margin: 0 0 4px; }
    .field .help { font-size: 12px; color: var(--c-fg-mute); margin: 4px 0 0; }
    .field .err { font-size: 12px; color: var(--c-err); margin: 4px 0 0; font-weight: 500; }
    .field.has-error input, .field.has-error select, .field.has-error textarea {
      border-color: var(--c-err); background: var(--c-err-lt); }
    input[type="text"], input[type="email"], input[type="tel"], input[type="number"],
    input[type="password"], input[type="month"], input[type="search"], select, textarea {
      width: 100%; min-height: var(--tap); padding: 10px 12px;
      background: var(--c-elev); color: var(--c-fg);
      border: 1px solid var(--c-border); border-radius: var(--r-md);
      -webkit-appearance: none; appearance: none; }
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--c-accent); outline-offset: 1px; border-color: var(--c-accent); }
    textarea { min-height: 88px; resize: vertical; }
    select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%231a2e1f' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; padding-right: 36px; }

    /* Stepper */
    .stepper { display: inline-flex; align-items: stretch;
      border: 1px solid var(--c-border); border-radius: var(--r-md);
      overflow: hidden; background: var(--c-elev); }
    .stepper button { background: var(--c-sunk); color: var(--c-fg); border: 0;
      min-width: var(--tap); min-height: var(--tap); font-size: 18px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .stepper button:active { background: var(--c-border); }
    .stepper button[disabled] { color: var(--c-fg-mute); cursor: not-allowed; }
    .stepper input { width: 52px; min-height: var(--tap); border: 0;
      border-left: 1px solid var(--c-border); border-right: 1px solid var(--c-border);
      text-align: center; font: 600 15px var(--f-mono); padding: 0; border-radius: 0; }
    .stepper input:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }

    /* Tile selector */
    .tile-group { display: grid; gap: 10px; }
    .tile { display: block; padding: 14px 16px; border-radius: var(--r-md);
      background: var(--c-elev); border: 1.5px solid var(--c-border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      position: relative; }
    .tile input { position: absolute; opacity: 0; pointer-events: none; }
    .tile[data-checked="true"] { border-color: var(--c-accent); background: var(--c-accent-lt); }
    .tile:active { background: var(--c-sunk); }
    .tile[data-checked="true"]:active { background: var(--c-accent-lt); }
    .tile .tile-title { font-weight: 600; font-size: 15px; margin: 0 0 2px; }
    .tile .tile-sub { font-size: 13px; color: var(--c-fg-soft); }

    /* Chip nav */
    .chip-row { display: flex; gap: 6px; overflow-x: auto;
      padding: 4px 0 8px; margin: 0 -4px 12px; -webkit-overflow-scrolling: touch; }
    .chip { display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 12px; border-radius: var(--r-pill);
      background: var(--c-sunk); color: var(--c-fg);
      font: 600 13px var(--f-sans); border: 0; white-space: nowrap;
      cursor: pointer; min-height: 36px;
      -webkit-tap-highlight-color: transparent; }
    .chip[aria-current="true"] { background: var(--c-accent); color: var(--c-fg-rev); }

    /* Toast */
    #toast-host { position: fixed;
      top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none; z-index: 100; }
    .toast { background: var(--c-fg); color: var(--c-fg-rev);
      padding: 10px 16px; border-radius: var(--r-pill);
      font-size: 14px; font-weight: 500;
      max-width: 90vw; box-shadow: var(--sh-pop);
      pointer-events: auto;
      animation: tslide 200ms ease-out; }
    .toast.ok { background: var(--c-ok); }
    .toast.warn { background: var(--c-warn); }
    .toast.err { background: var(--c-err); }
    @keyframes tslide { from { opacity: 0; transform: translateY(-12px); }
                        to { opacity: 1; transform: translateY(0); } }

    /* Banner */
    .banner { padding: 10px 14px; border-radius: var(--r-md);
      font-size: 14px; margin: 0 0 12px;
      border-left: 4px solid var(--c-accent);
      background: var(--c-accent-lt); color: var(--c-fg); }
    .banner.warn { border-color: var(--c-warn); background: var(--c-warn-lt); }
    .banner.err { border-color: var(--c-err); background: var(--c-err-lt); }
    .banner.info { border-color: var(--c-accent); background: var(--c-accent-lt); }

    /* Action sheet */
    #sheet-host { position: fixed; inset: 0; z-index: 90; display: none; }
    #sheet-host[data-open="true"] { display: block; }
    .sheet-backdrop { position: absolute; inset: 0;
      background: var(--c-overlay); animation: bfade 180ms; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--c-elev); border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: 80vh; overflow-y: auto;
      animation: ssup 220ms ease-out; }
    @keyframes bfade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ssup { from { transform: translateY(100%); }
                      to { transform: translateY(0); } }

    /* Wizard */
    .wiz-stepper { display: flex; gap: 6px; padding: 8px 0 16px;
      align-items: center; justify-content: center; }
    .wiz-dot { width: 22px; height: 4px; border-radius: 2px; background: var(--c-border); }
    .wiz-dot.active { background: var(--c-accent); }
    .wiz-dot.done { background: var(--c-accent-dk); }
    .wiz-step-label { text-align: center; font-size: 12px; color: var(--c-fg-mute);
      margin: 0 0 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .wiz-actionbar { position: sticky;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
      background: var(--c-bg); padding: 12px 0;
      display: flex; gap: 10px; align-items: center;
      border-top: 1px solid var(--c-border); margin-top: 16px; z-index: 5; }
    .wiz-actionbar .grow { flex: 1; }
    .wiz-summary { display: flex; flex-direction: column; gap: 10px; }
    .wiz-summary .sum-row { display: flex; justify-content: space-between;
      gap: 12px; padding: 8px 0;
      border-bottom: 1px dashed var(--c-border); }
    .wiz-summary .sum-row:last-child { border-bottom: 0; }
    .wiz-summary .sum-key { font-weight: 600; color: var(--c-fg-soft); font-size: 13px; }
    .wiz-summary .sum-val { text-align: right; font-size: 14px; }
    .wiz-summary .edit-link { display: inline-block; margin: 4px 0 0;
      font-size: 12px; color: var(--c-accent); cursor: pointer;
      background: transparent; border: 0; padding: 0; font-weight: 600; }

    /* Chassis hero (BoM) */
    .bom-card { background: linear-gradient(135deg, var(--c-elev), var(--c-accent-lt));
      border: 1.5px solid var(--c-accent); border-radius: var(--r-lg); padding: 18px;
      position: relative; overflow: hidden; margin: 0 0 16px; }
    .bom-card::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 90% 10%, rgba(200,160,74,0.18), transparent 50%);
      pointer-events: none; }
    .bom-card.empty-bom { background: var(--c-sunk); border: 1px dashed var(--c-border-st); }
    .bom-chassis-sku { font: 700 11px/1 var(--f-mono); letter-spacing: 0.08em;
      color: var(--c-accent-dk); text-transform: uppercase; }
    .bom-chassis-label { font-size: 22px; font-weight: 700; margin: 4px 0 2px;
      letter-spacing: -0.01em; }
    /* v27.1.2 #4b — I/O port summary, sits below chassisLabel above bom-meta */
    .bom-io { font-size: 12.5px; color: var(--c-fg-soft); margin: 0 0 2px;
      line-height: 1.4; }
    .bom-meta { font-size: 13px; color: var(--c-fg-soft); }
    .bom-lines { list-style: none; padding: 0; margin: 14px 0 0;
      border-top: 1px solid var(--c-border); }
    .bom-line { display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px dashed var(--c-border);
      font-size: 14px; gap: 12px; }
    .bom-line:last-child { border-bottom: 0; }
    .bom-line .desc { color: var(--c-fg); flex: 1; }
    .bom-line .qty { font: 600 13px var(--f-mono); color: var(--c-fg-soft); white-space: nowrap; }
    .bom-line .sku { font: 11px var(--f-mono); color: var(--c-fg-mute); display: block; margin-top: 2px; }
    .bom-concerns, .bom-valueadds { margin: 12px 0 0;
      padding: 10px 12px; border-radius: var(--r-sm); }
    .bom-concerns { background: var(--c-warn-lt); border-left: 3px solid var(--c-warn); }
    .bom-concerns h4 { margin: 0 0 4px; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-warn); }
    .bom-valueadds { background: var(--c-accent-lt); border-left: 3px solid var(--c-accent); }
    .bom-valueadds h4 { margin: 0 0 4px; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-accent); }
    .bom-concerns ul, .bom-valueadds ul { margin: 0; padding-left: 18px; font-size: 13px; }

    /* ----- Saved-deal view (alpha.7.1) ----- */
    /* Header band: ref + project + customer/stage */
    .sd-view { padding-bottom: 24px; }
    .sd-header { margin-bottom: 14px; }
    .sd-ref { font: 700 11px/1 var(--f-mono); letter-spacing: 0.08em;
      color: var(--c-fg-soft); text-transform: uppercase; margin-bottom: 6px; }
    .sd-title { margin: 0 0 2px; }
    /* v27.1.2 #8 — expanded header lines + lead_source pill */
    .sd-meta-line { font-size: 12.5px; line-height: 1.45;
      color: var(--c-fg-soft); margin-top: 3px; }
    .sd-meta-line .label { color: var(--c-fg-mute); }
    .sd-pill-source {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: var(--r-pill);
      font: 600 11px/1.4 var(--f-sans);
      letter-spacing: 0.02em; text-transform: none;
    }
    .sd-pill-source.is-cavitak { background: var(--c-ok-lt); color: var(--c-ok); }
    .sd-pill-source.is-tvone   { background: #d6e9f7;       color: #1c5a8a; }

    /* BoM hero wrap (no extra chrome, just spacing) */
    .sd-bom-wrap { margin: 4px 0 8px; }

    /* Sticky action bar — Excel/PDF/Edit/Delete buttons */
    .sd-actionbar {
      position: sticky;
      top: calc(var(--topbar-h, 48px) + var(--tricolor-h, 4px));
      z-index: 5;
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 10px 0;
      background: var(--c-bg);
      border-bottom: 1px solid var(--c-border);
      margin: 8px 0 0;
    }
    .sd-actionbar .btn { flex: 1 1 auto; min-height: 44px; min-width: 64px; }

    /* Sticky chip nav — section jump targets */
    .sd-chipnav {
      position: sticky;
      top: calc(var(--topbar-h, 48px) + var(--tricolor-h, 4px) + 56px);
      z-index: 4;
      display: flex; gap: 6px; overflow-x: auto;
      padding: 8px 0; margin: 0 0 4px;
      background: var(--c-bg);
      border-bottom: 1px solid var(--c-border);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .sd-chipnav::-webkit-scrollbar { display: none; }
    .sd-chip {
      flex: 0 0 auto;
      min-height: 36px; padding: 6px 14px;
      border: 1px solid var(--c-border-st); border-radius: 999px;
      background: var(--c-elev); color: var(--c-fg);
      font: 600 13px/1 var(--f-sans);
      cursor: pointer; white-space: nowrap;
    }
    .sd-chip:active { background: var(--c-accent-lt); border-color: var(--c-accent); }

    /* Accordion sections via <details>/<summary> */
    .sd-accordion { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .sd-section {
      background: var(--c-elev);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .sd-summary {
      list-style: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      min-height: 48px;       /* tap target per SPEC §9.2 */
      padding: 10px 14px;
      font-weight: 600;
      user-select: none;
    }
    .sd-summary::-webkit-details-marker { display: none; }
    .sd-summary-title { flex: 1 1 auto; }
    .sd-summary-meta { display: flex; align-items: center; gap: 8px; }
    /* v27.3.0 — section + chip icons */
    .sd-section-icon {
      width: 32px; height: 32px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--accent-soft, #fff3e6);
      color: var(--accent-deep, #d97316);
      display: inline-flex; align-items: center; justify-content: center;
      margin-right: 4px;
    }
    .sd-section-icon svg { width: 17px; height: 17px; }
    .sd-chip-icon {
      display: inline-flex; align-items: center;
      width: 14px; height: 14px;
      margin-right: 6px;
      color: var(--ink-soft, #6b6660);
      vertical-align: middle;
    }
    .sd-chip-icon svg { width: 14px; height: 14px; }
    .sd-chip.active .sd-chip-icon,
    .sd-chip:hover .sd-chip-icon { color: var(--accent-deep, #d97316); }
    .sd-badge {
      font: 600 11px/1 var(--f-mono);
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--c-sunk);
      color: var(--c-fg-soft);
      letter-spacing: 0.04em;
    }
    .sd-chevron {
      font-size: 18px;
      color: var(--c-fg-soft);
      transition: transform 0.18s ease;
      display: inline-block;
    }
    .sd-section[open] .sd-chevron { transform: rotate(90deg); }

    .sd-section-body {
      padding: 4px 14px 14px;
      border-top: 1px solid var(--c-border);
    }
    .sd-subhead {
      font: 600 11px/1 var(--f-sans);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--c-fg-soft);
      margin: 12px 0 4px;
    }
    .sd-subhead:first-child { margin-top: 8px; }
    .sd-row {
      display: flex; gap: 12px; align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid var(--c-border);
      font-size: 14px;
    }
    .sd-row:last-child { border-bottom: 0; }
    .sd-row-k { flex: 0 0 38%; color: var(--c-fg-soft); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.04em; }
    .sd-row-v { flex: 1 1 auto; word-break: break-word; }
    .sd-row-muted { color: var(--c-fg-mute); font-style: italic; padding: 8px 0; }
    .sd-edit-note { padding: 10px 0 0; }

    /* alpha.7.2 — Autosave status pill in saved-deal header */
    .sd-ref-row { display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px; flex-wrap: wrap; }
    .sd-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border-radius: var(--r-pill);
      letter-spacing: 0.02em;
      transition: background-color 0.18s ease, color 0.18s ease, opacity 0.18s ease;
    }
    .sd-status-idle    { opacity: 0; pointer-events: none; }
    .sd-status-edited  { background: rgba(245,158,11,0.12); color: #B45309; }
    .sd-status-saving  { background: var(--accent-soft);    color: var(--accent-deep); }
    .sd-status-saved   { background: rgba(34,197,94,0.12);  color: #15803D; }
    .sd-status-error   {
      background: rgba(185,28,28,0.10);
      color: #B91C1C;
      border: 1px solid #B91C1C;
    }
    .sd-status .spinner-sm {
      animation: ptr-spin 0.8s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .sd-status { transition: none; }
      .sd-status .spinner-sm { animation: none; }
    }

    /* alpha.7.2 — Editable form fields inside accordion body */
    .sd-section-body .field { margin: 10px 0; display: block; }
    .sd-section-body .field label {
      display: block; font: 600 12px/1.4 var(--f-sans);
      color: var(--c-fg-soft); text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 5px;
    }
    .sd-section-body .field input,
    .sd-section-body .field select {
      width: 100%; min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--c-border-st);
      border-radius: 8px;
      background: var(--c-bg);
      color: var(--c-fg);
      font: 400 15px/1.3 var(--f-sans);
      box-sizing: border-box;
    }
    .sd-section-body .field input:focus,
    .sd-section-body .field select:focus {
      outline: none;
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px var(--c-accent-lt);
    }
    .sd-section-body .field .help {
      font-size: 11px; color: var(--c-fg-mute); margin-top: 4px;
    }
    .sd-section-body .h3 {
      margin: 18px 0 4px; font-size: 14px;
      color: var(--c-fg-soft);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sd-section-body .h3:first-child { margin-top: 4px; }

    /* Spinner for loading state (alpha.7.0 leftover, reused) */
    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid var(--c-border);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: sd-spin 0.8s linear infinite;
    }
    @keyframes sd-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .sd-chevron { transition: none; }
    }

    /* Common layouts */
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .row.gap-2 { gap: 8px; }
    .row.gap-4 { gap: 16px; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--c-fg-mute); }
    .soft { color: var(--c-fg-soft); }
    .mono { font-family: var(--f-mono); }
    .t-center { text-align: center; }
    .small { font-size: 13px; }
    .tiny { font-size: 12px; }
    .h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
    .h2 { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
    .h3 { font-size: 13px; font-weight: 700; margin: 0 0 6px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-fg-soft); }
    .sp-12 { height: 12px; } .sp-24 { height: 24px; }

    /* Login */
    .login-bg { min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      background: linear-gradient(180deg, var(--c-bg), var(--c-accent-lt)); }
    .login-card { max-width: 380px; width: 100%; background: var(--c-elev);
      border-radius: var(--r-lg); padding: 24px; box-shadow: var(--sh-pop); }
    .login-card .brand { display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin: 0 0 20px; }
    .login-card .brand .logo { width: 56px; height: 56px; border-radius: 12px;
      background: var(--c-accent); display: flex; align-items: center;
      justify-content: center; color: var(--c-fg-rev); font-weight: 700; font-size: 22px; }
    .login-card .ver-tag { color: var(--c-fg-mute); font: 11px var(--f-mono); margin-top: 4px; }

    /* Home dashboard tiles */
    .dash-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin: 0 0 16px; }
    .dash-tile { background: var(--c-elev); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; text-align: left;
      min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; }
    .dash-tile:active { background: var(--c-sunk); }
    .dash-tile h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
    .dash-tile p { margin: 0; font-size: 12px; color: var(--c-fg-mute); }
    .dash-tile .big-num { font: 700 22px var(--f-mono); color: var(--c-accent); }

    /* History row */
    .history-row { background: var(--c-elev); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 12px 14px; margin: 0 0 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: block; width: 100%; text-align: left; }
    .history-row:active { background: var(--c-sunk); }
    .history-row .ref { font: 600 12px var(--f-mono); color: var(--c-accent); }
    .history-row .proj { font-weight: 600; margin: 2px 0; font-size: 15px; }
    .history-row .meta { font-size: 12px; color: var(--c-fg-mute);
      display: flex; gap: 10px; flex-wrap: wrap; }

    /* alpha.8.3 — Soft-deleted history rows: muted, non-clickable container */
    .history-row-deleted { cursor: default; opacity: 0.75; }
    .history-row-deleted:active { background: var(--c-elev); }
    .history-row-deleted .ref { color: var(--c-fg-mute); }
    .history-row-deleted .proj { text-decoration: line-through; color: var(--c-fg-mute); }
    .history-row-deleted .tag.muted { background: var(--c-sunk); color: var(--c-fg-mute); }

    /* Empty state */
    .empty { text-align: center; padding: 32px 16px; color: var(--c-fg-mute); }
    .empty .ico { font-size: 32px; margin-bottom: 8px; }

    /* Misc */
    .hidden { display: none !important; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: var(--c-accent); color: var(--c-fg-rev); vertical-align: middle; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: var(--r-pill);
      font: 600 11px/1.4 var(--f-sans); background: var(--c-sunk); color: var(--c-fg-soft); }
    .tag.ok { background: var(--c-ok-lt); color: var(--c-ok); }
    .tag.warn { background: var(--c-warn-lt); color: var(--c-warn); }
    .tag.accent { background: var(--c-accent-lt); color: var(--c-accent); }
    code { font-family: var(--f-mono); font-size: 13px;
      background: rgba(0,0,0,0.05); padding: 1px 5px; border-radius: 3px; }
    pre { background: #0e1c14; color: #d5e5db; padding: 14px;
      border-radius: 8px; font: 12px/1.5 var(--f-mono); margin: 12px 0 0;
      overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    pre .ok-ln { color: #8fd6a3; }
    pre .err-ln { color: #f08070; }
    pre .warn-ln { color: #f0c060; }

    /* Stepper-row (label + stepper) */
    .step-row { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; gap: 12px; border-bottom: 1px dashed var(--c-border); }
    .step-row:last-child { border-bottom: 0; }
    .step-row .step-label { flex: 1; }
    .step-row .step-label .name { font-weight: 600; font-size: 14px; }
    .step-row .step-label .sub { font-size: 12px; color: var(--c-fg-mute); margin-top: 2px; }

    /* Scale to wider screens */
    @media (min-width: 768px) {
      #view-root .v { padding: 24px 16px; }
      .dash-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
    }

    /* Print */
    @media print {
      .topbar, .app-topbar, .bottom-nav, .wiz-actionbar, .bom-action-bar { display: none !important; }
      body { background: white; }
      body::before, body::after { display: none !important; }
    }

    /* ============================================================
       v27.3.0 CHROME + COMPONENTS (LOCKED — REF-phase3 v4)
       ============================================================ */

    /* --- TOP BAR --- */
    .app-topbar {

    /* --- BOTTOM NAV (restyle) --- */
    /* New bottom-nav rules override the legacy .bottom-nav block earlier in the
       file via source order. The legacy block is left intact during transition. */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 0.5px solid var(--border-soft);
      box-shadow: none;
      display: flex; justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav button {
      flex: 1; min-height: var(--nav-h); border: 0; background: transparent;
      color: var(--ink-soft); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 4px;
      font: 600 11px var(--font-display);
      position: relative;
      -webkit-tap-highlight-color: transparent;
      transition: color var(--dur-base) var(--ease-out);
    }
    .bottom-nav button[aria-current="page"] { color: var(--accent); }
    .bottom-nav button[aria-current="page"]::before {
      content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px;
      background: var(--accent); border-radius: 0 0 3px 3px;
      animation: nav-indicator var(--dur-base) var(--ease-spring);
    }
    @keyframes nav-indicator { from { transform: scaleX(0.5); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    .bottom-nav button:active { transform: scale(0.95); background: transparent; }
    .bottom-nav button .icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Tricolor bar permanently hidden in v27.3.0 */
    .tricolor-bar { display: none !important; }

    /* --- PAGE HEADER (used across all screens for uniformity) --- */
    .page-header { margin-bottom: var(--s-7); }
    .page-header .eyebrow {
      font-family: var(--font-display);
      font-weight: 600; font-size: var(--t-eyebrow);

      font-family: var(--font-display);

    /* --- CHIPS (with stage-color variants + leading status dot) --- */
    .chip-v3 {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px;
      border-radius: var(--r-pill);
      font-family: var(--font-display);
      font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
      background: var(--bg-subtle); color: var(--ink-mid);
      border: 0.5px solid var(--border-soft);
      white-space: nowrap;
    }
    .chip-v3.chip-accent  { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; }
    .chip-v3.chip-success { background: var(--success-soft); color: var(--success); border-color: transparent; }
    .chip-v3.chip-warning { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
    .chip-v3.chip-danger  { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .chip-v3.chip-info    { background: var(--info-soft); color: var(--info); border-color: transparent; }
    .chip-v3.chip-pink    { background: #FCE7F3; color: #9D174D; border-color: transparent; }
    html[data-theme="dark"] .chip-v3.chip-pink { background: rgba(244,114,182,0.18); color: #F9A8D4; }
    .chip-v3.chip-accent::before, .chip-v3.chip-success::before, .chip-v3.chip-warning::before,
    .chip-v3.chip-danger::before, .chip-v3.chip-info::before, .chip-v3.chip-pink::before {
      content: ''; display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;

    /* --- BUTTONS (v3) --- */
    .btn-v3 {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-family: var(--font-display); font-weight: 600;
      letter-spacing: 0.01em;
      border: none; cursor: pointer;
      border-radius: var(--r-sm);
      transition:
        transform var(--dur-fast) var(--ease-spring),
        background var(--dur-base) var(--ease-out),
        box-shadow var(--dur-base) var(--ease-out),
        color var(--dur-base) var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .btn-v3:active:not(:disabled) { transform: scale(0.97); }
    .btn-v3:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-v3.btn-sm { padding: 7px 12px; font-size: 12.5px; min-height: 30px; border-radius: var(--r-xs); }
    .btn-v3.btn-md { padding: 10px 16px; font-size: var(--t-body-sm); min-height: 38px; }

    .btn-v3.btn-secondary:hover:not(:disabled) { background: var(--bg-card-hover); border-color: var(--border-strong); }
    .btn-v3.btn-ghost { background: transparent; color: var(--ink-mid); }
    .btn-v3.btn-ghost:hover:not(:disabled) { background: var(--bg-subtle); color: var(--ink-strong); }

    .card-v3 {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-md);

      font-family: var(--font-display);

      color: var(--ink-mid);
      margin-bottom: 6px;
