  /* ============================================================
     EXPORT — Session 8 (alpha.8.0)
     Lazy-loads ExcelJS / jsPDF / html2canvas on first use, then
     produces Excel + PDF blobs from a saved-deal payload.

     Network restriction risk: Cavitak office has been known to block
     some CDNs (per BS work notes). If jsdelivr is blocked at the
     network level, fallback is inline-bundled libraries (~1.2 MB
     added to the HTML — only worth it if reachability fails).
     Test reachability before relying on the lazy-load path.

     UMD note: ExcelJS / jsPDF / html2canvas all ship UMD that
     attaches to window.* . Native ES `import()` doesn't work; we
     inject a <script> tag and wait for onload.
     ============================================================ */
  const EXPORT = (function() {

    // CDN endpoints. Versions pinned for reproducibility.
    const CDN_EXCELJS     = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    const CDN_JSPDF       = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
    const CDN_HTML2CANVAS = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';

    // Cache promise per URL so concurrent calls don't double-fetch.
    const _loadPromises = {};

    // Inject a <script> tag and resolve when it fires onload. Errors are
    // surfaced as Promise rejection so callers can fall back / toast.
    function loadScript(url) {
      if (_loadPromises[url]) return _loadPromises[url];
      _loadPromises[url] = new Promise(function(resolve, reject) {
        // Defensive: if the script is already in the DOM (manually added,
        // hot-reloaded etc.) and the library is on window, short-circuit.
        if (document.querySelector('script[src="' + url + '"]')) {
          return resolve();
        }
        const s = document.createElement('script');
        s.src = url;
        s.async = true;
        s.onload  = function() { resolve(); };
        s.onerror = function() {
          // Drop the cached rejected promise so a retry can re-attempt.
          delete _loadPromises[url];
          reject(new Error('Failed to load ' + url));
        };
        document.head.appendChild(s);
      });
      return _loadPromises[url];
    }

    async function loadExcelJS() {
      if (window.ExcelJS) return window.ExcelJS;
      await loadScript(CDN_EXCELJS);
      if (!window.ExcelJS) throw new Error('ExcelJS loaded but window.ExcelJS missing');
      return window.ExcelJS;
    }

    async function loadJsPDF() {
      if (window.jspdf && window.jspdf.jsPDF) return window.jspdf;
      await loadScript(CDN_JSPDF);
      // jsPDF UMD attaches as window.jspdf with .jsPDF constructor
      if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF loaded but window.jspdf.jsPDF missing');
      return window.jspdf;
    }

    async function loadHtml2Canvas() {
      if (window.html2canvas) return window.html2canvas;
      await loadScript(CDN_HTML2CANVAS);
      if (!window.html2canvas) throw new Error('html2canvas loaded but window.html2canvas missing');
      return window.html2canvas;
    }

    // Download helper. iOS Safari doesn't honour <a download> for blob URLs,
    // so we open the blob in a new tab — user taps Share → Save to Files.
    // Android + desktop browsers respect the download attribute → direct save.
    //
    // We detect iOS by UA (imperfect but the standard heuristic).
    function isIOS() {
      const ua = navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) ||
        // iPadOS 13+ identifies as Mac with touch — distinguish from desktop
        (ua.indexOf('Mac') >= 0 && navigator.maxTouchPoints > 1);
    }

    function download(blob, filename) {
      if (!blob) throw new Error('download: blob required');
      if (!filename) throw new Error('download: filename required');

      const url = URL.createObjectURL(blob);

      if (isIOS()) {
        // iOS: open in new tab. User taps Share → Save to Files.
        // The new-tab URL doesn't keep the filename; the file will save
        // with a hash-like name unless the user renames in Files. Worth
        // a one-time hint toast (Session 7 todo: localStorage flag).
        const w = window.open(url, '_blank');
        if (!w) {
          // Popup blocked — fall back to direct navigation (loses tab continuity
          // but at least the file appears).
          window.location.href = url;
        }
        // Don't revoke immediately on iOS — the new tab needs the URL alive
        // long enough to render the share sheet. Revoke after a delay.
        setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
        return { method: 'ios-newtab' };
      }

      // Android / desktop: anchor download attribute.
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // Revoke after a small delay so the download has time to initiate.
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
      return { method: 'anchor-download' };
    }

    // Filename pattern (per SPEC §5.1)
    function filename(deal, ext) {
      const ref = (deal && (deal.display_ref || deal.ref || 'NOREF'));
      const date = new Date().toISOString().slice(0, 10);
      return 'tvONE_Quote_' + ref + '_' + date + '.' + ext;
    }

    // alpha.8.1 — Excel generation
    //
    // Layout (per plan §Session 8 / SPEC §5.1):
    //   Row 1: Title (merged A1:D1) — forest-green bold
    //   Row 2: Ref + generated date (merged) — italic muted
    //   Row 3: (empty)
    //   Rows 4-11: Project context, 2-column layout
    //   Row 12: (empty)
    //   Row 13: "Bill of Materials" header (merged, accent fill)
    //   Row 14: Column headers (Sr / Description / Model / Qty)
    //   Row 15+: Line items
    //   After: Concerns block (red) + Value-adds block (green)
    //   Last: Cavitak footer (merged, muted)
    //
    // Lines come from a fresh APP.recoForDeal call so the Excel reflects
    // what the user sees in the BoM card on the saved-deal view. If the
    // user has unsaved structural edits, both the on-screen BoM and the
    // Excel reflect current state (consistent UX).
    async function excel(deal) {
      if (!deal) throw new Error('excel: deal required');
      const ExcelJS = await loadExcelJS();

      // Compute fresh reco — matches the BoM card on saved-deal view.
      let reco = null;
      try {
        if (typeof APP !== 'undefined' && APP.recoForDeal) {
          reco = APP.recoForDeal(deal);
        }
      } catch (_e) { /* leave reco null */ }

      const wb = new ExcelJS.Workbook();
      wb.creator = 'tvONE Product Selector';
      wb.created = new Date();

      const ws = wb.addWorksheet('Quote', {
        pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true,
          margins: { left: 0.5, right: 0.5, top: 0.5, bottom: 0.5,
                     header: 0.3, footer: 0.3 } }
      });

      // Column widths
      ws.columns = [
        { width:  6 },   // Sr
        { width: 44 },   // Description
        { width: 20 },   // Model
        { width:  8 }    // Qty
      ];

      // ---- Title ----
      ws.mergeCells('A1:D1');
      const titleCell = ws.getCell('A1');
      titleCell.value = 'tvONE Product Selector \u2014 Quote';
      titleCell.font = { name: 'Arial', size: 16, bold: true, color: { argb: 'FF1F4E1F' }};
      titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.getRow(1).height = 28;

      // ---- Ref + date ----
      ws.mergeCells('A2:D2');
      const refCell = ws.getCell('A2');
      const ref = deal.display_ref || deal.ref || 'NOREF';
      refCell.value = ref + '  \u00b7  Generated ' + new Date().toISOString().slice(0, 10);
      refCell.font = { name: 'Arial', size: 10, italic: true, color: { argb: 'FF666666' }};
      refCell.alignment = { horizontal: 'center' };

      // ---- Project context (2-column) ----
      function ctxRow(rowIdx, k1, v1, k2, v2) {
        const r = ws.getRow(rowIdx);
        r.getCell(1).value = k1; r.getCell(1).font = { bold: true, size: 10 };
        r.getCell(2).value = (v1 == null || v1 === '') ? '\u2014' : String(v1);
        r.getCell(3).value = k2; r.getCell(3).font = { bold: true, size: 10 };
        r.getCell(4).value = (v2 == null || v2 === '') ? '\u2014' : String(v2);
        r.getCell(2).alignment = { wrapText: true };
        r.getCell(4).alignment = { wrapText: true };
      }
      ctxRow(4,  'Project',     deal.project,         'End User',         deal.customer_name);
      ctxRow(5,  'Partner',     deal.partner_name,    'Consultant',       deal.consultant_name);
      ctxRow(6,  'Venue type',  deal.venue_type,      'City',             deal.city);
      ctxRow(7,  'State',       deal.state,           'Stage',            deal.stage);
      ctxRow(8,  'Lead Origin', deal.lead_source,     'Expected closure', deal.close_month);
      ctxRow(9,  'Salesperson', labelFor(deal.sales_person_id, SALES_TEAM), 'Presales', labelFor(deal.presales_person_id, PRESALES_TEAM));

      // v27.1.1 — Partner contact (Name + Phone + Email). Skip when blank so
      // we don't leave an empty row. Single merged row 10 with all three
      // chunks separated by " \u00b7 " for readability.
      const contactParts = [];
      if (deal.contact_name  && String(deal.contact_name).trim())  contactParts.push(String(deal.contact_name).trim());
      if (deal.contact_phone && String(deal.contact_phone).trim()) contactParts.push(String(deal.contact_phone).trim());
      if (deal.contact_email && String(deal.contact_email).trim()) contactParts.push(String(deal.contact_email).trim());
      if (contactParts.length > 0) {
        ws.mergeCells('A10:D10');
        const cc = ws.getRow(10).getCell(1);
        cc.value = 'Partner contact: ' + contactParts.join(' \u00b7 ');
        cc.font = { size: 10 };
        cc.alignment = { wrapText: true, vertical: 'top' };
        ws.getRow(10).height = 20;
      }

      // v27.1.1 — External notes only (internal notes are hidden from exports).
      // Row 11 (was row 10 in v27.1.0). BoM header stays at row 13 regardless.
      if (deal.external_notes && String(deal.external_notes).trim()) {
        ws.mergeCells('A11:D11');
        const notesCell = ws.getRow(11).getCell(1);
        notesCell.value = 'Notes: ' + String(deal.external_notes).trim();
        notesCell.font = { size: 10 };
        notesCell.alignment = { wrapText: true, vertical: 'top' };
        ws.getRow(11).height = Math.min(80, Math.max(20, String(deal.external_notes).length / 4));
      }

      // ---- BoM header ----
      ws.mergeCells('A13:D13');
      const bomHdr = ws.getCell('A13');
      bomHdr.value = 'Bill of Materials';
      bomHdr.font  = { bold: true, size: 13, color: { argb: 'FF1F4E1F' }};
      bomHdr.fill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8F1E8' }};
      bomHdr.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.getRow(13).height = 22;

      // ---- Column headers ----
      const COL_LABELS = ['Sr', 'Description', 'Model', 'Qty'];
      const COL_ALIGNS = ['center', 'left', 'left', 'right'];
      const headerRow = ws.getRow(14);
      COL_LABELS.forEach(function(label, i) {
        const cell = headerRow.getCell(i + 1);
        cell.value = label;
        cell.font  = { bold: true, size: 10 };
        cell.fill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF0F0F0' }};
        cell.alignment = { horizontal: COL_ALIGNS[i], vertical: 'middle' };
        cell.border = {
          top:    { style: 'thin' },
          bottom: { style: 'thin' }
        };
      });

      // ---- Line rows ----
      // Build from reco (matches UI BoM card). Chassis prepended if not in cards.
      const fam = (deal.solutionType || '').toUpperCase();
      const lineRows = [];
      if (reco) {
        if (reco.chassis) {
          const chassisLabel = (reco.meta && reco.meta.chassisLabel) || reco.chassis;
          lineRows.push({ sku: reco.chassis, desc: chassisLabel, qty: 1 });
        }
        if (Array.isArray(reco.cards)) {
          reco.cards.forEach(function(c) {
            // Skip if it's the chassis already (defence-in-depth)
            if (reco.chassis && c.sku === reco.chassis) return;
            lineRows.push({
              sku: c.sku,
              desc: c.desc || c.label || c.sku,
              qty: c.qty != null ? c.qty : 1
            });
          });
        }
      }
      // Fallback: persisted lines (if reco didn't produce anything)
      if (lineRows.length === 0 && Array.isArray(deal.lines)) {
        deal.lines.forEach(function(l) {
          lineRows.push({
            sku: l.model_no || l.sku || '\u2014',
            desc: l.description || l.desc || '\u2014',
            qty: l.qty != null ? l.qty : 1
          });
        });
      }

      let curRow = 15;
      if (lineRows.length === 0) {
        ws.mergeCells(curRow, 1, curRow, 4);
        const empty = ws.getCell(curRow, 1);
        empty.value = '(No BoM lines \u2014 set solution type + I/O and rebuild)';
        empty.font = { italic: true, color: { argb: 'FF888888' }};
        empty.alignment = { horizontal: 'center' };
        curRow++;
      } else {
        lineRows.forEach(function(line, i) {
          const r = ws.getRow(curRow);
          r.getCell(1).value = i + 1;
          r.getCell(1).alignment = { horizontal: 'center', vertical: 'top' };
          r.getCell(2).value = line.desc;
          r.getCell(2).alignment = { wrapText: true, vertical: 'top' };
          r.getCell(3).value = line.sku;
          r.getCell(3).alignment = { vertical: 'top' };
          r.getCell(3).font = { name: 'Courier New', size: 10 };
          r.getCell(4).value = line.qty;
          r.getCell(4).alignment = { horizontal: 'right', vertical: 'top' };
          // Light row border so reps can see line separation in print
          [1,2,3,4].forEach(function(c) {
            r.getCell(c).border = { bottom: { style: 'hair', color: { argb: 'FFCCCCCC' }}};
          });
          curRow++;
        });
      }

      // ---- Concerns block ----
      if (reco && Array.isArray(reco.concerns) && reco.concerns.length > 0) {
        curRow += 1;
        ws.mergeCells(curRow, 1, curRow, 4);
        const h = ws.getCell(curRow, 1);
        h.value = 'Concerns';
        h.font  = { bold: true, size: 11, color: { argb: 'FFB91C1C' }};
        curRow++;
        reco.concerns.forEach(function(c) {
          ws.mergeCells(curRow, 1, curRow, 4);
          const cell = ws.getCell(curRow, 1);
          cell.value = '\u2022 ' + c;
          cell.alignment = { wrapText: true, vertical: 'top' };
          cell.font = { size: 10 };
          curRow++;
        });
      }

      // ---- Value-adds block ----
      if (reco && Array.isArray(reco.valueAdds) && reco.valueAdds.length > 0) {
        curRow += 1;
        ws.mergeCells(curRow, 1, curRow, 4);
        const h = ws.getCell(curRow, 1);
        h.value = 'Value-adds';
        h.font  = { bold: true, size: 11, color: { argb: 'FF1F4E1F' }};
        curRow++;
        reco.valueAdds.forEach(function(v) {
          ws.mergeCells(curRow, 1, curRow, 4);
          const cell = ws.getCell(curRow, 1);
          cell.value = '\u2022 ' + v;
          cell.alignment = { wrapText: true, vertical: 'top' };
          cell.font = { size: 10 };
          curRow++;
        });
      }

      // ---- Footer (Cavitak attribution) ----
      curRow += 2;
      ws.mergeCells(curRow, 1, curRow, 4);
      const foot = ws.getCell(curRow, 1);
      foot.value = 'Cavitak Marketing Pvt Ltd  \u00b7  tvONE India distributor';
      foot.font = { italic: true, size: 9, color: { argb: 'FF666666' }};
      foot.alignment = { horizontal: 'center' };

      // ---- Generate blob ----
      const buffer = await wb.xlsx.writeBuffer();
      return new Blob([buffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
    }

    // alpha.8.2 — PDF generation (native jsPDF, no html2canvas)
    //
    // Layout matches Excel:
    //   Forest-green title bar with white text
    //   Centered ref + date
    //   2-column project context
    //   BoM header bar + column headers + line rows (with hair borders)
    //   Concerns (red header) + Value-adds (green header) blocks

    //
    // Native (not html2canvas) for sharp text + small files. Hybrid

    async function pdf(deal) {

      const JsPDFCtor = jspdf.jsPDF;

      try {

        }
      } catch (_e) { /* leave null */ }

      // A4 portrait, points (1pt = 1/72 inch)
      const doc = new JsPDFCtor({ unit: 'pt', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();   // ~595
      const H = doc.internal.pageSize.getHeight();  // ~842
      const M = 40;
      let y = 0;

      // ---- Title bar ----
      doc.setFillColor(31, 78, 31); // forest green
      doc.rect(0, 0, W, 50, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.text('tvONE Product Selector \u2014 Quote', W / 2, 32, { align: 'center' });

      const ref = deal.display_ref || deal.ref || 'NOREF';

      doc.setFontSize(10);
      doc.text(ref + '  \u00b7  Generated ' + new Date().toISOString().slice(0, 10),
        W / 2, y, { align: 'center' });
      y += 25;

      // ---- Project context (2-column) ----
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(10);
      const colA_label  = M;
      const colA_value  = M + 95;
      const colB_label  = W / 2 + 10;
      const colB_value  = W / 2 + 105;

      function ctxRow(k1, v1, k2, v2) {
        doc.setFont('helvetica', 'bold');

      ctxRow('Project',     deal.project,         'End User',         deal.customer_name);
      ctxRow('Partner',     deal.partner_name,    'Consultant',       deal.consultant_name);
      ctxRow('Venue type',  deal.venue_type,      'City',             deal.city);
      ctxRow('State',       deal.state,           'Stage',            deal.stage);
      ctxRow('Lead Origin', deal.lead_source,     'Expected closure', deal.close_month);
      ctxRow('Salesperson', labelFor(deal.sales_person_id, SALES_TEAM), 'Presales', labelFor(deal.presales_person_id, PRESALES_TEAM));

      // v27.1.1 — Partner contact line. Skip when all three are blank.
      const contactParts = [];
      if (deal.contact_name  && String(deal.contact_name).trim())  contactParts.push(String(deal.contact_name).trim());
      if (deal.contact_phone && String(deal.contact_phone).trim()) contactParts.push(String(deal.contact_phone).trim());
      if (deal.contact_email && String(deal.contact_email).trim()) contactParts.push(String(deal.contact_email).trim());
      if (contactParts.length > 0) {
        y += 6;
        doc.setFont('helvetica', 'bold');
        doc.text('Partner contact:', colA_label, y);
        doc.setFont('helvetica', 'normal');
        doc.text(contactParts.join(' \u00b7 '), colA_label + 90, y, { maxWidth: W - 2 * M - 90 });
        y += 15;
      }

      // v27.1.1 — External notes only (internal_notes is hidden from exports).
      if (deal.external_notes && String(deal.external_notes).trim()) {
        y += 6;
        doc.setFont('helvetica', 'bold');
        doc.text('Notes:', colA_label, y);
        doc.setFont('helvetica', 'normal');
        const notesLines = doc.splitTextToSize(String(deal.external_notes).trim(), W - 2 * M - 40);
        doc.text(notesLines, colA_label + 40, y);
        y += notesLines.length * 12;
      }

      y += 10;

      // ---- Page-break helper (reserves footer space) ----
      function checkPageBreak(needed) {
        if (y + needed > H - M - 30) {
          doc.addPage();
          y = M;
        }
      }

      // ---- BoM header ----
      checkPageBreak(28);
      doc.setFillColor(232, 241, 232); // accent light
      doc.rect(M, y, W - 2 * M, 22, 'F');
      doc.setTextColor(31, 78, 31);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.text('Bill of Materials', W / 2, y + 15, { align: 'center' });
      y += 28;

      // ---- Column headers ----
      const colSr    = M + 5;
      const colDesc  = M + 45;
      const colModel = W - M - 170;
      const colQty   = W - M - 5;

      doc.setFillColor(240, 240, 240);
      doc.rect(M, y, W - 2 * M, 18, 'F');
      doc.setTextColor(0, 0, 0);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('Sr',          colSr,    y + 12);
      doc.text('Description', colDesc,  y + 12);
      doc.text('Model',       colModel, y + 12);
      doc.text('Qty',         colQty,   y + 12, { align: 'right' });
      y += 22;

      // ---- Line items ----
      const lineRows = [];
      if (reco) {
        if (reco.chassis) {
          const chassisLabel = (reco.meta && reco.meta.chassisLabel) || reco.chassis;
          lineRows.push({ sku: reco.chassis, desc: chassisLabel, qty: 1 });
        }
        if (Array.isArray(reco.cards)) {
          reco.cards.forEach(function(c) {
            if (reco.chassis && c.sku === reco.chassis) return;
            lineRows.push({

    /* ============================================================
       Saved-deal autosave (alpha.7.2)

       SOFT fields autosave silently (debounce 1s). STRUCTURAL fields
       remain read-only in 7.2; editing them triggers the rebuild flow
       which lands in alpha.7.3.

       Save model:
         user edits soft field → mutate _savedDealData[field] in place
         → setSavedDealStatus('edited') → schedule timer (1s)
         → on fire: setSavedDealStatus('saving')
         → STORE.saveDeal(_savedDealData) — full payload incl. lines /
           screens / sx_data (Session 4 gotcha: destructive on arrays)
         → on success: setSavedDealStatus('saved')
         → on error:   setSavedDealStatus('error', msg)

       Race safety:
         _activeSavedDealRefId guards against navigation-mid-save.
         disposeSavedDeal() flushes any pending timer before route change.
       ============================================================ */

    const SOFT_FIELDS = [
      'project', 'customer_name', 'partner_name', 'consultant_name',
      'venue_type', 'city', 'state',
      'stage', 'lead_source', 'sales_person_id', 'presales_person_id',
      'close_month',
      'contact_name', 'contact_phone', 'contact_email',
      'internal_notes', 'external_notes'
    ];

    // Reference list for alpha.7.3 — read by the Rebuild flow.
    const STRUCTURAL_FIELDS = [
      'solutionType',
      'calico_inputs', 'calico_outputs', 'calico_audio',
      'mv_inputs', 'mv_outputSignal',
      'corio_inputs', 'corio_outputs', 'corio_audio', 'corio_fanFilter',
      // v27.1.2 #7 — corio_canvases persisted via raw_submission. UI-only this
      // release; algorithm consumer lands in v27.1.3.

      'hasLed', 'screens',
      'hasSx', 'sx_data'

    // Module-level autosave state (one saved-deal is viewed at a time).
    let _savedDealData    = null;
    let _savedDealRefId   = null;
    let _autosaveTimer    = null;
    let _autosaveInFlight = false;
    const AUTOSAVE_DEBOUNCE_MS = 1000;

    // Field-render helpers for saved-deal accordion. Mirror wizard step 1's
    // shape but use data-sd-bind (separate delegation from data-bind which
    // belongs to wizardData) and unique ID prefix (sd-i-) to avoid clashing
    // with wizard inputs if both views are ever in DOM (they're not, but
    // defence-in-depth).
    function sdField(id, label, value, opts) {
      opts = opts || {};
      const type = opts.type || 'text';
      const placeholder = opts.placeholder || '';
      const inputmode = opts.inputmode ? ' inputmode="' + opts.inputmode + '"' : '';
      const maxlength = opts.maxlength ? ' maxlength="' + opts.maxlength + '"' : '';
      const listAttr = opts.list ? ' list="' + opts.list + '"' : '';
      const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
      return '<div class="field" id="sd-f-' + id + '">' +
        '<label for="sd-i-' + id + '">' + esc(label) + '</label>' +
        '<input id="sd-i-' + id + '" data-sd-bind="' + id + '" type="' + type + '"' +
          inputmode + maxlength + listAttr + ' value="' + esc(value == null ? '' : value) + '"' +
          (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '>' +
        helpHtml +
      '</div>';
    }
    // v27.1.0 — Multiline variant of sdField. Same data-sd-bind delegation,
    // same sd-i- prefix. textarea.value works identically to input.value so
    // no handler changes needed.
    function sdTextarea(id, label, value, opts) {
      opts = opts || {};
      const placeholder = opts.placeholder || '';
      const rows = opts.rows || 3;
      const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
      return '<div class="field" id="sd-f-' + id + '">' +
        '<label for="sd-i-' + id + '">' + esc(label) + '</label>' +
        '<textarea id="sd-i-' + id + '" data-sd-bind="' + id + '" rows="' + rows + '"' +
          (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '>' +
          esc(value == null ? '' : value) +
        '</textarea>' +
        helpHtml +
      '</div>';
    }
    function sdSelectField(id, label, value, options, opts) {
      opts = opts || {};
      const optsHtml = (opts.placeholder ? '<option value="">' + esc(opts.placeholder) + '</option>' : '') +
        options.map(o => {
          const v = typeof o === 'string' ? o : o.value;
          const l = typeof o === 'string' ? o : o.label;
          return '<option value="' + esc(v) + '"' +
            (String(value || '') === String(v) ? ' selected' : '') + '>' + esc(l) + '</option>';
        }).join('');
      return '<div class="field" id="sd-f-' + id + '">' +
        '<label for="sd-i-' + id + '">' + esc(label) + '</label>' +
        '<select id="sd-i-' + id + '" data-sd-bind="' + id + '">' + optsHtml + '</select>' +
      '</div>';
    }

    // Status pill — 'idle' | 'edited' | 'saving' | 'saved' | 'error'
    function setSavedDealStatus(state, detail) {
      const el = document.getElementById('sd-status');
      if (!el) return;
      el.className = 'sd-status sd-status-' + state;
      if (state === 'idle')    el.textContent = '';
      if (state === 'edited')  el.textContent = 'Edited \u00b7 saving soon\u2026';
      if (state === 'saving')  el.textContent = 'Saving\u2026';
      if (state === 'saved')   el.textContent = 'Saved';

    /* ============================================================
       buildSavePayload (alpha.7.4)

       The deal_save RPC has a structured column set + raw_submission
       JSONB. Wizard's nested fields (solutionType, calico_inputs, etc.)
       don't map to columns — they live in raw_submission. Pass them at
       top level and the RPC either errors or silently drops them.

       This helper splits a flat deal object back into the RPC shape:
         { id (if edit), display_ref (if known),
           [structured columns],
           raw_submission: { everything else from the wizard },
           lines: [ derived from deal.reco.cards if available,
                    else fall back to existing deal.lines so the
                    Session 4 destructive-on-save gotcha doesn't wipe ] }

       Used by:
         - wizSave (new deal save from wizard)
         - flushAutosave (soft-field autosave)
         - rebuildSavedDeal (via scheduleAutosave) — picks up new reco
         - beforeunload (best-effort flush)
       ============================================================ */

    // Fields the RPC recognizes as structured columns (per smoke test pattern).
    // Anything not in this list goes into raw_submission.
    // v27.1.1: notes -> internal_notes (renamed); +contact_name/phone/email,
    //          +external_notes (new). Length now 17. Invariant: SOFT_FIELDS
    //          must remain a subset (enforced by smoke).
    const STRUCTURED_COLS = [
      'project', 'customer_name', 'stage',
      'partner_name', 'consultant_name',
      'venue_type', 'city', 'state',
      'lead_source', 'sales_person_id', 'presales_person_id',
      'close_month',
      'contact_name', 'contact_phone', 'contact_email',
      'internal_notes', 'external_notes'
    ];

    function buildSavePayload(deal) {
      if (!deal) return null;
      const payload = {};
      const raw = {};

      // Preserve id (edit-path detector) and display_ref (server uses for idempotency)
      if (deal.id)          payload.id          = deal.id;
      if (deal.display_ref) payload.display_ref = deal.display_ref;

      // Split top-level keys
      Object.keys(deal).forEach(function(k) {
        // Skip server-managed + cached fields entirely
        if (k === 'id' || k === 'display_ref' || k === 'ref' ||
            k === 'reco' || k === 'raw_submission' || k === 'lines' ||
            k === 'created_at' || k === 'updated_at' || k === 'deleted_at' ||
            k === 'created_by' || k === 'deal_value_inr' || k === 'is_new') {
          return;
        }
        const v = deal[k];
        if (v === undefined || v === null) return;
        if (STRUCTURED_COLS.indexOf(k) >= 0) {
          payload[k] = v;
        } else {
          raw[k] = v;
        }
      });

      payload.raw_submission = raw;

      // v27.1.0 B3 — close_month column is DATE in Postgres, but HTML
      // <input type="month"> emits 'YYYY-MM'. NULLIF(...)::DATE rejects
      // 'YYYY-MM' (error 22007). Append '-01' so the RPC's cast succeeds.
      // The matching slice on the hydrate side (loadDeal) brings it back
      // to 'YYYY-MM' for the input to display correctly.
      if (payload.close_month && /^\d{4}-\d{2}$/.test(payload.close_month)) {
        payload.close_month = payload.close_month + '-01';
      }

      // Lines — prefer fresh reco.cards (post-Rebuild or wizard Build);
      // fall back to existing deal.lines so editing a soft field on an
      // already-saved deal doesn't wipe the BoM (Session 4 gotcha #3).
      const fam = (deal.solutionType || '').toUpperCase();
      if (deal.reco && Array.isArray(deal.reco.cards) && deal.reco.cards.length > 0) {
        payload.lines = deal.reco.cards.map(function(c) {
          return {
            product_family:    fam,
            sku:               c.sku,
            description:       c.desc || c.label || c.sku,
            model_no:          c.sku,
            qty:               (c.qty != null) ? c.qty : 1,
            unit_price_inr:    0,
            line_discount_pct: 0
          };
        });
        // If the chassis itself isn't in cards (some recommenders return it
        // separately), prepend it so the BoM is complete.
        if (deal.reco.chassis && !payload.lines.some(l => l.sku === deal.reco.chassis)) {
          payload.lines.unshift({
            product_family:    fam,
            sku:               deal.reco.chassis,
            description:       (deal.reco.meta && deal.reco.meta.chassisLabel) || deal.reco.chassis,
            model_no:          deal.reco.chassis,
            qty:               1,
            unit_price_inr:    0,
            line_discount_pct: 0
          });
        }
      } else if (Array.isArray(deal.lines) && deal.lines.length > 0) {
        // Pass existing lines through unchanged
        payload.lines = deal.lines;
      } else {
        payload.lines = [];
      }

      return payload;
    }

    function scheduleAutosave() {
      if (!_savedDealData) return;
      setSavedDealStatus('edited');
      if (_autosaveTimer) clearTimeout(_autosaveTimer);
      _autosaveTimer = setTimeout(flushAutosave, AUTOSAVE_DEBOUNCE_MS);
    }

    function flushAutosave() {
      if (_autosaveTimer) { clearTimeout(_autosaveTimer); _autosaveTimer = null; }
      if (!_savedDealData) return;
      if (_autosaveInFlight) {
        // A save is already in flight; reschedule another flush right after.
        // The latest data will win on next tick.
        setTimeout(scheduleAutosave, 50);
        return;
      }
      // Snapshot the current refId — if user navigates away mid-save, we drop
      // the success/error status update so it doesn't paint over a new view.
      const inflightRefId = _savedDealRefId;
      _autosaveInFlight = true;
      setSavedDealStatus('saving');
      // alpha.7.4: route through buildSavePayload so structural fields land
      // in raw_submission (RPC has structured columns + jsonb; nested wizard
      // fields aren't columns). Lines round-trip from reco or existing lines
      // (Session 4 gotcha: destructive on these arrays).
      const payload = buildSavePayload(_savedDealData);
      STORE.saveDeal(payload).then(function(_r) {
        _autosaveInFlight = false;
        if (_savedDealRefId !== inflightRefId) return; // navigated away
        setSavedDealStatus('saved');
      }).catch(function(err) {
        _autosaveInFlight = false;
        if (_savedDealRefId !== inflightRefId) return;
        const msg = (err && err.message) ? err.message : String(err || 'unknown');
        setSavedDealStatus('error', msg);
      });
    }

    // Called by other view show* functions on route change OUT of saved-deal.
    // Flushes any pending autosave synchronously-ish (no await — we kick off
    // the save and trust the network; the page itself isn't unloading here).
    function disposeSavedDeal() {
      if (_autosaveTimer) {
        clearTimeout(_autosaveTimer);
        _autosaveTimer = null;
        // Pending edits — flush them so we don't lose data.
        if (_savedDealData && !_autosaveInFlight) {
          // Fire-and-forget. Errors will surface via console but no UI.
          STORE.saveDeal(buildSavePayload(_savedDealData)).catch(function(e) {
            console.warn('disposeSavedDeal flush failed:', e);
          });
        }
      }
      _savedDealData    = null;
      _savedDealRefId   = null;
      _autosaveInFlight = false;
    }

    // beforeunload handler — best effort. Modern browsers ignore async work
    // in beforeunload, but clearing the timer + firing the save kicks off
    // a network request that often completes before the tab actually closes.
    window.addEventListener('beforeunload', function() {
      if (_autosaveTimer && _savedDealData && !_autosaveInFlight) {
        clearTimeout(_autosaveTimer);
        _autosaveTimer = null;
        try { STORE.saveDeal(buildSavePayload(_savedDealData)); } catch (_e) { /* swallow */ }
      }
    });

    /* ============================================================
       Structural edit + Rebuild flow (alpha.7.3)

       Soft fields (7.2) autosave silently. Structural fields (this
       module-level flag) require explicit Rebuild — they change the
       BoM, so we want the rep to confirm the new recommendation
       before the BoM card on the saved deal updates.

       Flow:
         user edits structural field → mutate _savedDealData + set
         _structuralDirty=true + show #sd-rebuild-banner. No save fires.

         user taps Rebuild → APP.recoForDeal(_savedDealData) → set
         _savedDealData.reco (cache) → clear flag → re-render the
         entire saved-deal view (which now shows the new BoM hero
         + hidden banner) → fire save (full payload).

       Trade-off: re-render loses input focus / scroll position.
       Cosmetic-session polish item to swap for targeted DOM patching.
       ============================================================ */

    let _structuralDirty = false;

    // Stepper row mirroring wizard's stepperRow but emits sd-step actions
    // that the saved-deal delegation routes to markStructuralDirty (no
    // autosave). Used for the CALICO I/O steppers in alpha.7.3.
    function sdStepperRow(key, name, sub, value, opts) {
      opts = opts || {};
      const min = opts.min != null ? opts.min : 0;
      const max = opts.max != null ? opts.max : 32;
      const ns = opts.namespace || '';

      return '<div class="step-row">' +
        '<div class="step-label">' +
          '<div class="name">' + esc(name) + '</div>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-action="sd-step-dec"' +
            ' data-sd-ns="' + esc(ns) + '" data-sd-key="' + esc(key) + '"' +
            (v <= min ? ' disabled' : '') + '>\u2212</button>' +
          '<input type="text" inputmode="numeric" value="' + v + '"' +
            ' data-action="sd-step-set"' +
            ' data-sd-ns="' + esc(ns) + '" data-sd-key="' + esc(key) + '"' +
            ' aria-label="' + esc(name) + ' count">' +
          '<button type="button" data-action="sd-step-inc"' +
            ' data-sd-ns="' + esc(ns) + '" data-sd-key="' + esc(key) + '"' +
            (v >= max ? ' disabled' : '') + '>+</button>' +
        '</div>' +
      '</div>';
    }

    function sdToggleRow(key, name, sub, checked) {
      return '<label class="tile" style="margin-bottom:8px"' +
        ' data-checked="' + (checked ? 'true' : 'false') + '"' +
        ' data-action="sd-toggle" data-sd-key="' + esc(key) + '">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<div class="tile-title">' + esc(name) + '</div>' +
        (sub ? '<div class="tile-sub">' + esc(sub) + '</div>' : '') +
      '</label>';
    }

    function markStructuralDirty() {
      _structuralDirty = true;
      const b = document.getElementById('sd-rebuild-banner');
      if (b) b.hidden = false;
    }

    // Rebuild: recompute reco, clear dirty flag, full re-render, fire save.
    function rebuildSavedDeal() {
      if (!_savedDealData) return;
      try {
        const reco = (typeof APP !== 'undefined' && APP.recoForDeal)
          ? APP.recoForDeal(_savedDealData) : null;
        // Cache the reco on the deal so subsequent reads have access (we
        // don't currently persist it, but it's harmless and helps the
        // render path stay synchronous).
        _savedDealData.reco = reco;
      } catch (e) {
        toast('Rebuild failed: ' + ((e && e.message) || String(e)), 'err');
        return;
      }
      _structuralDirty = false;
      // Re-render the whole view — banner re-renders hidden by default.
      setRoot(renderSavedDealLoaded(_savedDealData));
      toast('BoM rebuilt \u00b7 saving\u2026', 'ok');
      // Fire save through the autosave path (re-uses status pill).
      scheduleAutosave();
    }

    /* ---------- Human labels (v27.1.2 #4a) ----------
       Single source of truth for ID → display-name mapping used by
       Step 6 Review summary, BoM I/O spec line (#4b), and any other
       customer-facing surfaces. Internal IDs stay in code; labels here
       are the only place to edit display text. */
    const HUMAN_LABELS = {
      calico_inputs: {
        hdmi4k:  'HDMI 4K',
        hdmiFhd: 'HDMI FHD',
        sdi12g:  'SDI 12G',
        sdi3g:   'SDI 3G',
        hdbt:    'HDBaseT',
        ip:      'IP / NDI'
      },
      calico_outputs: {
        display:   'HDMI Display',
        projector: 'HDMI Projector',
        sdi:       'SDI Output',
        led:       'LED Screen',
        audio:     'Audio'
      },
      sx_data: {
        hdmi:  'HDMI Extender',
        sdi:   'SDI Extender',
        ap536: 'AP-536 Audio Extractor',
        avip:  'AVIP Encoder'
      }
      // corio_inputs / corio_outputs use CATALOG keys directly
      // (already human-readable: "HDMI 4K", "DVI-U", etc.)
    };

    // Summarise a namespaced data object as "Label \u00d7 N, Label \u00d7 N".
    // Returns 'none' when no positive numeric values present.
    function humanizeNamespace(ns, dataObj) {
      if (!dataObj || typeof dataObj !== 'object') return 'none';
      const map = HUMAN_LABELS[ns] || {};
      const parts = [];
      Object.keys(dataObj).forEach(function(k) {
        const v = dataObj[k];
        if (typeof v === 'number' && v > 0) {
          parts.push((map[k] || k) + ' \u00d7 ' + v);
        }
      });
      return parts.length ? parts.join(', ') : 'none';
    }

    const WIZ_KEY = 'v27.wizard.draft';

    function loadDraft() {
      try {
        const raw = localStorage.getItem(WIZ_KEY);
        if (!raw) return defaultWizard();
        const parsed = JSON.parse(raw);
        const merged = Object.assign(defaultWizard(), parsed);
        merged.reco = null;
        merged.errors = {};
        return merged;
      } catch (e) {
        return defaultWizard();
      }
    }

    const saveDraft = debounce(function() {
      try {
        if (!wizardData) return;
        const o = Object.assign({}, wizardData);
        delete o.reco; delete o.errors;
        localStorage.setItem(WIZ_KEY, JSON.stringify(o));
      } catch (e) { /* silent */ }
    }, 350);

    // v27.1.3 S5 — synchronous flush of the current wizardData to localStorage.
    // Bypasses the 350ms debounce on saveDraft. Used by the saveDraft round-trip
    // smoke test so it can read localStorage immediately after writing. Safe to
    // call from production code paths too (e.g. before navigating away), though
    // currently only the smoke harness uses it.
    function flushDraft() {
      try {
        if (!wizardData) return;
        const o = Object.assign({}, wizardData);
        delete o.reco; delete o.errors;
        localStorage.setItem(WIZ_KEY, JSON.stringify(o));
      } catch (e) { /* silent */ }
    }

    function clearDraft() {
      try { localStorage.removeItem(WIZ_KEY); } catch (e) {}
      wizardData = defaultWizard();
    }

    /* ---------- v27.1.2 #3+#5: screens array resizer ----------
       Called from the synthetic 'led' stepper in Step 3 CALICO Outputs and
       from the lazy-remap path in hydrateWizardFromDeal. Grows the screens
       array with blank entries {w,h,pitch} or trims from the tail, preserving
       existing data. Keeps wizardData.hasLed in sync at call-site. */
    function _resizeScreens(targetLen) {
      const n = Math.max(0, parseInt(targetLen, 10) || 0);
      if (!Array.isArray(wizardData.screens)) wizardData.screens = [];
      const cur = wizardData.screens.length;
      if (n === cur) return;
      if (n > cur) {
        for (let i = cur; i < n; i++) {
          wizardData.screens.push({ w: '', h: '', pitch: '' });
        }
      } else {
        wizardData.screens.length = n;
      }
    }

    /* ---------- v27.1.2 #6: hydrate wizard from saved deal ----------
       Caller is sd-edit action handler. Deal arrives already flattened
       (raw_submission unpacked onto top-level by showSavedDeal). We start
       from a fresh defaultWizard() so any missing fields default cleanly,
       then overlay deal fields. id + display_ref preserved so wizSave
       routes through the update path (buildSavePayload checks for id). */
    function hydrateWizardFromDeal(deal) {
      if (!deal || typeof deal !== 'object') {
        throw new Error('hydrateWizardFromDeal: deal required');
      }
      const w = defaultWizard();
      // Overlay top-level fields. Object.assign handles primitives + objects;
      // for nested objects (calico_inputs etc.) we re-merge with defaults so
      // any missing sub-keys default to 0 / false.
      Object.keys(deal).forEach(function(k) {
        if (k === 'reco' || k === 'errors' || k === 'lines' ||
            k === 'created_at' || k === 'updated_at' || k === 'deleted_at') {
          return;
        }
        const v = deal[k];
        if (v === undefined || v === null) return;
        // Re-merge known nested objects so v27.1.1 deals (lacking newer keys)
        // pick up the defaults; deal values still win for keys they have.
        if (k === 'calico_inputs' || k === 'calico_outputs' || k === 'sx_data') {
          w[k] = Object.assign({}, w[k], v);
        } else {
          w[k] = v;
        }
      });
      // Preserve id + display_ref for edit-mode detection (consumed by
      // buildSavePayload at line ~3735).
      if (deal.id)          w.id          = deal.id;
      if (deal.display_ref) w.display_ref = deal.display_ref;
      // v27.1.2 OQ 1A — lazy remap of v27.1.1 deal shape:
      //   - hasLed was a top-level boolean; v27.1.2 still uses it but Step 3
      //     drives it from a count stepper. No remap needed at hasLed itself
      //     (we kept it canonical).
      //   - screens entries lacked 'pitch'. Ensure every entry has the pitch
      //     key so Step 4 renders cleanly (empty string → user prompted to
      //     fill on edit; OQ 5B: shown as '\u2014' on Review pre-edit).
      if (Array.isArray(w.screens)) {
        w.screens = w.screens.map(function(s) {
          if (s && typeof s === 'object' && !('pitch' in s)) {
            return Object.assign({}, s, { pitch: '' });
          }
          return s;
        });
      }
      w.reco = null;        // rebuild on Build
      w.errors = {};
      w.step = 1;
      return w;
    }

    /* ---------- Toast / sheet / chrome ---------- */

    function toast(msg, level) {
      level = level || 'default';
      const host = $('toast-host');
      if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast' + (level !== 'default' ? ' ' + level : '');
      el.textContent = msg;
      host.appendChild(el);
      const ms = level === 'err' ? 6500 : 3500;
      setTimeout(() => {
        el.style.transition = 'opacity 220ms';
        el.style.opacity = '0';
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
      }, ms);
    }

    function openSheet(html) {

      $('sheet-host').setAttribute('data-open', 'true');
      $('sheet-host').setAttribute('aria-hidden', 'false');

    function closeSheet() {
      $('sheet-host').setAttribute('data-open', 'false');

    function updateNavActive(hash) {
      const btns = document.querySelectorAll('#bottom-nav button[data-nav]');
      btns.forEach(b => {
        const target = b.getAttribute('data-nav');
        const match = (hash === target) ||
                      (target === '#/quote/new' && hash.indexOf('#/quote/new') === 0) ||
                      (target === '#/history' && hash.indexOf('#/quote/') === 0 && hash !== '#/quote/new');
        if (match) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
    }

    function setRoot(html) {
      $('view-root').innerHTML = html;
      window.scrollTo(0, 0);

    function setFieldError(fieldId, msg) {
      const f = $(fieldId);

      const e = f.querySelector('.err');
      if (msg) {
        f.classList.add('has-error');
        if (e) { e.textContent = msg; e.hidden = false; }
      } else {
        f.classList.remove('has-error');
        if (e) { e.textContent = ''; e.hidden = true; }
      }
    }

    function showHistory() {
      showChrome(true);
      updateNavActive('#/history');
      historyState = { filter: 'all', limit: 20, offset: 0, total: 0 };
      setRoot(
        '<div class="v">' +
          '<div class="h1">History</div>' +
          '<div class="chip-row" id="hist-chips">' +
            ['all','open','won','lost','deleted'].map(f =>
              '<button class="chip" data-action="hist-filter" data-value="' + f + '"' +
              (historyState.filter === f ? ' aria-current="true"' : '') + '>' +
              (f === 'all' ? 'All' : f.charAt(0).toUpperCase() + f.slice(1)) +
              '</button>'
            ).join('') +
          '</div>' +
          '<div id="hist-list"><div class="muted small">Loading\u2026</div></div>' +
        '</div>'
      );
      loadHistoryList();
    }

    async function loadHistoryList() {
      try {
        const includeDeleted = (historyState.filter === 'deleted');
        const r = await STORE.listDeals({
          limit: historyState.limit,
          offset: historyState.offset,
          includeDeleted: includeDeleted
        });
        historyState.total = (r && r.total) || 0;
        const allRows = (r && r.rows) || [];
        const filtered = allRows.filter(d => {
          // alpha.8.3: explicitly handle deleted state
          if (historyState.filter === 'deleted') return !!d.deleted_at;
          // All other filters exclude deleted (defence-in-depth)
          if (d.deleted_at) return false;
          if (historyState.filter === 'all')  return true;
          if (historyState.filter === 'open') return d.stage !== 'Closed Won' && d.stage !== 'Closed Lost';
          if (historyState.filter === 'won')  return d.stage === 'Closed Won';
          if (historyState.filter === 'lost') return d.stage === 'Closed Lost';
          return true;
        });
        const host = $('hist-list');
        if (!host) return;
        if (filtered.length === 0) {
          const emptyMsg = historyState.filter === 'deleted'
            ? 'No deleted deals.'
            : 'No deals match the filter.';
          host.innerHTML =
            '<div class="empty">' +
              '<div class="ico">\uD83D\uDCED</div>' +
              '<div>' + emptyMsg + '</div>' +
            '</div>';
          return;
        }
        host.innerHTML = filtered.map(renderHistoryRow).join('') +
          (historyState.total > historyState.limit
            ? '<div class="muted small t-center">Showing ' + filtered.length +
              ' of ' + historyState.total + '. Pagination in v27.1.</div>'
            : '');
      } catch (e) {
        const host = $('hist-list');
        if (host) host.innerHTML =
          '<div class="banner err">Could not load deals: ' +
          esc(e && e.message || String(e)) + '</div>';
      }
    }

    function setHistoryFilter(f) {
      historyState.filter = f;
      document.querySelectorAll('#hist-chips .chip').forEach(c => {
        if (c.getAttribute('data-value') === f) c.setAttribute('aria-current', 'true');
        else c.removeAttribute('aria-current');
      });
      loadHistoryList();
    }

    /* ============================================================
       VIEW: Saved deal (one-page layout — alpha.7.0 skeleton)

       Loading flow:
         showSavedDeal(refId) ──┐
                                ├─ render loading skeleton
                                ├─ STORE.loadDeal(refId)  (async)
                                ├─ on success → render deal (alpha.7.1+)
                                └─ on error   → render error state with Back link

       Race guard:
         User may tap a saved deal then immediately navigate back to Home before
         loadDeal resolves. We track the active refId in _activeSavedDealRefId;
         if it changes between dispatch and resolve, we drop the render.

       Layout (alpha.7.0): minimal — banner saying "BoM + editor land in alpha.7.1"
       Layout (alpha.7.1+): BoM hero · sticky action bar · sticky chip nav ·
                            accordion sections (Project context, Solution type,
                            Inputs & outputs, LED [if hasLed], SX [if hasSx])
       ============================================================ */

    let _activeSavedDealRefId = null;

    function showSavedDeal(refId) {
      showChrome(true);
      updateNavActive('#/history');
      _activeSavedDealRefId = refId;

      // 1. Render loading skeleton immediately so the user sees activity.
      setRoot(renderSavedDealLoading(refId));

      // 2. Kick off the async load. Late resolutions are dropped via the
      //    race guard so they don't paint over a different view.
      STORE.loadDeal(refId).then(function(deal) {
        if (_activeSavedDealRefId !== refId) return;  // user navigated away
        if (!deal) {
          setRoot(renderSavedDealNotFound(refId));
          return;
        }
        // alpha.7.4: deal_save RPC stores wizardData-shape fields inside
        // raw_submission (JSONB), not as top-level columns. Unpack it so
        // the renderer sees a flat shape (solutionType, calico_inputs,
        // hasLed, screens, hasSx, sx_data etc. become top-level).
        // Top-level structured fields win over raw_submission on conflict
        // (project, customer_name, stage etc. are authoritative in the
        // structured columns).
        if (deal.raw_submission && typeof deal.raw_submission === 'object') {
          const raw = deal.raw_submission;
          Object.keys(raw).forEach(function(k) {
            if (deal[k] === undefined || deal[k] === null || deal[k] === '') {
              deal[k] = raw[k];
            }
          });
          // Drop the nested copy — buildSavePayload will rebuild it on save.
          delete deal.raw_submission;
        }

        // v27.1.0 B3 — deal_get returns close_month as 'YYYY-MM-DD' (DATE).
        // <input type="month"> needs 'YYYY-MM' to display. Slice it back so
        // the form shows the user's original month selection. (Matches the
        // '+ -01' appended in buildSavePayload on the send side.)
        if (deal.close_month && /^\d{4}-\d{2}-\d{2}$/.test(deal.close_month)) {
          deal.close_month = deal.close_month.slice(0, 7);
        }

        setRoot(renderSavedDealLoaded(deal));
      }).catch(function(err) {
        if (_activeSavedDealRefId !== refId) return;
        // alpha.7.1: STORE.loadDeal throws on "deal not found" instead of
        // resolving with null. Classify by sniffing the message — the RPC
        // returns "deal_get: deal not found" and PostgREST returns PGRST116
        // for the no-rows case. Route those to the warn banner instead of
        // the red error banner.
        const msg = (err && err.message) ? err.message : String(err || '');
        if (/deal not found|PGRST116|no rows/i.test(msg)) {
          setRoot(renderSavedDealNotFound(refId));
          return;
        }
        setRoot(renderSavedDealError(refId, err));
      });
    }

    function renderSavedDealLoading(refId) {
      return '<div class="v">' +
          '<div class="h1">Saved deal</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="card" style="text-align:center; padding:24px 16px">' +
            '<div class="spinner" aria-hidden="true"></div>' +
            '<div class="small muted" style="margin-top:10px">Loading deal\u2026</div>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealNotFound(refId) {
      return '<div class="v">' +
          '<div class="h1">Deal not found</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="banner warn">' +
            '<strong>No deal matches this reference.</strong> ' +
            'It may have been deleted, or the link may be malformed. ' +
            'Check the History view for current deals.' +
          '</div>' +
          '<div style="margin-top:16px">' +
            '<button class="btn" type="button" data-nav="#/history">Back to History</button>' +
            ' <button class="btn btn-ghost" type="button" data-nav="#/home">Home</button>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealError(refId, err) {
      const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
      return '<div class="v">' +
          '<div class="h1">Couldn\u2019t load deal</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="banner err">' +
            '<strong>Load failed:</strong> ' + esc(msg) +
          '</div>' +
          '<div style="margin-top:16px">' +
            '<button class="btn" type="button" data-action="saved-retry" data-ref="' + esc(refId) + '">Try again</button>' +
            ' <button class="btn btn-ghost" type="button" data-nav="#/history">Back to History</button>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealLoaded(deal) {
      // alpha.7.1 — real one-page layout per SPEC §4.2.
      // alpha.7.2 — Project Context editable + autosave; structural sections
      //             stay read-only (edit + rebuild lands in alpha.7.3).
      // BoM hero (top) · Rebuild banner (hidden) · sticky action bar ·
      // sticky chip nav · accordion sections (Project context auto-expanded).

      // ---- Autosave state init ----
      // Mutate-in-place is safe: the deal object is local to this view.
      // disposeSavedDeal() (called by other show* functions) nulls these out.
      _savedDealData    = deal;
      _savedDealRefId   = (deal && (deal.display_ref || deal.ref || deal.id)) || null;
      _autosaveInFlight = false;
      if (_autosaveTimer) { clearTimeout(_autosaveTimer); _autosaveTimer = null; }

      const refId    = _savedDealRefId || '\u2014';
      const project  = (deal && deal.project)       || '\u2014';
      const customer = (deal && deal.customer_name) || '\u2014';
      const stage    = (deal && deal.stage)         || '\u2014';

      // v27.1.2 #8 — expanded header fields. OQ 8B: missing fields skip
      // the line silently (no "Closing —" placeholders).
      const leadSource    = (deal && deal.lead_source) || '';
      const closeMonth    = (deal && deal.close_month) || '';     // 'YYYY-MM'
      const salesId       = (deal && deal.sales_person_id) || '';
      const presalesId    = (deal && deal.presales_person_id) || '';
      const city          = (deal && deal.city)  || '';
      const stateV        = (deal && deal.state) || '';
      const venueType     = (deal && deal.venue_type) || '';
      const createdAt     = (deal && deal.created_at) || '';
      const updatedAt     = (deal && deal.updated_at) || '';

      // Helpers — kept local to keep the function self-contained.
      function fmtShortDate(iso) {
        if (!iso) return '';
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return '';
          return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
        } catch (e) { return ''; }
      }
      function fmtCloseMonth(ym) {
        if (!ym) return '';
        // Accept either 'YYYY-MM' or 'YYYY-MM-DD'
        const m = /^(\d{4})-(\d{2})/.exec(ym);
        if (!m) return ym;
        const year = m[1], mn = parseInt(m[2], 10);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return (months[mn - 1] || mn) + ' ' + year;
      }
      const salesName    = salesId    ? labelFor(salesId,    SALES_TEAM)    : '';
      const presalesName = presalesId ? labelFor(presalesId, PRESALES_TEAM) : '';
      const createdStr   = fmtShortDate(createdAt);
      const updatedStr   = fmtShortDate(updatedAt);
      const closeStr     = fmtCloseMonth(closeMonth);

      // Lead-source pill HTML (OQ 8A — Cavitak=green, tvONE=blue).
      const sourceClass = leadSource === 'tvONE' ? 'is-tvone'
                        : leadSource === 'Cavitak' ? 'is-cavitak'
                        : '';
      const sourcePillHtml = (leadSource && sourceClass)
        ? '<span class="sd-pill-source ' + sourceClass + '">' + esc(leadSource) + '</span>'
        : '';

      // Customer · stage · closing — line 3. closeStr appended only if present.
      const line3Parts = [esc(customer), esc(stage)];
      if (closeStr) line3Parts.push('Closing ' + esc(closeStr));
      const line3Html = '<div class="sd-meta-line">' + line3Parts.join(' \u00b7 ') + '</div>';

      // Sales / Presales — line 4. Skipped entirely if both absent.
      const peopleParts = [];
      if (salesName)    peopleParts.push('<span class="label">Sales:</span> ' + esc(salesName));
      if (presalesName) peopleParts.push('<span class="label">Presales:</span> ' + esc(presalesName));
      const line4Html = peopleParts.length
        ? '<div class="sd-meta-line">' + peopleParts.join(' \u00b7 ') + '</div>'
        : '';

      // City, state · venue_type — line 5. Skipped if all three absent.
      const locParts = [];
      if (city || stateV) locParts.push(esc([city, stateV].filter(Boolean).join(', ')));
      if (venueType)      locParts.push(esc(venueType));
      const line5Html = locParts.length
        ? '<div class="sd-meta-line">' + locParts.join(' \u00b7 ') + '</div>'
        : '';

      // Created · Updated — line 6. Skipped if both absent.
      const dateParts = [];
      if (createdStr) dateParts.push('Created ' + esc(createdStr));
      if (updatedStr) dateParts.push('Updated ' + esc(updatedStr));
      const line6Html = dateParts.length
        ? '<div class="sd-meta-line">' + dateParts.join(' \u00b7 ') + '</div>'
        : '';

      // ---- Compute BoM from deal data ----
      let reco = null;
      let recoErr = null;
      try {
        reco = (typeof APP !== 'undefined' && APP.recoForDeal)
          ? APP.recoForDeal(deal)
          : null;
      } catch (e) {
        recoErr = (e && e.message) ? e.message : String(e);
      }
      const bomHtml = reco
        ? renderBomCard(reco, deal.solutionType || '')
        : '<div class="bom-card empty-bom">' +
            '<div class="bom-chassis-sku">BOM UNAVAILABLE</div>' +
            '<div class="bom-chassis-label">Couldn\u2019t compute</div>' +
            '<div class="bom-meta">' + esc(recoErr || 'No solution type set.') + '</div>' +
          '</div>';

      // ---- Section visibility ----
      const hasLed = !!(deal && deal.hasLed);
      const hasSx  = !!(deal && deal.hasSx);

      // ---- Field-count badges ----
      const ctxFields = SOFT_FIELDS; // exactly the editable fields below
      const ctxCount = ctxFields.filter(f => deal && deal[f] != null && deal[f] !== '').length;

      const ioCount = (function() {
        if (!deal) return 0;
        if (deal.solutionType === 'calico') {
          return countNonZero(deal.calico_inputs) + countNonZero(deal.calico_outputs) +
                 (deal.calico_audio ? 1 : 0);
        }
        if (deal.solutionType === 'mv') {
          return (Array.isArray(deal.mv_inputs) ? deal.mv_inputs.filter(r => r && Number(r.qty) > 0).length : 0) +
                 (deal.mv_outputSignal ? 1 : 0);
        }
        if (deal.solutionType === 'corio') {
          return countNonZero(deal.corio_inputs) + countNonZero(deal.corio_outputs) +
                 (deal.corio_audio ? 1 : 0) + (deal.corio_fanFilter ? 1 : 0);
        }
        return 0;
      })();

      const ledCount = (hasLed && Array.isArray(deal.screens))
        ? deal.screens.filter(s => Number(s.w) > 0 && Number(s.h) > 0).length
        : 0;
      const sxCount  = (hasSx && deal.sx_data)
        ? Object.values(deal.sx_data).filter(v => Number(v) > 0).length
        : 0;

      // ---- Chip nav (sticky) ----
      const chips = [
        { id:'sec-ctx', label:'Context'  },
        { id:'sec-sol', label:'Solution' },
        { id:'sec-io',  label:'I/O'      }
      ];
      if (hasLed) chips.push({ id:'sec-led', label:'LED' });
      if (hasSx)  chips.push({ id:'sec-sx',  label:'SX'  });
      const chipNavHtml = '<nav class="sd-chipnav" aria-label="Section nav">' +
        chips.map(c =>
          '<button class="sd-chip" type="button" data-action="sd-jump" data-target="' + esc(c.id) + '">' +
            esc(c.label) +
          '</button>'
        ).join('') +
      '</nav>';

      // ---- Helpers (read-only row for structural sections) ----
      function row(label, value) {
        const v = (value == null || value === '') ? '\u2014' : String(value);
        return '<div class="sd-row">' +
            '<div class="sd-row-k">' + esc(label) + '</div>' +
            '<div class="sd-row-v">' + esc(v) + '</div>' +
          '</div>';
      }
      function sectionHeader(title, count) {
        return '<summary class="sd-summary">' +
            '<span class="sd-summary-title">' + esc(title) + '</span>' +
            '<span class="sd-summary-meta">' +
              '<span class="sd-badge">' + count + (count === 1 ? ' field' : ' fields') + '</span>' +
              '<span class="sd-chevron" aria-hidden="true">\u203a</span>' +
            '</span>' +
          '</summary>';
      }

      // ---- Section: Project context (EDITABLE — alpha.7.2 autosave) ----
      // v27.1.1 — datalist for city dropdown (same cities-list as wizard Step-1)
      const ctxCitiesDatalist = '<datalist id="cities-list-sd">' +
        CITIES.map(function(c) {
          return '<option value="' + esc(c.city) + '"></option>';
        }).join('') +
      '</datalist>';
      const ctxBody =
        '<form id="sd-ctx-form" autocomplete="off" novalidate>' +
          ctxCitiesDatalist +
          '<h3 class="h3" style="margin-top:8px">Project</h3>' +
          sdField('project',         'Project name', deal.project,         { placeholder: 'e.g. Auditorium upgrade' }) +
          sdField('customer_name',   'End User',     deal.customer_name) +
          sdField('partner_name',    'Partner',      deal.partner_name) +
          sdField('consultant_name', 'Consultant',   deal.consultant_name) +
          '<h3 class="h3">Location</h3>' +
          sdSelectField('venue_type', 'Venue type', deal.venue_type, VENUE_TYPES, { placeholder: '\u2014 select \u2014' }) +
          sdField('city',  'City',  deal.city,  { list: 'cities-list-sd', placeholder: 'Start typing\u2026' }) +
          sdField('state', 'State', deal.state, { placeholder: 'Auto-fills from city; type if City = Other' }) +
          '<h3 class="h3">Stage &amp; owners</h3>' +
          sdSelectField('stage',              'Stage',           deal.stage,              STAGES) +
          sdSelectField('lead_source',        'Lead Origin',     deal.lead_source,        LEAD_SOURCES,  { placeholder: '\u2014 select \u2014' }) +
          sdSelectField('sales_person_id',    'Sales person',    deal.sales_person_id,    SALES_TEAM,    { placeholder: '\u2014 select \u2014' }) +
          sdSelectField('presales_person_id', 'Presales person', deal.presales_person_id, PRESALES_TEAM, { placeholder: '\u2014 select \u2014' }) +
          '<h3 class="h3">Partner contact</h3>' +
          sdField('contact_name',  'Contact name',  deal.contact_name,  { placeholder: 'Site / partner contact person' }) +
          sdField('contact_phone', 'Contact phone', deal.contact_phone, { inputmode: 'numeric', maxlength: 10, help: '10-digit mobile (no country code, no spaces)' }) +
          sdField('contact_email', 'Contact email', deal.contact_email, { type: 'email', placeholder: 'name@company.com' }) +
          '<h3 class="h3">Closure</h3>' +
          sdField('close_month', 'Expected closure', deal.close_month, { type: 'month', help: 'Year-month, e.g. 2026-09' }) +
          '<h3 class="h3">Notes</h3>' +
          sdTextarea('internal_notes', 'Internal notes', deal.internal_notes, { rows: 3, placeholder: 'Visible only to Cavitak team \u2014 not exported to Excel/PDF' }) +
          sdTextarea('external_notes', 'External notes', deal.external_notes, { rows: 3, placeholder: 'Shown in Excel/PDF exports to customer/partner' }) +
        '</form>';

      // ---- Read-only sections (structural — see below for I/O which IS editable in CALICO mode) ----
      const solBody = row('Family', familyLabel(deal.solutionType)) +
        '<div class="sd-edit-note small soft">Changing solution family is intentionally read-only \u2014 start a new quote if you need a different family.</div>';

      const ioBody = renderSavedDealIoSection(deal) +
        (deal.solutionType === 'calico'
          ? '<div class="sd-edit-note small soft">Edits set the Rebuild banner above. Tap <strong>Rebuild</strong> to recompute the BoM.</div>'
          : ''); // MV/CORIO already include their own cosmetic-session hint

      const ledBody = hasLed
        ? (function() {
            // Defensive: ensure screens exists.
            if (!Array.isArray(deal.screens)) deal.screens = [];
            const cards = deal.screens.length === 0
              ? '<div class="muted small" style="padding:12px 0">No screens yet. Tap \u201c+ Add screen\u201d.</div>'
              : deal.screens.map((s, idx) => {

                    '<div class="row between" style="margin:0 0 6px">' +
                      '<strong>Screen ' + (idx + 1) + '</strong>' +
                      '<button class="btn btn-text" type="button" data-action="sd-screen-remove" data-idx="' + idx + '">Remove</button>' +

                      '<div class="field" style="flex:1;margin:0">' +

                      '</div>' +
                      '<div class="field" style="flex:1;margin:0">' +
                        '<label>Height (px)</label>' +

      const sxBody = hasSx
        ? (function() {

            if (!deal.sx_data) deal.sx_data = { hdmi:0, sdi:0, ap536:0, avip:0 };
            return SX_EDITORIAL.map(s =>

      return '<div class="v sd-view">' +

          // Header band

          // ref row with Cavitak=green, tvONE=blue (OQ 8A).
          '<div class="sd-header">' +
            '<div class="sd-ref-row">' +

            '</div>' +
            '<div class="h1 sd-title">' + esc(project) + '</div>' +
            line3Html +
            line4Html +
            line5Html +
            line6Html +
          '</div>' +

          // BoM hero
          '<section class="sd-bom-wrap">' + bomHtml + '</section>' +

          // Rebuild banner — shown when _structuralDirty is true (alpha.7.3)
          '<div id="sd-rebuild-banner" class="banner warn"' +
            (_structuralDirty ? '' : ' hidden') +
            ' style="margin-top:10px">' +
            '<strong>BoM is out of date.</strong> ' +
            '<button class="btn btn-text" type="button" data-action="sd-rebuild">Tap Rebuild \u2192</button>' +
          '</div>' +

          // Sticky action bar
          // v27.1.2 #6 — Edit button leads; opens full wizard with deal pre-hydrated.
          // Route '#/quote/edit/{refId}' distinguishes update vs new-create.
          '<div class="sd-actionbar">' +
            '<button class="btn"        type="button" data-action="sd-edit"  id="sd-btn-edit">Edit</button>' +
            '<button class="btn"        type="button" data-action="sd-excel" id="sd-btn-excel">Excel</button>' +

          chipNavHtml +

          // Accordion sections
          '<div class="sd-accordion">' +

            '<details class="sd-section" id="sec-ctx" open>' +
