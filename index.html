<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tvONE Product Selector — v27</title>
  <style>
    /* ============================================================
       Design tokens — tvONE forest-green / gold / tricolor
       Mobile-first. Tap targets ≥44px. Safe-area aware.
       ============================================================ */
    :root {
      --c-fg: #1a2e1f;
      --c-fg-soft: #4a5d52;
      --c-fg-mute: #7a8a82;
      --c-fg-rev: #ffffff;
      --c-bg: #f5f7f3;
      --c-elev: #ffffff;
      --c-sunk: #ebeee8;
      --c-border: #d4ddd0;
      --c-border-st: #9eb3a5;
      --c-accent: #2d5a3d;
      --c-accent-dk: #1a3d28;
      --c-accent-lt: #e0ecdf;
      --c-gold: #c8a04a;
      --c-gold-lt: #f5ecd5;
      --c-ok: #2d7a3d;
      --c-ok-lt: #d6ecd9;
      --c-warn: #c46a18;
      --c-warn-lt: #fbe9d4;
      --c-err: #b53528;
      --c-err-lt: #fadcd6;
      --c-overlay: rgba(20, 30, 22, 0.45);
      --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --f-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
      --s-5: 24px; --s-6: 32px; --s-7: 48px;
      --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
      --nav-h: 64px; --tap: 44px; --content-max: 540px;
      --sh-card: 0 1px 2px rgba(26,46,31,0.04), 0 1px 4px rgba(26,46,31,0.04);
      --sh-pop: 0 8px 24px rgba(26,46,31,0.18);
      --sh-nav: 0 -1px 0 var(--c-border), 0 -4px 12px rgba(26,46,31,0.04);
    }
    * { box-sizing: border-box; }
    /* Belt-and-suspenders: [hidden] beats author CSS like display:flex.
       Without this, .topbar / .tricolor-bar / .bottom-nav stay visible on
       login because their display:flex outranks the UA [hidden] rule. */
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--c-bg); color: var(--c-fg);
      font: 15px/1.45 var(--f-sans); min-height: 100vh;
      overscroll-behavior-y: contain; }
    button, input, select, textarea { font: inherit; }
    a { color: var(--c-accent); text-decoration: none; }
    a:active { text-decoration: underline; }

    /* App shell */
    #app { min-height: 100vh; display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top); }
    #view-root { flex: 1;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
    #view-root .v { max-width: var(--content-max); margin: 0 auto; padding: 16px; }

    /* Topbar / tricolor */
    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--c-elev);
      border-bottom: 1px solid var(--c-border);
      position: sticky; top: env(safe-area-inset-top); z-index: 8; }
    .topbar .brand { font-weight: 700; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .topbar .brand .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--c-accent); }
    .topbar .ver { font: 11px var(--f-mono); color: var(--c-fg-mute);
      background: var(--c-sunk); padding: 2px 6px; border-radius: 4px; }
    .tricolor-bar { display: flex; height: 3px; }
    .tricolor-bar span { display: block; height: 100%; }
    .tricolor-bar .a { width: 50%; background: var(--c-accent); }
    .tricolor-bar .b { width: 23%; background: var(--c-gold); }
    .tricolor-bar .c { width: 27%; background: var(--c-fg); }

    /* Bottom nav */
    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--c-elev); box-shadow: var(--sh-nav);
      padding-bottom: env(safe-area-inset-bottom);
      display: flex; justify-content: space-around; }
    .bottom-nav button { flex: 1; min-height: var(--nav-h); border: 0;
      background: transparent; color: var(--c-fg-mute); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 4px;
      font: 600 11px var(--f-sans);
      -webkit-tap-highlight-color: transparent; }
    .bottom-nav button[aria-current="page"] { color: var(--c-accent); }
    .bottom-nav button:active { background: var(--c-sunk); }
    .bottom-nav button .icon { width: 22px; height: 22px; stroke: currentColor;
      fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Card */
    .card { background: var(--c-elev); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 16px; box-shadow: var(--sh-card);
      margin: 0 0 12px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; min-height: var(--tap); padding: 10px 18px;
      background: var(--c-accent); color: var(--c-fg-rev);
      border: 0; border-radius: var(--r-md);
      font: 600 15px/1 var(--f-sans); cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none; transition: background 80ms; }
    .btn:active { background: var(--c-accent-dk); }
    .btn[disabled] { background: var(--c-sunk); color: var(--c-fg-mute); cursor: not-allowed; }
    .btn.btn-ghost { background: transparent; color: var(--c-accent); border: 1px solid var(--c-border-st); }
    .btn.btn-ghost:active { background: var(--c-sunk); }
    .btn.btn-ghost[disabled] { color: var(--c-fg-mute); border-color: var(--c-border); background: transparent; }
    .btn.btn-danger { background: var(--c-err); }
    .btn.btn-danger:active { background: #8a1f15; }
    .btn.btn-text { background: transparent; color: var(--c-accent); padding: 10px 12px; }
    .btn.btn-block { width: 100%; }

    /* Inputs */
    .field { display: block; margin: 0 0 14px; }
    .field > label { display: block; font-size: 13px; font-weight: 600;
      color: var(--c-fg-soft); margin: 0 0 4px; }
    .field .help { font-size: 12px; color: var(--c-fg-mute); margin: 4px 0 0; }
    .field .err { font-size: 12px; color: var(--c-err); margin: 4px 0 0; font-weight: 500; }
    .field.has-error input, .field.has-error select, .field.has-error textarea {
      border-color: var(--c-err); background: var(--c-err-lt); }
    input[type="text"], input[type="email"], input[type="tel"], input[type="number"],
    input[type="password"], input[type="month"], input[type="search"], select, textarea {
      width: 100%; min-height: var(--tap); padding: 10px 12px;
      background: var(--c-elev); color: var(--c-fg);
      border: 1px solid var(--c-border); border-radius: var(--r-md);
      -webkit-appearance: none; appearance: none; }
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--c-accent); outline-offset: 1px; border-color: var(--c-accent); }
    textarea { min-height: 88px; resize: vertical; }
    select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%231a2e1f' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center; padding-right: 36px; }

    /* Stepper */
    .stepper { display: inline-flex; align-items: stretch;
      border: 1px solid var(--c-border); border-radius: var(--r-md);
      overflow: hidden; background: var(--c-elev); }
    .stepper button { background: var(--c-sunk); color: var(--c-fg); border: 0;
      min-width: var(--tap); min-height: var(--tap); font-size: 18px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .stepper button:active { background: var(--c-border); }
    .stepper button[disabled] { color: var(--c-fg-mute); cursor: not-allowed; }
    .stepper input { width: 52px; min-height: var(--tap); border: 0;
      border-left: 1px solid var(--c-border); border-right: 1px solid var(--c-border);
      text-align: center; font: 600 15px var(--f-mono); padding: 0; border-radius: 0; }
    .stepper input:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }

    /* Tile selector */
    .tile-group { display: grid; gap: 10px; }
    .tile { display: block; padding: 14px 16px; border-radius: var(--r-md);
      background: var(--c-elev); border: 1.5px solid var(--c-border);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      position: relative; }
    .tile input { position: absolute; opacity: 0; pointer-events: none; }
    .tile[data-checked="true"] { border-color: var(--c-accent); background: var(--c-accent-lt); }
    .tile:active { background: var(--c-sunk); }
    .tile[data-checked="true"]:active { background: var(--c-accent-lt); }
    .tile .tile-title { font-weight: 600; font-size: 15px; margin: 0 0 2px; }
    .tile .tile-sub { font-size: 13px; color: var(--c-fg-soft); }

    /* Chip nav */
    .chip-row { display: flex; gap: 6px; overflow-x: auto;
      padding: 4px 0 8px; margin: 0 -4px 12px; -webkit-overflow-scrolling: touch; }
    .chip { display: inline-flex; align-items: center; gap: 4px;
      padding: 8px 12px; border-radius: var(--r-pill);
      background: var(--c-sunk); color: var(--c-fg);
      font: 600 13px var(--f-sans); border: 0; white-space: nowrap;
      cursor: pointer; min-height: 36px;
      -webkit-tap-highlight-color: transparent; }
    .chip[aria-current="true"] { background: var(--c-accent); color: var(--c-fg-rev); }

    /* Toast */
    #toast-host { position: fixed;
      top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none; z-index: 100; }
    .toast { background: var(--c-fg); color: var(--c-fg-rev);
      padding: 10px 16px; border-radius: var(--r-pill);
      font-size: 14px; font-weight: 500;
      max-width: 90vw; box-shadow: var(--sh-pop);
      pointer-events: auto;
      animation: tslide 200ms ease-out; }
    .toast.ok { background: var(--c-ok); }
    .toast.warn { background: var(--c-warn); }
    .toast.err { background: var(--c-err); }
    @keyframes tslide { from { opacity: 0; transform: translateY(-12px); }
                        to { opacity: 1; transform: translateY(0); } }

    /* Banner */
    .banner { padding: 10px 14px; border-radius: var(--r-md);
      font-size: 14px; margin: 0 0 12px;
      border-left: 4px solid var(--c-accent);
      background: var(--c-accent-lt); color: var(--c-fg); }
    .banner.warn { border-color: var(--c-warn); background: var(--c-warn-lt); }
    .banner.err { border-color: var(--c-err); background: var(--c-err-lt); }
    .banner.info { border-color: var(--c-accent); background: var(--c-accent-lt); }

    /* Action sheet */
    #sheet-host { position: fixed; inset: 0; z-index: 90; display: none; }
    #sheet-host[data-open="true"] { display: block; }
    .sheet-backdrop { position: absolute; inset: 0;
      background: var(--c-overlay); animation: bfade 180ms; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--c-elev); border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: 80vh; overflow-y: auto;
      animation: ssup 220ms ease-out; }
    @keyframes bfade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ssup { from { transform: translateY(100%); }
                      to { transform: translateY(0); } }

    /* Wizard */
    .wiz-stepper { display: flex; gap: 6px; padding: 8px 0 16px;
      align-items: center; justify-content: center; }
    .wiz-dot { width: 22px; height: 4px; border-radius: 2px; background: var(--c-border); }
    .wiz-dot.active { background: var(--c-accent); }
    .wiz-dot.done { background: var(--c-accent-dk); }
    .wiz-step-label { text-align: center; font-size: 12px; color: var(--c-fg-mute);
      margin: 0 0 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .wiz-actionbar { position: sticky;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
      background: var(--c-bg); padding: 12px 0;
      display: flex; gap: 10px; align-items: center;
      border-top: 1px solid var(--c-border); margin-top: 16px; z-index: 5; }
    .wiz-actionbar .grow { flex: 1; }
    .wiz-summary { display: flex; flex-direction: column; gap: 10px; }
    .wiz-summary .sum-row { display: flex; justify-content: space-between;
      gap: 12px; padding: 8px 0;
      border-bottom: 1px dashed var(--c-border); }
    .wiz-summary .sum-row:last-child { border-bottom: 0; }
    .wiz-summary .sum-key { font-weight: 600; color: var(--c-fg-soft); font-size: 13px; }
    .wiz-summary .sum-val { text-align: right; font-size: 14px; }
    .wiz-summary .edit-link { display: inline-block; margin: 4px 0 0;
      font-size: 12px; color: var(--c-accent); cursor: pointer;
      background: transparent; border: 0; padding: 0; font-weight: 600; }

    /* Chassis hero (BoM) */
    .bom-card { background: linear-gradient(135deg, var(--c-elev), var(--c-accent-lt));
      border: 1.5px solid var(--c-accent); border-radius: var(--r-lg); padding: 18px;
      position: relative; overflow: hidden; margin: 0 0 16px; }
    .bom-card::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 90% 10%, rgba(200,160,74,0.18), transparent 50%);
      pointer-events: none; }
    .bom-card.empty-bom { background: var(--c-sunk); border: 1px dashed var(--c-border-st); }
    .bom-chassis-sku { font: 700 11px/1 var(--f-mono); letter-spacing: 0.08em;
      color: var(--c-accent-dk); text-transform: uppercase; }
    .bom-chassis-label { font-size: 22px; font-weight: 700; margin: 4px 0 2px;
      letter-spacing: -0.01em; }
    .bom-meta { font-size: 13px; color: var(--c-fg-soft); }
    .bom-lines { list-style: none; padding: 0; margin: 14px 0 0;
      border-top: 1px solid var(--c-border); }
    .bom-line { display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px dashed var(--c-border);
      font-size: 14px; gap: 12px; }
    .bom-line:last-child { border-bottom: 0; }
    .bom-line .desc { color: var(--c-fg); flex: 1; }
    .bom-line .qty { font: 600 13px var(--f-mono); color: var(--c-fg-soft); white-space: nowrap; }
    .bom-line .sku { font: 11px var(--f-mono); color: var(--c-fg-mute); display: block; margin-top: 2px; }
    .bom-concerns, .bom-valueadds { margin: 12px 0 0;
      padding: 10px 12px; border-radius: var(--r-sm); }
    .bom-concerns { background: var(--c-warn-lt); border-left: 3px solid var(--c-warn); }
    .bom-concerns h4 { margin: 0 0 4px; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-warn); }
    .bom-valueadds { background: var(--c-accent-lt); border-left: 3px solid var(--c-accent); }
    .bom-valueadds h4 { margin: 0 0 4px; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-accent); }
    .bom-concerns ul, .bom-valueadds ul { margin: 0; padding-left: 18px; font-size: 13px; }

    /* ----- Saved-deal view (alpha.7.1) ----- */
    /* Header band: ref + project + customer/stage */
    .sd-view { padding-bottom: 24px; }
    .sd-header { margin-bottom: 14px; }
    .sd-ref { font: 700 11px/1 var(--f-mono); letter-spacing: 0.08em;
      color: var(--c-fg-soft); text-transform: uppercase; margin-bottom: 6px; }
    .sd-title { margin: 0 0 2px; }

    /* BoM hero wrap (no extra chrome, just spacing) */
    .sd-bom-wrap { margin: 4px 0 8px; }

    /* Sticky action bar — Excel/PDF/Edit/Delete buttons */
    .sd-actionbar {
      position: sticky;
      top: calc(var(--topbar-h, 48px) + var(--tricolor-h, 4px));
      z-index: 5;
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 10px 0;
      background: var(--c-bg);
      border-bottom: 1px solid var(--c-border);
      margin: 8px 0 0;
    }
    .sd-actionbar .btn { flex: 1 1 auto; min-height: 44px; min-width: 64px; }

    /* Sticky chip nav — section jump targets */
    .sd-chipnav {
      position: sticky;
      top: calc(var(--topbar-h, 48px) + var(--tricolor-h, 4px) + 56px);
      z-index: 4;
      display: flex; gap: 6px; overflow-x: auto;
      padding: 8px 0; margin: 0 0 4px;
      background: var(--c-bg);
      border-bottom: 1px solid var(--c-border);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .sd-chipnav::-webkit-scrollbar { display: none; }
    .sd-chip {
      flex: 0 0 auto;
      min-height: 36px; padding: 6px 14px;
      border: 1px solid var(--c-border-st); border-radius: 999px;
      background: var(--c-elev); color: var(--c-fg);
      font: 600 13px/1 var(--f-sans);
      cursor: pointer; white-space: nowrap;
    }
    .sd-chip:active { background: var(--c-accent-lt); border-color: var(--c-accent); }

    /* Accordion sections via <details>/<summary> */
    .sd-accordion { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .sd-section {
      background: var(--c-elev);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .sd-summary {
      list-style: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      min-height: 48px;       /* tap target per SPEC §9.2 */
      padding: 10px 14px;
      font-weight: 600;
      user-select: none;
    }
    .sd-summary::-webkit-details-marker { display: none; }
    .sd-summary-title { flex: 1 1 auto; }
    .sd-summary-meta { display: flex; align-items: center; gap: 8px; }
    .sd-badge {
      font: 600 11px/1 var(--f-mono);
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--c-sunk);
      color: var(--c-fg-soft);
      letter-spacing: 0.04em;
    }
    .sd-chevron {
      font-size: 18px;
      color: var(--c-fg-soft);
      transition: transform 0.18s ease;
      display: inline-block;
    }
    .sd-section[open] .sd-chevron { transform: rotate(90deg); }

    .sd-section-body {
      padding: 4px 14px 14px;
      border-top: 1px solid var(--c-border);
    }
    .sd-subhead {
      font: 600 11px/1 var(--f-sans);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--c-fg-soft);
      margin: 12px 0 4px;
    }
    .sd-subhead:first-child { margin-top: 8px; }
    .sd-row {
      display: flex; gap: 12px; align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid var(--c-border);
      font-size: 14px;
    }
    .sd-row:last-child { border-bottom: 0; }
    .sd-row-k { flex: 0 0 38%; color: var(--c-fg-soft); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.04em; }
    .sd-row-v { flex: 1 1 auto; word-break: break-word; }
    .sd-row-muted { color: var(--c-fg-mute); font-style: italic; padding: 8px 0; }
    .sd-edit-note { padding: 10px 0 0; }

    /* Spinner for loading state (alpha.7.0 leftover, reused) */
    .spinner {
      display: inline-block; width: 28px; height: 28px;
      border: 3px solid var(--c-border);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: sd-spin 0.8s linear infinite;
    }
    @keyframes sd-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .sd-chevron { transition: none; }
    }

    /* Common layouts */
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .row.gap-2 { gap: 8px; }
    .row.gap-4 { gap: 16px; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--c-fg-mute); }
    .soft { color: var(--c-fg-soft); }
    .mono { font-family: var(--f-mono); }
    .t-center { text-align: center; }
    .small { font-size: 13px; }
    .tiny { font-size: 12px; }
    .h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
    .h2 { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
    .h3 { font-size: 13px; font-weight: 700; margin: 0 0 6px;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--c-fg-soft); }
    .sp-12 { height: 12px; } .sp-24 { height: 24px; }

    /* Login */
    .login-bg { min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px;
      background: linear-gradient(180deg, var(--c-bg), var(--c-accent-lt)); }
    .login-card { max-width: 380px; width: 100%; background: var(--c-elev);
      border-radius: var(--r-lg); padding: 24px; box-shadow: var(--sh-pop); }
    .login-card .brand { display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin: 0 0 20px; }
    .login-card .brand .logo { width: 56px; height: 56px; border-radius: 12px;
      background: var(--c-accent); display: flex; align-items: center;
      justify-content: center; color: var(--c-fg-rev); font-weight: 700; font-size: 22px; }
    .login-card .ver-tag { color: var(--c-fg-mute); font: 11px var(--f-mono); margin-top: 4px; }

    /* Home dashboard tiles */
    .dash-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin: 0 0 16px; }
    .dash-tile { background: var(--c-elev); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 14px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; text-align: left;
      min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; }
    .dash-tile:active { background: var(--c-sunk); }
    .dash-tile h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
    .dash-tile p { margin: 0; font-size: 12px; color: var(--c-fg-mute); }
    .dash-tile .big-num { font: 700 22px var(--f-mono); color: var(--c-accent); }

    /* History row */
    .history-row { background: var(--c-elev); border: 1px solid var(--c-border);
      border-radius: var(--r-md); padding: 12px 14px; margin: 0 0 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      display: block; width: 100%; text-align: left; }
    .history-row:active { background: var(--c-sunk); }
    .history-row .ref { font: 600 12px var(--f-mono); color: var(--c-accent); }
    .history-row .proj { font-weight: 600; margin: 2px 0; font-size: 15px; }
    .history-row .meta { font-size: 12px; color: var(--c-fg-mute);
      display: flex; gap: 10px; flex-wrap: wrap; }

    /* Empty state */
    .empty { text-align: center; padding: 32px 16px; color: var(--c-fg-mute); }
    .empty .ico { font-size: 32px; margin-bottom: 8px; }

    /* Misc */
    .hidden { display: none !important; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: var(--c-accent); color: var(--c-fg-rev); vertical-align: middle; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: var(--r-pill);
      font: 600 11px/1.4 var(--f-sans); background: var(--c-sunk); color: var(--c-fg-soft); }
    .tag.ok { background: var(--c-ok-lt); color: var(--c-ok); }
    .tag.warn { background: var(--c-warn-lt); color: var(--c-warn); }
    .tag.accent { background: var(--c-accent-lt); color: var(--c-accent); }
    code { font-family: var(--f-mono); font-size: 13px;
      background: rgba(0,0,0,0.05); padding: 1px 5px; border-radius: 3px; }
    pre { background: #0e1c14; color: #d5e5db; padding: 14px;
      border-radius: 8px; font: 12px/1.5 var(--f-mono); margin: 12px 0 0;
      overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    pre .ok-ln { color: #8fd6a3; }
    pre .err-ln { color: #f08070; }
    pre .warn-ln { color: #f0c060; }

    /* Stepper-row (label + stepper) */
    .step-row { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; gap: 12px; border-bottom: 1px dashed var(--c-border); }
    .step-row:last-child { border-bottom: 0; }
    .step-row .step-label { flex: 1; }
    .step-row .step-label .name { font-weight: 600; font-size: 14px; }
    .step-row .step-label .sub { font-size: 12px; color: var(--c-fg-mute); margin-top: 2px; }

    /* Scale to wider screens */
    @media (min-width: 768px) {
      #view-root .v { padding: 24px 16px; }
      .dash-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition: none !important; }
    }

    /* Print */
    @media print {
      .topbar, .bottom-nav, .wiz-actionbar { display: none !important; }
      body { background: white; }
    }
  </style>

  console.log('CATALOG ready:', CATALOG.version);

  /* ============================================================
     RECOMMEND (Session 2+3 of v27 rebuild)
     Pure recommendation functions. Each takes a fully-normalised
     input object and returns { chassis, cards, concerns, valueAdds }
     plus reasons[] and meta{} for debug. No DOM reads. No window
     globals. No side effects.

     Source map (line refs are v26 index.html):
       calico        ← recommend() L10093, pickInputCards() L9940
                       (refactor of L10093-10264 + L9940-10090)
       mv            ← (Session 3) recommendMWP() L10807
       corio         ← (Session 3) recommend() in CORIO block L11464

     Refactor pattern:
       - window._tvInputBreakdownV2580.{hdmi4k,hdmiFhd,sdi12g,sdi3g,hdbt,ip}
           → input.inputs.*
       - window._tvInputBreakdownV2580.displayQty → input.outputs.display
       - window._tvInputBreakdownV2580.audioNeeded → input.audio
       - input.projectorCount/Res → input.outputs.projector/projectorRes
       - input.outputSignal==='SDI' + input.sdiCount → input.outputs.sdi
       - input.inputs (total) → computed from per-signal counts
       - window._v2580_unfittableCards → returned from pick helper as {picks, unfittable}
       - CHASSIS/INPUT_CARDS/OUTPUT_CARDS/SLOT11_ALLOWED_WHEN_SLOT12
           → CATALOG.calico.{chassis,inputCards,outputCards,slotRules.slot11AllowedWhenSlot12}
       - PORT_CAPACITY_4K60 → CATALOG.constants.PORT_CAPACITY_4K60

     Logic preserved verbatim. Soft validation per SPEC §2.3:
     concerns/valueAdds are data; never throw on soft issues.
     ============================================================ */
  const RECOMMEND = (function() {

    /* ---------- CALICO ---------- */

    // Pure-function port of v26 pickInputCards (L9940).
    // Returns { picks, unfittable } — replaces window._v2580_unfittableCards
    // side-channel. picks: [{card, qty, slot}]. unfittable: array of card keys.
    function _pickCalicoInputCards(extraInputsNeeded, input) {
      const IC = CATALOG.calico.inputCards;
      const SLOT11 = CATALOG.calico.slotRules.slot11AllowedWhenSlot12;
      const inp = input.inputs;

      // v25.100.1 guard: SDI/HDBaseT/IP ALWAYS need cards even when total fits
      // native 8. Audio also needs a card. Bail only when truly nothing to pick.
      const nonHdmiInputs = (inp.sdi12g || 0) + (inp.sdi3g || 0) + (inp.hdbt || 0) + (inp.ip || 0);
      const audioGuard = !!input.audio;
      if (extraInputsNeeded <= 0 && nonHdmiInputs <= 0 && !audioGuard) {
        return { picks: [], unfittable: [] };
      }

      // Build cardsNeeded list — verbatim v25.80 per-signal logic.
      const cardsNeeded = []; // { key, ports, hbOnly?, lbOnly?, _placed? }

      const hdmiTotal = (inp.hdmi4k || 0) + (inp.hdmiFhd || 0);
      const NATIVE_HDMI = 8;
      const hdmiOverflow = Math.max(0, hdmiTotal - NATIVE_HDMI);
      if (hdmiOverflow > 0) {
        let remaining = hdmiOverflow;
        if (remaining >= 4) {
          cardsNeeded.push({ key: 'HDMI_4K_4IN', ports: 4, hbOnly: true });
          remaining -= 4;
        }
        while (remaining > 0) {
          cardsNeeded.push({ key: 'HDMI_4K_2IN', ports: 2, hbOnly: false });
          remaining -= 2;
        }
      }
      if ((inp.sdi12g || 0) > 0) {
        let r = inp.sdi12g;
        while (r > 0) { cardsNeeded.push({ key: 'SDI_12G_4IN', ports: 4, hbOnly: true }); r -= 4; }
      }
      if ((inp.sdi3g || 0) > 0) {
        let r = inp.sdi3g;
        while (r > 0) { cardsNeeded.push({ key: 'SDI_3G_4IN', ports: 4, hbOnly: false }); r -= 4; }
      }
      if ((inp.hdbt || 0) > 0) {
        let r = inp.hdbt;
        while (r > 0) { cardsNeeded.push({ key: 'HDBASET_2IN', ports: 2, hbOnly: false }); r -= 2; }
      }
      if ((inp.ip || 0) > 0) {
        let r = inp.ip;
        while (r > 0) { cardsNeeded.push({ key: 'MEDIA_4K_IN', ports: 1, hbOnly: false }); r -= 1; }
      }
      if (input.audio) {
        cardsNeeded.push({ key: 'AUDIO_2IN_4OUT', ports: 2, hbOnly: false, lbOnly: true });
      }

      if (cardsNeeded.length === 0) return { picks: [], unfittable: [] };

      // Pack into 2 slots: Slot 12 = HB, Slot 11 = LB.
      // Greedy: HB-only first, LB-only next, then flexibles respecting pairing.
      let slot12Key = null, slot11Key = null;
      for (let i = 0; i < cardsNeeded.length; i++) {
        const c = cardsNeeded[i];
        if (c.hbOnly && !slot12Key) { slot12Key = c.key; c._placed = true; break; }
      }
      for (let i = 0; i < cardsNeeded.length; i++) {
        const c = cardsNeeded[i];
        if (c.lbOnly && !c._placed && !slot11Key) { slot11Key = c.key; c._placed = true; break; }
      }
      const remaining = cardsNeeded.filter(c => !c._placed);
      for (let i = 0; i < remaining.length; i++) {
        const c = remaining[i];
        if (!slot12Key) { slot12Key = c.key; c._placed = true; }
        else if (!slot11Key) {
          const allowedInSlot11 = SLOT11[slot12Key] || [];
          if (allowedInSlot11.indexOf(c.key) >= 0) { slot11Key = c.key; c._placed = true; }
        }
      }

      const picks = [];
      const unfittable = [];
      if (slot12Key) picks.push({ card: IC[slot12Key], qty: 1, slot: 'HB (Slot 12)' });
      if (slot11Key) picks.push({ card: IC[slot11Key], qty: 1, slot: 'LB (Slot 11)' });
      cardsNeeded.forEach(c => { if (!c._placed) unfittable.push(c.key); });

      return { picks, unfittable };
    }

    function recommendCalico(rawInput) {
      // Normalize input — defensive defaults so callers can omit zeros.
      const input = {
        inputs: Object.assign(
          { hdmi4k: 0, hdmiFhd: 0, sdi12g: 0, sdi3g: 0, hdbt: 0, ip: 0 },
          (rawInput && rawInput.inputs) || {}
        ),
        outputs: Object.assign(
          { display: 0, projector: 0, projectorRes: 'FHD', sdi: 0, led: false },
          (rawInput && rawInput.outputs) || {}
        ),
        screens: (rawInput && rawInput.screens) || [],
        audio: !!(rawInput && rawInput.audio)
      };

      const PORT_CAP = CATALOG.constants.PORT_CAPACITY_4K60;
      const CHASSIS = CATALOG.calico.chassis;
      const OUT = CATALOG.calico.outputCards;

      const ledPixels = input.screens.reduce((a, s) => a + (s.pixels || 0), 0);
      const ledPorts = input.screens.reduce((a, s) => a + (s.ports || 0), 0);
      const rawLedPorts = ledPixels > 0 ? ledPixels / PORT_CAP : 0;
      const projPorts = input.outputs.projector || 0;

      const userWantsSDI = (input.outputs.sdi || 0) > 0;
      const sdiPortsNeeded = userWantsSDI ? input.outputs.sdi : 0;
      const displayPorts = input.outputs.display || 0;
      const hdmiPortsNeeded = ledPorts + projPorts + displayPorts;
      const portsNeeded = hdmiPortsNeeded + sdiPortsNeeded;

      const inputsNeeded = input.inputs.hdmi4k + input.inputs.hdmiFhd +
                           input.inputs.sdi12g + input.inputs.sdi3g +
                           input.inputs.hdbt + input.inputs.ip;

      const projPixelsPerUnit = input.outputs.projectorRes === '4K' ? PORT_CAP : (1920 * 1080);
      const totalPixelsProcessed = ledPixels + (projPorts * projPixelsPerUnit);

      const reasons = [];
      const concerns = [];
      const valueAdds = [];
      let chassis;
      let outputCardInfeasible = false;

      // CHASSIS CASCADE (v25.99.33 logic verbatim — 1U eligible only when EVERY input is HDMI)
      const needsInputCardSlots = (input.inputs.sdi12g + input.inputs.sdi3g +
                                   input.inputs.hdbt + input.inputs.ip) > 0;
      const audioInChassis = input.audio;
      if (!userWantsSDI && !needsInputCardSlots && !audioInChassis
          && hdmiPortsNeeded <= 2 && inputsNeeded <= 6) {
        chassis = 'C7-PRO-1200';
        reasons.push('HDMI output ports: ' + hdmiPortsNeeded + ' — fits C7-PRO-1200 (2 ports native)');
        reasons.push('Inputs: ' + inputsNeeded + ' (all HDMI) — fits C7-PRO-1200 (6 inputs native)');
      } else {
        chassis = 'C7-PRO-2200';
        if (userWantsSDI) reasons.push('SDI output required — C7-PRO-2200 (1U does not support SDI)');
        if (needsInputCardSlots) reasons.push('Non-HDMI inputs (SDI / HDBaseT / IP) require expansion cards — C7-PRO-2200 (1U fixed chassis has no input slots)');
        if (audioInChassis) reasons.push('Audio input card required — C7-PRO-2200 (only the 2U chassis has the input slot for it)');
        if (!userWantsSDI && hdmiPortsNeeded <= 4 && inputsNeeded <= 8) {
          reasons.push('HDMI outputs: ' + hdmiPortsNeeded + ', Inputs: ' + inputsNeeded + ' — fit C7-PRO-2200 native');
        }
        if (hdmiPortsNeeded > 4) reasons.push('HDMI outputs: ' + hdmiPortsNeeded + ' — exceeds native 4, output card required');
        if (inputsNeeded > 8) reasons.push('Inputs: ' + inputsNeeded + ' — exceeds native 8, input card required');
      }

      const model = CHASSIS[chassis];
      const cards = [];

      if (chassis === 'C7-PRO-2200') {
        const nativeHdmi = model.maxPortsNative; // 4

        // OUTPUT CARD SELECTION — Slot 10 holds exactly ONE card
        if (userWantsSDI && hdmiPortsNeeded > nativeHdmi) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — SDI output AND more than ' + nativeHdmi + ' HDMI outputs both requested. Slot 10 holds only ONE card (either SDI or HDMI expansion, not both). Requested: ' + hdmiPortsNeeded + ' HDMI + ' + sdiPortsNeeded + ' SDI. Multi-unit scenario required.');
        } else if (userWantsSDI && sdiPortsNeeded > 4) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — ' + sdiPortsNeeded + ' SDI outputs requested, but SDI_12G 4-OUT card provides max 4 ports. Multi-unit scenario required.');
        } else if (!userWantsSDI && hdmiPortsNeeded > 12) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — ' + hdmiPortsNeeded + ' HDMI outputs requested, but single C7-PRO-2200 maxes at 12 (native 4 × 4K + card 8 × FHD). Multi-unit scenario required.');
        } else if (!userWantsSDI && hdmiPortsNeeded > 8 && hdmiPortsNeeded <= 12) {
          cards.push({
            sku: OUT.HDMI_2K_8OUT.sku, description: OUT.HDMI_2K_8OUT.desc, qty: 1,
            notes: 'Adds 8 × FHD HDMI ports (native 4 × 4K HDMI remain). Used because 4K expansion card maxes at 8 total ports.',
            role: 'output_card'
          });
          reasons.push(hdmiPortsNeeded + ' HDMI outputs → HDMI_2K 8-OUT card (native 4 × 4K + card 8 × FHD = 12 HDMI ports total)');
          concerns.push('Port mix: 4 outputs available at 4K (native HDMI) and 8 outputs at FHD (via HDMI_2K 8-OUT card). Map displays to 4K vs FHD paths during BOM review.');
        } else if (!userWantsSDI && hdmiPortsNeeded > nativeHdmi) {
          cards.push({
            sku: OUT.HDMI_4K_4OUT.sku, description: OUT.HDMI_4K_4OUT.desc, qty: 1,
            notes: 'Adds 4 × 4K HDMI ports (native 4 + card 4 = 8 × 4K HDMI total)',
            role: 'output_card'
          });
          reasons.push(hdmiPortsNeeded + ' HDMI outputs → HDMI_4K 4-OUT card (native 4 + card 4 = 8 × 4K HDMI)');
        } else if (userWantsSDI && sdiPortsNeeded > 0 && sdiPortsNeeded <= 4) {
          cards.push({
            sku: OUT.SDI_12G_4OUT.sku, description: OUT.SDI_12G_4OUT.desc, qty: 1,
            notes: 'Adds 4 × 4K SDI ports (' + sdiPortsNeeded + ' needed). Native 4 × 4K HDMI outputs remain available.',
            role: 'output_card'
          });
          reasons.push(sdiPortsNeeded + ' SDI output(s) → SDI_12G 4-OUT card');
          if (hdmiPortsNeeded > 0) reasons.push(hdmiPortsNeeded + ' HDMI output(s) use native 4 × 4K HDMI ports (no HDMI expansion card needed)');
        }
        // HDMI ≤ 4 with no SDI → no output card (chassis only handles it)

        // INPUT CARD SELECTION
        const extraIn = Math.max(0, inputsNeeded - model.inputs);
        const audioNeeded = input.audio;
        const hasNonHdmi = needsInputCardSlots;
        const shouldPickCards = extraIn > 0 || audioNeeded || hasNonHdmi;

        if (shouldPickCards) {
          const result = _pickCalicoInputCards(extraIn, input);
          const inputCards = result.picks;
          const unfittable = result.unfittable;
          inputCards.forEach(ic => {
            cards.push({
              sku: ic.card.sku, description: ic.card.desc, qty: ic.qty,
              notes: 'Input expansion — adds ' + (ic.qty * ic.card.ports) + ' × ' + ic.card.resolution + ' ' + ic.card.signal + ' port(s) [' + ic.slot + ']',
              role: 'input_card'
            });
          });
          if (inputCards.length > 0) {
            reasons.push(inputCards.map(ic => ic.qty + '× ' + ic.card.sku + ' ' + ic.slot).join(' + '));
          }
          if (unfittable.length > 0) {
            outputCardInfeasible = true;
            concerns.push('⚠ NOT POSSIBLE in single chassis — ' + unfittable.length + ' card(s) cannot fit in remaining slots: ' + unfittable.join(', ') + '. Slot constraints (HB-only, LB-only, or cross-slot pairing rules) prevent fit. Multi-chassis scenario required.');
          }
        } else if (inputsNeeded > 0 && inputsNeeded <= model.inputs && (input.inputs.hdmiFhd || 0) > 0) {
          // VALUE-ADD: Inputs fit native AND user asked for FHD → promote to 4K free.
          const fhdCount = input.inputs.hdmiFhd;
          const k4Count = input.inputs.hdmi4k || 0;
          valueAdds.push({
            title: 'Free upgrade: ' + fhdCount + ' × FHD inputs promoted to 4K',
            body: 'Your requirement lists ' + k4Count + ' × 4K + ' + fhdCount + ' × FHD inputs. All ' + inputsNeeded + ' inputs fit within the C7-PRO-2200\'s 8 native 4K-capable inputs — so we deliver all ' + inputsNeeded + ' as 4K at no additional cost. No FHD input card required, and the customer gets full 4K capability across every source.'
          });
        }
        if (inputsNeeded > 16) {
          outputCardInfeasible = true;
          concerns.push('⚠ NO SINGLE-CHASSIS RECOMMENDATION — ' + inputsNeeded + ' inputs requested exceed single-chassis max of 16. Multi-unit scenario required.');
        }

        // Defensive BoM-completeness check (v25.99.37 — never silently ship
        // unwireable BoM when non-HDMI inputs lack a matching input card).
        const nonHdmiIn = input.inputs.sdi12g + input.inputs.sdi3g +
                          input.inputs.hdbt + input.inputs.ip;
        const inCardCount = cards.filter(c => c.role === 'input_card').length;
        if (nonHdmiIn > 0 && inCardCount === 0) {
          concerns.push('⚠ INPUT CARD MISSING — the configuration includes ' + nonHdmiIn + ' non-HDMI input(s) (SDI / HDBaseT / IP) but no input-expansion card is in the BoM. The C7-PRO-2200 native inputs are HDMI-only — these sources cannot connect without the matching input card. Re-check the input configuration.');
        }
      }

      if (projPorts > 0) {
        const mode = projPorts > 1 ? 'edge blend' : 'standalone';
        reasons.push(projPorts + '× ' + input.outputs.projectorRes + ' projector' +
                     (projPorts > 1 ? 's' : '') + ' (' + mode + ') — 1 port per projector');
      }

      return {
        chassis,
        cards,
        concerns,
        valueAdds,
        reasons,
        meta: {
          model: model.model, formFactor: model.formFactor,
          ledPixels, ledPorts, rawLedPorts, projPorts,
          hdmiPortsNeeded, sdiPortsNeeded, portsNeeded,
          totalPixelsProcessed, inputsNeeded,
          hasCards: cards.length > 0,
          outputCardInfeasible
        }
      };
    }

    return Object.freeze({
      calico: recommendCalico,
      mv: recommendMv,
      corio: recommendCorio
    });

    /* ---------- MV (CORIOview) ---------- */

    // Pure-function port of v26 recommendMWP (L10807).
    // Soft issues → concerns. Hard impossibilities (signal not in catalog,
    // too many cards for MTO) → returned as { error, chassis: null, cards: [] }
    // per SPEC §2.3.
    function recommendMv(rawInput) {
      const input = {
        inputs: Array.isArray(rawInput && rawInput.inputs) ? rawInput.inputs : [],
        outputSignal: (rawInput && rawInput.outputSignal) || ''
      };

      const CHASSIS = CATALOG.mv.chassis;
      const INPUT_MODS = CATALOG.mv.inputModules;
      const OUTPUT_MODS = CATALOG.mv.outputModules;
      const MTO = CHASSIS['MWP-MTO'];

      // Normalize: filter to entries with valid signal + qty>0
      const validInputs = input.inputs.filter(r => r && r.signal && Number(r.qty) > 0);

      if (validInputs.length === 0 || !input.outputSignal) {
        return {
          chassis: null, cards: [], concerns: [], valueAdds: [],
          reasons: [],
          meta: { type: 'empty', kind: validInputs.length === 0 ? 'no-inputs' : 'no-output' },
          error: validInputs.length === 0 ? 'No input rows provided.' : 'No output signal selected.'
        };
      }

      const reasons = [];
      const concerns = [];
      const valueAdds = [];

      // Step 1: SINGLE-signal path — try a fixed preset (only possible when output is 4K HDMI).
      if (validInputs.length === 1) {
        const single = validInputs[0];
        const sig = single.signal;
        const qty = Number(single.qty) || 0;

        if (input.outputSignal === '4K HDMI') {
          // Iterate fixed-chassis entries in catalog order, find ones matching signal & capacity.
          const candidates = [];
          Object.keys(CHASSIS).forEach(sku => {
            const c = CHASSIS[sku];
            if (c.fixedChassis && c.inSignal === sig && c.inPorts >= qty) {
              candidates.push(c);
            }
          });
          if (candidates.length > 0) {
            candidates.sort((a, b) => a.inPorts - b.inPorts);
            const chosen = candidates[0];
            reasons.push('Single-signal ' + qty + '× ' + sig + ' → ' + chosen.sku + ' (' + chosen.inPorts + '-port preset)');
            return {
              chassis: chosen.sku,
              cards: [],
              concerns,
              valueAdds,
              reasons,
              meta: {
                type: 'fixed', chassisDesc: chosen.desc,
                inputSignal: sig, outputSignal: input.outputSignal, inputCount: qty
              }
            };
          }
        }

        // Step 2: single-signal MTO fallback
        const inputCard = INPUT_MODS[sig];
        const outputCard = OUTPUT_MODS[input.outputSignal];
        if (!inputCard) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'Input signal "' + sig + '" not supported in current catalog.'
          };
        }
        if (!outputCard) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'Output signal "' + input.outputSignal + '" not supported in current catalog.'
          };
        }
        const cardsNeeded = Math.ceil(qty / inputCard.portsPerCard);
        if (cardsNeeded > MTO.maxInputCards) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'This configuration needs ' + cardsNeeded + ' input cards but MWP-MTO supports max ' + MTO.maxInputCards + '. Contact tvONE for a custom build.'
          };
        }

        // Preserve PLACEHOLDER warning as a concern if the output card is flagged.
        if (outputCard.placeholder) {
          concerns.push('Output module ' + outputCard.sku + ' is a PLACEHOLDER SKU; awaiting tvONE confirmation.');
        }

        reasons.push('No fixed preset matches — MTO build: ' + cardsNeeded + '× ' + inputCard.sku + ' + 1× ' + outputCard.sku);
        return {
          chassis: 'MWP-MTO',
          cards: [
            { sku: inputCard.sku,  description: inputCard.desc,  qty: cardsNeeded, role: 'input_card',  inputSignal: sig },
            { sku: outputCard.sku, description: outputCard.desc, qty: 1,           role: 'output_card', outputSignal: input.outputSignal }
          ],
          concerns,
          valueAdds,
          reasons,
          meta: {
            type: 'mto', chassisDesc: MTO.desc,
            inputSignal: sig, outputSignal: input.outputSignal, inputCount: qty
          }
        };
      }

      // Step 3: MIXED-input MTO path — always MWP-MTO with one card per signal type.
      const outputCard = OUTPUT_MODS[input.outputSignal];
      if (!outputCard) {
        return {
          chassis: null, cards: [], concerns, valueAdds, reasons,
          meta: { type: 'error' },
          error: 'Output signal "' + input.outputSignal + '" not supported in current catalog.'
        };
      }

      const cardLines = [];
      let totalCards = 0;
      const signalLabels = [];
      let totalPorts = 0;
      for (let i = 0; i < validInputs.length; i++) {
        const row = validInputs[i];
        const sig = row.signal;
        const qty = Number(row.qty) || 0;
        const inputCard = INPUT_MODS[sig];
        if (!inputCard) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error' },
            error: 'Input signal "' + sig + '" not supported in current catalog.'
          };
        }
        const cardsNeeded = Math.ceil(qty / inputCard.portsPerCard);
        cardLines.push({
          sku: inputCard.sku, description: inputCard.desc, qty: cardsNeeded,
          role: 'input_card', inputSignal: sig
        });
        totalCards += cardsNeeded;
        signalLabels.push(qty + '× ' + sig);
        totalPorts += qty;
      }

      if (totalCards > MTO.maxInputCards) {
        return {
          chassis: null, cards: [], concerns, valueAdds, reasons,
          meta: { type: 'error' },
          error: 'Mixed-input build needs ' + totalCards + ' input cards but MWP-MTO supports max ' + MTO.maxInputCards + '. Reduce signal-type count or quantities. Contact tvONE for higher-density custom builds.'
        };
      }

      if (outputCard.placeholder) {
        concerns.push('Output module ' + outputCard.sku + ' is a PLACEHOLDER SKU; awaiting tvONE confirmation.');
      }

      const summarySignals = signalLabels.join(' + ');
      reasons.push('Mixed inputs (' + summarySignals + ') → MWP-MTO + ' + cardLines.length + ' input card(s) + 1× ' + outputCard.sku);

      return {
        chassis: 'MWP-MTO',
        cards: cardLines.concat([
          { sku: outputCard.sku, description: outputCard.desc, qty: 1, role: 'output_card', outputSignal: input.outputSignal }
        ]),
        concerns,
        valueAdds,
        reasons,
        meta: {
          type: 'mto-mixed', chassisDesc: MTO.desc + ' · mixed input (' + summarySignals + ')',
          inputSignal: summarySignals, outputSignal: input.outputSignal, inputCount: totalPorts
        }
      };
    }

    /* ---------- CORIO ---------- */

    // Pure-function port of v26 _corioAutoSelectChassis (L4341).
    // Returns chassis SKU based on signal mix.
    function _corioAutoSelectChassis(inputCounts, outputCounts) {
      const has4K = (Number(inputCounts['HDMI 4K'] || 0) > 0)
                 || (Number(inputCounts['HDMI 4K 2-in'] || 0) > 0)
                 || (Number(inputCounts['HDMI 4K 4-in'] || 0) > 0)
                 || (Number(inputCounts['SDI 12G'] || 0) > 0)
                 || (Number(outputCounts['HDMI 4K'] || 0) > 0)
                 || (Number(outputCounts['HDMI 4K 1-out'] || 0) > 0)
                 || (Number(outputCounts['HDMI 4K 2-out'] || 0) > 0)
                 || (Number(outputCounts['SDI 12G'] || 0) > 0);
      if (has4K) return 'CM2-547-MK2';
      let estSlots = 0;
      Object.keys(inputCounts).forEach(k => {
        const q = Number(inputCounts[k] || 0);
        if (q > 0) estSlots += Math.ceil(q / 2);
      });
      Object.keys(outputCounts).forEach(k => {
        const q = Number(outputCounts[k] || 0);
        if (q > 0) estSlots += Math.ceil(q / 2);
      });
      return (estSlots <= 3) ? 'C3-503' : 'C3-510';
    }

    // Pure-function port of v26 recommendCORIO (L11463) + auto-select combined.
    // Caller can override chassis via rawInput.chassisSku; otherwise auto-selected.
    function recommendCorio(rawInput) {
      const input = {
        inputs: (rawInput && rawInput.inputs) || {},
        outputs: (rawInput && rawInput.outputs) || {},
        audio: (rawInput && rawInput.audio) || null,             // '2-4' | '8-8' | null
        psuChoice: (rawInput && rawInput.psuChoice) || '400',     // '400' | '700' | '400+redundant' | ...
        fanFilter: !!(rawInput && rawInput.fanFilter),
        autoBlank: (rawInput && rawInput.autoBlank !== false),    // default true
        chassisSku: (rawInput && rawInput.chassisSku) || null
      };

      const CHASSIS = CATALOG.corio.chassis;
      const ACC = CATALOG.corio.accessories;
      const PSUS = CATALOG.corio.psu;

      // Resolve chassis: explicit override or auto-select.
      const chassisSku = input.chassisSku || _corioAutoSelectChassis(input.inputs, input.outputs);
      const chassis = CHASSIS[chassisSku];
      if (!chassis) {
        return {
          chassis: null, cards: [], concerns: [], valueAdds: [], reasons: [],
          meta: { type: 'error' },
          error: 'Unknown chassis: ' + chassisSku
        };
      }

      const moduleSet = (chassis.cardEcosystem === 'CM2') ? CATALOG.corio.cm2 : CATALOG.corio.cm;
      const cards = [];
      const concerns = [];
      const valueAdds = [];
      const reasons = [];
      let slotsInputUsed = 0, slotsOutputUsed = 0;

      reasons.push('Auto-selected ' + chassis.label + ' (' + chassis.sku + ') based on signal mix');

      // Input cards
      for (let i = 0; i < moduleSet.inputs.length; i++) {
        const card = moduleSet.inputs[i];
        const qty = Number(input.inputs[card.key] || 0);
        if (qty <= 0) continue;
        let portsRequired = qty;
        // C3-510 has 2 fixed DVI-U input ports built-in — subtract them only for DVI-U
        if (chassis.fixedInput && card.key === chassis.fixedInput.signal) {
          portsRequired = Math.max(0, qty - chassis.fixedInput.ports);
        }
        if (portsRequired <= 0) {
          reasons.push(qty + '× ' + card.key + ' absorbed by chassis fixed input — no card needed');
          continue;
        }
        const cardsNeeded = Math.ceil(portsRequired / card.ports);
        cards.push({
          sku: card.sku, qty: cardsNeeded,
          description: card.desc + ' (' + qty + ' port' + (qty === 1 ? '' : 's') + ' requested)',
          role: 'input_card', inputSignal: card.key,
          meta: { portsPerCard: card.ports, portsRequested: qty, portsAfterFixed: portsRequired }
        });
        slotsInputUsed += cardsNeeded;
      }

      // Output cards
      for (let i = 0; i < moduleSet.outputs.length; i++) {
        const card = moduleSet.outputs[i];
        const qty = Number(input.outputs[card.key] || 0);
        if (qty <= 0) continue;
        const cardsNeeded = Math.ceil(qty / card.ports);
        cards.push({
          sku: card.sku, qty: cardsNeeded,
          description: card.desc + ' (' + qty + ' port' + (qty === 1 ? '' : 's') + ' requested)',
          role: 'output_card', outputSignal: card.key,
          meta: { portsPerCard: card.ports, portsRequested: qty }
        });
        slotsOutputUsed += cardsNeeded;
      }

      // Audio module
      if (input.audio === '2-4' && moduleSet.audio['2-4']) {
        cards.push({
          sku: moduleSet.audio['2-4'].sku, qty: 1,
          description: moduleSet.audio['2-4'].desc,
          role: 'audio_card'
        });
        slotsInputUsed += 1;
      } else if (input.audio === '8-8') {
        if (moduleSet.audio['8-8']) {
          cards.push({
            sku: moduleSet.audio['8-8'].sku, qty: 1,
            description: moduleSet.audio['8-8'].desc,
            role: 'audio_card'
          });
          slotsInputUsed += 1;
        } else {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error', attemptedChassis: chassis.sku },
            error: '8-IN / 8-OUT audio module only available on CORIOmaster Micro/Mini. CM2 supports 2-IN/3-OUT only.'
          };
        }
      }

      // Slot validation (hard math)
      const totalSlotsUsed = slotsInputUsed + slotsOutputUsed;
      if (chassis.slotsAreFlex) {
        if (totalSlotsUsed > chassis.slots) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error', attemptedChassis: chassis.sku, slotsUsed: totalSlotsUsed, slotsTotal: chassis.slots },
            error: 'Configuration needs ' + totalSlotsUsed + ' slots but ' + chassis.label + ' has only ' + chassis.slots + ' slots. Reduce the input/output count or pick a larger chassis.'
          };
        }
      } else {
        // CM2: input vs output split with 1 flex overflow slot.
        const inputCap = (chassis.slotsInputOnly + chassis.slotsInputHb);  // 8 for CM2
        const outputCap = chassis.slotsOutput;                              // 7 for CM2
        const flexCap = chassis.slotsFlex;                                  // 1 for CM2
        const inputOver = Math.max(0, slotsInputUsed - inputCap);
        const outputOver = Math.max(0, slotsOutputUsed - outputCap);
        const flexUsed = inputOver + outputOver;
        if (flexUsed > flexCap) {
          return {
            chassis: null, cards: [], concerns, valueAdds, reasons,
            meta: { type: 'error', attemptedChassis: chassis.sku, slotsInputUsed, slotsOutputUsed },
            error: 'Configuration needs ' + slotsInputUsed + ' input slot(s) + ' + slotsOutputUsed + ' output slot(s) — exceeds CM2 capacity (max 8 input + 7 output + 1 flex). Reduce cards or split into multiple chassis.'
          };
        }
      }

      // CPU module (auto-include)
      cards.push({
        sku: chassis.cpuModule, qty: 1,
        description: 'HTTPS CPU module for ' + chassis.label,
        role: 'accessory'
      });

      // PSU
      if (chassis.psuRequired) {
        const is700 = String(input.psuChoice).indexOf('700') === 0;
        const psu = is700 ? PSUS['700'] : PSUS['400'];
        cards.push({
          sku: psu.sku, qty: 1,
          description: psu.desc + ' (chassis PSU)',
          role: 'accessory'
        });
        if (String(input.psuChoice).indexOf('redundant') !== -1) {
          cards.push({
            sku: psu.sku, qty: 1,
            description: psu.desc + ' (redundant)',
            role: 'accessory'
          });
        }
      }

      // Fan filter (optional, customer-requested)
      if (input.fanFilter) {
        const filter = ACC['CM2-Filter'];
        cards.push({
          sku: filter.sku, qty: 1,
          description: filter.desc,
          role: 'accessory'
        });
      }

      // CM-BLANK auto-fill for Micro/Mini if enabled
      if (input.autoBlank && (chassis.sku === 'C3-503' || chassis.sku === 'C3-510')) {
        const unfilled = chassis.slots - totalSlotsUsed;
        if (unfilled > 0) {
          const blank = ACC['CM-BLANK'];
          cards.push({
            sku: blank.sku, qty: unfilled,
            description: blank.desc + (unfilled === 1 ? '' : 's'),
            role: 'accessory'
          });
        }
      }

      return {
        chassis: chassis.sku,
        cards,
        concerns,
        valueAdds,
        reasons,
        meta: {
          type: 'ok',
          chassisLabel: chassis.label,
          ecosystem: chassis.cardEcosystem,
          slotsUsed: totalSlotsUsed,
          slotsTotal: chassis.slots,
          slotsInputUsed,
          slotsOutputUsed
        }
      };
    }
  })();

  /* ============================================================
     STORE (Session 4 of v27 rebuild)
     Thin JS wrapper over the existing Supabase RPC layer.
     NO new SQL: backend was already built out in this DB (48 RPCs
     in public schema, RLS enabled with zero policies — direct table
     access denied; all CRUD via security-definer RPCs).

     Auth recipe (mirrors BS frontend, confirmed 2026-05-22):
       1. salt = await rpc('user_login_salt', {p_username})
       2. hash = sha256Hex(password.trim() + salt)        ← pw-then-salt
       3. { ok, user } = await rpc('user_login', {p_username, p_password_hash: hash})
     Server-side is algorithm-agnostic — it just string-compares stored
     password_hash to the client-computed value (after trim()).

     Session model: user object cached in localStorage under 'v27.session'.
     No server-side tokens. Every protected RPC takes actor_user_id as
     a parameter (validated server-side); STORE auto-fills it from cache.

     SPEC §6 contract (display_ref replaces SPEC's "refId" naming):
       await STORE.login({username, password})
       const r    = await STORE.saveDeal({ project, stage, customer_name, ... })
       const back = await STORE.loadDeal(r.display_ref)
       const list = await STORE.listDeals()
       await STORE.deleteDeal(r.display_ref)
     ============================================================ */
  const STORE = (function() {

    const SUPABASE_URL = 'https://yhzecukifwnlgowmgkrc.supabase.co';
    // Publishable key (sb_publishable_*) — public by design, safe to embed in client.
    // Independently rotatable; not the service_role key.
    const SUPABASE_KEY = 'sb_publishable_Rex8QiypJkVmJz2r7UPGtg_3-l1yy1u';
    const STORAGE_KEY  = 'v27.session';
    const REF_PREFIX   = 'TV-';
    const REF_DIGITS   = 8;
    const APP_TAG      = 'tvone';

    let _user = null;
    const _listeners = new Set();

    /* ---------- crypto ---------- */

    // sha256(text) → lowercase hex string. Uses WebCrypto SubtleCrypto.
    async function sha256Hex(text) {
      const enc = new TextEncoder().encode(String(text));
      const buf = await crypto.subtle.digest('SHA-256', enc);
      const arr = new Uint8Array(buf);
      let s = '';
      for (let i = 0; i < arr.length; i++) s += arr[i].toString(16).padStart(2, '0');
      return s;
    }

    function randomHex(bytes) {
      const arr = new Uint8Array(bytes);
      crypto.getRandomValues(arr);
      let s = '';
      for (let i = 0; i < arr.length; i++) s += arr[i].toString(16).padStart(2, '0');
      return s;
    }

    function randomDigits(n) {
      const arr = new Uint8Array(n * 2);   // overdraw, modulo bias is acceptable for ref IDs
      crypto.getRandomValues(arr);
      let s = '';
      for (let i = 0; i < arr.length && s.length < n; i++) s += (arr[i] % 10).toString();
      return s.slice(0, n);
    }

    /* ---------- transport ---------- */

    async function rpc(name, args) {
      let res;
      try {
        res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
          method: 'POST',
          headers: {
            'apikey':        SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type':  'application/json',
            'Accept':        'application/json'
          },
          body: JSON.stringify(args || {})
        });
      } catch (e) {
        throw new Error('rpc ' + name + ' network error: ' + (e && e.message || e));
      }
      const text = await res.text();
      let json = null;
      if (text) {
        try { json = JSON.parse(text); }
        catch (_) { /* non-JSON; leave json null, use raw text in error */ }
      }
      if (!res.ok) {
        const msg = (json && (json.message || json.error || json.hint)) ||
                    text || ('http ' + res.status);
        throw new Error('rpc ' + name + ' failed: ' + msg);
      }
      return json;
    }

    /* ---------- session ---------- */

    function fireAuthChange() {
      for (const cb of _listeners) {
        try { cb(_user); }
        catch (e) { console.error('STORE.onAuthChange handler threw:', e); }
      }
    }

    // Boot: restore user from localStorage if present. Pure local check;
    // does not call the server (no session token to validate).
    (function bootRestore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) _user = JSON.parse(raw);
      } catch (_) { _user = null; }
    })();

    async function login(opts) {
      const o = opts || {};
      const username = String(o.username || '').trim().toLowerCase();
      const password = String(o.password || '').trim();
      if (!username || !password) {
        throw new Error('username and password required');
      }
      const saltResp = await rpc('user_login_salt', { p_username: username });
      // Server returns {salt: ''} on miss to prevent username enumeration —
      // we treat empty salt same as a wrong password (generic failure).
      if (!saltResp || !saltResp.salt) {
        throw new Error('Incorrect username or password');
      }
      const hash = await sha256Hex(password + saltResp.salt);
      const r = await rpc('user_login', {
        p_username:      username,
        p_password_hash: hash
      });
      if (!r || r.ok !== true) {
        throw new Error((r && r.error) || 'Incorrect username or password');
      }
      _user = r.user;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(_user)); } catch (_) {}
      fireAuthChange();
      return _user;
    }

    function logout() {
      _user = null;
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      fireAuthChange();
    }

    function currentUser() { return _user; }

    function onAuthChange(cb) {
      if (typeof cb !== 'function') throw new Error('onAuthChange requires a function');
      _listeners.add(cb);
      return function unsubscribe() { _listeners.delete(cb); };
    }

    async function changePassword(opts) {
      if (!_user) throw new Error('not logged in');
      const o = opts || {};
      const oldPw = String(o.oldPassword || '').trim();
      const newPw = String(o.newPassword || '').trim();
      if (!oldPw || !newPw) throw new Error('oldPassword and newPassword required');

      const saltResp = await rpc('user_login_salt', { p_username: _user.username });
      if (!saltResp || !saltResp.salt) throw new Error('account state error — re-login');

      const oldHash = await sha256Hex(oldPw + saltResp.salt);
      const newSalt = randomHex(16);                       // 32-char hex, parity with prod
      const newHash = await sha256Hex(newPw + newSalt);

      const r = await rpc('user_change_password', {
        p_username:          _user.username,
        p_old_password_hash: oldHash,
        p_new_salt:          newSalt,
        p_new_password_hash: newHash
      });
      if (!r || r.ok !== true) {
        throw new Error((r && r.error) || 'change password failed');
      }
      // Update cached must_change so the Profile gate clears
      _user = Object.assign({}, _user, { must_change: false });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(_user)); } catch (_) {}
      fireAuthChange();
      return true;
    }

    /* ---------- deals ---------- */

    function genDisplayRef() {
      return REF_PREFIX + randomDigits(REF_DIGITS);
    }

    function isUniqueViolation(err) {
      const m = String(err && err.message || '').toLowerCase();
      return m.indexOf('duplicate') >= 0 || m.indexOf('unique') >= 0 ||
             m.indexOf('display_ref') >= 0;
    }

    async function saveDeal(payload) {
      if (!_user) throw new Error('not logged in');
      if (!payload || typeof payload !== 'object') throw new Error('payload required');

      const base = Object.assign({}, payload, {
        actor_user_id: _user.id,
        app:           APP_TAG
      });

      // Edit path — id present, use existing display_ref on server
      if (base.id) {
        return rpc('deal_save', { p_payload: base });
      }

      // New deal — generate display_ref, retry on the (1-in-100M) collision
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        const enriched = Object.assign({}, base, { display_ref: genDisplayRef() });
        try {
          return await rpc('deal_save', { p_payload: enriched });
        } catch (e) {
          lastErr = e;
          if (!isUniqueViolation(e)) throw e;
        }
      }
      throw lastErr || new Error('saveDeal failed after retries');
    }

    async function loadDeal(displayRef) {
      if (!displayRef) throw new Error('displayRef required');
      return rpc('deal_get', { p_deal_id: null, p_display_ref: String(displayRef) });
    }

    async function listDeals(opts) {
      const o = opts || {};
      return rpc('deal_list', {
        p_app:              APP_TAG,
        p_limit:            (o.limit != null ? o.limit : 50),
        p_offset:           (o.offset || 0),
        p_include_deleted:  !!o.includeDeleted
      });
    }

    async function deleteDeal(displayRef) {
      if (!_user) throw new Error('not logged in');
      if (!displayRef) throw new Error('displayRef required');
      return rpc('entry_soft_delete', {
        p_ref_id: String(displayRef),
        p_actor:  _user.id
      });
    }

    async function restoreDeal(displayRef) {
      if (!_user) throw new Error('not logged in');
      if (!displayRef) throw new Error('displayRef required');
      return rpc('entry_restore', {
        p_ref_id: String(displayRef),
        p_actor:  _user.id
      });
    }

    return Object.freeze({
      // auth
      login, logout, currentUser, onAuthChange, changePassword,
      // deals
      saveDeal, loadDeal, listDeals, deleteDeal, restoreDeal,
      // internals exposed for debug only
      _rpc: rpc, _sha256Hex: sha256Hex
    });
  })();

    function loadDraft() {
      try {
        const raw = localStorage.getItem(WIZ_KEY);
        if (!raw) return defaultWizard();
        const parsed = JSON.parse(raw);
        const merged = Object.assign(defaultWizard(), parsed);
        merged.reco = null;
        merged.errors = {};
        return merged;
      } catch (e) {
        return defaultWizard();
      }
    }

    const saveDraft = debounce(function() {
      try {
        if (!wizardData) return;
        const o = Object.assign({}, wizardData);
        delete o.reco; delete o.errors;
        localStorage.setItem(WIZ_KEY, JSON.stringify(o));
      } catch (e) { /* silent */ }
    }, 350);

    function clearDraft() {
      try { localStorage.removeItem(WIZ_KEY); } catch (e) {}
      wizardData = defaultWizard();

    /* ---------- Toast / sheet / chrome ---------- */

    function toast(msg, level) {
      level = level || 'default';
      const host = $('toast-host');
      if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast' + (level !== 'default' ? ' ' + level : '');
      el.textContent = msg;
      host.appendChild(el);
      const ms = level === 'err' ? 6500 : 3500;
      setTimeout(() => {
        el.style.transition = 'opacity 220ms';
        el.style.opacity = '0';
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
      }, ms);
    }

                      (target === '#/quote/new' && hash.indexOf('#/quote/new') === 0) ||
                      (target === '#/history' && hash.indexOf('#/quote/') === 0 && hash !== '#/quote/new');
        if (match) b.setAttribute('aria-current', 'page');
