     produces Excel + PDF blobs from a saved-deal payload.

     Network restriction risk: Cavitak office has been known to block
     some CDNs (per BS work notes). If jsdelivr is blocked at the
     network level, fallback is inline-bundled libraries (~1.2 MB
     added to the HTML — only worth it if reachability fails).
     Test reachability before relying on the lazy-load path.

     UMD note: ExcelJS / jsPDF / html2canvas all ship UMD that
     attaches to window.* . Native ES `import()` doesn't work; we
     inject a <script> tag and wait for onload.
     ============================================================ */
  const EXPORT = (function() {

    // CDN endpoints. Versions pinned for reproducibility.
    const CDN_EXCELJS     = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    const CDN_JSPDF       = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
    const CDN_HTML2CANVAS = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';

    // Cache promise per URL so concurrent calls don't double-fetch.
    const _loadPromises = {};

    // Inject a <script> tag and resolve when it fires onload. Errors are
    // surfaced as Promise rejection so callers can fall back / toast.
    function loadScript(url) {
      if (_loadPromises[url]) return _loadPromises[url];
      _loadPromises[url] = new Promise(function(resolve, reject) {
        // Defensive: if the script is already in the DOM (manually added,
        // hot-reloaded etc.) and the library is on window, short-circuit.
        if (document.querySelector('script[src="' + url + '"]')) {
          return resolve();
        }
        const s = document.createElement('script');
        s.src = url;
        s.async = true;
        s.onload  = function() { resolve(); };
        s.onerror = function() {
          // Drop the cached rejected promise so a retry can re-attempt.
          delete _loadPromises[url];
          reject(new Error('Failed to load ' + url));
        };
        document.head.appendChild(s);
      });
      return _loadPromises[url];
    }

    async function loadExcelJS() {
      if (window.ExcelJS) return window.ExcelJS;
      await loadScript(CDN_EXCELJS);
      if (!window.ExcelJS) throw new Error('ExcelJS loaded but window.ExcelJS missing');
      return window.ExcelJS;
    }

    async function loadJsPDF() {
      if (window.jspdf && window.jspdf.jsPDF) return window.jspdf;
      await loadScript(CDN_JSPDF);
      // jsPDF UMD attaches as window.jspdf with .jsPDF constructor
      if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF loaded but window.jspdf.jsPDF missing');
      return window.jspdf;
    }

    async function loadHtml2Canvas() {
      if (window.html2canvas) return window.html2canvas;
      await loadScript(CDN_HTML2CANVAS);
      if (!window.html2canvas) throw new Error('html2canvas loaded but window.html2canvas missing');
      return window.html2canvas;
    }

    // Download helper. iOS Safari doesn't honour <a download> for blob URLs,
    // so we open the blob in a new tab — user taps Share → Save to Files.
    // Android + desktop browsers respect the download attribute → direct save.
    //
    // We detect iOS by UA (imperfect but the standard heuristic).
    function isIOS() {
      const ua = navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) ||
        // iPadOS 13+ identifies as Mac with touch — distinguish from desktop
        (ua.indexOf('Mac') >= 0 && navigator.maxTouchPoints > 1);
    }

    function download(blob, filename) {
      if (!blob) throw new Error('download: blob required');
      if (!filename) throw new Error('download: filename required');

      const url = URL.createObjectURL(blob);

      if (isIOS()) {
        // iOS: open in new tab. User taps Share → Save to Files.
        // The new-tab URL doesn't keep the filename; the file will save
        // with a hash-like name unless the user renames in Files. Worth
        // a one-time hint toast (Session 7 todo: localStorage flag).
        const w = window.open(url, '_blank');
        if (!w) {
          // Popup blocked — fall back to direct navigation (loses tab continuity
          // but at least the file appears).
          window.location.href = url;
        }
        // Don't revoke immediately on iOS — the new tab needs the URL alive
        // long enough to render the share sheet. Revoke after a delay.
        setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
        return { method: 'ios-newtab' };
      }

      // Android / desktop: anchor download attribute.
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // Revoke after a small delay so the download has time to initiate.
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
      return { method: 'anchor-download' };
    }

    // Filename pattern (per SPEC §5.1)
    function filename(deal, ext, opts) {
      const ref = (deal && (deal.display_ref || deal.ref || 'NOREF'));
      const date = new Date().toISOString().slice(0, 10);
      const mode = opts && opts.mode ? String(opts.mode).toUpperCase() : null;
      const modePart = mode ? '_' + mode : '';
      // v27.3.0 — Filename pattern: tvONE_Quote_<ref>_<date>[_BOQ|BOM].<ext>
      return 'tvONE_Quote_' + ref + modePart + '_' + date + '.' + ext;
    }

    // alpha.8.1 — Excel generation
    //
    // Layout (per plan §Session 8 / SPEC §5.1):
    //   Row 1: Title (merged A1:D1) — forest-green bold
    //   Row 2: Ref + generated date (merged) — italic muted
    //   Row 3: (empty)
    //   Rows 4-11: Project context, 2-column layout
    //   Row 12: (empty)
    //   Row 13: "Bill of Materials" header (merged, accent fill)
    //   Row 14: Column headers (Sr / Description / Model / Qty)
    //   Row 15+: Line items
    //   After: Concerns block (red) + Value-adds block (green)
    //   Last: Cavitak footer (merged, muted)
    //
    // Lines come from a fresh APP.recoForDeal call so the Excel reflects
    // what the user sees in the BoM card on the saved-deal view. If the
    // user has unsaved structural edits, both the on-screen BoM and the
    // Excel reflect current state (consistent UX).
    async function excel(deal, opts) {
      if (!deal) throw new Error('excel: deal required');
      // v27.3.0 — `opts.mode` ('boq' | 'bom') controls pricing column visibility.
      // Until pricing migration lands (v27.4), both modes produce the same
      // sheet because no pricing data exists yet. Mode is carried through to
      // the filename so the user knows what they got.
      const mode = (opts && opts.mode) || 'boq';
      const showPricing = mode === 'boq';
      const ExcelJS = await loadExcelJS();

      // Compute fresh reco — matches the BoM card on saved-deal view.
      let reco = null;
      try {
        if (typeof APP !== 'undefined' && APP.recoForDeal) {
          reco = APP.recoForDeal(deal);
        }
      } catch (_e) { /* leave reco null */ }

      const wb = new ExcelJS.Workbook();
      wb.creator  = 'tvONE Product Selector';
      wb.company  = 'Cavitak Marketing Pvt Ltd';
      wb.created  = new Date();

      const ws = wb.addWorksheet('Quote', {
        pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true,
          fitToWidth: 1, fitToHeight: 0,
          margins: { left: 0.5, right: 0.5, top: 0.5, bottom: 0.7,
                     header: 0.3, footer: 0.4 } },
        headerFooter: {
          oddFooter: '&L&8&I Cavitak Marketing Pvt Ltd  ·  tvONE India Distributor&R&8&I Page &P of &N'
        }
      });

      // v27.3.0 — Polish palette. ARGB strings for ExcelJS.
      // tvONE brand amber replaces the legacy forest-green palette.
      const AMBER      = 'FFE8731C'; // primary brand amber
      const AMBER_DEEP = 'FFB45309'; // deep amber for column header
      const AMBER_LIGHT= 'FFFCE7C8'; // accent-soft band fill
      const AMBER_PALE = 'FFFFF7ED'; // row banding (alt rows)
      const INK_STRONG = 'FF111827';
      const INK_SOFT   = 'FF6B7280';
      const WHITE      = 'FFFFFFFF';
      const DANGER     = 'FFB91C1C';
      const SUCCESS    = 'FF15803D';

      // Column widths — give more to Description, narrower Sr column.
      ws.columns = [
        { width:  5 },   // Sr
        { width: 50 },   // Description
        { width: 22 },   // Model
        { width:  8 }    // Qty
      ];

      // ---- Title band (amber, white text) ----
      ws.mergeCells('A1:D1');
      const titleCell = ws.getCell('A1');
      titleCell.value = 'tvONE Product Selector';
      titleCell.font = { name: 'Calibri', size: 22, bold: true, color: { argb: WHITE } };
      titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AMBER } };
      ws.getRow(1).height = 36;

      // ---- Subtitle band (amber-deep, white text) ----
      ws.mergeCells('A2:D2');
      const subCell = ws.getCell('A2');
      subCell.value = 'Cavitak Marketing Pvt Ltd  \u00b7  tvONE India Distributor';
      subCell.font = { name: 'Calibri', size: 10.5, italic: true, color: { argb: WHITE } };
      subCell.alignment = { horizontal: 'center', vertical: 'middle' };
      subCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AMBER_DEEP } };
      ws.getRow(2).height = 18;

      // ---- Ref + date row (clean below the band) ----
      ws.mergeCells('A3:D3');
      const refCell = ws.getCell('A3');
      const ref = deal.display_ref || deal.ref || 'NOREF';
      refCell.value = 'Quote ref: ' + ref + '   \u00b7   Generated ' + new Date().toISOString().slice(0, 10);
      refCell.font = { name: 'Calibri', size: 10, color: { argb: INK_SOFT } };
      refCell.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.getRow(3).height = 18;

      // ---- Project context (2-column) ----
      // v27.3.0 — labels uppercase + INK_SOFT; values bold INK_STRONG.
      // Thin amber bottom border on each row for clean visual grouping.
      function ctxRow(rowIdx, k1, v1, k2, v2) {
        const r = ws.getRow(rowIdx);
        const c1 = r.getCell(1), c2 = r.getCell(2), c3 = r.getCell(3), c4 = r.getCell(4);
        c1.value = k1; c1.font = { name:'Calibri', size: 9, bold: true, color: { argb: INK_SOFT } };
        c1.alignment = { vertical: 'middle' };
        c2.value = (v1 == null || v1 === '') ? '\u2014' : String(v1);
        c2.font  = { name:'Calibri', size: 10.5, color: { argb: INK_STRONG } };
        c2.alignment = { wrapText: true, vertical: 'middle' };
        c3.value = k2; c3.font = { name:'Calibri', size: 9, bold: true, color: { argb: INK_SOFT } };
        c3.alignment = { vertical: 'middle' };
        c4.value = (v2 == null || v2 === '') ? '\u2014' : String(v2);
        c4.font  = { name:'Calibri', size: 10.5, color: { argb: INK_STRONG } };
        c4.alignment = { wrapText: true, vertical: 'middle' };
        // Light amber bottom border for row divider
        [1,2,3,4].forEach(function(ci) {
          r.getCell(ci).border = { bottom: { style: 'hair', color: { argb: AMBER_LIGHT } } };
        });
        r.height = 17;
      }
      // Row 4 spacer
      ws.getRow(4).height = 6;
      ctxRow(5,  'PROJECT',     deal.project,         'END USER',         deal.customer_name);
      ctxRow(6,  'PARTNER',     deal.partner_name,    'CONSULTANT',       deal.consultant_name);
      ctxRow(7,  'VENUE TYPE',  deal.venue_type,      'CITY',             deal.city);
      ctxRow(8,  'STATE',       deal.state,           'STAGE',            deal.stage);
      ctxRow(9,  'LEAD ORIGIN', deal.lead_source,     'EXPECTED CLOSURE', deal.close_month);
      ctxRow(10, 'SALESPERSON', UI._labelFor(deal.sales_person_id, UI._SALES_TEAM), 'PRESALES', UI._labelFor(deal.presales_person_id, UI._PRESALES_TEAM));

      // v27.1.1 — Partner contact (Name + Phone + Email). Skip when blank.
      const contactParts = [];
      if (deal.contact_name  && String(deal.contact_name).trim())  contactParts.push(String(deal.contact_name).trim());
      if (deal.contact_phone && String(deal.contact_phone).trim()) contactParts.push(String(deal.contact_phone).trim());
      if (deal.contact_email && String(deal.contact_email).trim()) contactParts.push(String(deal.contact_email).trim());
      if (contactParts.length > 0) {
        ws.mergeCells('A11:D11');
        const cc = ws.getRow(11).getCell(1);
        cc.value = 'Partner contact:  ' + contactParts.join('  \u00b7  ');
        cc.font = { name:'Calibri', size: 10, color: { argb: INK_STRONG } };
        cc.alignment = { wrapText: true, vertical: 'middle' };
        ws.getRow(11).height = 22;
        cc.border = { bottom: { style: 'hair', color: { argb: AMBER_LIGHT } } };
      }

      // v27.1.1 — External notes only (internal notes are hidden from exports).
      if (deal.external_notes && String(deal.external_notes).trim()) {
        ws.mergeCells('A12:D12');
        const notesCell = ws.getRow(12).getCell(1);
        notesCell.value = 'Notes:  ' + String(deal.external_notes).trim();
        notesCell.font = { name:'Calibri', size: 10, italic: true, color: { argb: INK_STRONG } };
        notesCell.alignment = { wrapText: true, vertical: 'top', indent: 0 };
        notesCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: AMBER_PALE } };
        ws.getRow(12).height = Math.min(80, Math.max(24, String(deal.external_notes).length / 4));
      }

      // ---- BoM section band (amber, white text) ----
      ws.mergeCells('A14:D14');
      const bomHdr = ws.getCell('A14');
      bomHdr.value = 'BILL OF MATERIALS';
      bomHdr.font  = { name:'Calibri', size: 13, bold: true, color: { argb: WHITE }};
      bomHdr.fill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: AMBER }};
      bomHdr.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.getRow(14).height = 26;

      // ---- Column headers (amber-deep band, white text) ----
      const COL_LABELS = ['SR', 'DESCRIPTION', 'MODEL', 'QTY'];
      const COL_ALIGNS = ['center', 'left', 'left', 'right'];
      const headerRow = ws.getRow(15);
      COL_LABELS.forEach(function(label, i) {
        const cell = headerRow.getCell(i + 1);
        cell.value = label;
        cell.font  = { name:'Calibri', size: 10, bold: true, color: { argb: WHITE } };
        cell.fill  = { type: 'pattern', pattern: 'solid', fgColor: { argb: AMBER_DEEP }};
        cell.alignment = { horizontal: COL_ALIGNS[i], vertical: 'middle', indent: i===1 ? 1 : 0 };
      });
      headerRow.height = 22;

      // ---- Line rows ----
      // Build from reco (matches UI BoM card). Chassis prepended if not in cards.
      const fam = (deal.solutionType || '').toUpperCase();
      const lineRows = [];
      if (reco) {
        if (reco.chassis) {
          const chassisLabel = (reco.meta && reco.meta.chassisLabel) || reco.chassis;
          lineRows.push({ sku: reco.chassis, desc: chassisLabel, qty: 1 });
        }
        if (Array.isArray(reco.cards)) {
          reco.cards.forEach(function(c) {
            // Skip if it's the chassis already (defence-in-depth)
            if (reco.chassis && c.sku === reco.chassis) return;
            lineRows.push({
              sku: c.sku,
              desc: c.desc || c.label || c.sku,
              qty: c.qty != null ? c.qty : 1
            });
          });
        }
      }
      // Fallback: persisted lines (if reco didn't produce anything)
      if (lineRows.length === 0 && Array.isArray(deal.lines)) {
        deal.lines.forEach(function(l) {
          lineRows.push({
            sku: l.model_no || l.sku || '\u2014',
            desc: l.description || l.desc || '\u2014',
            qty: l.qty != null ? l.qty : 1
          });
        });
      }

      let curRow = 16;
      if (lineRows.length === 0) {
        ws.mergeCells(curRow, 1, curRow, 4);
        const empty = ws.getCell(curRow, 1);
        empty.value = '(No BoM lines \u2014 set solution type + I/O and rebuild)';
        empty.font = { name:'Calibri', italic: true, size: 10.5, color: { argb: INK_SOFT }};
        empty.alignment = { horizontal: 'center', vertical: 'middle' };
        ws.getRow(curRow).height = 22;
        curRow++;
      } else {
        lineRows.forEach(function(line, i) {
          const r = ws.getRow(curRow);
          const isAlt = (i % 2 === 1);
          const fill = isAlt
            ? { type:'pattern', pattern:'solid', fgColor:{ argb: AMBER_PALE } }
            : null;
          r.getCell(1).value = i + 1;
          r.getCell(1).font = { name:'Calibri', size: 10.5, color: { argb: INK_SOFT } };
          r.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
          r.getCell(2).value = line.desc;
          r.getCell(2).font = { name:'Calibri', size: 10.5, color: { argb: INK_STRONG } };
          r.getCell(2).alignment = { wrapText: true, vertical: 'middle', indent: 1 };
          r.getCell(3).value = line.sku;
          r.getCell(3).alignment = { vertical: 'middle' };
          r.getCell(3).font = { name: 'Consolas', size: 10, color: { argb: INK_STRONG } };
          r.getCell(4).value = line.qty;
          r.getCell(4).font = { name:'Calibri', size: 10.5, bold: true, color: { argb: AMBER_DEEP } };
          r.getCell(4).alignment = { horizontal: 'right', vertical: 'middle' };
          // Apply fill + light amber bottom border on each row
          [1,2,3,4].forEach(function(c) {
            if (fill) r.getCell(c).fill = fill;
            r.getCell(c).border = { bottom: { style: 'hair', color: { argb: AMBER_LIGHT } } };
          });
          r.height = 20;
          curRow++;
        });
      }

      // -- Helper for section bands (amber, white text) --
      function sectionBand(rowIdx, label, color) {
        ws.mergeCells(rowIdx, 1, rowIdx, 4);
        const h = ws.getCell(rowIdx, 1);
        h.value = label;
        h.font  = { name:'Calibri', size: 11.5, bold: true, color: { argb: WHITE } };
        h.fill  = { type:'pattern', pattern:'solid', fgColor: { argb: color || AMBER } };
        h.alignment = { horizontal: 'left', vertical: 'middle', indent: 1 };
        ws.getRow(rowIdx).height = 22;
      }

      // ---- Concerns block ----
      if (reco && Array.isArray(reco.concerns) && reco.concerns.length > 0) {
        curRow += 1;
        sectionBand(curRow, 'CONCERNS', DANGER);
        curRow++;
        reco.concerns.forEach(function(c) {
          ws.mergeCells(curRow, 1, curRow, 4);
          const cell = ws.getCell(curRow, 1);
          cell.value = '\u2022  ' + c;
          cell.alignment = { wrapText: true, vertical: 'top', indent: 1 };
          cell.font = { name:'Calibri', size: 10.5, color: { argb: INK_STRONG } };
          ws.getRow(curRow).height = Math.max(18, Math.ceil(c.length / 65) * 14);
          curRow++;
        });
      }

      // ---- Value-adds block ----
      if (reco && Array.isArray(reco.valueAdds) && reco.valueAdds.length > 0) {
        curRow += 1;
        sectionBand(curRow, 'VALUE-ADDS', SUCCESS);
        curRow++;
        reco.valueAdds.forEach(function(v) {
          ws.mergeCells(curRow, 1, curRow, 4);
          const cell = ws.getCell(curRow, 1);
          cell.value = '\u2022  ' + v;
          cell.alignment = { wrapText: true, vertical: 'top', indent: 1 };
          cell.font = { name:'Calibri', size: 10.5, color: { argb: INK_STRONG } };
          ws.getRow(curRow).height = Math.max(18, Math.ceil(v.length / 65) * 14);
          curRow++;
        });
      }

      // ---- v27.2.3 — Screen Configuration block (LED deals only) ----
      // Lists each screen's pixels, pitch, and physical dimensions so
      // the partner reading the quote has a full spec of the LED wall.
      // Skipped silently when the deal has no LED screens.
      {
        const screens = (deal && Array.isArray(deal.screens))
          ? deal.screens.filter(function(s) { return s && Number(s.w) > 0 && Number(s.h) > 0; })
          : [];
        if (screens.length > 0) {
          curRow += 2;  // spacer
          sectionBand(curRow, 'SCREEN CONFIGURATION', AMBER);
          curRow++;

          // Column header row
          const colHdr = ws.getRow(curRow);
          colHdr.getCell(1).value = 'SCREEN';
          colHdr.getCell(2).value = 'PIXELS (W \u00d7 H)';
          colHdr.getCell(3).value = 'PITCH';
          colHdr.getCell(4).value = 'PHYSICAL SIZE';
          for (let c = 1; c <= 4; c++) {
            colHdr.getCell(c).font = { name:'Calibri', bold: true, size: 9, color: { argb: WHITE } };
            colHdr.getCell(c).fill = { type:'pattern', pattern:'solid', fgColor: { argb: AMBER_DEEP } };
            colHdr.getCell(c).alignment = { vertical: 'middle', horizontal: c===1 ? 'left' : 'left', indent: c===1 ? 1 : 0 };
          }
          colHdr.height = 20;

          screens.forEach(function(s, i) {
            curRow++;
            const r = ws.getRow(curRow);
            const isAlt = (i % 2 === 1);
            const fill = isAlt
              ? { type:'pattern', pattern:'solid', fgColor:{ argb: AMBER_PALE } }
              : null;
            const dims = UI._screenDimensions(s.w, s.h, s.pitch);
            r.getCell(1).value = 'Screen ' + (i + 1);
            r.getCell(2).value = String(s.w) + ' \u00d7 ' + String(s.h);
            r.getCell(3).value = (s.pitch ? String(s.pitch) + ' mm' : '\u2014');
            r.getCell(4).value = dims.ok ? dims.pretty : '\u2014';
            for (let c = 1; c <= 4; c++) {
              r.getCell(c).font = { name:'Calibri', size: 10, color: { argb: INK_STRONG } };
              r.getCell(c).alignment = { vertical: 'middle', indent: c===1 ? 1 : 0 };
              if (fill) r.getCell(c).fill = fill;
              r.getCell(c).border = { bottom: { style: 'hair', color: { argb: AMBER_LIGHT } } };
            }
            r.height = 18;
          });
        }
      }

      // ---- v27.2.0 — C1 Cavitak T&C / Warranty block ----
      // Mandatory on every export per OP §3.8 (contract C1).
      {
        const _today = UI._formatQuoteDate(new Date());
        const _tnc   = UI._tncItems(_today);

        curRow += 2;  // spacer above T&C
        // v27.3.0 — Force T&C to start on a fresh page when the BoM
        // is long enough that splitting would orphan the rules.
        ws.getRow(curRow).addPageBreak = true;
        sectionBand(curRow, 'TERMS & CONDITIONS', AMBER);

        _tnc.forEach(function(pair, idx) {
          curRow++;
          const r = ws.getRow(curRow);
          ws.mergeCells(curRow, 2, curRow, 4);
          const isAlt = (idx % 2 === 1);
          if (isAlt) {
            r.getCell(1).fill = { type:'pattern', pattern:'solid', fgColor:{ argb: AMBER_PALE } };
            r.getCell(2).fill = { type:'pattern', pattern:'solid', fgColor:{ argb: AMBER_PALE } };
          }
          r.getCell(1).value = pair[0];
          r.getCell(1).font  = { name:'Calibri', bold: true, size: 9, color: { argb: AMBER_DEEP } };
          r.getCell(1).alignment = { vertical: 'top', indent: 1 };
          r.getCell(2).value = pair[1];
          r.getCell(2).font  = { name:'Calibri', size: 9.5, color: { argb: INK_STRONG } };
          r.getCell(2).alignment = { wrapText: true, vertical: 'top', indent: 1 };
          // Auto-grow row height for longer items
          r.height = pair[1].length > 80 ? 32 : 18;
        });
      }

      // ---- v27.2.0 — C2 Sales+Presales contact footer ----
      // Mandatory on every export per OP §3.9. Reads from UI._userRichFor
      // (live roster) so designation/phone/email come from current DB
      // values, not the hardcoded SALES_TEAM/PRESALES_TEAM arrays which
      // only carry names. Skips the presales line when no presales
      // assignment exists on the deal. Skips the escalation line when
      // the viewer is a Super user (typically Dipenkumar himself —
      // avoids the "escalate to yourself" pattern). Issued-by always
      // renders. Format: "Sales: {name} · {title} · Phone: +91 {10digits} · Email: {email}"
      {
        const _viewer  = STORE.currentUser();
        const _isSuper = _viewer && _viewer.permission_tier === 'super';

        const _composeLine = function(label, uuid, fallbackTeam) {
          if (!uuid) return null;
          const rich  = UI._userRichFor(uuid);
          const name  = (rich && String(rich.full_name || '').trim()) ||
                        UI._labelFor(uuid, fallbackTeam);
          if (!name) return null;
          const title = rich ? String(rich.professional_title || '').trim() : '';
          const phone = rich ? String(rich.phone || '').trim() : '';
          const email = rich ? String(rich.email || '').trim() : '';
          const parts = [
            name,
            title,
            phone ? 'Phone: +91 ' + phone : '',
            email ? 'Email: ' + email : ''
          ];
          return label + ': ' + UI._joinParts(parts, ' \u00b7 ');
        };

        const _writeRow = function(text, italic, accent) {
          if (!text) return;
          curRow++;
          ws.mergeCells(curRow, 1, curRow, 4);
          const cell = ws.getCell(curRow, 1);
          cell.value = text;
          cell.font  = {
            name: 'Calibri', size: 10, italic: !!italic,
            color: { argb: accent ? AMBER_DEEP : INK_STRONG }
          };
          cell.alignment = { wrapText: true, vertical: 'middle', indent: 1 };
          ws.getRow(curRow).height = 18;
        };

        curRow += 2;  // spacer above the block
        sectionBand(curRow, 'CONTACTS', AMBER);

        _writeRow(_composeLine('Sales',    deal.sales_person_id,    UI._SALES_TEAM));
        _writeRow(_composeLine('Presales', deal.presales_person_id, UI._PRESALES_TEAM));

        // Escalation line — only when viewer is not Super.
        if (!_isSuper) {
          const DIPENKUMAR_UUID = '155b257a-ec1a-4ee9-ac89-31ba47c4c610';
          const dipRich  = UI._userRichFor(DIPENKUMAR_UUID);
          const dipTitle = (dipRich && String(dipRich.professional_title || '').trim()) ||
                           'National Product Lead';
          const dipPhone = (dipRich && String(dipRich.phone || '').trim()) || '8160756906';
          const dipEmail = (dipRich && String(dipRich.email || '').trim()) || 'dipen.g@cavitak.com';
          _writeRow(
            'For pricing escalation: Dipenkumar Gajjar \u00b7 ' + dipTitle +
            ' \u00b7 Phone: +91 ' + dipPhone +
            ' \u00b7 Email: ' + dipEmail,
            true,  // italic
            true   // accent (amber)
          );
        }

        _writeRow('Issued by: Cavitak Marketing Pvt Ltd', false, true);
      }

      // ---- Footer attribution band (amber-deep, white text) ----
      curRow += 2;
      ws.mergeCells(curRow, 1, curRow, 4);
      const foot = ws.getCell(curRow, 1);
      foot.value = 'Cavitak Marketing Pvt Ltd  \u00b7  tvONE India Distributor  \u00b7  www.cavitak.com';
      foot.font = { name:'Calibri', italic: true, size: 9, color: { argb: WHITE }};
      foot.fill = { type:'pattern', pattern:'solid', fgColor: { argb: AMBER_DEEP } };
      foot.alignment = { horizontal: 'center', vertical: 'middle' };
      ws.getRow(curRow).height = 22;

      // ---- Generate blob ----
      const buffer = await wb.xlsx.writeBuffer();
      return new Blob([buffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
    }

    // alpha.8.2 — PDF generation (native jsPDF, no html2canvas)
    //
    // Layout matches Excel:
    //   Forest-green title bar with white text
    //   Centered ref + date
    //   2-column project context
    //   BoM header bar + column headers + line rows (with hair borders)
    //   Concerns (red header) + Value-adds (green header) blocks
    //   Footer on every page: Cavitak attribution + "Page N of M"
    //
    // Native (not html2canvas) for sharp text + small files. Hybrid
    // (rendered BoM card image at top) is a polish item if reps want it.
    async function pdf(deal, opts) {
      if (!deal) throw new Error('pdf: deal required');
      // v27.3.0 — see excel() above for mode semantics.
      const mode = (opts && opts.mode) || 'boq';
      const showPricing = mode === 'boq';
      const jspdf = await loadJsPDF();
      const JsPDFCtor = jspdf.jsPDF;

      // Compute fresh reco — same logic as Excel.
      let reco = null;
      try {
        if (typeof APP !== 'undefined' && APP.recoForDeal) {
          reco = APP.recoForDeal(deal);
        }
      } catch (_e) { /* leave null */ }

      // A4 portrait, points (1pt = 1/72 inch)
      const doc = new JsPDFCtor({ unit: 'pt', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();   // ~595
      const H = doc.internal.pageSize.getHeight();  // ~842
      const M = 40;
      let y = 0;

      // v27.3.0 — Polished palette helpers. RGB triplets for jsPDF.
      // Use these instead of forest-green legacy colors throughout.
      const AMBER       = [232, 115, 28];     // brand amber #E8731C
      const AMBER_DEEP  = [180, 83, 9];       // deep amber #B45309
      const AMBER_LIGHT = [252, 231, 200];    // soft amber band #FCE7C8
      const AMBER_PALE  = [255, 247, 237];    // alt-row pale #FFF7ED
      const INK_STRONG  = [17, 24, 39];
      const INK_SOFT    = [107, 114, 128];
      const WHITE       = [255, 255, 255];
      const DANGER      = [185, 28, 28];
      const SUCCESS     = [21, 128, 61];
      const fill   = function(rgb) { doc.setFillColor(rgb[0], rgb[1], rgb[2]); };
      const stroke = function(rgb) { doc.setDrawColor(rgb[0], rgb[1], rgb[2]); };
      const ink    = function(rgb) { doc.setTextColor(rgb[0], rgb[1], rgb[2]); };

      // ---- Title band (amber, 75pt tall, with subtitle) ----
      fill(AMBER);
      doc.rect(0, 0, W, 60, 'F');
      // Deeper amber strip beneath for the subtitle
      fill(AMBER_DEEP);
      doc.rect(0, 60, W, 18, 'F');

      ink(WHITE);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(22);
      doc.text('tvONE Product Selector', W / 2, 36, { align: 'center' });

      ink(WHITE);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(10);
      doc.text('Cavitak Marketing Pvt Ltd  \u00b7  tvONE India Distributor', W / 2, 72, { align: 'center' });

      y = 100;

      // ---- Ref + date in a clean amber-pale pill ----
      const ref = deal.display_ref || deal.ref || 'NOREF';
      const dateStr = new Date().toISOString().slice(0, 10);
      const refLabel = 'Quote ref: ' + ref + '   \u00b7   Generated ' + dateStr;
      // Compute width for pill
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      const refW = doc.getTextWidth(refLabel) + 24;
      fill(AMBER_LIGHT);
      doc.roundedRect((W - refW) / 2, y - 12, refW, 18, 9, 9, 'F');
      ink(AMBER_DEEP);
      doc.setFont('helvetica', 'bold');
      doc.text(refLabel, W / 2, y, { align: 'center' });
      y += 20;

      // ---- Project context (2-column) ----
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(10);
      const colA_label  = M;
      const colA_value  = M + 95;
      const colB_label  = W / 2 + 10;
      const colB_value  = W / 2 + 105;

      function ctxRow(k1, v1, k2, v2) {
        // v27.3.0 — uppercase keys in INK_SOFT (small caps look), values in INK_STRONG
        ink(INK_SOFT);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8);
        doc.text(k1.toUpperCase(), colA_label, y);
        if (k2) doc.text(k2.toUpperCase(), colB_label, y);
        ink(INK_STRONG);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        const v1s = (v1 == null || v1 === '') ? '\u2014' : String(v1);
        const v2s = (v2 == null || v2 === '') ? '\u2014' : String(v2);
        doc.text(v1s, colA_value, y, { maxWidth: (colB_label - colA_value - 5) });
        if (k2) doc.text(v2s, colB_value, y, { maxWidth: (W - M - colB_value) });
        // Thin amber divider beneath each row
        stroke(AMBER_LIGHT);
        doc.setLineWidth(0.5);
        doc.line(M, y + 4, W - M, y + 4);
        y += 16;
      }

      ctxRow('Project',     deal.project,         'End User',         deal.customer_name);
      ctxRow('Partner',     deal.partner_name,    'Consultant',       deal.consultant_name);
      ctxRow('Venue type',  deal.venue_type,      'City',             deal.city);
      ctxRow('State',       deal.state,           'Stage',            deal.stage);
      ctxRow('Lead Origin', deal.lead_source,     'Expected closure', deal.close_month);
      ctxRow('Salesperson', UI._labelFor(deal.sales_person_id, UI._SALES_TEAM), 'Presales', UI._labelFor(deal.presales_person_id, UI._PRESALES_TEAM));

      // v27.1.1 — Partner contact line. Skip when all three are blank.
      const contactParts = [];
      if (deal.contact_name  && String(deal.contact_name).trim())  contactParts.push(String(deal.contact_name).trim());
      if (deal.contact_phone && String(deal.contact_phone).trim()) contactParts.push(String(deal.contact_phone).trim());
      if (deal.contact_email && String(deal.contact_email).trim()) contactParts.push(String(deal.contact_email).trim());
      if (contactParts.length > 0) {
        y += 6;
        ink(INK_SOFT); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
        doc.text('PARTNER CONTACT', colA_label, y);
        ink(INK_STRONG); doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        doc.text(contactParts.join('  \u00b7  '), colA_label + 110, y, { maxWidth: W - 2 * M - 110 });
        y += 16;
      }

      // v27.1.1 — External notes only (internal_notes is hidden from exports).
      if (deal.external_notes && String(deal.external_notes).trim()) {
        y += 4;
        const notesText = String(deal.external_notes).trim();
        const notesLines = doc.splitTextToSize(notesText, W - 2 * M - 16);
        const notesH = notesLines.length * 12 + 14;
        // amber-pale background panel
        fill(AMBER_PALE);
        doc.rect(M, y, W - 2 * M, notesH, 'F');
        // amber left edge accent
        fill(AMBER);
        doc.rect(M, y, 3, notesH, 'F');
        ink(AMBER_DEEP); doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
        doc.text('NOTES', M + 10, y + 12);
        ink(INK_STRONG); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
        doc.text(notesLines, M + 10, y + 26);
        y += notesH + 4;
      }

      y += 10;

      // ---- Page-break helper (reserves footer space) ----
      function checkPageBreak(needed) {
        if (y + needed > H - M - 40) {
          doc.addPage();
          y = M;
        }
      }

      // ---- Section band helper (full-width amber band, white text) ----
      function sectionBand(label, color) {
        checkPageBreak(28);
        fill(color || AMBER);
        doc.rect(M, y, W - 2 * M, 22, 'F');
        ink(WHITE);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11.5);
        doc.text(label, M + 10, y + 15);
        y += 28;
      }

      // ---- BoM section band ----
      sectionBand('BILL OF MATERIALS', AMBER);

      // ---- Column headers (amber-deep band, white text) ----
      const colSr    = M + 5;
      const colDesc  = M + 40;
      const colModel = W - M - 170;
      const colQty   = W - M - 5;

      fill(AMBER_DEEP);
      doc.rect(M, y, W - 2 * M, 20, 'F');
      ink(WHITE);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9.5);
      doc.text('SR',          colSr,    y + 13);
      doc.text('DESCRIPTION', colDesc,  y + 13);
      doc.text('MODEL',       colModel, y + 13);
      doc.text('QTY',         colQty,   y + 13, { align: 'right' });
      y += 22;

      // ---- Line items ----
      const lineRows = [];
      if (reco) {
        if (reco.chassis) {
          const chassisLabel = (reco.meta && reco.meta.chassisLabel) || reco.chassis;
          lineRows.push({ sku: reco.chassis, desc: chassisLabel, qty: 1 });
        }
        if (Array.isArray(reco.cards)) {
          reco.cards.forEach(function(c) {
            if (reco.chassis && c.sku === reco.chassis) return;
            lineRows.push({
              sku: c.sku,
              desc: c.desc || c.label || c.sku,
              qty: c.qty != null ? c.qty : 1
            });
          });
        }
      }
      if (lineRows.length === 0 && Array.isArray(deal.lines)) {
        deal.lines.forEach(function(l) {
          lineRows.push({
            sku: l.model_no || l.sku || '\u2014',
            desc: l.description || l.desc || '\u2014',
            qty: l.qty != null ? l.qty : 1
          });
        });
      }

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);

      if (lineRows.length === 0) {
        checkPageBreak(20);
        doc.setFont('helvetica', 'italic');
        ink(INK_SOFT);
        doc.setFontSize(10);
        doc.text('(No BoM lines \u2014 set solution type + I/O and rebuild)',
          W / 2, y + 10, { align: 'center' });
        y += 22;
        doc.setFont('helvetica', 'normal');
        ink(INK_STRONG);
      } else {
        lineRows.forEach(function(line, i) {
          const descWidth = colModel - colDesc - 10;
          const descLines = doc.splitTextToSize(String(line.desc), descWidth);
          const rowHeight = Math.max(18, descLines.length * 12 + 6);
          checkPageBreak(rowHeight + 4);

          // Alt-row banding
          if (i % 2 === 1) {
            fill(AMBER_PALE);
            doc.rect(M, y, W - 2 * M, rowHeight, 'F');
          }

          ink(INK_SOFT);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          doc.text(String(i + 1), colSr, y + 13);

          ink(INK_STRONG);
          doc.setFontSize(10);
          doc.text(descLines, colDesc, y + 13);

          doc.setFont('courier', 'normal');
          ink(INK_STRONG);
          doc.text(String(line.sku), colModel, y + 13);

          doc.setFont('helvetica', 'bold');
          ink(AMBER_DEEP);
          doc.text(String(line.qty), colQty, y + 13, { align: 'right' });

          // Thin amber-light bottom border
          stroke(AMBER_LIGHT);
          doc.setLineWidth(0.5);
          doc.line(M, y + rowHeight, W - M, y + rowHeight);

          y += rowHeight;
        });
      }

      // Reset state after BoM
      ink(INK_STRONG);
      doc.setFont('helvetica', 'normal');

      // ---- Concerns block (red band) ----
      if (reco && Array.isArray(reco.concerns) && reco.concerns.length > 0) {
        y += 12;
        sectionBand('CONCERNS', DANGER);
        doc.setFont('helvetica', 'normal');
        ink(INK_STRONG);
        doc.setFontSize(10);
        reco.concerns.forEach(function(c) {
          const wrapped = doc.splitTextToSize('\u2022  ' + c, W - 2 * M - 20);
          const blockH = wrapped.length * 13 + 6;
          checkPageBreak(blockH);
          doc.text(wrapped, M + 10, y + 4);
          y += blockH;
        });
      }

      // ---- Value-adds block (green band) ----
      if (reco && Array.isArray(reco.valueAdds) && reco.valueAdds.length > 0) {
        y += 12;
        sectionBand('VALUE-ADDS', SUCCESS);
        doc.setFont('helvetica', 'normal');
        ink(INK_STRONG);
        doc.setFontSize(10);
        reco.valueAdds.forEach(function(v) {
          const wrapped = doc.splitTextToSize('\u2022  ' + v, W - 2 * M - 20);
          const blockH = wrapped.length * 13 + 6;
          checkPageBreak(blockH);
          doc.text(wrapped, M + 10, y + 4);
          y += blockH;
        });
      }

      // ---- v27.2.3 — Screen Configuration block (LED deals only) ----
      // Lists each screen's pixels, pitch, and physical dimensions. Same
      // source-of-truth as Excel via UI._screenDimensions. Skipped silently
      // when the deal has no LED screens.
      {
        const screens = (deal && Array.isArray(deal.screens))
          ? deal.screens.filter(function(s) { return s && Number(s.w) > 0 && Number(s.h) > 0; })
          : [];
        if (screens.length > 0) {
          y += 12;
          sectionBand('SCREEN CONFIGURATION', AMBER);

          // Column header (amber-deep band)
          fill(AMBER_DEEP);
          doc.rect(M, y, W - 2 * M, 18, 'F');
          ink(WHITE);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9);
          const col1 = M + 6;
          const col2 = M + 70;
          const col3 = M + 180;
          const col4 = M + 235;
          doc.text('SCREEN',        col1, y + 12);
          doc.text('PIXELS (W \u00d7 H)', col2, y + 12);
          doc.text('PITCH',         col3, y + 12);
          doc.text('PHYSICAL SIZE', col4, y + 12);
          y += 18;

          screens.forEach(function(s, i) {
            const rowH = 16;
            checkPageBreak(rowH + 4);
            if (i % 2 === 1) {
              fill(AMBER_PALE);
              doc.rect(M, y, W - 2 * M, rowH, 'F');
            }
            const dims = UI._screenDimensions(s.w, s.h, s.pitch);
            ink(INK_STRONG);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.text('Screen ' + (i + 1), col1, y + 11);
            doc.text(String(s.w) + ' \u00d7 ' + String(s.h), col2, y + 11);
            doc.text(s.pitch ? String(s.pitch) + ' mm' : '\u2014', col3, y + 11);
            doc.text(dims.ok ? dims.pretty : '\u2014', col4, y + 11);
            // Thin bottom border
            stroke(AMBER_LIGHT);
            doc.setLineWidth(0.5);
            doc.line(M, y + rowH, W - M, y + rowH);
            y += rowH;
          });
          y += 4;
        }
      }

      // ---- v27.2.0 — C1 Cavitak T&C / Warranty block ----
      // Mandatory on every export per OP §3.8 (contract C1).
      {
        const _today = UI._formatQuoteDate(new Date());
        const _tnc   = UI._tncItems(_today);

        // Pre-wrap to size the block.
        const _labelW = 90;
        const _textW  = W - 2 * M - _labelW - 16;
        doc.setFontSize(9);
        const _rows = _tnc.map(function(pair) {
          const wrap = doc.splitTextToSize(pair[1], _textW);
          return { label: pair[0], wrap: wrap, h: Math.max(wrap.length * 11, 14) };
        });

        y += 12;
        // Try to keep band + first item together; force new page if tight.
        if (y + 60 > H - M - 40) { doc.addPage(); y = M; }
        sectionBand('TERMS & CONDITIONS', AMBER);

        ink(INK_STRONG);
        doc.setFontSize(9);
        _rows.forEach(function(r, i) {
          const rowH = r.h + 8;
          checkPageBreak(rowH);
          // Alt-row fill
          if (i % 2 === 1) {
            fill(AMBER_PALE);
            doc.rect(M, y - 2, W - 2 * M, rowH, 'F');
          }
          ink(AMBER_DEEP);
          doc.setFont('helvetica', 'bold');
          doc.text(r.label, M + 6, y + 8);
          ink(INK_STRONG);
          doc.setFont('helvetica', 'normal');
          doc.text(r.wrap, M + _labelW + 6, y + 8);
          y += rowH;
        });
      }

      // ---- v27.2.0 — C2 Sales+Presales contact footer ----
      // Mandatory on every export per OP §3.9. Same source-of-truth and
      // composition as the Excel block. Uses checkPageBreak to ensure
      // the whole block lands on a single page when room exists; falls
      // to next page only if Value-adds already pushed close to the bottom.
      {
        const _viewer  = STORE.currentUser();
        const _isSuper = _viewer && _viewer.permission_tier === 'super';

        const _composeLine = function(label, uuid, fallbackTeam) {
          if (!uuid) return null;
          const rich  = UI._userRichFor(uuid);
          const name  = (rich && String(rich.full_name || '').trim()) ||
                        UI._labelFor(uuid, fallbackTeam);
          if (!name) return null;
          const title = rich ? String(rich.professional_title || '').trim() : '';
          const phone = rich ? String(rich.phone || '').trim() : '';
          const email = rich ? String(rich.email || '').trim() : '';
          const parts = [
            name,
            title,
            phone ? 'Phone: +91 ' + phone : '',
            email ? 'Email: ' + email : ''
          ];
          return label + ': ' + UI._joinParts(parts, ' \u00b7 ');
        };

        const lines = [];
        const salesLn = _composeLine('Sales',    deal.sales_person_id,    UI._SALES_TEAM);
        const presLn  = _composeLine('Presales', deal.presales_person_id, UI._PRESALES_TEAM);
        if (salesLn) lines.push({ text: salesLn, italic: false, accent: false });
        if (presLn)  lines.push({ text: presLn,  italic: false, accent: false });
        if (!_isSuper) {
          const DIPENKUMAR_UUID = '155b257a-ec1a-4ee9-ac89-31ba47c4c610';
          const dipRich  = UI._userRichFor(DIPENKUMAR_UUID);
          const dipTitle = (dipRich && String(dipRich.professional_title || '').trim()) ||
                           'National Product Lead';
          const dipPhone = (dipRich && String(dipRich.phone || '').trim()) || '8160756906';
          const dipEmail = (dipRich && String(dipRich.email || '').trim()) || 'dipen.g@cavitak.com';
          lines.push({
            text: 'For pricing escalation: Dipenkumar Gajjar \u00b7 ' + dipTitle +
                  ' \u00b7 Phone: +91 ' + dipPhone +
                  ' \u00b7 Email: ' + dipEmail,
            italic: true,
            accent: true
          });
        }
        lines.push({ text: 'Issued by: Cavitak Marketing Pvt Ltd', italic: false, accent: true });

        // Pre-wrap to compute block height
        doc.setFontSize(9.5);
        const wrappedLines = lines.map(function(ln) {
          const wrap = doc.splitTextToSize(ln.text, W - 2 * M - 16);
          return { wrap: wrap, italic: ln.italic, accent: ln.accent, h: wrap.length * 12 };
        });
        const blockH = 32 + wrappedLines.reduce(function(a, w) { return a + w.h + 4; }, 0);
        checkPageBreak(blockH);

        y += 12;
        sectionBand('CONTACTS', AMBER);

        wrappedLines.forEach(function(w) {
          doc.setFont('helvetica', w.italic ? 'italic' : 'normal');
          doc.setFontSize(9.5);
          ink(w.accent ? AMBER_DEEP : INK_STRONG);
          doc.text(w.wrap, M + 6, y + 4);
          y += w.h + 4;
        });
        ink(INK_STRONG);
      }

      // ---- Per-page footer: amber strip + attribution + Page N of M ----
      const pageCount = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pageCount; p++) {
        doc.setPage(p);
        // Bottom amber band (28pt)
        fill(AMBER_DEEP);
        doc.rect(0, H - 26, W, 26, 'F');
        ink(WHITE);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9);
        doc.text('Cavitak Marketing Pvt Ltd  \u00b7  tvONE India Distributor  \u00b7  www.cavitak.com',
          W / 2, H - 10, { align: 'center' });
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8.5);

    check('CORIO small: 2× HDMI 1080p + 1× HDMI 1080p out → C3-503 (Micro)',
      () => {

        });
        if (r.chassis !== 'C3-503') return 'chassis: ' + r.chassis;
        if (r.meta.ecosystem !== 'CM') return 'ecosystem: ' + r.meta.ecosystem;
        const skus = r.cards.map(c => c.sku);
        if (!skus.includes('CM-C3-503-CPU-HTTPS')) return 'missing CPU; got: ' + skus.join(',');

        return true;
      });

    check('CORIO medium: HDMI 1080p high-count → C3-510 (Mini, >3 estimated slots)',
      () => {

          inputs: { 'HDMI 1080p': 8, 'SDI 3G': 4 },
          outputs: { 'HDMI 1080p 4-out': 4 }
        });
        if (r.chassis !== 'C3-510') return 'chassis: ' + r.chassis;
        if (r.meta.ecosystem !== 'CM') return 'ecosystem: ' + r.meta.ecosystem;
        return true;
      });

    check('CORIO large: 4K signal triggers CM2-547-MK2',
      () => {
        const r = RECOMMEND.corio({
          inputs: { 'HDMI 4K 2-in': 4 },
          outputs: { 'HDMI 4K': 2 }

        if (r.chassis !== 'CM2-547-MK2') return 'chassis: ' + r.chassis;
        if (r.meta.ecosystem !== 'CM2') return 'ecosystem: ' + r.meta.ecosystem;
        const skus = r.cards.map(c => c.sku);
        if (!skus.includes('CM2-4RPS')) return 'missing 400W PSU (psuRequired); got: ' + skus.join(',');
        if (skus.includes('CM-BLANK')) return 'unexpected CM-BLANK on CM2 (Micro/Mini only); got: ' + skus.join(',');
        return true;
      });

    check('CORIO edge: C3-510 fixed DVI-U absorbs 2 ports',
      () => {
        const r = RECOMMEND.corio({
          chassisSku: 'C3-510',  // force chassis to verify fixed-input behaviour
          inputs: { 'DVI-U': 2 },
          outputs: { 'HDMI 1080p 4-out': 1 }
        });
        if (r.chassis !== 'C3-510') return 'chassis: ' + r.chassis;
        // 2 DVI-U inputs are fully absorbed by the chassis's fixed 2-port DVI-U input
        // → no DVI-U card needed
        const skus = r.cards.map(c => c.sku);
        if (skus.includes('CM-DVIU-2IN')) return 'unexpected DVI-U input card; got: ' + skus.join(',');
        if (!r.reasons.some(x => /absorbed by chassis fixed input/.test(x))) return 'expected absorption reason';
        return true;
      });

    check('CORIO error: 8-8 audio on CM2 rejected (hard impossibility)',
      () => {
        const r = RECOMMEND.corio({
          chassisSku: 'CM2-547-MK2',

    check('CORIO error: slot overflow on Micro returns error',
      () => {
        const r = RECOMMEND.corio({
          chassisSku: 'C3-503',  // 3 slots only

        });
        if (!r.error) return 'expected error, got chassis: ' + r.chassis;
        if (!/slots/.test(r.error)) return 'error msg: ' + r.error;
        return true;
      });

    check('CORIO accessory: fanFilter flag adds CM2-Filter line',
      () => {
        const r = RECOMMEND.corio({
          chassisSku: 'CM2-547-MK2',

          || 'keys: ' + keys.join(',');
      });

    const summary = '\n' + pass + ' passed, ' + fail + ' failed';
    return { pass, fail, lines: out, summary, ok: fail === 0 };

    function joinParts(parts, sep) {

    // v27.2.0 — Normalize a phone-ish string to the last 10 digits.
    // Strips +91, spaces, hyphens, parens, anything non-digit. Returns
    // the digits string; the caller validates length === 10. Used on
    // D16 Profile Gate save before writing to public.users.phone so
    // every stored phone is in canonical 10-digit form regardless of
    // how the user typed it.
    function normalizePhone(raw) {
      const digits = String(raw || '').replace(/\D+/g, '');
      return digits.length >= 10 ? digits.slice(-10) : digits;
    }

    // v27.2.0 — D16 Profile Setup Gate predicate. Returns true when
    // the user record is missing or invalid for any of the three
    // mandatory fields that feed the C2 Sales+Presales contact footer
    // in exports. Called by the router (post-login + on every nav)
    // and by the login submit handler to decide whether to route to
    // the gate screen. Conservative: any of NULL / blank / shape-wrong
    // triggers the gate, since a half-filled profile renders the
    // C2 footer half-blank for every quote that user creates.
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const PHONE_RE = /^[0-9]{10}$/;
    function profileIncomplete(u) {
      if (!u) return false;  // not-logged-in path is handled upstream
      // v27.2.0 — Session-scoped bypass set by the "Skip for now"
      // escape hatch after 3 failed RPC saves. Lets a trapped user
      // continue working; gate re-fires on next browser session.
      try {
        if (sessionStorage.getItem('v27.profileSkip') === '1') return false;
      } catch (_) {}
      const title = String(u.professional_title || '').trim();
      const phone = String(u.phone || '').trim();
      const email = String(u.email || '').trim();
      if (!title) return true;
      if (!PHONE_RE.test(phone)) return true;
      if (!EMAIL_RE.test(email)) return true;
      return false;
    }

    // v27.2.0 — Format a Date as "DD MMM YYYY" for the T&C Validity line.
    // Locale-stable: avoids the locale-sniffing surprises of
    // toLocaleDateString() on jsdom / older Android Chrome where the
    // 'en-IN' tag occasionally falls back to en-US ordering.
    function formatQuoteDate(d) {
      const dt = d instanceof Date ? d : new Date();
      const dd = String(dt.getDate()).padStart(2, '0');
      const mm = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
      return dd + ' ' + mm + ' ' + dt.getFullYear();

    // v27.2.3 — Compute physical dimensions for one LED screen from
    // pixel-w/h and pitch (mm). Returns {ok, width_mm, height_mm,
    // diagonal_mm, diagonal_inches, width_m, height_m, diagonal_m,
    // pretty} or {ok:false} if inputs are invalid. Used by Step 4
    // inline display, saved-deal I/O section, and Excel/PDF Screen
    // Configuration block.
    function screenDimensions(w, h, pitch) {
      const wPx = Number(w);
      const hPx = Number(h);
      const p   = Number(pitch);
      if (!isFinite(wPx) || !isFinite(hPx) || !isFinite(p) ||
          wPx <= 0 || hPx <= 0 || p <= 0) {
        return { ok: false };
      }
      const widthMm    = wPx * p;
      const heightMm   = hPx * p;
      const diagonalMm = Math.sqrt(widthMm * widthMm + heightMm * heightMm);
      const widthM     = widthMm    / 1000;
      const heightM    = heightMm   / 1000;
      const diagonalM  = diagonalMm / 1000;
      const diagInches = diagonalMm / 25.4;
      // Compact human-readable summary, e.g. "9.70 m × 3.00 m · diagonal 10.15 m / ~400\""
      const pretty = widthM.toFixed(2) + ' m \u00d7 ' + heightM.toFixed(2) + ' m' +
                     ' \u00b7 diagonal ' + diagonalM.toFixed(2) + ' m' +
                     ' / \u007e' + Math.round(diagInches) + '\u201d';
      return {
        ok: true,
        width_mm:        Math.round(widthMm),
        height_mm:       Math.round(heightMm),
        diagonal_mm:     Math.round(diagonalMm),
        diagonal_inches: Math.round(diagInches * 10) / 10,
        width_m:         Math.round(widthM    * 100) / 100,
        height_m:        Math.round(heightM   * 100) / 100,
        diagonal_m:      Math.round(diagonalM * 100) / 100,
        pretty:          pretty
      };
    }

    function sdField(id, label, value, opts) {

          inputmode + maxlength + listAttr + ' value="' + esc(value == null ? '' : value) + '"' +
