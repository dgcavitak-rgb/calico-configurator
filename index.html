      buildSavePayload,
      // alpha.9.1: APP exposes these to __smokeIntegration. APP's IIFE has no
      // closure access to UI internals (different scope), so route via UI's
      // public API. Underscore prefix marks "for internal smoke use only".
      _SOFT_FIELDS:        SOFT_FIELDS,
      _STRUCTURAL_FIELDS:  STRUCTURAL_FIELDS,
      _STRUCTURED_COLS:    STRUCTURED_COLS,
      // v27.1.0 B2 smoke needs reach into the UUID-lookup machinery; same
      // expose-via-UI pattern as _SOFT_FIELDS above.
      _labelFor:           labelFor,
      _SALES_TEAM:         SALES_TEAM,
      _PRESALES_TEAM:      PRESALES_TEAM,
      // v27.2.0 — expose roster + helpers for EXPORT (sibling IIFE, no
      // shared scope). C2 contact footer uses _userRichFor to look up
      // designation/phone/email per uuid; _joinParts skips blanks in
      // composed text lines. Same expose-via-UI pattern as _labelFor.
      _userRichFor:        userRichFor,
      _joinParts:          joinParts,
      _normalizePhone:     normalizePhone,
      _profileIncomplete:  profileIncomplete,
      _tncItems:           tncItems,
      _formatQuoteDate:    formatQuoteDate,
      _screenDimensions:   screenDimensions,
      // v27.1.1 — N1, N2, N7, N8, N12 smoke checks need these constants
      // and helper. Same expose-via-UI pattern.
      _VENUE_TYPES:        VENUE_TYPES,
      _LEAD_SOURCES:       LEAD_SOURCES,
      _CITIES:             CITIES,
      _autoFillStateFromCity: autoFillStateFromCity,
      // helpers
      esc, fmtINR, debounce,

      // Both live inside the UI IIFE closure; smoke harness lives outside,

  })();

  /* ============================================================
     APP  (Session 5 + 6 of v27 rebuild)

     Orchestrator. Wires:
       - hashchange → UI view
       - auth state → guarded routes
       - login form → STORE.login
       - PW change form → STORE.changePassword
       - wizard Next/Back/Build → RECOMMEND dispatch

     Notes:
       - Save-on-Build is deferred to Session 7 per SPEC §5.1 ("No save yet")
         interpretation: Step 6 Build computes RECOMMEND + renders BoM, and a
         disabled "Save quote (Session 7)" button surfaces the next move.
       - actor_user_id injection is implicit in STORE; APP doesn't pass it.
       - Pipeline stages are hardcoded in UI.STAGES (TODO: load from DB
         per Session 4 handoff §12).
     ============================================================ */
  const APP = (function() {

    /* ---------- Router ---------- */

    function start() {
      // Guarded routing: if no current user and not at #/login, force to login.
      window.addEventListener('hashchange', onRouteChange);
      // Auth state cleanup: clear wizard draft on explicit logout via STORE event.
      STORE.onAuthChange(function(user) {
        if (!user) {
          UI.clearDraft();
          // Force to login if not already there.
          if (location.hash !== '#/login') location.hash = '#/login';
        }
      });
      // Boot route
      const initialHash = (location.hash && location.hash.length > 1) ? location.hash : '';
      const u = STORE.currentUser();
      if (!u) {
        // Unauth — force login
        if (initialHash !== '#/login') {
          // Setting hash will fire onRouteChange
          location.hash = '#/login';
        } else {
          UI.showLogin();
        }
        return;
      }
      // v27.2.2 — Order swap: Profile gate fires BEFORE force-PW gate.
      // We want title/phone/email collected on the very first login while
      // the default-password session is still alive. PW change happens
      // afterwards. The Profile gate is partial-fill tolerant — any one
      // field saved is progress, and the gate re-fires next login for
      // whatever is still missing.
      if (UI._profileIncomplete(u)) {
        UI.showProfileSetup(u);
        return;
      }
      // After profile gate clears (fully filled), force-PW takes over.
      if (u.must_change) {
        UI.showForcePw(u);
        return;
      }
      if (!initialHash || initialHash === '#/' || initialHash === '#/login') {
        location.hash = '#/home';
      } else {
        onRouteChange();
      }
    }

    function onRouteChange() {
      const hash = location.hash || '#/home';
      const u = STORE.currentUser();

      // Auth guard
      if (!u && hash !== '#/login') {
        location.hash = '#/login';
        return;
      }
      // v27.2.2 — Order swap mirrors start(): Profile gate before force-PW.
      if (u && UI._profileIncomplete(u) && hash !== '#/login') {
        UI.showProfileSetup(u);
        return;
      }
      // Forced-PW guard: any logged-in user with must_change must finish PW
      // change before going anywhere else.
      if (u && u.must_change && hash !== '#/login') {
        UI.showForcePw(u);
        return;
      }

      // Route resolution
      if (hash === '#/login') { UI.showLogin(); return; }
      if (hash === '#/home')  { UI.showHome();  return; }
      if (hash === '#/dashboard') { UI.showDashboard(); return; }
      if (hash === '#/history') { UI.showHistory(); return; }
      if (hash === '#/customers') { UI.showCustomers(); return; }
      if (hash === '#/profile') { UI.showProfile(); return; }
      if (hash === '#/quote/new' ||
          hash.indexOf('#/quote/new/') === 0) {
        const parts = hash.split('/');
        // #/quote/new          → step 1
        // #/quote/new/2        → step 2
        const stepNum = parts.length >= 4 ? parseInt(parts[3], 10) || 1 : 1;
        UI.showWizard(stepNum);
        return;
      }
      // v27.1.2 #6 — edit-mode wizard entry. Hash carries the refId so
      // wizSave can detect update-vs-insert. wizardData itself is
      // hydrated by the sd-edit handler BEFORE the hash change, so we
      // just route to the wizard renderer here.
      if (hash.indexOf('#/quote/edit/') === 0) {
        const parts = hash.split('/');
        // #/quote/edit/{refId}     → step 1
        // #/quote/edit/{refId}/3   → step 3 (deep link case)
        const stepNum = parts.length >= 5 ? parseInt(parts[4], 10) || 1 : 1;
        UI.showWizard(stepNum);
        return;
      }
      if (hash.indexOf('#/quote/') === 0) {
        // #/quote/TV-XXXXXXXX → saved-deal view (alpha.7.0 skeleton, full layout alpha.7.1+)
        const refId = hash.substring('#/quote/'.length);
        UI.showSavedDeal(refId);
        return;
      }
      // Fallback
      location.hash = '#/home';
    }

    /* ---------- Login flow ---------- */

    async function handleLoginSubmit() {
      const userF = document.getElementById('f-username');
      const passF = document.getElementById('f-password');
      const userI = document.getElementById('i-username');
      const passI = document.getElementById('i-password');
      const btn   = document.getElementById('btn-login');
      if (!userI || !passI) return;

      UI.setFieldError('f-username', null);
      UI.setFieldError('f-password', null);

      const username = (userI.value || '').trim();
      const password = passI.value || '';
      if (!username) { UI.setFieldError('f-username', 'Required.'); userI.focus(); return; }
      if (!password) { UI.setFieldError('f-password', 'Required.'); passI.focus(); return; }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Signing in\u2026';
      try {
        const user = await STORE.login({ username, password });
        // v27.2.2 — Order swap: Profile gate fires before force-PW so the
        // user fills title/phone/email on first login before setting their
        // own password. Both routers (start + onRouteChange) mirror this.
        if (UI._profileIncomplete(user)) {
          UI.showProfileSetup(user);
          UI.toast('A few profile details first.', 'default');
        } else if (user.must_change) {
          UI.showForcePw(user);
          UI.toast('Please set a new password.', 'default');
        } else {
          UI.toast('Welcome, ' + (user.full_name || user.username) + '!', 'ok');
          location.hash = '#/home';
        }
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Sign-in failed.';
        UI.setFieldError('f-password', msg);
        UI.toast(msg, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function handleForcePwSubmit() {
      const oldF = document.getElementById('f-oldpw');
      const newF = document.getElementById('f-newpw');
      const new2F = document.getElementById('f-newpw2');
      const oldI = document.getElementById('i-oldpw');
      const newI = document.getElementById('i-newpw');
      const new2I = document.getElementById('i-newpw2');
      const btn = document.getElementById('btn-pwchange');

      UI.setFieldError('f-oldpw',  null);
      UI.setFieldError('f-newpw',  null);
      UI.setFieldError('f-newpw2', null);

      const oldPw = oldI.value || '';
      const newPw = newI.value || '';
      const conf  = new2I.value || '';

      if (!oldPw) { UI.setFieldError('f-oldpw', 'Required.'); return; }
      if (!newPw || newPw.trim().length < 6) {
        UI.setFieldError('f-newpw', 'At least 6 characters required.'); return;
      }
      if (newPw !== conf) { UI.setFieldError('f-newpw2', 'Does not match.'); return; }
      if (newPw.trim() !== newPw) {
        UI.setFieldError('f-newpw', 'No leading/trailing spaces.'); return;
      }
      if (newPw === oldPw) {
        UI.setFieldError('f-newpw', 'Must differ from current password.'); return;
      }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Updating\u2026';
      try {
        await STORE.changePassword({ oldPassword: oldPw, newPassword: newPw });
        // v27.2.2 — Force-PW success path: close the session and return
        // the user to the login screen. They sign back in with their
        // new password. Establishes the password as a real credential
        // (typed on the login form, not just inside the change-PW form)
        // and creates a clean session boundary after the default-PW
        // handoff. Voluntary PW changes (handleProfilePwSubmit) keep
        // the user logged in — only the first-login forced change ends
        // the session.
        STORE.logout();
        UI.showLogin();
        UI.toast('Password updated. Please sign in with your new password.', 'ok');
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Password change failed.';
        UI.setFieldError('f-oldpw', msg);
        UI.toast(msg, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    // v27.2.0 — D16 Profile Setup Gate submit handler. Validates the 3
    // fields locally, normalizes the phone to canonical 10 digits, calls
    // profile_update, then patches STORE._user via _patchCurrentUser so
    // the gate clears without a reload. Refreshes the roster cache in
    // the background. After 3 consecutive RPC failures, an escape hatch
    // appears so the user can continue working with a stale profile;
    // the gate will re-fire on next browser session.
    let _profileSetupAttempts = 0;
    async function handleProfileSetupSubmit() {
      const titleI = document.getElementById('i-prof-title');
      const phoneI = document.getElementById('i-prof-phone');
      const emailI = document.getElementById('i-prof-email');
      const btn    = document.getElementById('btn-prof-save');
      if (!titleI || !phoneI || !emailI || !btn) return;

      UI.setFieldError('f-prof-title', null);
      UI.setFieldError('f-prof-phone', null);
      UI.setFieldError('f-prof-email', null);

      const titleRaw = String(titleI.value || '').trim();
      const phoneRaw = String(phoneI.value || '').trim();
      const emailRaw = String(emailI.value || '').trim();
      // v27.2.1 — UI._normalizePhone via namespace.
      const phone10  = UI._normalizePhone(phoneRaw);
      // v27.2.1 — Inlined regex literals.
      const _PHONE_RE = /^[0-9]{10}$/;
      const _EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // v27.2.2 — Partial-fill tolerant validation.
      //   - Empty field: skipped entirely (not saved, not errored). DB
      //     keeps whatever it already had (RPC uses COALESCE).
      //   - Filled field: must validate. If invalid → block submit with
      //     inline error; user must either fix it or clear it.
      //   - At least ONE valid field is required to submit; otherwise
      //     "Save and continue" has nothing to do and we leave the gate
      //     up rather than no-op-saving.
      const payload = {};
      let firstError = null;

      if (titleRaw.length > 0) {
        if (titleRaw.length > 80) {
          UI.setFieldError('f-prof-title', 'Keep under 80 characters.');
          firstError = firstError || 'i-prof-title';
        } else {
          payload.professional_title = titleRaw;
        }
      }
      if (phoneRaw.length > 0) {
        if (!_PHONE_RE.test(phone10)) {
          UI.setFieldError('f-prof-phone',
            phone10.length < 10
              ? 'Enter 10 digits (+91 / spaces / hyphens are accepted).'
              : 'Phone must be 10 digits.');
          firstError = firstError || 'i-prof-phone';
        } else {
          payload.phone = phone10;
        }
      }
      if (emailRaw.length > 0) {
        if (!_EMAIL_RE.test(emailRaw)) {
          UI.setFieldError('f-prof-email', 'Enter a valid email address.');
          firstError = firstError || 'i-prof-email';
        } else {
          payload.email = emailRaw;
        }
      }
      if (firstError) {
        const input = document.getElementById(firstError);
        if (input) input.focus();
        return;
      }
      // All-blank → nothing to save. Nudge the user; keep the gate up.
      if (Object.keys(payload).length === 0) {
        UI.toast('Fill at least one field to save progress.', 'default');
        titleI.focus();
        return;
      }

      const u = STORE.currentUser();
      if (!u || !u.id) {
        UI.toast('Session error — please sign in again.', 'err');
        return;
      }

      btn.disabled = true;
      const orig = btn.textContent;
      btn.textContent = 'Loading\u2026';
      try {
        const r = await STORE._rpc('profile_update', {
          p_actor:   u.id,
          p_payload: payload   // only filled-and-valid keys; RPC COALESCEs the rest
        });
        if (!r || r.ok !== true) {
          throw new Error((r && r.error) || 'Profile save failed.');
        }
        // OP §2.6 — single canonical write path for state.user mutations.
        // Only patch fields we actually sent (partial-fill: DB and local
        // state must stay aligned — never patch what we didn't save).
        STORE._patchCurrentUser(payload);
        // Refresh roster cache so any export rendered this session reads
        // the new values.
        STORE.fetchRoster();   // not awaited — UX speed
        _profileSetupAttempts = 0;
        try { sessionStorage.removeItem('v27.profileSkip'); } catch (_) {}

        // v27.2.2 — Re-check profile completeness against the freshly
        // patched user. If anything's still missing (partial save),
        // stay on the gate so the user can finish. If complete, hand
        // off: must_change still true → force-PW gate next; otherwise
        // → home.
        const patched = STORE.currentUser();
        if (UI._profileIncomplete(patched)) {
          UI.toast('Saved. A few more details when you have a moment.', 'ok');
          // Re-render the gate with the freshly-patched user so any
          // newly-filled fields display correctly + missing ones remain.
          UI.showProfileSetup(patched);
          return;
        }
        if (patched && patched.must_change) {
          UI.toast('Profile saved. Now set a new password.', 'ok');
          UI.showForcePw(patched);
          return;
        }
        UI.toast('Profile saved. Welcome aboard!', 'ok');
        location.hash = '#/home';
      } catch (e) {
        _profileSetupAttempts += 1;
        const msg = (e && e.message) ? e.message : 'Profile save failed.';
        UI.setFieldError('f-prof-email', msg);
        UI.toast(msg, 'err');
        // After 3 failures, expose the skip escape hatch.
        if (_profileSetupAttempts >= 3) {
          const wrap = document.getElementById('prof-skip-wrap');
          if (wrap && !wrap.querySelector('button')) {
            wrap.innerHTML =
              '<div class="sp-12"></div>' +
              '<div class="tiny muted t-center" style="margin-bottom:6px;">' +
                'Backend seems unavailable. You can continue without saving — ' +
                'we\u2019ll ask again on next login.</div>' +
              '<button class="btn btn-text btn-block" type="button" ' +
                'id="btn-prof-skip">Skip for now</button>';
            const skipBtn = document.getElementById('btn-prof-skip');
            if (skipBtn) {
              skipBtn.addEventListener('click', function() {
                console.warn('[v27.2 D16] Profile save skipped after ' +
                  _profileSetupAttempts + ' failed attempts for ' +
                  (u && u.username));
                try { sessionStorage.setItem('v27.profileSkip', '1'); } catch (_) {}
                UI.toast('Continuing without saving. Will ask again next login.', 'default');
                location.hash = '#/home';
              });
            }
          }
        }
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    }

    async function handleProfilePwSubmit() {
      const oldI = document.getElementById('pi-oldpw');
      const newI = document.getElementById('pi-newpw');
      const new2I = document.getElementById('pi-newpw2');

      UI.setFieldError('pf-oldpw',  null);
      UI.setFieldError('pf-newpw',  null);
      UI.setFieldError('pf-newpw2', null);

      const oldPw = oldI.value || '';
      const newPw = newI.value || '';
      const conf  = new2I.value || '';

      if (!oldPw) { UI.setFieldError('pf-oldpw', 'Required.'); return; }
      if (!newPw || newPw.trim().length < 6) {
        UI.setFieldError('pf-newpw', 'At least 6 characters required.'); return;
      }
      if (newPw !== conf) { UI.setFieldError('pf-newpw2', 'Does not match.'); return; }
      if (newPw.trim() !== newPw) {
        UI.setFieldError('pf-newpw', 'No leading/trailing spaces.'); return;
      }
      try {
        await STORE.changePassword({ oldPassword: oldPw, newPassword: newPw });
        UI.toast('Password updated.', 'ok');
        // Clear form
        oldI.value = ''; newI.value = ''; new2I.value = '';
      } catch (e) {
        const msg = (e && e.message) ? e.message : 'Password change failed.';
        UI.setFieldError('pf-oldpw', msg);
        UI.toast(msg, 'err');
      }
    }

    /* ---------- Wizard navigation ---------- */

    function wizNext() {
      UI.captureCurrentStepForm();
      const d = UI.getWizardData();
      const v = UI.validateStep(d);
      if (!v.ok) {
        d.errors = v.errors;
        UI.renderWizard();
        // Toast first error for visibility
        const firstKey = Object.keys(v.errors)[0];
        UI.toast(v.errors[firstKey], 'err');
        return;
      }
      d.errors = {};
      // Advance with auto-skip for conditional steps.
      // v27.3.0 — CALICO renders LED W/H/pitch inline in Step 3, so skip Step 4
      // for CALICO even when hasLed=true. Non-CALICO families with LED still
      // route through Step 4.
      let next = d.step + 1;
      const skipStep4 = !d.hasLed || d.solutionType === 'calico';
      if (next === 4 && skipStep4) next = d.hasSx ? 5 : 6;
      if (next === 5 && !d.hasSx)  next = 6;
      d.step = clamp(next, 1, 6);
      UI.saveDraft();
      UI.renderWizard();
    }

    function wizBack() {
      UI.captureCurrentStepForm();
      const d = UI.getWizardData();
      d.errors = {};
      let prev = d.step - 1;
      const skipStep4 = !d.hasLed || d.solutionType === 'calico';
      if (prev === 5 && !d.hasSx)    prev = skipStep4 ? 3 : 4;
      if (prev === 4 && skipStep4)   prev = 3;
      d.step = clamp(prev, 1, 6);
      UI.saveDraft();
      UI.renderWizard();
    }

    function wizBuild() {
      const d = UI.getWizardData();

      // v27.3.0 — Auto-save on Build. Flow:
      //   1. Validate required Step-1 fields (defense-in-depth; gate already ran).
      //   2. Compute reco.
      //   3. If reco errored / no chassis: render the wizard so user sees the BoM
      //      error inline + a toast — do NOT save.
      //   4. If reco OK: build save payload, write to Supabase, navigate to
      //      saved-deal view (which has the glass action bar w/ Excel/PDF/
      //      WhatsApp/Email — that's our new "footer").
      //
      // Removes the old two-step flow ("Build quote" then "Save quote") that
      // Dipenkumar wanted gone — one click does it all now.

      if (!d.project || !d.customer_name || !d.stage) {
        UI.toast('Missing project, end user, or stage \u2014 go back to step 1.', 'err');
        return;
      }

      try {
        d.reco = computeReco(d);
      } catch (e) {
        UI.toast('Build failed: ' + (e && e.message || String(e)), 'err');
        UI.saveDraft();
        UI.renderWizard();
        return;
      }

      // Error path — show BoM error inline, don't save
      if (d.reco && d.reco.error) {
        UI.saveDraft();
        UI.renderWizard();
        UI.toast(d.reco.error, 'err');
        return;
      }
      if (d.reco && !d.reco.chassis) {
        UI.saveDraft();
        UI.renderWizard();
        UI.toast('No chassis recommended for current inputs. Revise and rebuild.', 'warn');
        return;
      }

      // Success path — auto-save + navigate
      const payload = UI.buildSavePayload(d);
      if (!payload) {
        UI.toast('Could not build save payload.', 'err');
        UI.saveDraft();
        UI.renderWizard();
        return;
      }
      const isEdit = !!payload.id;
      UI.toast(isEdit ? 'Updating\u2026' : 'Saving\u2026', 'info');
      STORE.saveDeal(payload).then(function (r) {
        const ref = r && r.display_ref;
        if (!ref) {
          UI.toast('Save returned no display_ref \u2014 something is off.', 'err');
          // Render wizard so user can retry with the Build button
          UI.renderWizard();
          return;
        }
        UI.clearDraft();
        UI.toast(isEdit ? ('Updated ' + ref) : ('Quote ready: ' + ref), 'ok');
        // Navigate to saved-deal view. Glass action bar (Edit / Confirm / Excel
        // / PDF / WhatsApp / Email / Delete) renders automatically there.
        location.hash = '#/quote/' + ref;
      }).catch(function (err) {
        const msg = (err && err.message) ? err.message : String(err);
        UI.toast((isEdit ? 'Update' : 'Save') + ' failed: ' + msg, 'err');
        UI.renderWizard();
      });
    }

    // v27.3.0 — wizSave retained as a thin alias for wizBuild for any legacy
    // callers (e.g. saved drafts that still emit data-action="wiz-save"). The
    // inline Save card was removed from Step 6 — Build does the save now.
    function wizSave() { return wizBuild(); }

    // v27.2.3 — Append SX SKUs to a recommendation's `cards` array based
    // on wizardData's sx_data quantities. Called by computeReco after the
    // family-specific RECOMMEND.* call so SX lines appear in Step 6,
    // saved-deal view, Excel export, and PDF export all from one site.
    //
    // Mapping (the v26 sx_data field-name footgun, documented in
    // 04-FIELDS-BY-BRANCH.md §5 — locked until the v27.2c SX inline-wizard
    // rebuild gives the user per-variant choice):
    //   sx_data.hdmi  → CATALOG.sx.hdbt   → HDBaseT extender (HD-One DX kit default)
    //   sx_data.sdi   → CATALOG.sx.da     → HDMI splitter / distribution amplifier
    //   sx_data.ap536 → CATALOG.sx.ap     → AP-536 audio extractor
    //   sx_data.avip  → CATALOG.sx.aocCodes → AOC cable (default placeholder)
    function appendSxCards(reco, d) {
      if (!reco || !d || !d.hasSx) return reco;
      const cards = reco.cards || [];
      const concerns = reco.concerns ? reco.concerns.slice() : [];

      // 1. HDBaseT — per-line emission from sx_hdbt_lines. Each line's SKU
      //    derives from (signal, direction). Family: 'Video' / 'Video+Audio'
      //    share HD-One DX; 'Video+Audio+IR+RS232' uses HD-One LX.
      const hdbtLines = Array.isArray(d.sx_hdbt_lines) ? d.sx_hdbt_lines : [];
      hdbtLines.forEach(function (line) {
        const qty = Number(line.qty) || 0;
        if (qty <= 0) return;
        const fam = CATALOG.sx.hdbt[line.signal] || CATALOG.sx.hdbt['Video'];
        const dir = (line.direction === 'tx') ? 'tx'
                  : (line.direction === 'rx') ? 'rx'
                  : 'kit';
        const sku = fam[dir];
        const dirLabel = (dir === 'kit') ? 'Kit (TX+RX)' : (dir === 'tx') ? 'TX only' : 'RX only';
        cards.push({
          sku:  sku,
          desc: 'HDBaseT ' + dirLabel + ' \u00b7 ' + fam.familyLabel + ' \u00b7 ' +
                line.signal + ' \u00b7 ' + (line.resolution || '1080p'),
          qty:  qty
        });
      });

      // 2. HDMI Splitter (DA) — direct counts per model.
      const da = d.sx_da_counts || {};
      [['612','1×2 splitter'], ['614','1×4 splitter'], ['618','1×8 splitter']].forEach(function (pair) {
        const k = pair[0], lbl = pair[1];
        const qty = Number(da[k]) || 0;
        if (qty <= 0) return;
        const c = CATALOG.sx.da[k];
        cards.push({
          sku:  c.sku,
          desc: lbl + ' \u00b7 ' + c.desc,
          qty:  qty
        });
      });

      // 3. AP-536 audio extractor.
      const apQty = Number(d.sx_ap_qty) || 0;
      if (apQty > 0) {
        const ap = CATALOG.sx.ap['AP-536'];
        cards.push({
          sku:  ap.sku,
          desc: ap.desc,
          qty:  apQty
        });
        concerns.push('AP-536 billing SKU pending tvONE rep confirmation (placeholder line).');
      }

      // 4. AOC cables — per-line with assembled SKU code + length.
      const aocLines = Array.isArray(d.sx_aoc_lines) ? d.sx_aoc_lines : [];
      aocLines.forEach(function (line) {
        const qty = Number(line.qty) || 0;
        if (qty <= 0) return;
        const codes = (CATALOG.sx.aocCodes && CATALOG.sx.aocCodes[line.signal]) || {};
        const code = codes[line.jacket] || '661';
        const lenM = Number(line.length) || 10;
        const sku = 'T1-' + code + '-' + lenM + 'M';
        cards.push({
          sku:  sku,
          desc: 'AOC ' + line.signal + ' \u00b7 ' + (line.jacket || 'Standard') +
                ' jacket \u00b7 ' + lenM + ' m',
          qty:  qty
        });
      });
      if (aocLines.some(l => Number(l.qty) > 0)) {
        concerns.push('AOC cable SKU pattern (T1-<code>-<length>M) pending tvONE rep confirmation.');
      }

      // ------- Backward-compat fallback: if no detail arrays but sums exist
      // (old saved deal), emit using legacy defaults. New deals always go
      // through the per-variant path above. -------
      const noNewDetail =
        hdbtLines.length === 0 &&
        ((da['612']|0)+(da['614']|0)+(da['618']|0) === 0) &&
        apQty === 0 &&
        aocLines.length === 0;
      const sx = d.sx_data || {};
      if (noNewDetail && (Number(sx.hdmi)>0 || Number(sx.sdi)>0 || Number(sx.ap536)>0 || Number(sx.avip)>0)) {
        const hdQ = Number(sx.hdmi) || 0;
        if (hdQ > 0) {
          const hd = CATALOG.sx.hdbt['Video'];
          cards.push({ sku: hd.kit, desc: 'HDBaseT Extender Kit (' + hd.familyLabel + ', TX+RX, Video) \u2014 legacy', qty: hdQ });
        }
        const daQ = Number(sx.sdi) || 0;
        if (daQ > 0) {
          const da614 = CATALOG.sx.da['614'];
          cards.push({ sku: da614.sku, desc: da614.desc + ' \u2014 legacy default 1×4', qty: daQ });
        }
        if (Number(sx.ap536) > 0) {
          const ap = CATALOG.sx.ap['AP-536'];
          cards.push({ sku: ap.sku, desc: ap.desc + ' \u2014 legacy', qty: Number(sx.ap536) });
        }
        if (Number(sx.avip) > 0) {
          cards.push({ sku: 'AOC-CABLE-TBD', desc: 'AOC cable \u2014 legacy placeholder', qty: Number(sx.avip) });
        }
      }

      reco.cards = cards;
      reco.concerns = concerns;
      return reco;
    }

    function computeReco(d) {
      let reco;
      if (d.solutionType === 'calico') {
        reco = RECOMMEND.calico({
          inputs:  d.calico_inputs,
          outputs: Object.assign({}, d.calico_outputs, { led: !!d.hasLed }),
          screens: d.hasLed ? d.screens
            .filter(s => Number(s.w) > 0 && Number(s.h) > 0)
            .map(s => ({ pixels: Number(s.w) * Number(s.h), ports: 0 }))
            : [],
          audio:   !!d.calico_audio
        });
      } else if (d.solutionType === 'mv') {
        const validInputs = d.mv_inputs
          .filter(r => r && r.signal && Number(r.qty) > 0)
          .map(r => ({ signal: r.signal, qty: Number(r.qty) }));
        reco = RECOMMEND.mv({
          inputs: validInputs,
          outputSignal: d.mv_outputSignal
        });
      } else if (d.solutionType === 'corio') {
        // Strip zero-qty entries to keep the input clean for RECOMMEND.
        const inputs = {};
        Object.entries(d.corio_inputs).forEach(([k,v]) => { if (Number(v) > 0) inputs[k] = Number(v); });
        const outputs = {};
        Object.entries(d.corio_outputs).forEach(([k,v]) => { if (Number(v) > 0) outputs[k] = Number(v); });
        const args = { inputs, outputs };
        if (d.corio_audio)     args.audio = d.corio_audio;
        if (d.corio_fanFilter) args.fanFilter = true;
        reco = RECOMMEND.corio(args);
      } else {
        reco = { chassis: null, cards: [], concerns: [], valueAdds: [], meta: { type: 'empty' } };
      }
      // v27.2.3 — Append SX cards from sx_data. Works for all three families
      // (and the empty case, where SX still gets listed even when no chassis
      // is recommended — useful when user is only doing signal extension).
      return appendSxCards(reco, d);
    }

    function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

    /* ---------- Public API ---------- */

    return {
      start, onRouteChange,
      handleLoginSubmit, handleForcePwSubmit, handleProfilePwSubmit, handleProfileSetupSubmit,
      wizNext, wizBack, wizBuild, wizSave,
      // alpha.7.1: UI.showSavedDeal needs to compute BoM from loaded deal data.
      // computeReco accepts wizardData-shaped object and STORE.loadDeal returns
      // the same shape (plus display_ref / lines[] / etc.), so passing the deal
      // straight in is safe.
      recoForDeal: computeReco,
      // alpha.9.0 \u2014 internals exposed for __smokeIntegration only.
      // alpha.9.1 \u2014 the bare identifiers `buildSavePayload`, `SOFT_FIELDS`,
      // `STRUCTURAL_FIELDS`, `STRUCTURED_COLS` are NOT in APP's closure (all
      // defined inside the UI IIFE, lines 3154/3163/3250/3260). The alpha.9.0
      // expose throws ReferenceError at IIFE-tail. Route through UI.<name>:
      // UI's IIFE completes at line ~5757 before APP starts at ~5777, so
      // UI.<name> resolves cleanly here. Mirrors the working pattern at the
      // earlier `UI.buildSavePayload(d)` call site.
      _buildSavePayload:   UI.buildSavePayload,
      _SOFT_FIELDS:        UI._SOFT_FIELDS,
      _STRUCTURAL_FIELDS:  UI._STRUCTURAL_FIELDS,
      _STRUCTURED_COLS:    UI._STRUCTURED_COLS,
      _labelFor:           UI._labelFor,
      _SALES_TEAM:         UI._SALES_TEAM,
      _PRESALES_TEAM:      UI._PRESALES_TEAM,
      // v27.1.1 — N1/N2/N7/N8/N12 smoke reach: route through UI same as above
      _VENUE_TYPES:        UI._VENUE_TYPES,
      _LEAD_SOURCES:       UI._LEAD_SOURCES,
      _CITIES:             UI._CITIES,
      _autoFillStateFromCity: UI._autoFillStateFromCity
    };
  })();

  /* ============================================================

    d3mv.mv_inputs = [{ signal: 'FHD HDMI', qty: 4 }];

    /* ---- Validation step 4 (LED screens) ---- */
    const d4 = UI.defaultWizard(); d4.step = 4; d4.hasLed = true;
    v = UI.validateStep(d4);
    check('Step 4 validation: hasLed=true with no screens fails',

    // v27.1.3 S4 — pitch is required after v27.1.2 #5. Stale test data was

  window.__smokeExport = function() {

      () => (typeof EXPORT.pdf === 'function') || 'got: ' + typeof EXPORT.pdf);

      () => (typeof EXPORT.filename === 'function') || 'got: ' + typeof EXPORT.filename);

      () => {

          || 'got: ' + fn;

    check('EXPORT.filename handles deal with no ref (fallback "NOREF")',
      () => {

          || 'got: ' + fn;

    check('EXPORT._cdn URLs all start with https://',

    return {

     blocked. Don't run it on every smoke pass (CDN load is ~1.2MB
     across the three libraries).
     ============================================================ */
  window.__smokeExportAsync = async function() {
    const out = [];
    let pass = 0, fail = 0;
    async function check(label, fn) {
      try {
        const r = await fn();
        if (r === true) { out.push('\u2713 ' + label); pass++; }
        else            { out.push('\u2717 ' + label + '  \u2192 ' + r); fail++; }
      } catch (e) {
        out.push('\u2717 ' + label + '  \u2192 THREW: ' + (e && e.message || String(e)));
        fail++;
      }
    }

    await check('EXPORT.loadExcelJS reaches CDN and resolves',
      async () => {
        const lib = await EXPORT.loadExcelJS();
        return (lib && typeof lib.Workbook === 'function')
          || 'got: ' + (lib ? Object.keys(lib).slice(0, 5).join(',') : lib);
      });

    await check('EXPORT.loadJsPDF reaches CDN and resolves',
      async () => {
        const lib = await EXPORT.loadJsPDF();
        return (lib && typeof lib.jsPDF === 'function')
          || 'got: ' + (lib ? Object.keys(lib).slice(0, 5).join(',') : lib);
      });

          || 'got: ' + typeof fn;
      });

    // alpha.8.1 — end-to-end Excel generation
    await check('EXPORT.excel(mockDeal) produces a non-trivial Blob',
      async () => {

          customer_name: 'Smoke Customer',
          stage: 'Qualified',
          solutionType: 'calico',

          calico_outputs: { display: 2, projector: 0, sdi: 0, projectorRes: 'FHD' },
          calico_audio: false,
          hasLed: false, hasSx: false
        };
        const blob = await EXPORT.excel(mock);
        if (!(blob instanceof Blob)) return 'not a Blob';
        if (blob.size < 1000)        return 'too small: ' + blob.size + ' bytes';
        if (blob.type.indexOf('spreadsheetml') < 0) return 'mime: ' + blob.type;
        return true;

    // alpha.8.2 — end-to-end PDF generation

        const mock = {
          display_ref: 'TV-99999997',
          project: 'Smoke pdf test',

          calico_audio: false,

        };
        const blob = await EXPORT.pdf(mock);
        if (!(blob instanceof Blob)) return 'not a Blob';
        if (blob.size < 500)         return 'too small: ' + blob.size + ' bytes';
        if (blob.type.indexOf('pdf') < 0) return 'mime: ' + blob.type;
        return true;
      });

    return {
      pass, fail, lines: out,
      summary: '\n' + pass + ' passed, ' + fail + ' failed (Export-async)',
      ok: fail === 0
    };
  };

  /* ============================================================
     v27.1.3 S6 — __smokeRunAll() aggregator

     Convenience runner referenced by the v27.1.2 deploy handoff doc but
     never actually built. Sequences every sync + async smoke harness in
     order, sums pass/fail counts, console.table()s a per-suite breakdown,
     and returns a structured result.

     __smokeStore() is intentionally excluded — it signs the user out at
     the end, which would interrupt any subsequent UI tests. Call it
     separately when you specifically want to validate STORE.
     ============================================================ */
  window.__smokeRunAll = async function() {
    const results = [];
    results.push(Object.assign({ name: 'core'        }, window.__smoke()));
    results.push(Object.assign({ name: 'ui'          }, window.__smokeUI()));
    results.push(Object.assign({ name: 'integration' }, window.__smokeIntegration()));
    results.push(Object.assign({ name: 'export'      }, window.__smokeExport()));
    results.push(Object.assign({ name: 'exportAsync' }, await window.__smokeExportAsync()));
    const totalPass = results.reduce(function(s, r) { return s + r.pass; }, 0);
    const totalFail = results.reduce(function(s, r) { return s + r.fail; }, 0);
    try {
      console.table(results.map(function(r) {
        return { suite: r.name, pass: r.pass, fail: r.fail };
      }));
    } catch (e) { /* console.table unsupported in some envs */ }
    console.log('SMOKE TOTAL: ' + totalPass + ' passed, ' + totalFail + ' failed');
    return { results: results, totalPass: totalPass, totalFail: totalFail, ok: totalFail === 0 };
  };
