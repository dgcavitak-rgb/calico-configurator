         - flushAutosave (soft-field autosave)
         - rebuildSavedDeal (via scheduleAutosave) — picks up new reco
         - beforeunload (best-effort flush)
       ============================================================ */

    // Fields the RPC recognizes as structured columns (per smoke test pattern).
    // Anything not in this list goes into raw_submission.
    // v27.1.1: notes -> internal_notes (renamed); +contact_name/phone/email,
    //          +external_notes (new). Length now 17. Invariant: SOFT_FIELDS
    //          must remain a subset (enforced by smoke).
    const STRUCTURED_COLS = [
      'project', 'customer_name', 'stage',
      'partner_name', 'consultant_name',
      'venue_type', 'city', 'state',
      'lead_source', 'sales_person_id', 'presales_person_id',
      'close_month',
      'contact_name', 'contact_phone', 'contact_email',
      'internal_notes', 'external_notes'
    ];

    function buildSavePayload(deal) {
      if (!deal) return null;
      const payload = {};
      const raw = {};

      // Preserve id (edit-path detector) and display_ref (server uses for idempotency)
      if (deal.id)          payload.id          = deal.id;
      if (deal.display_ref) payload.display_ref = deal.display_ref;

      // Split top-level keys
      Object.keys(deal).forEach(function(k) {
        // Skip server-managed + cached fields entirely
        if (k === 'id' || k === 'display_ref' || k === 'ref' ||
            k === 'reco' || k === 'raw_submission' || k === 'lines' ||
            k === 'created_at' || k === 'updated_at' || k === 'deleted_at' ||
            k === 'created_by' || k === 'deal_value_inr' || k === 'is_new') {
          return;
        }
        const v = deal[k];
        if (v === undefined || v === null) return;
        if (STRUCTURED_COLS.indexOf(k) >= 0) {
          payload[k] = v;
        } else {
          raw[k] = v;
        }
      });

      payload.raw_submission = raw;

      // v27.1.0 B3 — close_month column is DATE in Postgres, but HTML
      // <input type="month"> emits 'YYYY-MM'. NULLIF(...)::DATE rejects
      // 'YYYY-MM' (error 22007). Append '-01' so the RPC's cast succeeds.
      // The matching slice on the hydrate side (loadDeal) brings it back
      // to 'YYYY-MM' for the input to display correctly.
      if (payload.close_month && /^\d{4}-\d{2}$/.test(payload.close_month)) {
        payload.close_month = payload.close_month + '-01';
      }

      // Lines — prefer fresh reco.cards (post-Rebuild or wizard Build);
      // fall back to existing deal.lines so editing a soft field on an
      // already-saved deal doesn't wipe the BoM (Session 4 gotcha #3).
      const fam = (deal.solutionType || '').toUpperCase();
      if (deal.reco && Array.isArray(deal.reco.cards) && deal.reco.cards.length > 0) {
        payload.lines = deal.reco.cards.map(function(c) {
          return {
            product_family:    fam,
            sku:               c.sku,
            description:       c.desc || c.label || c.sku,
            model_no:          c.sku,
            qty:               (c.qty != null) ? c.qty : 1,
            unit_price_inr:    0,
            line_discount_pct: 0
          };
        });
        // If the chassis itself isn't in cards (some recommenders return it
        // separately), prepend it so the BoM is complete.
        if (deal.reco.chassis && !payload.lines.some(l => l.sku === deal.reco.chassis)) {
          payload.lines.unshift({
            product_family:    fam,
            sku:               deal.reco.chassis,
            description:       (deal.reco.meta && deal.reco.meta.chassisLabel) || deal.reco.chassis,
            model_no:          deal.reco.chassis,
            qty:               1,
            unit_price_inr:    0,
            line_discount_pct: 0
          });
        }
      } else if (Array.isArray(deal.lines) && deal.lines.length > 0) {
        // Pass existing lines through unchanged
        payload.lines = deal.lines;
      } else {
        payload.lines = [];
      }

      return payload;
    }

    function scheduleAutosave() {
      if (!_savedDealData) return;
      setSavedDealStatus('edited');
      if (_autosaveTimer) clearTimeout(_autosaveTimer);
      _autosaveTimer = setTimeout(flushAutosave, AUTOSAVE_DEBOUNCE_MS);
    }

    function flushAutosave() {
      if (_autosaveTimer) { clearTimeout(_autosaveTimer); _autosaveTimer = null; }
      if (!_savedDealData) return;
      if (_autosaveInFlight) {
        // A save is already in flight; reschedule another flush right after.
        // The latest data will win on next tick.
        setTimeout(scheduleAutosave, 50);
        return;
      }
      // Snapshot the current refId — if user navigates away mid-save, we drop
      // the success/error status update so it doesn't paint over a new view.
      const inflightRefId = _savedDealRefId;
      _autosaveInFlight = true;
      setSavedDealStatus('saving');
      // alpha.7.4: route through buildSavePayload so structural fields land
      // in raw_submission (RPC has structured columns + jsonb; nested wizard
      // fields aren't columns). Lines round-trip from reco or existing lines
      // (Session 4 gotcha: destructive on these arrays).
      const payload = buildSavePayload(_savedDealData);
      // v27.3.0 — detect won-deal transition for confetti
      const prevStage = _savedDealLastSavedStage;
      const newStage = _savedDealData && _savedDealData.stage;
      const transitionedToWon = (newStage === 'Closed Won' && prevStage !== 'Closed Won');
      const stageChanged = (prevStage != null && newStage && newStage !== prevStage);
      STORE.saveDeal(payload).then(function(_r) {
        _autosaveInFlight = false;
        if (_savedDealRefId !== inflightRefId) return; // navigated away
        setSavedDealStatus('saved');
        _savedDealLastSavedStage = newStage;
        if (transitionedToWon) {
          try { fireConfetti(); toast('Deal won! \uD83C\uDF89', 'ok'); } catch (e) {}
        }
        // v27.3.0 — append a row to stage_transitions when the stage changes.
        // Fire-and-forget; failures shouldn't block the saved-deal flow.
        if (stageChanged) {
          try {
            const u = STORE.currentUser();
            const actor = u && (u.id || u.username) || null;
            const refForLog = _savedDealData.display_ref || _savedDealData.ref_id || _savedDealRefId;
            STORE.stageTransitionWrite({
              refId:    refForLog,
              fromStage: prevStage,
              toStage:   newStage,
              actor:     actor,
              notes:     null
            }).catch(function (e) {
              console.warn('stage_transition_write failed:', e);
            });

            // v27.3.0 — Notify stakeholders on stage change.
            // Recipients: assigned sales rep, assigned presales rep, BU heads
            // for the deal's region. The current actor is excluded — no point
            // notifying yourself about your own action.
            try {
              const actorUname = u && u.username;
              const recipients = new Set();
              if (_savedDealData.sales_person_id)    recipients.add(String(_savedDealData.sales_person_id));
              if (_savedDealData.presales_person_id) recipients.add(String(_savedDealData.presales_person_id));
              // Resolve UUIDs/usernames via the roster cache. _userRichFor maps either.
              const targetUsernames = new Set();
              recipients.forEach(function (key) {
                try {
                  const u2 = UI && UI._userRichFor && UI._userRichFor(key);
                  if (u2 && u2.username && u2.username !== actorUname) {
                    targetUsernames.add(u2.username);
                  }
                } catch (_) {}
              });
              const proj = _savedDealData.project || '';
              const msg = 'Stage moved from ' + (prevStage || '\u2014') + ' \u2192 ' + (newStage || '\u2014');
              // Pick notification type by destination stage
              let notifType = 'info';
              if (newStage === 'Closed Won')  notifType = 'success';
              else if (newStage === 'Closed Lost') notifType = 'warn';
              targetUsernames.forEach(function (uname) {
                STORE.notifCreate(uname, notifType, refForLog, proj, msg).catch(function (e) {
                  console.warn('notif_create failed for', uname, e);
                });
              });
            } catch (e) {
              console.warn('stage-change notify threw:', e);
            }
          } catch (e) {
            console.warn('stage_transition_write threw:', e);
          }
        }
      }).catch(function(err) {
        _autosaveInFlight = false;
        if (_savedDealRefId !== inflightRefId) return;
        const msg = (err && err.message) ? err.message : String(err || 'unknown');
        setSavedDealStatus('error', msg);
      });
    }

    // Called by other view show* functions on route change OUT of saved-deal.
    // Flushes any pending autosave synchronously-ish (no await — we kick off
    // the save and trust the network; the page itself isn't unloading here).
    function disposeSavedDeal() {
      if (_autosaveTimer) {
        clearTimeout(_autosaveTimer);
        _autosaveTimer = null;
        // Pending edits — flush them so we don't lose data.
        if (_savedDealData && !_autosaveInFlight) {
          // Fire-and-forget. Errors will surface via console but no UI.
          STORE.saveDeal(buildSavePayload(_savedDealData)).catch(function(e) {
            console.warn('disposeSavedDeal flush failed:', e);
          });
        }
      }
      _savedDealData    = null;
      _savedDealRefId   = null;
      _autosaveInFlight = false;
    }

    // beforeunload handler — best effort. Modern browsers ignore async work
    // in beforeunload, but clearing the timer + firing the save kicks off
    // a network request that often completes before the tab actually closes.
    window.addEventListener('beforeunload', function() {
      if (_autosaveTimer && _savedDealData && !_autosaveInFlight) {
        clearTimeout(_autosaveTimer);
        _autosaveTimer = null;
        try { STORE.saveDeal(buildSavePayload(_savedDealData)); } catch (_e) { /* swallow */ }
      }
    });

    /* ============================================================
       Structural edit + Rebuild flow (alpha.7.3)

       Soft fields (7.2) autosave silently. Structural fields (this
       module-level flag) require explicit Rebuild — they change the
       BoM, so we want the rep to confirm the new recommendation
       before the BoM card on the saved deal updates.

       Flow:
         user edits structural field → mutate _savedDealData + set
         _structuralDirty=true + show #sd-rebuild-banner. No save fires.

         user taps Rebuild → APP.recoForDeal(_savedDealData) → set
         _savedDealData.reco (cache) → clear flag → re-render the
         entire saved-deal view (which now shows the new BoM hero
         + hidden banner) → fire save (full payload).

       Trade-off: re-render loses input focus / scroll position.
       Cosmetic-session polish item to swap for targeted DOM patching.
       ============================================================ */

    let _structuralDirty = false;

    // Stepper row mirroring wizard's stepperRow but emits sd-step actions
    // that the saved-deal delegation routes to markStructuralDirty (no
    // autosave). Used for the CALICO I/O steppers in alpha.7.3.
    function sdStepperRow(key, name, sub, value, opts) {
      opts = opts || {};
      const min = opts.min != null ? opts.min : 0;
      const max = opts.max != null ? opts.max : 32;
      const ns = opts.namespace || '';
      const v = Number(value) || 0;
      return '<div class="step-row">' +
        '<div class="step-label">' +
          '<div class="name">' + esc(name) + '</div>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-action="sd-step-dec"' +
            ' data-sd-ns="' + esc(ns) + '" data-sd-key="' + esc(key) + '"' +
            (v <= min ? ' disabled' : '') + '>\u2212</button>' +
          '<input type="text" inputmode="numeric" value="' + v + '"' +
            ' data-action="sd-step-set"' +
            ' data-sd-ns="' + esc(ns) + '" data-sd-key="' + esc(key) + '"' +
            ' aria-label="' + esc(name) + ' count">' +
          '<button type="button" data-action="sd-step-inc"' +
            ' data-sd-ns="' + esc(ns) + '" data-sd-key="' + esc(key) + '"' +
            (v >= max ? ' disabled' : '') + '>+</button>' +
        '</div>' +
      '</div>';
    }

    // Toggle row for saved-deal — used for calico_audio in alpha.7.3.
    function sdToggleRow(key, name, sub, checked) {
      return '<label class="tile" style="margin-bottom:8px"' +
        ' data-checked="' + (checked ? 'true' : 'false') + '"' +
        ' data-action="sd-toggle" data-sd-key="' + esc(key) + '">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<div class="tile-title">' + esc(name) + '</div>' +
        (sub ? '<div class="tile-sub">' + esc(sub) + '</div>' : '') +
      '</label>';
    }

    function markStructuralDirty() {
      _structuralDirty = true;
      const b = document.getElementById('sd-rebuild-banner');
      if (b) b.hidden = false;
    }

    // Rebuild: recompute reco, clear dirty flag, full re-render, fire save.
    function rebuildSavedDeal() {
      if (!_savedDealData) return;
      try {
        const reco = (typeof APP !== 'undefined' && APP.recoForDeal)
          ? APP.recoForDeal(_savedDealData) : null;
        // Cache the reco on the deal so subsequent reads have access (we
        // don't currently persist it, but it's harmless and helps the
        // render path stay synchronous).
        _savedDealData.reco = reco;
      } catch (e) {
        toast('Rebuild failed: ' + ((e && e.message) || String(e)), 'err');
        return;
      }
      _structuralDirty = false;
      // Re-render the whole view — banner re-renders hidden by default.
      setRoot(renderSavedDealLoaded(_savedDealData));
      toast('BoM rebuilt \u00b7 saving\u2026', 'ok');
      // Fire save through the autosave path (re-uses status pill).
      scheduleAutosave();
    }

    const STEP_TITLES = [
      null,
      'Project context',
      'Solution type',
      'Inputs & outputs',
      'LED screens',
      'Signal extension',
      'Review & build'
    ];

    /* v27.3.0 — Compact labels for the wizard step pills (header strip).
       Full titles are still used in the big "Project context" headline. */
    const STEP_PILL_LABELS = [
      null,
      'Project',
      'Solution',
      'I/O',
      'LED',
      'SX',
      'Review'
    ];

    /* ---------- Human labels (v27.1.2 #4a) ----------
       Single source of truth for ID → display-name mapping used by
       Step 6 Review summary, BoM I/O spec line (#4b), and any other
       customer-facing surfaces. Internal IDs stay in code; labels here
       are the only place to edit display text. */
    const HUMAN_LABELS = {
      calico_inputs: {
        hdmi4k:  'HDMI 4K',
        hdmiFhd: 'HDMI FHD',
        sdi12g:  'SDI 12G',
        sdi3g:   'SDI 3G',
        hdbt:    'HDBaseT',
        ip:      'IP / NDI'
      },
      calico_outputs: {
        display:   'HDMI Display',
        projector: 'HDMI Projector',
        sdi:       'SDI Output',
        led:       'LED Screen',
        audio:     'Audio'
      },
      sx_data: {
        hdmi:  'HDMI Extender',
        sdi:   'SDI Extender',
        ap536: 'AP-536 Audio Extractor',
        avip:  'AVIP Encoder'
      }
      // corio_inputs / corio_outputs use CATALOG keys directly
      // (already human-readable: "HDMI 4K", "DVI-U", etc.)
    };

    // Summarise a namespaced data object as "Label \u00d7 N, Label \u00d7 N".
    // Returns 'none' when no positive numeric values present.
    function humanizeNamespace(ns, dataObj) {
      if (!dataObj || typeof dataObj !== 'object') return 'none';
      const map = HUMAN_LABELS[ns] || {};
      const parts = [];
      Object.keys(dataObj).forEach(function(k) {
        const v = dataObj[k];
        if (typeof v === 'number' && v > 0) {
          parts.push((map[k] || k) + ' \u00d7 ' + v);
        }
      });
      return parts.length ? parts.join(', ') : 'none';
    }

    /* ---------- State ---------- */

    function defaultWizard() {
      return {
        step: 1,
        project: '', customer_name: '', partner_name: '', consultant_name: '',
        venue_type: '', city: '', state: '',
        stage: 'Qualified', lead_source: '',
        sales_person_id: '', presales_person_id: '',
        close_month: '',
        contact_name: '', contact_phone: '', contact_email: '',
        internal_notes: '', external_notes: '',
        solutionType: '',
        calico_inputs:  { hdmi4k: 0, hdmiFhd: 0, sdi12g: 0, sdi3g: 0, hdbt: 0, ip: 0 },
        calico_outputs: { display: 0, projector: 0, projectorRes: 'FHD', sdi: 0 },
        calico_audio: false,
        mv_inputs: [],
        mv_outputSignal: '',
        corio_inputs:  {},
        corio_outputs: {},
        corio_audio: '',
        corio_fanFilter: false,
        // v27.1.2 #7 — Canvas count for CORIO solutions. UI-only this release
        // (OQ 7B): captured + displayed + persisted, but does NOT drive chassis
        // auto-select (_corioAutoSelectChassis). Algorithm update lands in
        // v27.1.3 once tvONE's exact canvas→chassis rule is confirmed.
        corio_canvases: 0,
        hasLed: false,
        screens: [],
        hasSx: false,
        // v27.3.0 §10 — sx_data sums kept for backward compat with saved deals
        // (engine path falls through to detail arrays when present).
        sx_data: { hdmi: 0, sdi: 0, ap536: 0, avip: 0 },
        // v27.3.0 — per-variant detail arrays. These drive the BoM SKU emission.
        // HDBaseT: each line is { id, direction: 'kit'|'tx'|'rx', signal: 'Video'|'Video+Audio'|'Video+Audio+IR+RS232', resolution: '1080p'|'4K', qty }
        sx_hdbt_lines: [],
        // Splitter (DA): direct counts per model. Engine emits one BoM line per non-zero.
        sx_da_counts: { '612': 0, '614': 0, '618': 0 },
        // AP-536: simple qty.
        sx_ap_qty: 0,
        // AOC: each line is { id, signal: 'HDMI'|'DisplayPort', jacket: 'Standard'|'Plenum'|'LSZH'|'Armored', length: 10, qty }
        sx_aoc_lines: [],
        reco: null,
        errors: {}
      };
    }

    let wizardData = null;
    let historyState = { filter: 'all', limit: 20, offset: 0, total: 0 };
    let loginMode = 'login';
    let pendingForcedUser = null;
    let pendingProfileUser = null;  // v27.2.0 — D16 gate

    const WIZ_KEY = 'v27.wizard.draft';

    function loadDraft() {
      try {
        const raw = localStorage.getItem(WIZ_KEY);
        if (!raw) return defaultWizard();
        const parsed = JSON.parse(raw);
        const merged = Object.assign(defaultWizard(), parsed);
        merged.reco = null;
        merged.errors = {};
        return merged;
      } catch (e) {
        return defaultWizard();
      }
    }

    const saveDraft = debounce(function() {
      try {
        if (!wizardData) return;
        const o = Object.assign({}, wizardData);
        delete o.reco; delete o.errors;
        localStorage.setItem(WIZ_KEY, JSON.stringify(o));
      } catch (e) { /* silent */ }
    }, 350);

    // v27.1.3 S5 — synchronous flush of the current wizardData to localStorage.
    // Bypasses the 350ms debounce on saveDraft. Used by the saveDraft round-trip
    // smoke test so it can read localStorage immediately after writing. Safe to
    // call from production code paths too (e.g. before navigating away), though
    // currently only the smoke harness uses it.
    function flushDraft() {
      try {
        if (!wizardData) return;
        const o = Object.assign({}, wizardData);
        delete o.reco; delete o.errors;
        localStorage.setItem(WIZ_KEY, JSON.stringify(o));
      } catch (e) { /* silent */ }
    }

    function clearDraft() {
      try { localStorage.removeItem(WIZ_KEY); } catch (e) {}
      wizardData = defaultWizard();
    }

    /* ---------- v27.1.2 #3+#5: screens array resizer ----------
       Called from the synthetic 'led' stepper in Step 3 CALICO Outputs and
       from the lazy-remap path in hydrateWizardFromDeal. Grows the screens
       array with blank entries {w,h,pitch} or trims from the tail, preserving
       existing data. Keeps wizardData.hasLed in sync at call-site. */
    function _resizeScreens(targetLen) {
      const n = Math.max(0, parseInt(targetLen, 10) || 0);
      if (!Array.isArray(wizardData.screens)) wizardData.screens = [];
      const cur = wizardData.screens.length;
      if (n === cur) return;
      if (n > cur) {
        for (let i = cur; i < n; i++) {
          wizardData.screens.push({ w: '', h: '', pitch: '' });
        }
      } else {
        wizardData.screens.length = n;
      }
    }

    /* ---------- v27.1.2 #6: hydrate wizard from saved deal ----------
       Caller is sd-edit action handler. Deal arrives already flattened
       (raw_submission unpacked onto top-level by showSavedDeal). We start
       from a fresh defaultWizard() so any missing fields default cleanly,
       then overlay deal fields. id + display_ref preserved so wizSave
       routes through the update path (buildSavePayload checks for id). */
    function hydrateWizardFromDeal(deal) {
      if (!deal || typeof deal !== 'object') {
        throw new Error('hydrateWizardFromDeal: deal required');
      }
      const w = defaultWizard();
      // Overlay top-level fields. Object.assign handles primitives + objects;
      // for nested objects (calico_inputs etc.) we re-merge with defaults so
      // any missing sub-keys default to 0 / false.
      Object.keys(deal).forEach(function(k) {
        if (k === 'reco' || k === 'errors' || k === 'lines' ||
            k === 'created_at' || k === 'updated_at' || k === 'deleted_at') {
          return;
        }
        const v = deal[k];
        if (v === undefined || v === null) return;
        // Re-merge known nested objects so v27.1.1 deals (lacking newer keys)
        // pick up the defaults; deal values still win for keys they have.
        if (k === 'calico_inputs' || k === 'calico_outputs' || k === 'sx_data' ||
            k === 'sx_da_counts') {
          w[k] = Object.assign({}, w[k], v);
        } else {
          w[k] = v;
        }
      });
      // Preserve id + display_ref for edit-mode detection (consumed by
      // buildSavePayload at line ~3735).
      if (deal.id)          w.id          = deal.id;
      if (deal.display_ref) w.display_ref = deal.display_ref;

      // v27.3.0 §10 — SX backward-compat. Old deals only have sx_data sums.
      // If the new detail arrays are empty but the old sums are >0, seed the
      // arrays with sensible defaults so the deal opens with line items the
      // user can edit (instead of empty cards that look broken).
      const sxData = w.sx_data || {};
      if ((!w.sx_hdbt_lines || w.sx_hdbt_lines.length === 0) && Number(sxData.hdmi) > 0) {
        w.sx_hdbt_lines = [{
          id: 'h' + Date.now(),
          direction: 'kit',
          signal: 'Video',
          resolution: '1080p',
          qty: Number(sxData.hdmi) || 0
        }];
      }
      if ((!w.sx_da_counts || (w.sx_da_counts['612']|0)+(w.sx_da_counts['614']|0)+(w.sx_da_counts['618']|0) === 0) && Number(sxData.sdi) > 0) {
        w.sx_da_counts = { '612': 0, '614': Number(sxData.sdi) || 0, '618': 0 };  // default to 1×4
      }
      if (!(Number(w.sx_ap_qty) > 0) && Number(sxData.ap536) > 0) {
        w.sx_ap_qty = Number(sxData.ap536) || 0;
      }
      if ((!w.sx_aoc_lines || w.sx_aoc_lines.length === 0) && Number(sxData.avip) > 0) {
        w.sx_aoc_lines = [{
          id: 'a' + Date.now(),
          signal: 'HDMI',
          jacket: 'Standard',
          length: 10,
          qty: Number(sxData.avip) || 0
        }];
      }
      // v27.1.2 OQ 1A — lazy remap of v27.1.1 deal shape:
      //   - hasLed was a top-level boolean; v27.1.2 still uses it but Step 3
      //     drives it from a count stepper. No remap needed at hasLed itself
      //     (we kept it canonical).
      //   - screens entries lacked 'pitch'. Ensure every entry has the pitch
      //     key so Step 4 renders cleanly (empty string → user prompted to
      //     fill on edit; OQ 5B: shown as '\u2014' on Review pre-edit).
      if (Array.isArray(w.screens)) {
        w.screens = w.screens.map(function(s) {
          if (s && typeof s === 'object' && !('pitch' in s)) {
            return Object.assign({}, s, { pitch: '' });
          }
          return s;
        });
      }
      w.reco = null;        // rebuild on Build
      w.errors = {};
      w.step = 1;
      return w;
    }

    /* ---------- Toast / sheet / chrome ---------- */

    function toast(msg, level) {
      level = level || 'default';
      const host = $('toast-host');
      if (!host) return;
      const el = document.createElement('div');
      el.className = 'toast' + (level !== 'default' ? ' ' + level : '');
      el.textContent = msg;
      host.appendChild(el);
      const ms = level === 'err' ? 6500 : 3500;
      setTimeout(() => {
        el.style.transition = 'opacity 220ms';
        el.style.opacity = '0';
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 240);
      }, ms);
    }

    function openSheet(html) {
      $('sheet-body').innerHTML = html;
      $('sheet-host').setAttribute('data-open', 'true');
      $('sheet-host').setAttribute('aria-hidden', 'false');
    }
    function closeSheet() {
      $('sheet-host').setAttribute('data-open', 'false');
      $('sheet-host').setAttribute('aria-hidden', 'true');
      $('sheet-body').innerHTML = '';
    }

    /* v27.3.0 — Custom confirmation sheet. Replaces native window.confirm()
       which on mobile (esp. Z Fold) renders as an ugly OS dialog far from
       the trigger. Uses the standard sheet-host + a single one-shot callback.
       Stored as module-level so closeSheet doesn't strand the callback. */
    let _pendingConfirmCallback = null;
    function showConfirmSheet(title, message, opts, onConfirm) {
      opts = opts || {};
      _pendingConfirmCallback = (typeof onConfirm === 'function') ? onConfirm : null;
      const confirmLabel = opts.confirmLabel || 'Confirm';
      const cancelLabel  = opts.cancelLabel  || 'Cancel';
      const danger = !!opts.danger;
      const confirmCls = danger ? 'btn-danger' : 'btn-primary';
      const icon = danger
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
      openSheet(
        '<div class="confirm-sheet">' +
          '<div class="confirm-icon ' + (danger ? 'confirm-icon-danger' : 'confirm-icon-info') + '">' + icon + '</div>' +
          '<h3 class="confirm-title">' + esc(title) + '</h3>' +
          (message ? '<p class="confirm-msg">' + esc(message) + '</p>' : '') +
          '<div class="confirm-actions">' +
            '<button class="btn-v3 btn-ghost btn-md" type="button" data-action="confirm-cancel">' + esc(cancelLabel) + '</button>' +
            '<button class="btn-v3 ' + confirmCls + ' btn-md" type="button" data-action="confirm-go">' + esc(confirmLabel) + '</button>' +
          '</div>' +
        '</div>'
      );

    function showChrome(show) {

      const tc = $('tricolor'); if (tc) tc.hidden = !show;

    /* ---------- v27.3.0 Theme toggle + topbar dynamic ---------- */
    const THEME_STORAGE_KEY = 'tvone.theme.v27';
    function applyTheme(pref) {
      try { localStorage.setItem(THEME_STORAGE_KEY, pref); } catch (e) {}
      const actual = (pref === 'auto')
        ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
        : pref;
      document.documentElement.setAttribute('data-theme', actual);
      const btns = document.querySelectorAll('#theme-toggle .theme-btn');
      btns.forEach(b => b.classList.toggle('active', b.getAttribute('data-theme-val') === pref));
    }
    function renderTopBarDynamic(user) {
      if (!user) return;
      // avatar initials
      const av = $('avatar-btn');
      if (av) {
        const name = String(user.full_name || user.username || '').trim();
        const initials = name.split(/\s+/).map(p => p[0]).filter(Boolean).slice(0, 2).join('').toUpperCase() || '?';
        av.textContent = initials;
        av.title = name || 'Profile';
      }
      // perm badge — only show for super
      const pb = $('perm-badge');
      if (pb) {
        if (user.permission_tier === 'super') { pb.hidden = false; pb.textContent = 'SUPER'; }
        else { pb.hidden = true; }
      }
      // Kick off notification badge refresh
      try { refreshNotifBadge(); } catch (e) {}
    }

    async function refreshNotifBadge() {
      try {
        const rows = await STORE.notifList();
        const unread = rows.filter(r => !r.read_at).length;
        const badge = $('notif-badge');
        if (!badge) return;

      switch (String(type || '').toLowerCase()) {
        case 'won':       return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5A2.5 2.5 0 0 1 2 6.5V5h4"/><path d="M18 9h1.5A2.5 2.5 0 0 0 22 6.5V5h-4"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';

        case 'handoff':   return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 11l2 2 4-4"/></svg>';

      }
    }
    function _notifTimeAgo(iso) {
      if (!iso) return '';
      const t = new Date(iso).getTime();
      if (isNaN(t)) return '';
      const s = Math.floor((Date.now() - t) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
      return String(iso).slice(0, 10);
    }

    /* v27.3.0 — Won-deal confetti (v27.7 partial restore).
       Pure-DOM CSS-animated; no library dependency.
       Spawns 60 particles in brand + win colors, falls + fades over ~2.6s. */
    function fireConfetti() {
      const host = document.body;
      const colors = ['#F7941D', '#E8731C', '#22C55E', '#16A34A', '#A78BFA', '#3B82F6', '#FAC172'];
      const container = document.createElement('div');
      container.className = 'confetti-burst';
      container.setAttribute('aria-hidden', 'true');
      for (let i = 0; i < 60; i++) {
        const p = document.createElement('span');
        p.className = 'confetti-particle';
        const c = colors[i % colors.length];
        const left = Math.random() * 100;
        const rotate = Math.floor(Math.random() * 720) - 360;
        const delay = Math.random() * 0.3;
        const duration = 1.6 + Math.random() * 1.2;
        const drift = (Math.random() - 0.5) * 200;
        p.style.left = left + 'vw';
        p.style.background = c;
        p.style.setProperty('--rotate', rotate + 'deg');
        p.style.setProperty('--drift', drift + 'px');
        p.style.animationDelay = delay + 's';
        p.style.animationDuration = duration + 's';
        container.appendChild(p);
      }
      host.appendChild(container);
      setTimeout(function () { if (container.parentNode) container.parentNode.removeChild(container); }, 3000);
    }

    /* v27.3.0 — Pull-to-refresh manager.
       Single delegated touchstart/touchmove/touchend listener on <body>.
       Activates only when window.scrollTop === 0 and the swipe is clearly
       vertical-down. When deltaY crosses threshold (80px), the indicator
       enters its "ready" state; on release, it spins and calls the route's
       reloader. Skipped entirely if prefers-reduced-motion. */
    const _ptr = (function () {
      const TRIGGER = 80;
      const MAX_PULL = 140;
      let indicator = null;
      let startY = 0;
      let lastY = 0;
      let pulling = false;
      let ready = false;
      let armed = false;            // current route allows PTR
      let reloader = null;          // current route's refresh callback
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function ensureIndicator() {
        if (indicator) return indicator;
        indicator = document.createElement('div');
        indicator.className = 'ptr-indicator';
        indicator.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
            '<polyline points="23 4 23 10 17 10"/>' +
            '<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>' +
          '</svg>';
        document.body.appendChild(indicator);
        return indicator;
      }

      function setIndicatorPos(delta) {
        if (!indicator) return;
        const clamped = Math.min(MAX_PULL, Math.max(0, delta));
        const y = -100 + Math.min(180, clamped * 1.3);
        indicator.style.transform = 'translate(-50%, ' + y + '%)';
      }

      function onStart(ev) {
        if (!armed) return;
        if (reduceMotion) return;
        if (window.scrollY > 0) return;
        const t = ev.touches && ev.touches[0];
        if (!t) return;
        startY = t.clientY;
        lastY = startY;
        pulling = true;
        ready = false;
      }

      function onMove(ev) {
        if (!pulling || !armed) return;
        const t = ev.touches && ev.touches[0];
        if (!t) return;
        const delta = t.clientY - startY;
        if (delta <= 0) {
          // scrolling up — cancel
          if (indicator) indicator.classList.remove('is-visible');
          pulling = false;
          return;
        }
        // Only kick in for clearly-vertical swipes
        if (delta < 12) return;
        // We're holding a downward pull from scrollTop=0 → take over the gesture
        ensureIndicator();
        indicator.classList.add('is-visible');
        // Resist beyond trigger
        const shown = delta < TRIGGER ? delta : TRIGGER + (delta - TRIGGER) * 0.35;
        setIndicatorPos(shown);
        ready = delta >= TRIGGER;
        lastY = t.clientY;
        // Prevent overscroll bounce on iOS while pulling
        if (ev.cancelable) ev.preventDefault();
      }

      function onEnd() {
        if (!pulling) return;
        pulling = false;
        if (!indicator) return;
        if (ready && reloader) {
          indicator.classList.add('is-spinning');
          // Hold indicator near the threshold while reloader runs
          setIndicatorPos(TRIGGER);
          Promise.resolve()
            .then(function () { return reloader(); })
            .catch(function (e) { console.warn('PTR reload failed:', e); })
            .then(function () {
              setTimeout(function () {
                indicator.classList.remove('is-spinning', 'is-visible');
                setIndicatorPos(0);
              }, 240);
            });
        } else {
          indicator.classList.remove('is-visible');
          setIndicatorPos(0);
        }
        ready = false;
      }

      function armForCurrentRoute() {
        const hash = location.hash || '#/home';
        if (hash === '#/home') {
          armed = true;
          reloader = function () {
            return Promise.all([loadHomeSimpleStats(), loadHomeRecent()]);
          };
        } else if (hash === '#/dashboard') {
          armed = true;
          reloader = function () { return loadHomeKpis(); };
        } else if (hash === '#/history' || hash.indexOf('#/history?') === 0) {
          armed = true;
          reloader = function () {
            return typeof loadHistoryList === 'function' ? loadHistoryList() : null;
          };
        } else if (hash === '#/customers') {
          armed = true;
          reloader = function () {
            return typeof loadCustomerList === 'function' ? loadCustomerList() : null;
          };
        } else {
          armed = false;
          reloader = null;
        }
      }

      // Single delegated set of listeners on document — install once.
      document.addEventListener('touchstart', onStart, { passive: true });
      document.addEventListener('touchmove',  onMove,  { passive: false });
      document.addEventListener('touchend',   onEnd,   { passive: true });
      document.addEventListener('touchcancel', onEnd,  { passive: true });

      return { armForCurrentRoute: armForCurrentRoute };
    })();

      if (!f) return;
      const e = f.querySelector('.err');
      if (msg) {

      } else {
        f.classList.remove('has-error');

    /* WhatsApp share — builds wa.me URL with phone (stripped, +91 prepended if 10-digit) */
    function _buildWhatsAppUrl(deal) {
      let phone = String((deal && deal.contact_phone) || '').replace(/\D/g, '');
      if (phone.length === 10) phone = '91' + phone;
      const ref  = deal.display_ref || deal.ref_id || '';
      const proj = deal.project || '(no project name)';
      const cust = deal.customer_name || '';
      const sender = (function () {
        try { const u = STORE.currentUser(); return u ? (u.full_name || u.username || '') : ''; } catch (e) { return ''; }
      })();
      const lines = [
        'Hi' + (cust ? ' ' + cust : '') + ',',
        '',
        'Sharing the BoM for *' + proj + '* (' + ref + ').',
        '',
        'Excel + PDF attached. Please review and let me know if any adjustments are needed.',
        '',
        sender ? 'Best,\n' + sender : 'Best regards',
        sender ? 'Cavitak Marketing' : ''
      ].filter(Boolean).join('\n');
      const text = encodeURIComponent(lines);
      return phone
        ? 'https://wa.me/' + phone + '?text=' + text
        : 'https://wa.me/?text=' + text;
    }

    /* Email share — builds mailto: URL with subject + body + CC to sender */
    function _buildMailtoUrl(deal) {
      const ref  = deal.display_ref || deal.ref_id || '';
      const proj = deal.project || '(no project name)';
      const cust = deal.customer_name || '';
      const to   = String((deal && deal.contact_email) || '').trim();
      const sender = (function () {
        try {
          const u = STORE.currentUser();
          return { name: u ? (u.full_name || u.username || '') : '', email: u ? (u.email || '') : '' };
        } catch (e) { return { name: '', email: '' }; }
      })();
      const subject = 'Quotation — ' + proj + ' (' + ref + ')';
      const body = [
        'Dear ' + (cust || 'Sir/Madam') + ',',
        '',
        'Please find the attached quotation (Excel + PDF) for ' + proj + ' (ref: ' + ref + ').',
        '',
        'Kindly review and revert in case of any clarifications.',
        '',
        'Best regards,',
        sender.name || 'Cavitak Marketing',
        'Cavitak Marketing Pvt Ltd'
      ].join('\r\n');
      const params = [];
      if (sender.email) params.push('cc=' + encodeURIComponent(sender.email));
      params.push('subject=' + encodeURIComponent(subject));
      params.push('body=' + encodeURIComponent(body));
      return 'mailto:' + encodeURIComponent(to) + '?' + params.join('&');
    }

    function _currentYYYYMM() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function _daysSince(iso) {
      if (!iso) return 0;
      const ms = Date.now() - new Date(iso).getTime();
      return Math.floor(ms / 86400000);
    }
    function _isOpenStage(stage) {
      const s = String(stage || '').trim();
      return s !== 'Closed Won' && s !== 'Closed Lost' && s !== '';
    }

    async function loadHomeKpis() {
      try {
        const r = await STORE.listDeals({ limit: 500, offset: 0 });
        const all = (r && r.rows) || [];
        const u = STORE.currentUser() || {};
        const uid = u.id;
        const isSuper = u.permission_tier === 'super';
        const isBuHead = u.org_function === 'BU Head';
        // Scope: Super sees all, BU Head sees regional, everyone else sees own
        let scoped;
        if (isSuper) {
          scoped = all;
        } else if (isBuHead && u.region) {
          // BU Head — match by region (handle multi-region like 'South,East')
          const myRegions = String(u.region || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
          scoped = all.filter(d => {
            const ownerRegion = String(d.region_owner || d.region || '').toLowerCase();
            // No region column on deals — fall back to mine + reports
            return d.sales_person_id === uid || d.presales_person_id === uid ||
                   (ownerRegion && myRegions.indexOf(ownerRegion) >= 0);
          });
        } else {
          scoped = uid ? all.filter(d => d.sales_person_id === uid || d.presales_person_id === uid) : all;
        }
        const active = scoped.filter(d => !d.deleted_at);
        const open  = active.filter(d => _isOpenStage(d.stage));
        const won   = active.filter(d => d.stage === 'Closed Won');
        const lost  = active.filter(d => d.stage === 'Closed Lost');
        const curM  = _currentYYYYMM();
        const closingNow = open.filter(d => String(d.close_month || '').slice(0, 7) === curM);
        const stuck14 = open.filter(d => _daysSince(d.updated_at || d.created_at) > 14);
        const stale30 = open.filter(d => _daysSince(d.updated_at || d.created_at) > 30);

        // -- Quarter window --
        const qStart = (function () {
          const d = new Date(); const m = d.getMonth();
          const qm = Math.floor(m / 3) * 3;
          return new Date(d.getFullYear(), qm, 1);
        })();
        const wonQ  = won.filter(d => new Date(d.updated_at || d.created_at || 0) >= qStart);
        const lostQ = lost.filter(d => new Date(d.updated_at || d.created_at || 0) >= qStart);

        // -- Win rate (last 90 days) --
        const since90 = new Date(Date.now() - 90 * 86400000);
        const won90 = won.filter(d => new Date(d.updated_at || 0) >= since90).length;
        const lost90 = lost.filter(d => new Date(d.updated_at || 0) >= since90).length;
        const resolved90 = won90 + lost90;
        const winRate90 = resolved90 ? Math.round(won90 * 100 / resolved90) : null;

        // -- Avg sales cycle (won deals — days from created to updated) --
        const wonWithDates = won.filter(d => d.created_at && d.updated_at);
        const avgCycleDays = wonWithDates.length
          ? Math.round(wonWithDates.reduce((s, d) => {
              const ms = new Date(d.updated_at).getTime() - new Date(d.created_at).getTime();
              return s + (ms / 86400000);
            }, 0) / wonWithDates.length)
          : null;

        // -- Velocity (deals closed/month over last 3 months) --
        const since90d = Date.now() - 90 * 86400000;
        const closed90 = won.concat(lost).filter(d =>
          new Date(d.updated_at || 0).getTime() >= since90d
        ).length;
        const velocity = (closed90 / 3).toFixed(1);

        // -- KPI fills --
        const openVal = open.reduce((s, d) => s + (Number(d.deal_value_inr) || 0), 0);
        const wonVal = wonQ.reduce((s, d) => s + (Number(d.deal_value_inr) || 0), 0);
        setText('kpi-open-val',  openVal > 0 ? _fmtLakh(openVal) : String(open.length));
        setText('kpi-open-sub',  open.length + (open.length === 1 ? ' deal' : ' deals'));
        setText('kpi-won-val',   wonVal > 0 ? _fmtLakh(wonVal) : String(wonQ.length));
        setText('kpi-won-sub',   wonQ.length + (wonQ.length === 1 ? ' win' : ' wins') + ' this quarter');
        setText('kpi-wr-val',    winRate90 != null ? (winRate90 + '%') : '\u2014');
        setText('kpi-wr-sub',    resolved90 + ' resolved');
        setText('kpi-cm-val',    String(closingNow.length));
        setText('kpi-cm-sub',    closingNow.length ? 'due this month' : 'nothing due');
        setText('kpi-stuck-val', String(stuck14.length));
        setText('kpi-stuck-sub', stuck14.length ? 'need a nudge' : 'all current');
        setText('kpi-lost-val',  String(lostQ.length));
        setText('kpi-lost-sub',  lostQ.length === 1 ? '1 loss' : (lostQ.length + ' losses'));
        setText('kpi-cycle-val', avgCycleDays != null ? (avgCycleDays + 'd') : '\u2014');
        setText('kpi-cycle-sub', wonWithDates.length + ' wins sampled');
        setText('kpi-velocity-val', velocity);
        setText('kpi-velocity-sub', 'deals / mo (90d)');

        // -- Attention counts --
        setText('att-closing', String(closingNow.length));
        setText('att-stuck',   String(stuck14.length));
        setText('att-stale',   String(stale30.length));
        setText('home-deal-count', scoped.length + (scoped.length === 1 ? ' deal' : ' deals'));

        // -- Stage funnel --
        renderStageFunnel(active);

        // -- Region tiles (BU Head + Super only) --
        if ($('region-tiles')) {
          renderRegionTiles(active, u);
        }

        // -- Stuck/slipped table --
        renderStuckTable(stuck14.concat(stale30).filter((v, i, a) => a.indexOf(v) === i));

      } catch (e) {
        console.error('loadHomeKpis failed:', e);
      }
    }

    /* v27.3.0 — Stage funnel as horizontal bar chart (inline SVG, no library) */
    function renderStageFunnel(deals) {
      const host = $('stage-funnel');
      if (!host) return;
      const stageOrder = ['Qualified','Proposal','Budget Approval','Technical Approval','Negotiation','Awarded','Closed Won','Closed Lost'];
      const counts = {};
      stageOrder.forEach(s => counts[s] = 0);
      deals.forEach(d => {
        if (counts[d.stage] != null) counts[d.stage] += 1;
      });
      const max = Math.max.apply(null, stageOrder.map(s => counts[s])) || 1;
      const stageColor = {
        'Qualified':          '#3B82F6',
        'Proposal':           '#EC4899',
        'Budget Approval':    '#06B6D4',
        'Technical Approval': '#8B5CF6',
        'Negotiation':        '#F59E0B',
        'Awarded':            '#F7941D',
        'Closed Won':         '#22C55E',
        'Closed Lost':        '#94A3B8'
      };
      // v27.3.0 — Map stages to History filters so the row is tappable
      // and jumps to a pre-filtered Quotes list.
      const stageToFilter = {
        'Qualified':          'open',  // no per-stage filter yet; closest is "open"
        'Proposal':           'open',
        'Budget Approval':    'open',
        'Technical Approval': 'open',
        'Negotiation':        'open',
        'Awarded':            'open',
        'Closed Won':         'won',
        'Closed Lost':        'lost'
      };
      host.innerHTML = stageOrder.map(function (s) {
        const ct = counts[s];
        const pct = Math.max(2, Math.round(ct * 100 / max));
        const navHref = '#/history?filter=' + stageToFilter[s] + '&stage=' + encodeURIComponent(s);
        const isEmpty = ct === 0;
        return '<button class="funnel-row funnel-row-btn' + (isEmpty ? ' funnel-row-empty' : '') + '" type="button" data-nav="' + esc(navHref) + '"' + (isEmpty ? ' aria-disabled="true"' : '') + '>' +
          '<span class="funnel-stage" style="color:' + stageColor[s] + '">' + esc(s) + '</span>' +
          '<div class="funnel-bar-wrap">' +
            '<div class="funnel-bar" style="width:' + pct + '%;background:' + stageColor[s] + '"></div>' +
          '</div>' +
          '<span class="funnel-count">' + ct + '</span>' +
        '</button>';
      }).join('');
    }

    /* v27.3.0 — Region zone tiles (BU Head + Super only).
       For Super: shows all 4 zones (W/N/S/E) aggregating all deals.
       For BU Head: shows their assigned region(s) only. */
    function renderRegionTiles(deals, u) {
      const host = $('region-tiles');
      if (!host) return;
      const isSuper = u && u.permission_tier === 'super';
      const allZones = ['West', 'North', 'South', 'East'];
      let zones;
      if (isSuper) {
        zones = allZones;
      } else {
        zones = String(u.region || '').split(',').map(s => s.trim()).filter(Boolean);
        if (zones.length === 0) zones = allZones; // fallback
      }
      // Group deals by zone — uses state-to-region mapping fallback if no region field
      const stateRegion = {
        'Maharashtra':'West','Gujarat':'West','Rajasthan':'West','Goa':'West','Madhya Pradesh':'West',
        'Delhi':'North','Punjab':'North','Haryana':'North','Uttar Pradesh':'North','Uttarakhand':'North','Himachal Pradesh':'North','Jammu and Kashmir':'North','Chandigarh':'North',
        'Karnataka':'South','Tamil Nadu':'South','Kerala':'South','Andhra Pradesh':'South','Telangana':'South','Puducherry':'South',
        'West Bengal':'East','Bihar':'East','Jharkhand':'East','Odisha':'East','Assam':'East','Sikkim':'East','Manipur':'East','Meghalaya':'East','Mizoram':'East','Nagaland':'East','Tripura':'East','Arunachal Pradesh':'East'
      };
      const zoneStats = {};
      zones.forEach(z => { zoneStats[z] = { open: 0, won: 0, lost: 0, value: 0 }; });
      deals.forEach(function (d) {
        const z = d.region || stateRegion[d.state] || null;
        if (!z || !zoneStats[z]) return;
        if (d.stage === 'Closed Won') {
          zoneStats[z].won += 1;
          zoneStats[z].value += Number(d.deal_value_inr) || 0;
        } else if (d.stage === 'Closed Lost') {
          zoneStats[z].lost += 1;
        } else if (_isOpenStage(d.stage)) {
          zoneStats[z].open += 1;
        }
      });
      const zoneColor = { 'West':'#F7941D', 'North':'#3B82F6', 'South':'#22C55E', 'East':'#A855F7' };
      host.innerHTML = zones.map(function (z) {
        const s = zoneStats[z] || { open: 0, won: 0, lost: 0, value: 0 };
        const resolved = s.won + s.lost;
        const wr = resolved ? Math.round(s.won * 100 / resolved) : null;
        const navHref = '#/history?filter=all&region=' + encodeURIComponent(z);
        return '<button class="region-tile region-tile-btn" type="button" data-nav="' + esc(navHref) + '" style="--zone-color:' + zoneColor[z] + '">' +
          '<div class="region-tile-head">' +
            '<span class="region-dot" style="background:' + zoneColor[z] + '"></span>' +
            '<span class="region-name">' + esc(z) + '</span>' +
            '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;color:var(--ink-soft);opacity:0.5"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</div>' +
          '<div class="region-stats">' +
            '<div class="region-stat"><div class="region-stat-k">Open</div><div class="region-stat-v">' + s.open + '</div></div>' +
            '<div class="region-stat"><div class="region-stat-k">Won</div><div class="region-stat-v">' + s.won + '</div></div>' +
            '<div class="region-stat"><div class="region-stat-k">Win %</div><div class="region-stat-v">' + (wr != null ? wr + '%' : '\u2014') + '</div></div>' +
          '</div>' +
        '</button>';
      }).join('');
    }

    /* v27.3.0 — Stuck/slipped table. Open deals not updated in 14+ days. */
    function renderStuckTable(rows) {
      const host = $('stuck-table');
      if (!host) return;
      if (!rows || rows.length === 0) {
        host.innerHTML =
          '<div class="empty-state" style="padding:24px 16px">' +
            '<div class="empty-state-illustration"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>' +
            '<p class="empty-state-body">All open deals updated recently. Nice work.</p>' +
          '</div>';
        return;
      }
      // Sort: most stuck first
      rows.sort(function (a, b) {
        const da = _daysSince(a.updated_at || a.created_at);
        const db = _daysSince(b.updated_at || b.created_at);
        return db - da;
      });
      const top = rows.slice(0, 8);
      host.innerHTML =
        '<table class="stuck-table">' +
          '<thead><tr>' +
            '<th>Project</th>' +
            '<th>Stage</th>' +
            '<th class="num">Idle</th>' +
          '</tr></thead>' +
          '<tbody>' +
            top.map(function (d) {
              const ref = d.display_ref || d.ref || '\u2014';
              const days = _daysSince(d.updated_at || d.created_at);
              const stageCls = _stageChipClassName(d.stage);
              return '<tr data-nav="#/quote/' + esc(ref) + '">' +
                '<td>' +
                  '<div class="stuck-project">' + esc(d.project || '\u2014') + '</div>' +
                  '<div class="stuck-meta">' + esc(ref) + (d.customer_name ? ' \u00b7 ' + esc(d.customer_name) : '') + '</div>' +
                '</td>' +
                '<td><span class="' + stageCls + '" style="font-size:10.5px">' + esc(d.stage || '\u2014') + '</span></td>' +
                '<td class="num"><span class="stuck-days' + (days > 30 ? ' stuck-days-bad' : '') + '">' + days + 'd</span></td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
        (rows.length > top.length
          ? '<div class="stuck-table-more">' +
              'Showing ' + top.length + ' of ' + rows.length + '. ' +
              '<a data-nav="#/history?filter=stuck">See all \u2192</a>' +
            '</div>'
          : '');
    }

    function _fmtLakh(n) {
      n = Number(n) || 0;
      if (n >= 10000000) return '\u20B9' + (n / 10000000).toFixed(2).replace(/\.?0+$/, '') + ' Cr';
      if (n >= 100000)   return '\u20B9' + (n / 100000).toFixed(2).replace(/\.?0+$/, '') + ' L';
      return fmtINR(n);
    }

    /* ============================================================
       VIEW: History — full quote list with search + filter chips.
       v27.3.0 — Modernized with v273-page wrapper, debounced search,
       expanded filter chips (closing-this-month/stuck/stale/deleted).
       ============================================================ */

    let _historySearchTimer = null;

    function showHistory() {
      showChrome(true);
      updateNavActive('#/history');
      // Parse filter + stage + region from URL query
      // (e.g. #/history?filter=stuck or #/history?filter=open&stage=Proposal
      //  or #/history?filter=all&region=West)
      const hash = location.hash || '';
      const queryStart = hash.indexOf('?');
      let urlFilter = null;
      let urlStage  = null;
      let urlRegion = null;
      if (queryStart >= 0) {
        const query = hash.slice(queryStart + 1);
        query.split('&').forEach(function (kv) {
          const eq = kv.indexOf('=');
          if (eq < 0) return;
          const k = kv.slice(0, eq);
          const v = decodeURIComponent(kv.slice(eq + 1));
          if (k === 'filter') urlFilter = v;
          if (k === 'stage')  urlStage  = v;
          if (k === 'region') urlRegion = v;
        });
      }
      historyState = {
        filter: urlFilter || 'all',
        stage:  urlStage  || null,
        region: urlRegion || null,
        search: '',
        sort:   'updated_desc',   // v27.3.0 — list sorting (Updated newest first by default)
        limit: 100,
        offset: 0,
        total: 0
      };
      const chips = [
        { id: 'all',                label: 'All' },
        { id: 'open',               label: 'Open' },
        { id: 'closing-this-month', label: 'Closing now' },
        { id: 'stuck',              label: 'Stuck >14d' },
        { id: 'stale',              label: 'Stale >30d' },
        { id: 'won',                label: 'Won' },
        { id: 'lost',               label: 'Lost' },
        { id: 'deleted',            label: 'Deleted' }
      ];
      setRoot(
        '<div class="v273-page">' +
          '<header class="page-header">' +
            '<span class="eyebrow">QUOTES</span>' +
            '<h1>All quotes</h1>' +
            '<p>Search and filter your saved deals.</p>' +
          '</header>' +
          /* Search bar */
          '<div class="search-bar">' +
            '<span class="search-icon">' +
              '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
            '</span>' +
            '<input id="hist-search" class="search-input" type="search" placeholder="Search by project, customer, or ref..." autocomplete="off">' +
            '<button class="search-clear" type="button" data-action="hist-clear-search" hidden>' +
              '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
            '</button>' +
          '</div>' +
          /* Filter chips */
          '<div class="hist-chip-row" id="hist-chips" role="tablist">' +
            chips.map(function (c) {
              const isActive = historyState.filter === c.id;
              return '<button class="hist-chip' + (isActive ? ' hist-chip-active' : '') + '" type="button" data-action="hist-filter" data-value="' + c.id + '" role="tab" aria-selected="' + (isActive ? 'true' : 'false') + '">' +
                esc(c.label) +
              '</button>';
            }).join('') +
          '</div>' +
          /* v27.3.0 — Sort row */
          '<div class="hist-sort-row">' +
            '<label class="hist-sort-label" for="hist-sort">Sort by</label>' +
            '<select class="hist-sort-select" id="hist-sort">' +
              '<option value="updated_desc">Recently updated</option>' +
              '<option value="created_desc">Recently created</option>' +
              '<option value="project_asc">Project (A\u2192Z)</option>' +
              '<option value="customer_asc">Customer (A\u2192Z)</option>' +
              '<option value="value_desc">Highest value</option>' +
            '</select>' +
          '</div>' +
          /* Result count meta */
          '<div class="hist-meta" id="hist-meta">&nbsp;</div>' +
          /* v27.3.0 — Summary panel (open / won / lost counts of filtered set) */
          '<div id="hist-summary" class="hist-summary" hidden></div>' +
          /* Results */
          '<div id="hist-list">' + _skelDealRows(6) + '</div>' +
        '</div>'
      );
      // Wire search input with debounce
      const searchInput = $('hist-search');
      const clearBtn = document.querySelector('[data-action="hist-clear-search"]');
      if (searchInput) {
        searchInput.addEventListener('input', function (ev) {
          const val = ev.target.value || '';
          if (clearBtn) clearBtn.hidden = !val;
          if (_historySearchTimer) clearTimeout(_historySearchTimer);
          _historySearchTimer = setTimeout(function () {
            historyState.search = val.trim().toLowerCase();
            loadHistoryList();
          }, 250);
        });
      }
      // v27.3.0 — Wire sort dropdown
      const sortSelect = $('hist-sort');
      if (sortSelect) {
        sortSelect.value = historyState.sort;
        sortSelect.addEventListener('change', function (ev) {
          historyState.sort = ev.target.value || 'updated_desc';
          loadHistoryList();
        });
      }
      loadHistoryList();
    }

    async function loadHistoryList() {
      try {
        const includeDeleted = (historyState.filter === 'deleted');
        const r = await STORE.listDeals({
          limit: historyState.limit,
          offset: historyState.offset,
          includeDeleted: includeDeleted
        });
        historyState.total = (r && r.total) || 0;
        const allRows = (r && r.rows) || [];
        const curM = _currentYYYYMM();
        // v27.3.0 — apply stage filter + new dashboard filters
        let filtered = allRows.filter(d => {
          if (historyState.filter === 'deleted') return !!d.deleted_at;
          if (d.deleted_at) return false;
          if (historyState.filter === 'all')  return true;
          if (historyState.filter === 'open') return _isOpenStage(d.stage);
          if (historyState.filter === 'won')  return d.stage === 'Closed Won';
          if (historyState.filter === 'lost') return d.stage === 'Closed Lost';
          if (historyState.filter === 'closing-this-month') {
            return _isOpenStage(d.stage) && String(d.close_month || '').slice(0, 7) === curM;
          }
          if (historyState.filter === 'stuck') {
            return _isOpenStage(d.stage) && _daysSince(d.updated_at || d.created_at) > 14;
          }
          if (historyState.filter === 'stale') {
            return _isOpenStage(d.stage) && _daysSince(d.updated_at || d.created_at) > 30;
          }
          return true;
        });
        // v27.3.0 — exact-stage filter (from clickable funnel rows)
        if (historyState.stage) {
          filtered = filtered.filter(function (d) {
            return String(d.stage || '').toLowerCase() === String(historyState.stage).toLowerCase();
          });
        }
        // v27.3.0 — region filter (from clickable region tiles).
        // Match d.region first, fall back to state→region map.
        if (historyState.region) {
          const stateRegion = {
            'Maharashtra':'West','Gujarat':'West','Rajasthan':'West','Goa':'West','Madhya Pradesh':'West',
            'Delhi':'North','Punjab':'North','Haryana':'North','Uttar Pradesh':'North','Uttarakhand':'North','Himachal Pradesh':'North','Jammu and Kashmir':'North','Chandigarh':'North',
            'Karnataka':'South','Tamil Nadu':'South','Kerala':'South','Andhra Pradesh':'South','Telangana':'South','Puducherry':'South',
            'West Bengal':'East','Bihar':'East','Jharkhand':'East','Odisha':'East','Assam':'East','Sikkim':'East','Manipur':'East','Meghalaya':'East','Mizoram':'East','Nagaland':'East','Tripura':'East','Arunachal Pradesh':'East'
          };
          const targetRegion = String(historyState.region).toLowerCase();
          filtered = filtered.filter(function (d) {
            const z = (d.region || stateRegion[d.state] || '').toLowerCase();
            return z === targetRegion;
          });
        }
        // v27.3.0 — text search across ref + project + customer
        if (historyState.search) {
          const q = historyState.search;
          filtered = filtered.filter(function (d) {
            return ((d.display_ref || d.ref_id || '').toLowerCase().indexOf(q) >= 0)
                || ((d.project || '').toLowerCase().indexOf(q) >= 0)
                || ((d.customer_name || '').toLowerCase().indexOf(q) >= 0)
                || ((d.partner_name || '').toLowerCase().indexOf(q) >= 0);
          });
        }
        // Result count
        const meta = $('hist-meta');
        if (meta) {
          if (historyState.search) {
            meta.textContent = filtered.length + ' result' + (filtered.length === 1 ? '' : 's') + ' for "' + historyState.search + '"';
          } else if (historyState.stage) {
            meta.textContent = filtered.length + ' deal' + (filtered.length === 1 ? '' : 's') + ' in ' + historyState.stage;
          } else if (historyState.region) {
            meta.textContent = filtered.length + ' deal' + (filtered.length === 1 ? '' : 's') + ' in ' + historyState.region + ' region';
          } else {
            meta.textContent = filtered.length + ' of ' + allRows.length + (allRows.length === 1 ? ' deal' : ' deals');
          }
        }
        // v27.3.0 — Summary panel: open/won/lost counts + (when pricing exists) total value
        renderHistorySummary(filtered);
        const host = $('hist-list');
        if (!host) return;
        if (filtered.length === 0) {
          // Friendly empty states per filter
          const emptyByFilter = {
            'deleted': { icon:'🗑️', msg:'No deleted deals.' },
            'closing-this-month': { icon:'📅', msg:'Nothing closing this month.' },
            'stuck': { icon:'✓', msg:'No deals are stuck. Nice.' },
            'stale': { icon:'✓', msg:'No deals have gone stale.' },
            'won': { icon:'🏆', msg:'No wins logged yet.' },
            'lost': { icon:'—', msg:'No losses recorded.' }
          };
          const e = emptyByFilter[historyState.filter] || { icon:'📭', msg:'No deals match this filter.' };
          host.innerHTML =
            '<div class="empty-state" style="padding:32px 16px;text-align:center">' +
              '<div class="empty-state-illustration" style="font-size:32px;margin-bottom:8px">' + e.icon + '</div>' +
              '<p class="empty-state-body">' + (historyState.search ? 'No results for "' + esc(historyState.search) + '".' : e.msg) + '</p>' +
            '</div>';
          return;
        }
        // v27.3.0 — Apply sort just before render
        filtered = _sortHistoryRows(filtered, historyState.sort);
        host.innerHTML = filtered.map(renderHistoryRow).join('');
      } catch (e) {
        _renderLoadError('hist-list', (e && e.message) || String(e), 'hist-retry');
      }
    }

    /* v27.3.0 — History list sort. Stable across re-renders.
       'updated_desc' is the default and matches list_deals_v2 server order. */
    function _sortHistoryRows(rows, sort) {
      if (!Array.isArray(rows) || rows.length === 0) return rows;
      const arr = rows.slice();
      const dateVal = function (d, key) {
        const s = d && d[key];
        if (!s) return 0;
        const t = new Date(s).getTime();
        return isNaN(t) ? 0 : t;
      };
      switch (sort) {
        case 'created_desc':
          return arr.sort(function (a, b) { return dateVal(b, 'created_at') - dateVal(a, 'created_at'); });
        case 'project_asc':
          return arr.sort(function (a, b) {
            return String(a.project || '').toLowerCase().localeCompare(String(b.project || '').toLowerCase());
          });
        case 'customer_asc':
          return arr.sort(function (a, b) {
            return String(a.customer_name || '').toLowerCase().localeCompare(String(b.customer_name || '').toLowerCase());
          });
        case 'value_desc':
          return arr.sort(function (a, b) {
            return (Number(b.deal_value_inr) || 0) - (Number(a.deal_value_inr) || 0);
          });
        case 'updated_desc':
        default:
          return arr.sort(function (a, b) {
            return dateVal(b, 'updated_at') - dateVal(a, 'updated_at');
          });
      }
    }

    /* v27.3.0 — History summary panel.
       Renders 3-4 mini stat tiles above the result rows: Open/Won/Lost
       counts of the currently-filtered set, plus total deal value when
       pricing exists. Hidden entirely when results are empty. */
    function renderHistorySummary(rows) {
      const host = $('hist-summary');
      if (!host) return;
      if (!rows || rows.length === 0) {
        host.hidden = true;
        host.innerHTML = '';
        return;
      }
      // Compute counts
      let open = 0, won = 0, lost = 0, deleted = 0, value = 0;
      rows.forEach(function (d) {
        if (d.deleted_at) { deleted += 1; return; }
        if (d.stage === 'Closed Won')  won  += 1;
        else if (d.stage === 'Closed Lost') lost += 1;
        else if (_isOpenStage(d.stage))     open += 1;
        value += Number(d.deal_value_inr) || 0;
      });
      const tiles = [];
      if (open > 0)   tiles.push({ label: 'Open',    val: String(open),    color: '#3B82F6' });
      if (won > 0)    tiles.push({ label: 'Won',     val: String(won),     color: '#22C55E' });
      if (lost > 0)   tiles.push({ label: 'Lost',    val: String(lost),    color: '#94A3B8' });
      if (deleted > 0)tiles.push({ label: 'Deleted', val: String(deleted), color: '#EF4444' });
      if (value > 0)  tiles.push({ label: 'Pipeline', val: _fmtLakh(value), color: '#E8731C' });
      if (tiles.length <= 1) {
        // Single category — no point showing summary
        host.hidden = true;
        host.innerHTML = '';
        return;
      }
      host.hidden = false;
      host.innerHTML = tiles.map(function (t) {
        return '<div class="hist-summary-tile" style="--tile-color:' + t.color + '">' +
          '<div class="hist-summary-val">' + esc(t.val) + '</div>' +
          '<div class="hist-summary-label">' + esc(t.label) + '</div>' +
        '</div>';
      }).join('');
    }

    function setHistoryFilter(f) {
      historyState.filter = f;
      historyState.stage = null;   // v27.3.0 — chip click clears stage filter
      historyState.region = null;  // v27.3.0 — and region filter
      document.querySelectorAll('#hist-chips .hist-chip').forEach(c => {
        const isActive = c.getAttribute('data-value') === f;
        c.classList.toggle('hist-chip-active', isActive);
        c.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
      loadHistoryList();
    }
