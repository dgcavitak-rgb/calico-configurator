    /* ============================================================
       VIEW: Saved deal (one-page layout — alpha.7.0 skeleton)

       Loading flow:
         showSavedDeal(refId) ──┐
                                ├─ render loading skeleton
                                ├─ STORE.loadDeal(refId)  (async)
                                ├─ on success → render deal (alpha.7.1+)
                                └─ on error   → render error state with Back link

       Race guard:
         User may tap a saved deal then immediately navigate back to Home before
         loadDeal resolves. We track the active refId in _activeSavedDealRefId;
         if it changes between dispatch and resolve, we drop the render.

       Layout (alpha.7.0): minimal — banner saying "BoM + editor land in alpha.7.1"
       Layout (alpha.7.1+): BoM hero · sticky action bar · sticky chip nav ·
                            accordion sections (Project context, Solution type,
                            Inputs & outputs, LED [if hasLed], SX [if hasSx])
       ============================================================ */

    let _activeSavedDealRefId = null;

    function showSavedDeal(refId) {
      showChrome(true);
      updateNavActive('#/history');
      _activeSavedDealRefId = refId;

      // 1. Render loading skeleton immediately so the user sees activity.
      setRoot(renderSavedDealLoading(refId));

      // 2. Kick off the async load. Late resolutions are dropped via the
      //    race guard so they don't paint over a different view.
      STORE.loadDeal(refId).then(function(deal) {
        if (_activeSavedDealRefId !== refId) return;  // user navigated away
        if (!deal) {
          setRoot(renderSavedDealNotFound(refId));
          return;
        }
        // alpha.7.4: deal_save RPC stores wizardData-shape fields inside
        // raw_submission (JSONB), not as top-level columns. Unpack it so
        // the renderer sees a flat shape (solutionType, calico_inputs,
        // hasLed, screens, hasSx, sx_data etc. become top-level).
        // Top-level structured fields win over raw_submission on conflict
        // (project, customer_name, stage etc. are authoritative in the
        // structured columns).
        if (deal.raw_submission && typeof deal.raw_submission === 'object') {
          const raw = deal.raw_submission;
          Object.keys(raw).forEach(function(k) {
            if (deal[k] === undefined || deal[k] === null || deal[k] === '') {
              deal[k] = raw[k];
            }
          });
          // Drop the nested copy — buildSavePayload will rebuild it on save.
          delete deal.raw_submission;
        }

        // v27.1.0 B3 — deal_get returns close_month as 'YYYY-MM-DD' (DATE).
        // <input type="month"> needs 'YYYY-MM' to display. Slice it back so
        // the form shows the user's original month selection. (Matches the
        // '+ -01' appended in buildSavePayload on the send side.)
        if (deal.close_month && /^\d{4}-\d{2}-\d{2}$/.test(deal.close_month)) {
          deal.close_month = deal.close_month.slice(0, 7);
        }

        setRoot(renderSavedDealLoaded(deal));
      }).catch(function(err) {
        if (_activeSavedDealRefId !== refId) return;
        // alpha.7.1: STORE.loadDeal throws on "deal not found" instead of
        // resolving with null. Classify by sniffing the message — the RPC
        // returns "deal_get: deal not found" and PostgREST returns PGRST116
        // for the no-rows case. Route those to the warn banner instead of
        // the red error banner.
        const msg = (err && err.message) ? err.message : String(err || '');
        if (/deal not found|PGRST116|no rows/i.test(msg)) {
          setRoot(renderSavedDealNotFound(refId));
          return;
        }
        setRoot(renderSavedDealError(refId, err));
      });
    }

    function renderSavedDealLoading(refId) {
      return '<div class="v">' +
          '<div class="h1">Saved deal</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="card" style="text-align:center; padding:24px 16px">' +
            '<div class="spinner" aria-hidden="true"></div>' +
            '<div class="small muted" style="margin-top:10px">Loading deal\u2026</div>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealNotFound(refId) {
      return '<div class="v">' +
          '<div class="h1">Deal not found</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="banner warn">' +
            '<strong>No deal matches this reference.</strong> ' +
            'It may have been deleted, or the link may be malformed. ' +
            'Check the History view for current deals.' +
          '</div>' +
          '<div style="margin-top:16px">' +
            '<button class="btn" type="button" data-nav="#/history">Back to History</button>' +
            ' <button class="btn btn-ghost" type="button" data-nav="#/home">Home</button>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealError(refId, err) {
      const msg = (err && err.message) ? err.message : String(err || 'Unknown error');
      return '<div class="v">' +
          '<div class="h1">Couldn\u2019t load deal</div>' +
          '<div class="small mono soft" style="margin:-6px 0 16px">' + esc(refId) + '</div>' +
          '<div class="banner err">' +
            '<strong>Load failed:</strong> ' + esc(msg) +
          '</div>' +
          '<div style="margin-top:16px">' +
            '<button class="btn" type="button" data-action="saved-retry" data-ref="' + esc(refId) + '">Try again</button>' +
            ' <button class="btn btn-ghost" type="button" data-nav="#/history">Back to History</button>' +
          '</div>' +
        '</div>';
    }

    function renderSavedDealLoaded(deal) {
      // alpha.7.1 — real one-page layout per SPEC §4.2.
      // alpha.7.2 — Project Context editable + autosave; structural sections
      //             stay read-only (edit + rebuild lands in alpha.7.3).
      // BoM hero (top) · Rebuild banner (hidden) · sticky action bar ·
      // sticky chip nav · accordion sections (Project context auto-expanded).

      // ---- Autosave state init ----
      // Mutate-in-place is safe: the deal object is local to this view.
      // disposeSavedDeal() (called by other show* functions) nulls these out.
      _savedDealData    = deal;
      _savedDealRefId   = (deal && (deal.display_ref || deal.ref || deal.id)) || null;
      _autosaveInFlight = false;
      _savedDealLastSavedStage = (deal && deal.stage) || null;  // v27.3.0 confetti baseline
      if (_autosaveTimer) { clearTimeout(_autosaveTimer); _autosaveTimer = null; }

      const refId    = _savedDealRefId || '\u2014';
      const project  = (deal && deal.project)       || '\u2014';
      const customer = (deal && deal.customer_name) || '\u2014';
      const stage    = (deal && deal.stage)         || '\u2014';

      // v27.1.2 #8 — expanded header fields. OQ 8B: missing fields skip
      // the line silently (no "Closing —" placeholders).
      const leadSource    = (deal && deal.lead_source) || '';
      const closeMonth    = (deal && deal.close_month) || '';     // 'YYYY-MM'
      const salesId       = (deal && deal.sales_person_id) || '';
      const presalesId    = (deal && deal.presales_person_id) || '';
      const city          = (deal && deal.city)  || '';
      const stateV        = (deal && deal.state) || '';
      const venueType     = (deal && deal.venue_type) || '';
      const createdAt     = (deal && deal.created_at) || '';
      const updatedAt     = (deal && deal.updated_at) || '';

      // Helpers — kept local to keep the function self-contained.
      function fmtShortDate(iso) {
        if (!iso) return '';
        try {
          const d = new Date(iso);
          if (isNaN(d.getTime())) return '';
          return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
        } catch (e) { return ''; }
      }
      function fmtCloseMonth(ym) {
        if (!ym) return '';
        // Accept either 'YYYY-MM' or 'YYYY-MM-DD'
        const m = /^(\d{4})-(\d{2})/.exec(ym);
        if (!m) return ym;
        const year = m[1], mn = parseInt(m[2], 10);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return (months[mn - 1] || mn) + ' ' + year;
      }
      const salesName    = salesId    ? labelFor(salesId,    SALES_TEAM)    : '';
      const presalesName = presalesId ? labelFor(presalesId, PRESALES_TEAM) : '';
      const createdStr   = fmtShortDate(createdAt);
      const updatedStr   = fmtShortDate(updatedAt);
      const closeStr     = fmtCloseMonth(closeMonth);

      // Lead-source pill HTML (OQ 8A — Cavitak=green, tvONE=blue).
      const sourceClass = leadSource === 'tvONE' ? 'is-tvone'
                        : leadSource === 'Cavitak' ? 'is-cavitak'
                        : '';
      const sourcePillHtml = (leadSource && sourceClass)
        ? '<span class="sd-pill-source ' + sourceClass + '">' + esc(leadSource) + '</span>'
        : '';

      // Customer · stage · closing — line 3. closeStr appended only if present.
      // v27.3.0 — stage badge is now clickable → opens stage history sheet
      const stageCls = _stageChipClassName(stage);
      const stageHtml = stage
        ? '<button type="button" class="' + stageCls + ' sd-stage-link" data-action="sd-history" style="font-size:10.5px;padding:2px 8px;cursor:pointer" title="View stage history">' +
            esc(stage) +
            '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px;vertical-align:-1px;opacity:0.65"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
          '</button>'
        : esc(stage);
      const line3Parts = [esc(customer), stageHtml];
      if (closeStr) line3Parts.push('Closing ' + esc(closeStr));
      const line3Html = '<div class="sd-meta-line">' + line3Parts.join(' \u00b7 ') + '</div>';

      // Sales / Presales — line 4. Skipped entirely if both absent.
      const peopleParts = [];
      if (salesName)    peopleParts.push('<span class="label">Sales:</span> ' + esc(salesName));
      if (presalesName) peopleParts.push('<span class="label">Presales:</span> ' + esc(presalesName));
      const line4Html = peopleParts.length
        ? '<div class="sd-meta-line">' + peopleParts.join(' \u00b7 ') + '</div>'
        : '';

      // City, state · venue_type — line 5. Skipped if all three absent.
      const locParts = [];
      if (city || stateV) locParts.push(esc([city, stateV].filter(Boolean).join(', ')));
      if (venueType)      locParts.push(esc(venueType));
      const line5Html = locParts.length
        ? '<div class="sd-meta-line">' + locParts.join(' \u00b7 ') + '</div>'
        : '';

      // Created · Updated — line 6. Skipped if both absent.
      const dateParts = [];
      if (createdStr) dateParts.push('Created ' + esc(createdStr));
      if (updatedStr) dateParts.push('Updated ' + esc(updatedStr));
      const line6Html = dateParts.length
        ? '<div class="sd-meta-line">' + dateParts.join(' \u00b7 ') + '</div>'
        : '';

      // ---- Compute BoM from deal data ----
      let reco = null;
      let recoErr = null;
      try {
        reco = (typeof APP !== 'undefined' && APP.recoForDeal)
          ? APP.recoForDeal(deal)
          : null;
      } catch (e) {
        recoErr = (e && e.message) ? e.message : String(e);
      }
      const bomHtml = reco
        ? renderBomCard(reco, deal.solutionType || '')
        : '<div class="bom-card empty-bom">' +
            '<div class="bom-chassis-sku">BOM UNAVAILABLE</div>' +
            '<div class="bom-chassis-label">Couldn\u2019t compute</div>' +
            '<div class="bom-meta">' + esc(recoErr || 'No solution type set.') + '</div>' +
          '</div>';

      // ---- Section visibility ----
      const hasLed = !!(deal && deal.hasLed);
      const hasSx  = !!(deal && deal.hasSx);

      // ---- Field-count badges ----
      const ctxFields = SOFT_FIELDS; // exactly the editable fields below
      const ctxCount = ctxFields.filter(f => deal && deal[f] != null && deal[f] !== '').length;

      const ioCount = (function() {
        if (!deal) return 0;
        if (deal.solutionType === 'calico') {
          return countNonZero(deal.calico_inputs) + countNonZero(deal.calico_outputs) +
                 (deal.calico_audio ? 1 : 0);
        }
        if (deal.solutionType === 'mv') {
          return (Array.isArray(deal.mv_inputs) ? deal.mv_inputs.filter(r => r && Number(r.qty) > 0).length : 0) +
                 (deal.mv_outputSignal ? 1 : 0);
        }
        if (deal.solutionType === 'corio') {
          return countNonZero(deal.corio_inputs) + countNonZero(deal.corio_outputs) +
                 (deal.corio_audio ? 1 : 0) + (deal.corio_fanFilter ? 1 : 0);
        }
        return 0;
      })();

      // v27.3.0 — Count of LED screen SLOTS (not filled fields). When LED is
      // on but W/H/pitch are blank, we still want the section to show "1
      // screen" so the user knows there's a screen to fill in — not "0
      // fields" which reads as broken.
      const ledCount = (hasLed && Array.isArray(deal.screens))
        ? deal.screens.length
        : 0;
      // v27.3.0 — SX count = sum of detail lines across all 4 families.
      // Falls back to legacy sx_data sums when detail arrays absent (old deals).
      const sxCount = (function () {
        if (!hasSx) return 0;
        const hdbtN = Array.isArray(deal.sx_hdbt_lines) ? deal.sx_hdbt_lines.filter(l => Number(l.qty) > 0).length : 0;
        const da = deal.sx_da_counts || {};
        const daN  = ((da['612']|0) > 0 ? 1 : 0) + ((da['614']|0) > 0 ? 1 : 0) + ((da['618']|0) > 0 ? 1 : 0);
        const apN  = (Number(deal.sx_ap_qty) > 0) ? 1 : 0;
        const aocN = Array.isArray(deal.sx_aoc_lines) ? deal.sx_aoc_lines.filter(l => Number(l.qty) > 0).length : 0;
        const newTotal = hdbtN + daN + apN + aocN;
        if (newTotal > 0) return newTotal;
        // Legacy fallback
        return deal.sx_data ? Object.values(deal.sx_data).filter(v => Number(v) > 0).length : 0;
      })();

      // v27.3.0 — section icons. Lucide-style strokes, 18×18, currentColor.
      const SD_ICON = {
        ctx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        sol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M7 7V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/></svg>',
        io:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><polyline points="15 17 20 12 15 7"/></svg>',
        led: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
        sx:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="8" height="6" rx="1"/><rect x="14" y="9" width="8" height="6" rx="1"/><line x1="10" y1="12" x2="14" y2="12" stroke-dasharray="2 2"/></svg>'
      };

      // ---- Chip nav (sticky) ----
      const chips = [
        { id:'sec-ctx', label:'Context',  icon: SD_ICON.ctx },
        { id:'sec-sol', label:'Solution', icon: SD_ICON.sol },
        { id:'sec-io',  label:'I/O',      icon: SD_ICON.io }
      ];
      if (hasLed) chips.push({ id:'sec-led', label:'LED', icon: SD_ICON.led });
      if (hasSx)  chips.push({ id:'sec-sx',  label:'SX',  icon: SD_ICON.sx });
      const chipNavHtml = '<nav class="sd-chipnav" aria-label="Section nav">' +
        chips.map(c =>
          '<button class="sd-chip" type="button" data-action="sd-jump" data-target="' + esc(c.id) + '">' +
            '<span class="sd-chip-icon">' + c.icon + '</span>' +
            esc(c.label) +
          '</button>'
        ).join('') +
      '</nav>';

      // ---- Helpers (read-only row for structural sections) ----
      function row(label, value) {
        const v = (value == null || value === '') ? '\u2014' : String(value);
        return '<div class="sd-row">' +
            '<div class="sd-row-k">' + esc(label) + '</div>' +
            '<div class="sd-row-v">' + esc(v) + '</div>' +
          '</div>';
      }
      function sectionHeader(title, count, unit, iconSvg) {
        const unitWord = unit || 'field';
        const icon = iconSvg
          ? '<span class="sd-section-icon">' + iconSvg + '</span>'
          : '';
        return '<summary class="sd-summary">' +
            icon +
            '<span class="sd-summary-title">' + esc(title) + '</span>' +
            '<span class="sd-summary-meta">' +
              '<span class="sd-badge">' + count + ' ' + unitWord + (count === 1 ? '' : 's') + '</span>' +
              '<span class="sd-chevron" aria-hidden="true">\u203a</span>' +
            '</span>' +
          '</summary>';
      }

      // ---- Section: Project context (EDITABLE — alpha.7.2 autosave) ----
      // v27.1.1 — datalist for city dropdown (same cities-list as wizard Step-1)
      const ctxCitiesDatalist = '<datalist id="cities-list-sd">' +
        CITIES.map(function(c) {
          return '<option value="' + esc(c.city) + '"></option>';
        }).join('') +
      '</datalist>';
      const ctxBody =
        '<form id="sd-ctx-form" autocomplete="off" novalidate>' +
          ctxCitiesDatalist +
          '<h3 class="h3" style="margin-top:8px">Project</h3>' +
          sdField('project',         'Project name', deal.project,         { placeholder: 'e.g. Auditorium upgrade' }) +
          sdField('customer_name',   'End User',     deal.customer_name) +
          sdField('partner_name',    'Partner',      deal.partner_name) +
          sdField('consultant_name', 'Consultant',   deal.consultant_name) +
          '<h3 class="h3">Location</h3>' +
          sdSelectField('venue_type', 'Venue type', deal.venue_type, VENUE_TYPES, { placeholder: '\u2014 select \u2014' }) +
          sdField('city',  'City',  deal.city,  { list: 'cities-list-sd', placeholder: 'Start typing\u2026' }) +
          sdField('state', 'State', deal.state, { placeholder: 'Auto-fills from city; type if City = Other' }) +
          '<h3 class="h3">Stage &amp; owners</h3>' +
          sdSelectField('stage',              'Stage',           deal.stage,              STAGES) +
          sdSelectField('lead_source',        'Lead Origin',     deal.lead_source,        LEAD_SOURCES,  { placeholder: '\u2014 select \u2014' }) +
          sdSelectField('sales_person_id',    'Sales person',    deal.sales_person_id,    SALES_TEAM,    { placeholder: '\u2014 select \u2014' }) +
          sdSelectField('presales_person_id', 'Presales person', deal.presales_person_id, PRESALES_TEAM, { placeholder: '\u2014 select \u2014' }) +
          '<h3 class="h3">Partner contact</h3>' +
          sdField('contact_name',  'Contact name',  deal.contact_name,  { placeholder: 'Site / partner contact person' }) +
          sdField('contact_phone', 'Contact phone', deal.contact_phone, { inputmode: 'numeric', maxlength: 10, help: '10-digit mobile (no country code, no spaces)' }) +
          sdField('contact_email', 'Contact email', deal.contact_email, { type: 'email', placeholder: 'name@company.com' }) +
          '<h3 class="h3">Closure</h3>' +
          sdField('close_month', 'Expected closure', deal.close_month, { type: 'month', help: 'Year-month, e.g. 2026-09' }) +
          '<h3 class="h3">Notes</h3>' +
          sdTextarea('internal_notes', 'Internal notes', deal.internal_notes, { rows: 3, placeholder: 'Visible only to Cavitak team \u2014 not exported to Excel/PDF' }) +
          sdTextarea('external_notes', 'External notes', deal.external_notes, { rows: 3, placeholder: 'Shown in Excel/PDF exports to customer/partner' }) +
        '</form>';

      // ---- Read-only sections (structural — see below for I/O which IS editable in CALICO mode) ----
      const solBody = row('Family', familyLabel(deal.solutionType)) +
        '<div class="sd-edit-note small soft">Changing solution family is intentionally read-only \u2014 start a new quote if you need a different family.</div>';

      const ioBody = renderSavedDealIoSection(deal) +
        (deal.solutionType === 'calico'
          ? '<div class="sd-edit-note small soft">Edits set the Rebuild banner above. Tap <strong>Rebuild</strong> to recompute the BoM.</div>'
          : ''); // MV/CORIO already include their own cosmetic-session hint

      const ledBody = hasLed
        ? (function() {
            // Defensive: ensure screens exists.
            if (!Array.isArray(deal.screens)) deal.screens = [];
            const cards = deal.screens.length === 0
              ? '<div class="muted small" style="padding:12px 0">No screens yet. Tap \u201c+ Add screen\u201d.</div>'
              : deal.screens.map((s, idx) => {
                  const px = (Number(s.w) || 0) * (Number(s.h) || 0);
                  return '<div class="card" style="margin-bottom:8px">' +
                    '<div class="row between" style="margin:0 0 6px">' +
                      '<strong>Screen ' + (idx + 1) + '</strong>' +
                      '<button class="btn btn-text" type="button" data-action="sd-screen-remove" data-idx="' + idx + '">Remove</button>' +
                    '</div>' +
                    '<div class="row gap-2">' +
                      '<div class="field" style="flex:1;margin:0">' +
                        '<label>Width (px)</label>' +
                        '<input type="text" inputmode="numeric" value="' + esc(s.w == null ? '' : s.w) + '"' +
                          ' data-action="sd-screen-w" data-idx="' + idx + '">' +
                      '</div>' +
                      '<div class="field" style="flex:1;margin:0">' +
                        '<label>Height (px)</label>' +
                        '<input type="text" inputmode="numeric" value="' + esc(s.h == null ? '' : s.h) + '"' +
                          ' data-action="sd-screen-h" data-idx="' + idx + '">' +
                      '</div>' +
                    '</div>' +
                    (px > 0 ? '<div class="help mono" style="margin-top:6px">= ' +
                      px.toLocaleString('en-US') + ' pixels</div>' : '') +
                  '</div>';
                }).join('');
            return cards +
              '<button class="btn btn-ghost btn-block" type="button" data-action="sd-screen-add">+ Add screen</button>' +
              '<div class="sd-edit-note small soft">Edits set the Rebuild banner above. Tap <strong>Rebuild</strong> to recompute the BoM.</div>';
          })()
        : '';

      const sxBody = hasSx
        ? (function() {
            // v27.3.0 — Show the new per-variant detail. Read-only summary
            // because editing per-variant pickers inline in the saved-deal
            // accordion would explode the layout. To edit details, user taps
            // "Edit" in the action bar which re-enters the wizard.
            const lines = [];
            // HDBaseT lines
            const hdbtLines = Array.isArray(deal.sx_hdbt_lines) ? deal.sx_hdbt_lines : [];
            hdbtLines.forEach(function (l) {
              if (Number(l.qty) <= 0) return;
              const dirLbl = l.direction === 'tx' ? 'TX only' : l.direction === 'rx' ? 'RX only' : 'Kit (TX+RX)';
              lines.push({
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="9" width="8" height="6" rx="1"/><rect x="14" y="9" width="8" height="6" rx="1"/><line x1="10" y1="12" x2="14" y2="12" stroke-dasharray="2 2"/></svg>',
                title: 'HDBaseT ' + dirLbl,
                sub: l.signal + ' \u00b7 ' + (l.resolution || '1080p'),
                qty: l.qty
              });
            });
            // Splitter counts
            const da = deal.sx_da_counts || {};
            [['612','1×2'], ['614','1×4'], ['618','1×8']].forEach(function (p) {
              const q = Number(da[p[0]]) || 0;
              if (q <= 0) return;
              lines.push({
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="10" width="6" height="4" rx="1"/><path d="M8 12h4M12 12v-4h4M12 12v4h4M16 6h6M16 12h6M16 18h6"/></svg>',
                title: 'HDMI Splitter ' + p[1],
                sub: 'MG-DA-' + p[0] + ' \u00b7 4K60 HDMI 2.0',
                qty: q
              });
            });
            // AP-536
            if (Number(deal.sx_ap_qty) > 0) {
              lines.push({
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
                title: 'AP-536 Audio Extractor',
                sub: 'HDMI audio de-embedder',
                qty: deal.sx_ap_qty
              });
            }
            // AOC lines
            const aocLines = Array.isArray(deal.sx_aoc_lines) ? deal.sx_aoc_lines : [];
            aocLines.forEach(function (l) {
              if (Number(l.qty) <= 0) return;
              lines.push({
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 6c0-2 3-3 8-3s8 1 8 3v12c0 2-3 3-8 3s-8-1-8-3z"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/></svg>',
                title: 'AOC ' + (l.signal || 'HDMI'),
                sub: (l.jacket || 'Standard') + ' \u00b7 ' + (l.length || 10) + ' m',
                qty: l.qty
              });
            });
            // Legacy fallback — old deals with just sx_data sums
            if (lines.length === 0) {
              const sx = deal.sx_data || {};
              if (Number(sx.hdmi)  > 0) lines.push({ icon:'', title:'HDBaseT Extender (legacy)', sub:'\u2014', qty: sx.hdmi });
              if (Number(sx.sdi)   > 0) lines.push({ icon:'', title:'HDMI Splitter (legacy)',    sub:'\u2014', qty: sx.sdi });
              if (Number(sx.ap536) > 0) lines.push({ icon:'', title:'AP-536 (legacy)',           sub:'\u2014', qty: sx.ap536 });
              if (Number(sx.avip)  > 0) lines.push({ icon:'', title:'AOC Cables (legacy)',      sub:'\u2014', qty: sx.avip });
            }
            if (lines.length === 0) {
              return '<div class="muted small" style="padding:12px 0">No SX lines configured. Tap <strong>Edit</strong> to add.</div>';
            }
            return '<div class="sd-sx-list">' +
              lines.map(function (l) {
                return '<div class="sd-sx-row">' +
                  '<span class="sd-sx-icon">' + l.icon + '</span>' +
                  '<div class="sd-sx-text">' +
                    '<div class="sd-sx-title">' + esc(l.title) + '</div>' +
                    '<div class="sd-sx-sub">' + esc(l.sub) + '</div>' +
                  '</div>' +
                  '<div class="sd-sx-qty">\u00d7' + l.qty + '</div>' +
                '</div>';
              }).join('') +
            '</div>' +
            '<div class="sd-edit-note small soft">Tap <strong>Edit</strong> in the action bar to change SX configuration.</div>';
          })()
        : '';

      // ---- Assemble ----
      return '<div class="v sd-view">' +

          // Header band
          // v27.1.2 #8 — expanded header (refId + source pill · project · customer/stage/close · sales/presales · city,state/venue · created/updated).
          // Missing fields skip their line silently (OQ 8B). Lead-source pill on
          // ref row with Cavitak=green, tvONE=blue (OQ 8A).
          '<div class="sd-header">' +
            '<div class="sd-ref-row">' +
              '<div class="sd-ref">' + esc(refId) + '</div>' +
              sourcePillHtml +
              '<div class="sd-status sd-status-idle" id="sd-status"></div>' +
            '</div>' +
            '<div class="h1 sd-title">' + esc(project) + '</div>' +
            line3Html +
            line4Html +
            line5Html +
            line6Html +
          '</div>' +

          // BoM hero
          '<section class="sd-bom-wrap">' + bomHtml + '</section>' +

          // Rebuild banner — shown when _structuralDirty is true (alpha.7.3)
          '<div id="sd-rebuild-banner" class="banner warn"' +
            (_structuralDirty ? '' : ' hidden') +
            ' style="margin-top:10px">' +
            '<strong>BoM is out of date.</strong> ' +
            '<button class="btn btn-text" type="button" data-action="sd-rebuild">Tap Rebuild \u2192</button>' +
          '</div>' +

          // v27.3.0 glass action bar (6 buttons): Back/Edit, Confirmed, Excel, PDF, WhatsApp, Email
          '<div class="bom-action-bar">' +
            '<div class="bom-action-bar-inner">' +
              '<button class="action-btn-v3" type="button" data-action="sd-edit" id="sd-btn-edit">' +
                '<svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' +
                '<span class="label">Edit</span>' +
              '</button>' +
              '<button class="action-btn-v3 act-confirm" type="button" data-action="sd-confirm" id="sd-btn-confirm">' +
                '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
                '<span class="label">Confirm</span>' +
              '</button>' +
              '<button class="action-btn-v3 act-excel" type="button" data-action="sd-excel" id="sd-btn-excel">' +
                '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13l3 3 5-5"/></svg>' +
                '<span class="label">Excel</span>' +
              '</button>' +
              '<button class="action-btn-v3 act-pdf" type="button" data-action="sd-pdf" id="sd-btn-pdf">' +
                '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><polyline points="9 15 12 18 15 15"/></svg>' +
                '<span class="label">PDF</span>' +
              '</button>' +
              '<button class="action-btn-v3 act-wa" type="button" data-action="sd-whatsapp" id="sd-btn-wa">' +
                '<svg class="icon" viewBox="0 0 24 24"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9z"/><path d="M9 10a5 5 0 0 0 5 5"/></svg>' +
                '<span class="label">WhatsApp</span>' +
              '</button>' +
              '<button class="action-btn-v3 act-email" type="button" data-action="sd-email" id="sd-btn-email">' +
                '<svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 7 12 13 2 7"/></svg>' +
                '<span class="label">Email</span>' +
              '</button>' +
              '<button class="action-btn-v3" type="button" data-action="sd-delete" id="sd-btn-delete" style="margin-left:auto">' +
                '<svg class="icon" viewBox="0 0 24 24" style="color:#DC2626"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>' +
              '</button>' +
            '</div>' +
          '</div>' +

          // Sticky chip nav
          chipNavHtml +

          // Accordion sections
          '<div class="sd-accordion">' +

            '<details class="sd-section" id="sec-ctx" open>' +
              sectionHeader('Project context', ctxCount, 'field', SD_ICON.ctx) +
              '<div class="sd-section-body">' + ctxBody + '</div>' +
            '</details>' +

            '<details class="sd-section" id="sec-sol">' +
              sectionHeader('Solution type', deal.solutionType ? 1 : 0, 'field', SD_ICON.sol) +
              '<div class="sd-section-body">' + solBody + '</div>' +
            '</details>' +

            '<details class="sd-section" id="sec-io">' +
              sectionHeader('Inputs & outputs', ioCount, 'field', SD_ICON.io) +
              '<div class="sd-section-body">' + ioBody + '</div>' +
            '</details>' +

            (hasLed
              ? '<details class="sd-section" id="sec-led">' +
                  sectionHeader('LED screens', ledCount, 'screen', SD_ICON.led) +
                  '<div class="sd-section-body">' + ledBody + '</div>' +
                '</details>'
              : '') +

            (hasSx
              ? '<details class="sd-section" id="sec-sx">' +
                  sectionHeader('Signal extension', sxCount, 'line', SD_ICON.sx) +
                  '<div class="sd-section-body">' + sxBody + '</div>' +
                '</details>'
              : '') +

          '</div>' +

          // Bottom escape
          '<div style="margin-top:18px; text-align:center">' +
            '<button class="btn btn-ghost" type="button" data-nav="#/history">\u2190 Back to History</button>' +
          '</div>' +
        '</div>';
    }

    // Family label helper used in saved-deal Solution section.
    function familyLabel(t) {
      if (t === 'calico') return 'CALICO \u2014 Video Processor';
      if (t === 'mv')     return 'Multi Viewer (CORIOview)';
      if (t === 'corio')  return 'CORIO \u2014 Video Processor';
      return '\u2014';
    }

    // Count non-zero values in a simple object (used for I/O field counts).
    function countNonZero(obj) {
      if (!obj || typeof obj !== 'object') return 0;
      return Object.values(obj).filter(v => Number(v) > 0).length;
    }

    // Compact I/O preview/edit per family. Mirrors wizard step 3 structure.
    // alpha.7.3: CALICO becomes editable steppers + audio toggle; MV/CORIO
    // stay read-only with hint (cosmetic-session backlog).
    function renderSavedDealIoSection(deal) {
      if (!deal || !deal.solutionType) {
        return '<div class="sd-row sd-row-muted">No solution type set.</div>';
      }
      const row = function(k, v) {
        const val = (v == null || v === '') ? '\u2014' : String(v);
        return '<div class="sd-row">' +
            '<div class="sd-row-k">' + esc(k) + '</div>' +
            '<div class="sd-row-v">' + esc(val) + '</div>' +
          '</div>';
      };
      if (deal.solutionType === 'calico') {
        // Defensive: ensure objects exist so steppers don't NaN.
        if (!deal.calico_inputs)  deal.calico_inputs  = { hdmi4k:0, hdmiFhd:0, sdi12g:0, sdi3g:0, hdbt:0, ip:0 };
        if (!deal.calico_outputs) deal.calico_outputs = { display:0, projector:0, sdi:0 };
        const i = deal.calico_inputs;
        const o = deal.calico_outputs;
        return '<div class="sd-subhead">Inputs</div>' +
          sdStepperRow('hdmi4k',  'HDMI 4K60', '4K60 4:4:4 sources',    i.hdmi4k,  { namespace:'calico_inputs' }) +
          sdStepperRow('hdmiFhd', 'HDMI FHD',  '1080p sources',         i.hdmiFhd, { namespace:'calico_inputs' }) +
          sdStepperRow('sdi12g',  'SDI 12G',   '12G-SDI sources',       i.sdi12g,  { namespace:'calico_inputs' }) +
          sdStepperRow('sdi3g',   'SDI 3G',    '3G-SDI sources',        i.sdi3g,   { namespace:'calico_inputs' }) +
          sdStepperRow('hdbt',    'HDBaseT',   'HDBT-extended sources', i.hdbt,    { namespace:'calico_inputs' }) +
          sdStepperRow('ip',      'IP / NDI',  'IP-streamed sources',   i.ip,      { namespace:'calico_inputs' }) +
          '<div class="sd-subhead">Outputs</div>' +
          sdStepperRow('display',   'Display (HDMI)',   'Standard displays', o.display,   { namespace:'calico_outputs' }) +
          sdStepperRow('projector', 'Projector (HDMI)', 'Projector outputs', o.projector, { namespace:'calico_outputs' }) +
          sdStepperRow('sdi',       'SDI output',       '12G-SDI outputs',   o.sdi,       { namespace:'calico_outputs' }) +
          '<div class="sd-subhead">Audio</div>' +
          sdToggleRow('calico_audio', 'Audio handling',
            'Embed/de-embed audio + AES67/Dante options', !!deal.calico_audio);
      }
      if (deal.solutionType === 'mv') {
        // Defensive: ensure mv_inputs is an array.
        if (!Array.isArray(deal.mv_inputs)) deal.mv_inputs = [];
        const MV_INPUT_SIGNALS  = Object.keys(CATALOG.mv.inputModules);
        const MV_OUTPUT_SIGNALS = Object.keys(CATALOG.mv.outputModules);

        // alpha.9.2: Rule A — max 2 distinct signal types (mirror of renderStep3Mv).
        // Same shape as the wizard: capReached disables "+ Add input" and filters
        // each row's signal dropdown to {distinctSet} ∪ {row.signal}.
        const MV_DISTINCT_CAP = 2;
        const distinctSet = new Set(
          deal.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
        );
        const capReached = distinctSet.size >= MV_DISTINCT_CAP;
        const capBanner = capReached
          ? '<div class="banner info" style="margin-top:8px"><strong>Cap reached:</strong> Multi Viewer supports a maximum of ' + MV_DISTINCT_CAP + ' distinct signal types. Remove a row or change its signal to add a different type.</div>'
          : '';

        const inputRowsHtml = deal.mv_inputs.length === 0
          ? '<div class="muted small" style="padding:8px 0">No input rows yet. Tap \u201c+ Add input\u201d below.</div>'
          : deal.mv_inputs.map((row, idx) =>
              '<div class="card" style="margin-bottom:8px">' +
                '<div class="row gap-2" style="flex-wrap:wrap">' +
                  '<select data-action="sd-mv-input-signal" data-idx="' + idx + '" style="flex:1;min-width:140px">' +
                    '<option value="">\u2014 signal \u2014</option>' +
                    MV_INPUT_SIGNALS
                      .filter(s => !capReached || distinctSet.has(s) || s === row.signal)
                      .map(s =>
                        '<option value="' + esc(s) + '"' +
                        (row.signal === s ? ' selected' : '') + '>' + esc(s) + '</option>'
                      ).join('') +
                  '</select>' +
                  '<div class="stepper">' +
                    '<button type="button" data-action="sd-mv-input-dec" data-idx="' + idx + '"' +
                      ((Number(row.qty) || 0) <= 0 ? ' disabled' : '') + '>\u2212</button>' +
                    '<input type="text" inputmode="numeric" value="' + (row.qty || 0) + '"' +
                      ' data-action="sd-mv-input-set" data-idx="' + idx + '" aria-label="qty">' +
                    '<button type="button" data-action="sd-mv-input-inc" data-idx="' + idx + '">+</button>' +
                  '</div>' +
                  '<button class="btn btn-text" type="button" data-action="sd-mv-input-remove" data-idx="' + idx + '"' +
                    ' aria-label="Remove" style="min-width:auto;padding:8px">\u00d7</button>' +
                '</div>' +
              '</div>'
            ).join('');
        const outputOptions = MV_OUTPUT_SIGNALS.map(s => ({ value: s, label: s }));
        return '<div class="sd-subhead">Inputs</div>' +
          inputRowsHtml +
          '<button class="btn btn-ghost btn-block" type="button" data-action="sd-mv-input-add"' + (capReached ? ' disabled' : '') + '>+ Add input</button>' +
          capBanner +
          '<div class="sd-subhead">Output signal</div>' +
          sdSelectField('mv_outputSignal', 'Output', deal.mv_outputSignal || '', outputOptions,
            { placeholder: '\u2014 select \u2014' }) +
          '<div class="sd-edit-note small soft">Edits set the Rebuild banner above. Tap <strong>Rebuild</strong> to recompute the BoM.</div>';
      }
      if (deal.solutionType === 'corio') {
        // Defensive: ensure objects exist so steppers don't NaN.
        if (!deal.corio_inputs)  deal.corio_inputs  = {};
        if (!deal.corio_outputs) deal.corio_outputs = {};
        const cm2In  = CATALOG.corio.cm2.inputs;
        const cm2Out = CATALOG.corio.cm2.outputs;
        // Use sdSelectField for corio_audio — it lands at top level (not in
        // SOFT_FIELDS), so the routing in the data-sd-bind handler calls
        // markStructuralDirty (no autosave).
        const audioOptions = [
          { value: '',    label: 'None' },
          { value: '2-4', label: '2-4 (analog + SPDIF)' },
          { value: '8-8', label: '8-8 (CM only \u00b7 8-IN / 8-OUT HD-44)' }
        ];
        return '<div class="sd-subhead">Inputs</div>' +
          cm2In.map(c =>
            sdStepperRow(c.key, c.key, c.desc, deal.corio_inputs[c.key] || 0, { namespace:'corio_inputs' })
          ).join('') +
          '<div class="sd-subhead">Outputs</div>' +
          cm2Out.map(c =>
            sdStepperRow(c.key, c.key, c.desc, deal.corio_outputs[c.key] || 0, { namespace:'corio_outputs' })
          ).join('') +
          '<div class="sd-subhead">Audio</div>' +
          sdSelectField('corio_audio', 'Audio module', deal.corio_audio || '', audioOptions) +
          (deal.corio_audio === '8-8'
            ? '<div class="help danger-text">8-8 module is CM-only \u2014 incompatible with CM2 / 4K chassis.</div>'
            : '') +
          '<div class="sd-subhead">Add-ons</div>' +
          sdToggleRow('corio_fanFilter', 'CM2 fan filter', 'Adds CM2-Filter line item', !!deal.corio_fanFilter);
      }
      return '<div class="sd-row sd-row-muted">Unknown solution type.</div>';
    }

    /* ============================================================
       VIEW: Wizard (6 steps)
       ============================================================ */

    function showWizard(stepNum) {
      showChrome(true);
      updateNavActive('#/quote/new');
      // v27.1.2 #2 + #6 — reset/preserve logic by hash shape:
      //   #/quote/new            → silent reset (fresh "New" tap, OQ 2A)
      //   #/quote/new/N          → deep-link into wizard, preserve in-memory state
      //   #/quote/edit/{ref}     → preserve hydrated state from sd-edit handler
      //   #/quote/edit/{ref}/N   → ditto, deep link mid-edit
      // OQ 2A locked: silent reset, no confirm prompt.
      const isFreshNew = (location.hash === '#/quote/new');
      if (isFreshNew) {
        clearDraft();             // wipes localStorage AND sets wizardData = defaultWizard()
      } else if (!wizardData) {
        wizardData = loadDraft();
      }
      wizardData.step = clamp(parseInt(stepNum, 10) || 1, 1, 6);
      wizardData.errors = {};
      // Auto-skip conditional steps if their flag is off
      if (wizardData.step === 4 && !wizardData.hasLed) wizardData.step = wizardData.hasSx ? 5 : 6;
      if (wizardData.step === 5 && !wizardData.hasSx) wizardData.step = 6;
      renderWizard();
    }

    // v27.1.3 F2 — Wrapper that re-renders the wizard while preserving the
    // current scroll position. Used at all in-step state mutation sites
    // (steppers, toggles, MV row add/remove). The bare renderWizard() does
    // setRoot(html) → wholesale innerHTML replace AND setRoot itself calls
    // window.scrollTo(0, 0) on every render (line ~4372). To preserve scroll
    // we must call scrollTo(0, y) SYNCHRONOUSLY after renderWizard returns
    // — same task, same paint frame — so the second scrollTo wins. A
    // requestAnimationFrame restore loses to setRoot's scrollTo on Chrome
    // Android because a paint can occur between the two scrolls.
    // Step-navigation handlers (wiz-jump, wiz-new, hydration mount) keep
    // calling renderWizard() directly — scroll-to-top is correct there.
    function rerenderPreservingScroll() {
      const y = window.scrollY || window.pageYOffset || 0;
      renderWizard();
      window.scrollTo(0, y);
    }

    function renderWizard() {
      const d = wizardData;
      const visibleSteps = computeVisibleSteps(d);
      setRoot(
        '<div class="v273-page">' +
          renderWizStepper(d.step, visibleSteps) +
          '<div id="wiz-step-body">' + renderStepBody(d) + '</div>' +
          renderWizActions(d) +
        '</div>'
      );
    }

    function computeVisibleSteps(d) {
      const v = [1, 2, 3];
      // v27.3.0 — Step 4 only appears for non-CALICO families (defensive — was
      // CALICO-only originally, but kept available for any future LED path).
      // CALICO renders LED W/H/pitch inline in Step 3, so Step 4 is redundant.
      if (d.hasLed && d.solutionType !== 'calico') v.push(4);
      if (d.hasSx)  v.push(5);
      v.push(6);
      return v;
    }

    /* v27.3.0 — Polished wizard progress header. Shows:
       - Eyebrow "STEP N OF M"
       - Current step title (large)
       - Progress bar (amber fill from 0% to step / total)
       - Tappable step pills for navigation (visible steps only) */
    function renderWizStepper(current, visible) {
      const total = visible.length;
      const curIdx = visible.indexOf(current);
      const pct = total > 0 ? Math.round(((curIdx + 1) / total) * 100) : 0;
      // Step title (uses STEP_TITLES)
      const title = STEP_TITLES[current] || '';

      // Pill row — one pill per visible step, current highlighted in amber.
      // Tappable when step has been reached (i.e. <= current).
      const pills = visible.map(function (n) {
        const isCurrent = n === current;
        const isPast    = visible.indexOf(n) < curIdx;
        const isFuture  = visible.indexOf(n) > curIdx;
        const cls = 'wiz-pill' +
          (isCurrent ? ' wiz-pill-current' : '') +
          (isPast ? ' wiz-pill-past' : '') +
          (isFuture ? ' wiz-pill-future' : '');
        const dis = isFuture ? ' aria-disabled="true"' : '';
        const navAction = isFuture ? '' : ' data-action="wiz-jump" data-step="' + n + '"';
        return '<button type="button" class="' + cls + '"' + navAction + dis + '>' +
          (isPast ? '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '<span class="wiz-pill-n">' + n + '</span>') +
          '<span class="wiz-pill-label">' + esc(STEP_PILL_LABELS[n] || STEP_TITLES[n] || '\u2014') + '</span>' +
        '</button>';
      }).join('');

      return '<div class="wiz-progress">' +
          '<div class="wiz-progress-head">' +
            '<div class="wiz-progress-eyebrow">STEP ' + (curIdx + 1) + ' OF ' + total + '</div>' +
            '<div class="wiz-progress-pct">' + pct + '%</div>' +
          '</div>' +
          '<h1 class="wiz-progress-title">' + esc(title) + '</h1>' +
          '<div class="wiz-progress-track">' +
            '<div class="wiz-progress-fill" style="width:' + pct + '%"></div>' +
          '</div>' +
          '<div class="wiz-pills">' + pills + '</div>' +
        '</div>';
    }

    function renderStepBody(d) {
      switch (d.step) {
        case 1: return renderStep1(d);
        case 2: return renderStep2(d);
        case 3: return renderStep3(d);
        case 4: return renderStep4(d);
        case 5: return renderStep5(d);
        case 6: return renderStep6(d);
        default: return '';
      }
    }

    function renderWizActions(d) {
      const isLast = d.step === 6;
      const isFirst = d.step === 1;
      return '' +
        '<div class="wiz-actionbar">' +
          (isFirst
            ? '<button class="btn btn-text" type="button" data-action="wiz-cancel">Cancel</button>'
            : '<button class="btn btn-ghost" type="button" data-action="wiz-back">\u2190 Back</button>') +
          '<div class="grow"></div>' +
          (isLast
            ? (d.reco
                ? '<button class="btn" type="button" data-action="wiz-rebuild">Rebuild &amp; save \u2192</button>'
                : '<button class="btn" type="button" data-action="wiz-build">Build &amp; save quote \u2192</button>')
            : '<button class="btn" type="button" data-action="wiz-next">Next \u2192</button>') +
        '</div>';
    }

    /* ---------- Step 1: Project context ---------- */

    function renderStep1(d) {
      function field(id, label, value, opts) {
        opts = opts || {};
        const type = opts.type || 'text';
        const placeholder = opts.placeholder || '';
        const inputmode = opts.inputmode ? ' inputmode="' + opts.inputmode + '"' : '';
        const maxlength = opts.maxlength ? ' maxlength="' + opts.maxlength + '"' : '';
        const required = opts.required ? ' required' : '';
        const listAttr = opts.list ? ' list="' + opts.list + '"' : '';
        const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + (opts.required ? ' *' : '') + '</label>' +
          '<input id="i-' + id + '" data-bind="' + id + '" type="' + type + '" ' +
            inputmode + maxlength + listAttr + ' value="' + esc(value || '') + '" ' +
            (placeholder ? 'placeholder="' + esc(placeholder) + '" ' : '') +
            required + '>' +
          helpHtml + errHtml +
        '</div>';
      }
      // v27.1.0 — Multiline variant of field(). Same closure (shares d),
      // same i- prefix, same data-bind delegation. textarea.value works
      // identically to input.value so the capture path is unchanged.
      function textareaField(id, label, value, opts) {
        opts = opts || {};
        const placeholder = opts.placeholder || '';
        const rows = opts.rows || 3;
        const helpHtml = opts.help ? '<div class="help">' + esc(opts.help) + '</div>' : '';
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + '</label>' +
          '<textarea id="i-' + id + '" data-bind="' + id + '" rows="' + rows + '"' +
            (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '>' +
            esc(value || '') +
          '</textarea>' +
          helpHtml + errHtml +
        '</div>';
      }
      function selectField(id, label, value, options, opts) {
        opts = opts || {};
        const errCls = d.errors[id] ? ' has-error' : '';
        const errHtml = d.errors[id]
          ? '<div class="err">' + esc(d.errors[id]) + '</div>'
          : '<div class="err" hidden></div>';
        const optsHtml = (opts.placeholder ? '<option value="">' + esc(opts.placeholder) + '</option>' : '') +
          options.map(o => {
            const v = typeof o === 'string' ? o : o.value;
            const l = typeof o === 'string' ? o : o.label;
            return '<option value="' + esc(v) + '"' +
              (value === v ? ' selected' : '') + '>' + esc(l) + '</option>';
          }).join('');
        return '<div class="field' + errCls + '" id="f-' + id + '">' +
          '<label for="i-' + id + '">' + esc(label) + (opts.required ? ' *' : '') + '</label>' +
          '<select id="i-' + id + '" data-bind="' + id + '"' +
            (opts.required ? ' required' : '') + '>' + optsHtml + '</select>' +
          errHtml +
        '</div>';
      }

      // v27.1.1 — Datalist for the City field (B5). Native mobile search,
      // works on Z Fold Chrome / Samsung Internet. Includes 'Other' fallback.
      const citiesDatalist = '<datalist id="cities-list">' +
        CITIES.map(function(c) {
          return '<option value="' + esc(c.city) + '"></option>';
        }).join('') +
      '</datalist>';

      return '' +
        '<form id="step1-form" autocomplete="off" novalidate>' +
          citiesDatalist +
          '<h3 class="h3">Project</h3>' +
          field('project',         'Project name', d.project,         { required: true, placeholder: 'e.g. Auditorium upgrade' }) +
          field('customer_name',   'End User',     d.customer_name,   { required: true }) +
          field('partner_name',    'Partner',      d.partner_name,    { required: true }) +
          field('consultant_name', 'Consultant',   d.consultant_name, { required: true }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Location</h3>' +
          selectField('venue_type', 'Venue type', d.venue_type, VENUE_TYPES, { placeholder: '\u2014 select \u2014', required: true }) +
          field('city',  'City',  d.city,  { required: true, list: 'cities-list', placeholder: 'Start typing\u2026' }) +
          field('state', 'State', d.state, { required: true, placeholder: 'Auto-fills from city; type if City = Other' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Stage &amp; owners</h3>' +
          selectField('stage', 'Stage', d.stage, STAGES, { required: true }) +
          selectField('lead_source', 'Lead Origin', d.lead_source, LEAD_SOURCES, { placeholder: '\u2014 select \u2014', required: true }) +
          selectField('sales_person_id',    'Sales person',    d.sales_person_id,    SALES_TEAM,    { placeholder: '\u2014 select \u2014', required: true }) +
          selectField('presales_person_id', 'Presales person', d.presales_person_id, PRESALES_TEAM, { placeholder: '\u2014 select \u2014', required: true }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Partner contact</h3>' +
          field('contact_name',  'Contact name',  d.contact_name,  { required: true, placeholder: 'Site / partner contact person' }) +
          field('contact_phone', 'Contact phone', d.contact_phone, { required: true, inputmode: 'numeric', maxlength: 10, help: '10-digit mobile (no country code, no spaces)' }) +
          field('contact_email', 'Contact email', d.contact_email, { required: true, type: 'email', placeholder: 'name@company.com' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Closure</h3>' +
          field('close_month', 'Expected closure', d.close_month, { required: true, type: 'month', help: 'Year-month, e.g. 2026-09' }) +
          '<div class="sp-12"></div>' +
          '<h3 class="h3">Notes</h3>' +
          textareaField('internal_notes', 'Internal notes', d.internal_notes, { rows: 3, placeholder: 'Visible only to Cavitak team \u2014 not exported to Excel/PDF' }) +
          textareaField('external_notes', 'External notes', d.external_notes, { rows: 3, placeholder: 'Shown in Excel/PDF exports to customer/partner' }) +
        '</form>';
    }

    /* ---------- Step 2: Solution type ---------- */

    function renderStep2(d) {
      // v27.3.0 §9: collapse to 2 tiles (MULTI VIEWER, VIDEO PROCESSOR).
      // VP tap reveals a sub-step picker (CALICO / CORIO) on the same screen.
      const errHtml = d.errors.solutionType
        ? '<div class="banner err">' + esc(d.errors.solutionType) + '</div>'
        : '';
      const isMV = d.solutionType === 'mv';
      const isVP = d.solutionType === 'calico' || d.solutionType === 'corio';
      const vpExpanded = isVP || d._step2_videoProcessorOpen === true;
      const isCalico = d.solutionType === 'calico';
      const isCorio  = d.solutionType === 'corio';

      return errHtml +
        '<div class="tile-group">' +
          '<button type="button" class="tile" data-checked="' + (isMV ? 'true' : 'false') + '"' +
            ' data-action="solution-pick" data-value="mv">' +
            '<span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></span>' +
            '<div class="tile-text">' +
              '<div class="tile-title">MULTI VIEWER</div>' +
              '<div class="tile-sub">CORIOview \u00b7 Multi-source preview in one display</div>' +
            '</div>' +
          '</button>' +
          '<button type="button" class="tile" data-checked="' + (isVP ? 'true' : 'false') + '"' +
            ' data-action="solution-vp-toggle">' +
            '<span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="10"/><line x1="10" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="14" y2="10"/><line x1="18" y1="10" x2="18" y2="10"/><path d="M2 14h20"/></svg></span>' +
            '<div class="tile-text">' +
              '<div class="tile-title">VIDEO PROCESSOR</div>' +
              '<div class="tile-sub">CALICO / CORIO \u00b7 Video-wall scaling &amp; processing</div>' +
            '</div>' +
          '</button>' +
          (vpExpanded
            ? '<div class="tile-group sub-tile-group">' +
                '<button type="button" class="tile" data-checked="' + (isCalico ? 'true' : 'false') + '"' +
                  ' data-action="solution-pick" data-value="calico">' +
                  '<span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><text x="6" y="16" font-size="8" font-weight="700" fill="currentColor" stroke="none" font-family="Arial">4K</text></svg></span>' +
                  '<div class="tile-text">' +
                    '<div class="tile-title">CALICO</div>' +
                    '<div class="tile-sub">C7-PRO \u00b7 4K up to 32 ports</div>' +
                  '</div>' +
                '</button>' +
                '<button type="button" class="tile" data-checked="' + (isCorio ? 'true' : 'false') + '"' +
                  ' data-action="solution-pick" data-value="corio">' +
                  '<span class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="16" x2="21" y2="16"/></svg></span>' +
                  '<div class="tile-text">' +
                    '<div class="tile-title">CORIO</div>' +
                    '<div class="tile-sub">C3 / CM2 \u00b7 FHD-to-4K modular</div>' +
                  '</div>' +
                '</button>' +
              '</div>'
            : '') +
        '</div>';
    }

    /* ---------- Step 3: Inputs & outputs ---------- */

    function stepperRow(key, name, sub, value, opts) {
      opts = opts || {};
      const min = opts.min != null ? opts.min : 0;
      const max = opts.max != null ? opts.max : 32;
      const ns = opts.namespace || '';
      return '<div class="step-row">' +
        '<div class="step-label">' +
          '<div class="name">' + esc(name) + '</div>' +
          (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" data-action="step-dec" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            (value <= min ? ' disabled' : '') + '>\u2212</button>' +
          '<input type="text" inputmode="numeric" value="' + value + '"' +
            ' data-action="step-set" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            ' aria-label="' + esc(name) + ' count">' +
          '<button type="button" data-action="step-inc" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
            (value >= max ? ' disabled' : '') + '>+</button>' +
        '</div>' +
      '</div>';
    }

    // v27.2.6 — Compact checkbox-row renderer. Replaces the prior .tile
    // card-banner style. Renders a single line: [✓] Name — sub. Tap target
    // remains full-row (label wraps the input), so usability on Z Fold is
    // unchanged. Same data-action="toggle" wiring as before, so the event
    // delegation handler in onSubmit doesn't need to change.
    function toggleRow(key, name, sub, checked, opts) {
      opts = opts || {};
      const ns = opts.namespace || '';
      return '<label class="check-row"' +
        ' data-action="toggle" data-ns="' + esc(ns) + '" data-key="' + esc(key) + '"' +
        ' style="display:flex;align-items:center;gap:12px;' +
                'padding:14px 12px;margin:0;' +
                'border-bottom:1px solid #eee;cursor:pointer;' +
                'min-height:48px;">' +
        '<input type="checkbox"' + (checked ? ' checked' : '') +
          ' style="width:22px;height:22px;margin:0;flex:0 0 auto;' +
                  'accent-color:#1F4E1F;cursor:pointer;">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;font-size:15px;color:#1a1a1a;">' + esc(name) + '</div>' +
          (sub ? '<div style="font-size:13px;color:#666;margin-top:2px;">' + esc(sub) + '</div>' : '') +
        '</div>' +
      '</label>';
    }

    function renderStep3(d) {
      if (!d.solutionType) {
        return '<div class="banner warn">Pick a solution type in Step 2 first.</div>';
      }
      if (d.solutionType === 'calico') return renderStep3Calico(d);
      if (d.solutionType === 'mv')     return renderStep3Mv(d);
      if (d.solutionType === 'corio')  return renderStep3Corio(d);
      return '';
    }

    function renderStep3Calico(d) {
      const inErr = d.errors.calico_io
        ? '<div class="banner err">' + esc(d.errors.calico_io) + '</div>' : '';
      // v27.1.2 #3+#5 — derive LED count from existing screens array length.
      // Stepper drives this via the new 'calico-led' action which resizes
      // d.screens in-place (preserving entries on shrink, pushing {w,h,pitch}
      // on grow) and toggles d.hasLed accordingly. This keeps hasLed and
      // screens as the canonical state (no defaultWizard shape break).
      const ledCount = (d.hasLed && Array.isArray(d.screens)) ? d.screens.length : 0;
      return inErr +
        '<h3 class="h3">Inputs</h3>' +
        '<div class="card">' +

    function renderStep3Mv(d) {
      const MV_INPUT_SIGNALS = Object.keys(CATALOG.mv.inputModules);
      const MV_OUTPUT_SIGNALS = Object.keys(CATALOG.mv.outputModules);

      // alpha.9.2: Rule A — max 2 distinct signal types (mirrors RECOMMEND.mv guard).
      // capReached disables "+ Add input" and filters each row's signal dropdown
      // to {already-chosen distinct signals} ∪ {this row's own signal}, so
      // existing rows can be retargeted but can't expand distinct count past 2.
      const MV_DISTINCT_CAP = 2;
      const distinctSet = new Set(
        d.mv_inputs.filter(r => r && r.signal && Number(r.qty) > 0).map(r => r.signal)
      );
      const capReached = distinctSet.size >= MV_DISTINCT_CAP;
      const capBanner = capReached
        ? '<div class="banner info" style="margin-top:8px"><strong>Cap reached:</strong> Multi Viewer supports a maximum of ' + MV_DISTINCT_CAP + ' distinct signal types. Remove a row or change its signal to add a different type.</div>'
        : '';

      const inErr = d.errors.mv_io
        ? '<div class="banner err">' + esc(d.errors.mv_io) + '</div>' : '';

      const inputRowsHtml = d.mv_inputs.length === 0
        ? '<div class="muted small" style="padding:8px 0">No input rows yet. Tap \u201c+ Add input\u201d below.</div>'
        : d.mv_inputs.map((row, idx) =>
          '<div class="card" style="margin-bottom:8px">' +
            '<div class="row gap-2" style="flex-wrap:wrap">' +
              '<select data-action="mv-input-signal" data-idx="' + idx + '" style="flex:1;min-width:140px">' +
                '<option value="">\u2014 signal \u2014</option>' +
                MV_INPUT_SIGNALS
                  .filter(s => !capReached || distinctSet.has(s) || s === row.signal)
                  .map(s =>
                    '<option value="' + esc(s) + '"' +
                    (row.signal === s ? ' selected' : '') + '>' + esc(s) + '</option>'
                  ).join('') +
              '</select>' +
              '<div class="stepper">' +
                '<button type="button" data-action="mv-input-dec" data-idx="' + idx + '"' +
                  (row.qty <= 0 ? ' disabled' : '') + '>\u2212</button>' +
                '<input type="text" inputmode="numeric" value="' + (row.qty || 0) + '"' +
                  ' data-action="mv-input-set" data-idx="' + idx + '" aria-label="qty">' +
                '<button type="button" data-action="mv-input-inc" data-idx="' + idx + '">+</button>' +
              '</div>' +
              '<button class="btn btn-text" type="button" data-action="mv-input-remove" data-idx="' + idx + '" aria-label="Remove" style="min-width:auto;padding:8px">\u00d7</button>' +
            '</div>' +
          '</div>'
        ).join('');

      return inErr +
        '<h3 class="h3">Inputs</h3>' +
        inputRowsHtml +
        '<button class="btn btn-ghost btn-block" type="button" data-action="mv-input-add"' + (capReached ? ' disabled' : '') + '>+ Add input</button>' +
        capBanner +
        '<h3 class="h3">Output signal</h3>' +
        '<div class="card">' +
          '<div class="field" style="margin:0">' +
            '<label for="mv-out">Output signal *</label>' +
            '<select id="mv-out" data-bind="mv_outputSignal">' +
              '<option value="">\u2014 select \u2014</option>' +
              MV_OUTPUT_SIGNALS.map(s =>
                '<option value="' + esc(s) + '"' +
                (d.mv_outputSignal === s ? ' selected' : '') + '>' + esc(s) + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="sp-12"></div>' +
        toggleRow('hasSx', 'Signal Extension needed', 'Configure in Step 5', d.hasSx, { namespace:'' });
    }

    /* ---------- Step 4: LED screens ---------- */

    function renderStep4(d) {
      const errHtml = d.errors.screens
        ? '<div class="banner err">' + esc(d.errors.screens) + '</div>' : '';
      if (!d.screens || d.screens.length === 0) {
        return errHtml +
          '<div class="banner info">' +

    /* v27.3.0 — Shared LED-screen renderer. Used by Step 3 (CALICO inline)
       and by Step 4 (legacy non-CALICO LED path). Each screen card shows
       W/H/pitch inputs + live badges (pixels, RJ45 ports, HDMI feeds, aspect
       ratio) and physical dimensions. Aggregate band totals at the bottom. */
    function renderLedScreens(d) {
      if (!d.screens || d.screens.length === 0) return '';
      const totals = { pixels: 0, ledPorts: 0, hdmiFeeds: 0 };
      const screensHtml = d.screens.map(function(s, idx) {
        const w = Number(s.w) || 0;
        const h = Number(s.h) || 0;
        const px = w * h;
        const ports = px > 0 ? Math.ceil(px / 650000) : 0;
        const feeds = px > 0 ? Math.ceil(px / (3840 * 2160)) : 0;
        const aspect = _ledAspectRatio(w, h);
        const dims = screenDimensions(s.w, s.h, s.pitch);
        totals.pixels += px;
        totals.ledPorts += ports;
        totals.hdmiFeeds += feeds;
        const hasComplete = (w > 0 && h > 0);
        return '<div class="led-card">' +
          '<div class="led-card-head"><strong>Screen ' + (idx + 1) + '</strong></div>' +
          '<div class="row gap-2">' +
            '<div class="field" style="flex:1;margin:0">' +
              '<label>Width (px)</label>' +
              '<input type="text" inputmode="numeric" value="' + esc(s.w) + '"' +
                ' data-action="screen-w" data-idx="' + idx + '">' +
            '</div>' +
            '<div class="field" style="flex:1;margin:0">' +
              '<label>Height (px)</label>' +
              '<input type="text" inputmode="numeric" value="' + esc(s.h) + '"' +
                ' data-action="screen-h" data-idx="' + idx + '">' +
            '</div>' +
          '</div>' +
          '<div class="field" style="margin:8px 0 0">' +
            '<label>Pixel pitch (mm)</label>' +
            '<input type="text" inputmode="decimal" value="' + esc(s.pitch || '') + '"' +
              ' placeholder="e.g. 2.50"' +
              ' data-action="screen-pitch" data-idx="' + idx + '">' +
            '<div class="help">Typical 0.50\u201350.00 mm \u00b7 2 decimal places</div>' +
          '</div>' +
          (hasComplete
            ? '<div class="led-badge-row">' +
                '<span class="led-badge"><span class="led-badge-k">Pixels</span><span class="led-badge-v">' + px.toLocaleString('en-IN') + '</span></span>' +
                '<span class="led-badge"><span class="led-badge-k">RJ45 ports</span><span class="led-badge-v">' + ports + '</span></span>' +
                '<span class="led-badge"><span class="led-badge-k">HDMI feeds</span><span class="led-badge-v">' + feeds + '</span></span>' +
                '<span class="led-badge"><span class="led-badge-k">Aspect</span><span class="led-badge-v">' + esc(aspect) + '</span></span>' +
              '</div>'
            : '') +
          (dims.ok
            ? '<div class="led-physical"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
              '<span>Physical: ' + esc(dims.pretty) + '</span></div>'
            : '') +
        '</div>';
      }).join('');
      const projectorCt = Number((d.calico_outputs && d.calico_outputs.projector) || 0);
      const totalPorts = totals.hdmiFeeds + projectorCt;
      // v27.3.0 — slim aggregate summary. Per-screen pills already show
      // Pixels / RJ45 / HDMI feeds / Aspect, so no need to repeat them.
      // This line just totals across all screens + projector ports.
      const aggregateHtml = (d.screens.length > 1 || projectorCt > 0)
        ? '<div class="led-summary">' +
            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
            '<span><strong>' + totals.pixels.toLocaleString('en-IN') + '</strong> total pixels \u00b7 ' +
              '<strong>' + totals.ledPorts + '</strong> RJ45 \u00b7 ' +
              '<strong>' + totalPorts + '</strong> total feeds (' + totals.hdmiFeeds + ' LED + ' + projectorCt + ' projector)' +
            '</span>' +
          '</div>'
        : '';
      return screensHtml + aggregateHtml;
    }

    /* v27.3.0 §11 — LED aspect ratio. Returns exact-match label for common
       ratios within 0.5% tolerance, otherwise "Custom W.WW:1 — tvONE territory". */
    function _ledAspectRatio(w, h) {
      if (!w || !h) return '\u2014';
      const r = w / h;
      const tol = 0.005;
      const common = [
        ['16:9',   16 / 9],
        ['16:10',  16 / 10],
        ['4:3',    4 / 3],
        ['21:9',   21 / 9],
        ['32:9',   32 / 9],
        ['1:1',    1],
        ['9:16',   9 / 16],
        ['5:4',    5 / 4]
      ];
      for (let i = 0; i < common.length; i++) {
        if (Math.abs(r - common[i][1]) / common[i][1] < tol) return common[i][0];
      }
      return 'Custom ' + r.toFixed(2) + ':1';
    }
